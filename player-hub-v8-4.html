<style>
  :root{
    --pitch: #1A1A1A;
    --pitch-dark: #0D0D0D;
    --chalk: #F4F1E8;
    --paper: #FFFFFF;
    --amber: #C9922B;
    --amber-dark: #9C6E1C;
    --clay: #B5473A;
    --clay-soft: #F0DAD6;
    --ok: #404040;
    --line: #DCD6C4;
    --ink: #000000;
    --ink-soft: #333333;
    --radius: 10px;
    --radius-sm: 6px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--chalk);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:'Oswald',sans-serif;letter-spacing:0.01em;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}

  .app{display:flex;min-height:100vh;}
  .login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--pitch);color:var(--chalk);padding:20px;}
  .login-card{background:var(--paper);color:var(--ink);border-radius:var(--radius);padding:40px;max-width:380px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.2);}
  .login-card h1{margin-top:0;font-size:24px;text-align:center;color:var(--pitch);}
  .login-logo{width:72px;height:72px;border-radius:50%;background:var(--amber);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--pitch-dark);}
  .login-form label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;margin-top:12px;}
  .login-form input,.login-form select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;}
  .login-form input:focus,.login-form select:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}
  .login-btn{width:100%;padding:12px;background:var(--pitch);color:var(--chalk);border:none;border-radius:var(--radius-sm);font-weight:600;margin-top:18px;cursor:pointer;}
  .login-btn:hover{background:var(--pitch-dark);}

  .sidebar{width:220px;flex-shrink:0;background:var(--pitch);color:var(--chalk);display:flex;flex-direction:column;padding:20px 0;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 18px 20px 18px;border-bottom:1px solid rgba(244,241,232,0.14);margin-bottom:14px;}
  .brand-logo{width:38px;height:38px;border-radius:50%;background:var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;color:var(--pitch-dark);font-size:15px;}
  .brand-name{font-family:'Oswald';font-size:17px;font-weight:600;}
  .brand-sub{font-size:10.5px;color:#B9C6BC;text-transform:uppercase;letter-spacing:0.08em;}

  .nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;flex:1;}
  .nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;background:transparent;color:#CFD8CC;border-radius:var(--radius-sm);text-align:left;font-size:14px;font-weight:500;}
  .nav-btn:hover{background:rgba(244,241,232,0.08);}
  .nav-btn.active{background:var(--amber);color:var(--pitch-dark);font-weight:600;}

  .sidebar-foot{padding:12px 18px 0 18px;font-size:11px;color:#8DA095;border-top:1px solid rgba(244,241,232,0.1);margin-top:10px;padding-top:12px;}
  .logout-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(244,241,232,0.2);color:var(--chalk);padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;margin-top:8px;width:100%;}
  .logout-btn:hover{background:rgba(255,255,255,0.15);}

  .main{flex:1;padding:32px 40px;max-width:1200px;overflow-y:auto;}
  .page-head{margin-bottom:24px;}
  .page-head h1{font-size:26px;margin:0 0 4px 0;color:var(--pitch);}
  .page-head p{margin:0;color:var(--ink-soft);font-size:14px;}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .card h3{margin:0 0 14px 0;font-size:15px;color:var(--pitch);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;margin-top:12px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;color:var(--ink);
  }
  input[type=range]{
    width:100%;height:6px;border-radius:3px;background:var(--line);outline:none;-webkit-appearance:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--amber);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:18px;height:18px;border-radius:50%;background:var(--amber);cursor:pointer;border:none;
  }
  textarea{resize:vertical;min-height:60px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--pitch);background:var(--pitch);color:var(--chalk);font-size:13.5px;font-weight:600;}
  .btn:hover{background:var(--pitch-dark);}
  .btn.secondary{background:var(--paper);color:var(--pitch);border-color:var(--line);}
  .btn.secondary:hover{background:#F2EFE4;}
  .btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:8px 10px;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid #EEEAD9;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#FAF8F0;}

  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge.ok{background:#E3EFE7;color:var(--ok);}
  .badge.warn{background:#F7EAD3;color:var(--amber-dark);}
  .badge.bad{background:var(--clay-soft);color:var(--clay);}

  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .stat{flex:1;min-width:140px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:all 0.2s;}
  .stat:hover{border-color:var(--amber);box-shadow:0 2px 8px rgba(0,0,0,0.08);}
  .stat .num{font-family:'Oswald';font-size:28px;color:var(--pitch);}
  .stat .lbl{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}

  .workout-item{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;background:var(--chalk);}
  .workout-item h4{margin:0 0 6px 0;font-size:13px;color:var(--pitch);font-weight:600;}
  .workout-item-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;font-size:12px;margin-bottom:4px;}
  .workout-item-val{color:var(--amber);font-weight:600;}

  .session-exercise{border:1px solid var(--amber);border-left:4px solid var(--amber);padding:8px;margin-bottom:6px;background:#FFF9F0;font-size:12px;}
  .session-exercise-name{font-weight:600;color:var(--pitch);margin-bottom:2px;}
  .session-exercise-detail{color:var(--ink-soft);font-size:11px;}

  .checkbox-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #EEEAD9;}
  .checkbox-item:last-child{border-bottom:none;}
  .checkbox-item input{width:auto;margin:0;}
  .checkbox-item label{margin:0;font-weight:400;}

    .brand-name{font-size:14px;}
    .brand-sub{font-size:9px;}

    .nav-btn{padding:8px 10px;font-size:12px;gap:5px;}
    .nav-btn span{display:none;}
    .sidebar-foot{display:none;}
    .main{margin-top:60px;padding:20px 12px;}
    .page-head h1{font-size:22px;}
    .page-head p{font-size:12px;}
    .card{padding:14px;}
    .btn{padding:10px 14px;font-size:13px;}
    .grid2,.grid3{grid-template-columns:1fr;}
    input,select,textarea{font-size:16px;padding:10px;}
  }

    .sidebar{padding:8px 5px;}
    .brand{padding:0 5px;}
    .brand-logo{width:28px;height:28px;font-size:11px;}
    .brand-name{font-size:13px;}
    .nav-btn{padding:6px 8px;font-size:11px;}
    .main{margin-top:50px;padding:16px 10px;}
    .page-head h1{font-size:18px;}
    .card{padding:12px;margin-bottom:16px;}
    .btn{padding:12px;font-size:14px;width:100%;}
    .card h3{font-size:16px;}

    .login-card{padding:20px 16px;}
    .login-card h1{font-size:18px;}
    .login-btn{padding:14px;}

</style>

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('it-IT', {day:'2-digit', month:'short', year:'numeric'});
}
function calcAge(birthDateStr){
  const today = new Date();
  const birth = new Date(birthDateStr);
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if(m<0 || (m===0 && today.getDate()<birth.getDate())) age--;
  return age;
}
function daysAgo(n){
  const d = new Date();
  d.setDate(d.getDate()-n);
  return d.toISOString().slice(0,10);
}

// ========== STORAGE FUNCTIONS (localStorage + Firestore) ==========
async function saveKey(key, value){
  // Salva SEMPRE su localStorage (locale)
  try{
    localStorage.setItem(key, JSON.stringify(value));
    console.log('✅ Salvato localStorage:', key);
  }catch(e){
    console.error('❌ Errore localStorage:', e.message);
  }
  
  // Prova a sincronizzare su Firestore (opzionale)
  if(db && TEAM_ID){
    try{
      await db.collection('teams').doc(TEAM_ID).collection('data').doc(key).set({
        value: value,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        playerId: STATE.currentPlayerId || 'admin'
      });
      console.log('📡 Sincronizzato Firestore:', key);
    }catch(e){
      console.warn('⚠️ Sync Firestore fallito:', e.message);
    }
  }
}

async function loadKey(key, fallback){
  let result = fallback;
  
  // Prova a caricare da localStorage PRIMA (è il source of truth)
  try{
    const stored = localStorage.getItem(key);
    if(stored){
      result = JSON.parse(stored);
      console.log('✅ Caricato localStorage:', key);
      return result;
    }
  }catch(e){
    console.warn('⚠️ Errore lettura localStorage:', e.message);
  }
  
  // Se non c'è su localStorage, prova Firestore
  if(db && TEAM_ID){
    try{
      const doc = await db.collection('teams').doc(TEAM_ID).collection('data').doc(key).get();
      if(doc.exists){
        result = doc.data().value;
        // Salva su localStorage per la prossima volta
        localStorage.setItem(key, JSON.stringify(result));
        console.log('📡 Caricato da Firestore, salvato in cache:', key);
        return result;
      }
    }catch(e){
      console.warn('⚠️ Errore Firestore:', e.message);
    }
  }
  
  return result;
}

function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function calcWorkoutDuration(workout){
  if(workout.category==='Tecnico-tattico'){
    const series = workout.series || 1;
    const minutesPerSeries = workout.minutesPerSeries || 1;
    const recovery = workout.recovery || 0;
    return (series * minutesPerSeries) + ((series-1) * recovery);
  }
  if(workout.category==='Atletico'){
    const type = workout.type;
    if(type==='Riscaldamento coordinativo' || type==='Core stability e propriocezione' || type==='Forza resistente' || type==='Potenza metabolica ed High-Intensity Interval Training (HIIT)' || type==='Lavoro intermittente'){
      return (workout.series * workout.minutesPerSeries) + ((workout.series-1) * workout.recovery);
    }else if(type==='Speed & Agility (Velocità pura)' || type==='Cambi di direzione (COD)' || type==='Forza massima'){
      return (workout.series * 1) + ((workout.series-1) * workout.recovery);
    }else if(type==='Riscaldamento generale (Warm-up)' || type==='Prevenzione infortuni (Screening e protocolli)' || type==='Resistenza aerobica a secco' || type==='Rigenerazione e scarico (Recovery)'){
      return workout.minutes || 0;
    }else if(type.startsWith('Test')){
      return 0; // Test non hanno durata calcolata
    }
  }
  return 0;
}

function getSessionDuration(session){
  if(!session.workoutIds) return 0;
  return session.workoutIds.reduce((sum, wid)=>{
    const w = STATE.workouts.find(wo=>wo.id===wid);
    return sum + (w ? calcWorkoutDuration(w) : 0);
  }, 0);
}

function playerLoadStats(playerId){
  const entries = STATE.rpeLog.filter(r=>r.playerId===playerId);
  const acuteFrom = daysAgo(7), chronicFrom = daysAgo(28);
  
  let acute = entries.filter(e=>e.date>=acuteFrom).reduce((s,e)=>{
    const evt = STATE.events.find(ev=>ev.id===e.sessionId);
    const duration = evt ? getSessionDuration(evt) : 0;
    return s+(e.rpe*duration);
  },0);
  
  const chronicSum = entries.filter(e=>e.date>=chronicFrom).reduce((s,e)=>{
    const evt = STATE.events.find(ev=>ev.id===e.sessionId);
    const duration = evt ? getSessionDuration(evt) : 0;
    return s+(e.rpe*duration);
  },0);
  
  const chronicWeekly = chronicSum/4;
  const acwr = chronicWeekly>0 ? (acute/chronicWeekly) : (acute>0?2:0);
  return {acute, chronicWeekly, acwr};
}

function getLatestHooperIndex(playerId){
  const entries = STATE.hooperLog.filter(h=>h.playerId===playerId).sort((a,b)=>b.date.localeCompare(a.date));
  if(entries.length===0) return null;
  const latest = entries[0];
  const total = (latest.stress || 0) + (latest.sleep || 0) + (latest.muscles || 0) + (latest.mood || 0);
  const percentage = Math.round(total / 20 * 100);
  return {date: latest.date, percentage, data: latest};
}

              <strong>Ruolo:</strong> <input id="editRole" type="text" value="${esc(selectedPlayer.role)}" style="margin-top:2px;"><br>
              <strong>Stato:</strong> <select id="editStatus" style="margin-top:2px;"><option value="Disponibile" ${selectedPlayer.status==='Disponibile'?'selected':''}>Disponibile</option><option value="In rientro" ${selectedPlayer.status==='In rientro'?'selected':''}>In rientro</option><option value="Infortunato" ${selectedPlayer.status==='Infortunato'?'selected':''}>Infortunato</option></select><br>
              <strong>Password accesso:</strong> <input id="editPassword" type="text" value="${esc(selectedPlayer.password)}" style="margin-top:2px;" placeholder="Imposta password">
            </div>
            <div class="btn-row"><button class="btn" id="savePlayerBtn">Salva</button><button class="btn secondary" id="deletePlayerBtn" style="background:var(--clay);color:white;">Elimina</button><button class="btn secondary" id="closePlayerBtn">Chiudi</button></div>
          </div>
        ` : `<div class="card"><div class="empty">Clicca su un giocatore o aggiungi uno nuovo</div></div>`}
      </div>
    </div>
  `;
  
  const tbody = document.getElementById('playersTableBody');
  STATE.players.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(p=>{
    const tr = document.createElement('tr');
    tr.className = 'player-row';
    if(selectedId===p.id) tr.style.cssText = 'background:var(--chalk);border-left:4px solid var(--amber);';
    const hooper = getLatestHooperIndex(p.id);
    const hiDisplay = hooper ? `<span style="font-weight:600;color:${hooper.percentage>=75?'var(--ok)':hooper.percentage>=50?'var(--amber-dark)':'var(--clay)'};">${hooper.percentage}%</span>` : '-';
    tr.innerHTML = `<td><strong>${esc(p.name)}</strong></td><td>${calcAge(p.birthDate)}</td><td>${esc(p.role)}</td><td>${hiDisplay}</td><td><span style="font-size:11px;${p.status==='Infortunato'?'color:var(--clay);font-weight:600;':p.status==='In rientro'?'color:var(--amber-dark);font-weight:600;':'color:var(--ok);font-weight:600;'}">${p.status}</span></td><td><button class="del-player-btn" data-player-id="${p.id}" style="background:none;border:none;color:var(--clay);cursor:pointer;font-size:12px;">✕</button></td>`;
    tr.addEventListener('click', (e)=>{
      if(e.target.closest('button')) return;
      el.dataset.selectedPlayerId = p.id;
      delete el.dataset.addingNew;
      renderGiocatori(el);
    });
    tbody.appendChild(tr);
  });
  
  // Add player button
  const addBtn = document.getElementById('addPlayerBtn');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      el.dataset.addingNew = 'true';
      delete el.dataset.selectedPlayerId;
      renderGiocatori(el);
    });
  }
  
  // Confirm add player
  const confirmAddBtn = document.getElementById('confirmAddPlayerBtn');
  if(confirmAddBtn){
    confirmAddBtn.addEventListener('click', async ()=>{
      const name = document.getElementById('newName').value.trim();
      const birthDate = document.getElementById('newBirthDate').value;
      const role = document.getElementById('newRole').value.trim();
      const password = document.getElementById('newPassword').value.trim();
      
      if(!name || !birthDate || !role || !password){
        showToast('Completa tutti i campi');
        return;
      }
      
      const newPlayer = {
        id: Math.max(0, ...STATE.players.map(p=>p.id)) + 1,
        name,
        birthDate,
        role,
        password,
        status: 'Disponibile'
      };
      
      STATE.players.push(newPlayer);
      await saveKey('players', STATE.players);
      showToast('✅ Giocatore aggiunto');
      delete el.dataset.addingNew;
      render();
    });
  }
  
  // Cancel add player
  const cancelAddBtn = document.getElementById('cancelAddPlayerBtn');
  if(cancelAddBtn){
    cancelAddBtn.addEventListener('click', ()=>{
      delete el.dataset.addingNew;
      renderGiocatori(el);
    });
  }
  
  // Delete player (via event delegation on table)
  el.addEventListener('click', async (e)=>{
    const btn = e.target.closest('.del-player-btn');
    if(!btn) return;
    const playerId = parseInt(btn.dataset.playerId);
    const playerToDelete = STATE.players.find(p=>p.id===playerId);
    if(!playerToDelete) return;
    
    if(!confirm(`Eliminare ${esc(playerToDelete.name)}? L\'azione non può essere annullata.`)) return;
    
    STATE.players = STATE.players.filter(p=>p.id!==playerId);
    await saveKey('players', STATE.players);
    showToast('✅ Giocatore eliminato');
    delete el.dataset.selectedPlayerId;
    render();
  });
  
  if(selectedPlayer){
    document.getElementById('savePlayerBtn').addEventListener('click', async ()=>{
      selectedPlayer.name = document.getElementById('editName').value.trim();
      selectedPlayer.birthDate = document.getElementById('editBirthDate').value;
      selectedPlayer.role = document.getElementById('editRole').value.trim();
      selectedPlayer.status = document.getElementById('editStatus').value;
      const newPassword = document.getElementById('editPassword').value.trim();
      if(!newPassword){ showToast('Inserisci una password'); return; }
      selectedPlayer.password = newPassword;
      await saveKey('players', STATE.players);
      showToast('✅ Salvato');
      render();
    });
    
    const deleteBtn = document.getElementById('deletePlayerBtn');
    if(deleteBtn){
      deleteBtn.addEventListener('click', async ()=>{
        if(!confirm(`Eliminare ${esc(selectedPlayer.name)}? L\'azione non può essere annullata.`)) return;
        STATE.players = STATE.players.filter(p=>p.id!==selectedPlayer.id);
        await saveKey('players', STATE.players);
        showToast('✅ Giocatore eliminato');
        delete el.dataset.selectedPlayerId;
        render();
      });
    }
    
    document.getElementById('closePlayerBtn').addEventListener('click', ()=>{
      delete el.dataset.selectedPlayerId;
      renderGiocatori(el);
    });
  }
}

/* ---------- TEST ---------- */
function renderTest(el){
  const selectedTestId = el.dataset.selectedTestId || null;
  const selectedTest = selectedTestId ? STATE.tests.find(t=>t.id===selectedTestId) : null;
  
  el.innerHTML = `
    <div class="page-head"><h1>Test</h1><p>Crea test e registra i risultati</p></div>
    
    ${!selectedTestId ? `
    <div class="card">
      <h3>Nuovo test</h3>
      <div class="grid2">
        <div><label>Nome del test</label><input id="testName" type="text" placeholder="Es. Test 30-15 - Settimana 1"></div>
        <div><label>Tipo di test</label><select id="testType">${Object.keys(TEST_SPECS).map(t=>`<option>${t}</option>`).join('')}</select></div>
      </div>
      <div class="grid2">
        <div><label>Data</label><input id="testDate" type="date" value="${todayStr()}"></div>
        <div><label>Unità di misura</label><input id="testUnit" type="text" readonly></div>
      </div>
      <div id="descDisplay" style="font-size:12px;color:var(--ink-soft);margin-top:8px;padding:8px;background:var(--chalk);border-radius:6px;"></div>
      <div class="btn-row"><button class="btn" id="createTestBtn">Crea test</button></div>
    </div>
    ` : ''}
    
    <div class="card">
      <h3>Test disponibili (${STATE.tests.length})</h3>
      ${STATE.tests.length===0 ? '<div class="empty">Nessun test creato</div>' :
        STATE.tests.slice().reverse().map(t=>`
          <div style="border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;background:var(--chalk);">
            <div style="display:flex;justify-content:space-between;align-items:start;">
              <div>
                <h4 style="margin:0 0 6px 0;color:var(--pitch);font-size:13px;">${esc(t.name)}</h4>
                <span style="font-size:11px;color:var(--ink-soft);">${fmtDate(t.date)} | ${t.type} (${t.unit}) | ${t.results?.length||0} giocatori</span>
              </div>
              <div style="display:flex;gap:6px;">
                <button style="background:none;border:none;color:${selectedTestId===t.id?'var(--amber)':'var(--ink-soft)'};cursor:pointer;font-size:14px;" data-select-test="${t.id}">→</button>
                <button style="background:none;border:none;color:var(--clay);cursor:pointer;font-size:12px;" data-del-test="${t.id}">✕</button>
              </div>
            </div>
            ${selectedTestId===t.id ? `
              <div style="border-top:1px solid var(--line);padding-top:12px;">
                <h4 style="margin:0 0 12px 0;font-size:13px;color:var(--pitch);">Inserisci valori test (${t.unit})</h4>
                <table style="width:100%;border-collapse:collapse;">
                  <thead>
                    <tr style="background:var(--chalk);border-bottom:1px solid var(--line);">
                      <th style="text-align:left;padding:8px;font-size:12px;font-weight:600;color:var(--ink-soft);">Giocatore</th>
                      <th style="text-align:center;padding:8px;font-size:12px;font-weight:600;color:var(--ink-soft);">Valore</th>
                      <th style="text-align:center;padding:8px;font-size:12px;font-weight:600;color:var(--ink-soft);">Azioni</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${STATE.players.map(p=>{
                      const result = t.results?.find(r=>r.playerId===p.id);
                      return `
                        <tr data-player-row="${p.id}" style="border-bottom:1px solid #EEEAD9;">
                          <td style="padding:10px;font-size:13px;">${esc(p.name)}</td>
                          <td style="padding:10px;text-align:center;">
                            <input type="number" step="0.01" class="test-value-input" data-player-id="${p.id}" value="${result?.value||''}" placeholder="-" style="width:80px;padding:6px;border:1px solid var(--line);border-radius:4px;text-align:center;">
                          </td>
                          <td style="padding:10px;text-align:center;">
                            ${result ? 
                              `<button class="test-remove-btn" data-player-id="${p.id}" style="background:none;border:none;color:var(--clay);cursor:pointer;font-size:13px;font-weight:600;">✕</button>` 
                              : `<button class="test-add-btn" data-player-id="${p.id}" style="background:none;border:none;color:var(--ok);cursor:pointer;font-size:13px;font-weight:600;">+</button>`
                            }
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
                <button class="btn" id="saveTestResultsBtn" style="margin-top:12px;">💾 Salva Risultati</button>
              </div>
            ` : ''}
          </div>
        `).join('')}
    </div>
  `;
  
  const typeSelect = document.getElementById('testType');
  if(typeSelect){
    const updateUnit = ()=>{
      const type = typeSelect.value;
      const spec = TEST_SPECS[type];
      document.getElementById('testUnit').value = spec.unit;
      document.getElementById('descDisplay').textContent = spec.description;
    };
    updateUnit();
    typeSelect.addEventListener('change', updateUnit);
  }
  
  if(document.getElementById('createTestBtn')){
    document.getElementById('createTestBtn').addEventListener('click', async ()=>{
      const name = document.getElementById('testName').value.trim();
      const type = document.getElementById('testType').value;
      const date = document.getElementById('testDate').value;
      if(!name){ showToast('Inserisci il nome del test'); return; }
      const spec = TEST_SPECS[type];
      STATE.tests.push({id:uid(), name, type, unit:spec.unit, date, results:[]});
      await saveKey('tests', STATE.tests);
      showToast('Test creato');
      render();
    });
  }
  
  el.querySelectorAll('[data-select-test]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      el.dataset.selectedTestId = el.dataset.selectedTestId===b.dataset.selectTest ? null : b.dataset.selectTest;
      renderTest(el);
    });
  });
  
  el.querySelectorAll('[data-del-test]').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Sei sicuro di voler eliminare questo test? L\'azione non può essere annullata.')) return;
      STATE.tests = STATE.tests.filter(t=>t.id!==b.dataset.delTest);
      await saveKey('tests', STATE.tests);
      renderTest(el);
    });
  });
  
  // New: handle test results with input fields
  if(selectedTest && document.getElementById('saveTestResultsBtn')){
    document.getElementById('saveTestResultsBtn').addEventListener('click', async ()=>{
      const inputs = el.querySelectorAll('.test-value-input');
      let count = 0;
      selectedTest.results = [];
      
      inputs.forEach(inp=>{
        const playerId = parseInt(inp.dataset.playerId);
        const value = inp.value.trim();
        if(value){
          selectedTest.results.push({playerId, value: parseFloat(value)});
          count++;
        }
      });
      
      if(count === 0){
        showToast('Inserisci almeno un valore');
        return;
      }
      
      await saveKey('tests', STATE.tests);
      showToast(`✅ ${count} risultati salvati`);
      renderTest(el);
    });

    // Add giocatore button - focus input
    el.querySelectorAll('.test-add-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const playerId = parseInt(btn.dataset.playerId);
        const input = el.querySelector(`.test-value-input[data-player-id="${playerId}"]`);
        if(input) {
          input.focus();
          input.select();
        }
      });
    });

    // Remove giocatore button
    el.querySelectorAll('.test-remove-btn').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        if(!confirm('Sei sicuro di voler rimuovere questo giocatore dal test?')) return;
        const playerId = parseInt(btn.dataset.playerId);
        const input = el.querySelector(`.test-value-input[data-player-id="${playerId}"]`);
        if(input) input.value = '';
        if(selectedTest.results){
          selectedTest.results = selectedTest.results.filter(r=>r.playerId!==playerId);
          await saveKey('tests', STATE.tests);
          showToast('Giocatore rimosso');
          renderTest(el);
        }
      });
    });
  }
}

/* ---------- ALLENAMENTI (Database Esercitazioni) ---------- */
function renderAllenamenti(el){
  el.innerHTML = `
    <div class="page-head"><h1>Allenamenti</h1><p>Catalogo esercitazioni di allenamento</p></div>
    
    <div class="card">
      <h3>Nuova esercitazione</h3>
      <div class="grid2">
        <div><label>Categoria di lavoro</label><select id="workoutCategory"><option>Tecnico-tattico</option><option>Atletico</option></select></div>
        <div><label>Tipo specifico</label><select id="workoutType"></select></div>
      </div>
      <label>Nome esercitazione</label><input id="workoutName" type="text" placeholder="Es. Rondo 4v2">
      <div id="workoutParamsDiv"></div>
      <div class="btn-row"><button class="btn" id="createWorkoutBtn">Crea esercitazione</button></div>
    </div>
    
    <div class="card">
      <h3>Esercitazioni disponibili (${STATE.workouts.length})</h3>
      ${STATE.workouts.length===0 ? '<div class="empty">Nessuna esercitazione catalogata</div>' :
        STATE.workouts.map(w=>`
          <div class="workout-item">
            <h4>${esc(w.name)}</h4>
            <div class="workout-item-row">
              <div><span style="font-size:10px;color:var(--ink-soft);">${w.category}</span> - ${esc(w.type)}</div>
              <div>Durata: <span class="workout-item-val">${calcWorkoutDuration(w)}min</span></div>
              <div style="display:flex;gap:8px;">
                <button style="background:none;border:none;color:var(--amber);cursor:pointer;font-size:12px;" data-edit-workout="${w.id}">Modifica</button>
                <button style="background:none;border:none;color:var(--clay);cursor:pointer;font-size:12px;" data-del-workout="${w.id}">Elimina</button>
              </div>
            </div>
            <div style="font-size:11px;color:var(--ink-soft);margin-top:6px;line-height:1.6;">
              ${w.category==='Tecnico-tattico' ? 
                `${w.teamsPlayers?.map(tp=>`Sq${tp.teamNumber}: ${tp.players}`).join(' | ')}${w.withGoalkeepers?' + portieri':''} (Tot: ${w.totalPlayers}) | Campo: ${w.fieldLength}×${w.fieldWidth}m | ${w.squareMetersPerPlayer}m²/giocatore | ${w.series}×${w.minutesPerSeries}min + ${w.recovery}min recupero` :
                w.type==='Forza massima' ? `${w.exercise}, ${w.series}×${w.reps}, Recupero: ${w.recovery}min` :
                w.type.includes('Intermittente') || w.type.includes('Lavoro intermittente') || w.type==='Differenziato' || w.type.includes('HIIT') ? `Serie: ${w.series} × ${w.minutesPerSeries}min, Recupero: ${w.recovery}min` :
                w.type==='Resistenza aerobica a secco' ? `Durata: ${w.minutes}min` :
                w.type.includes('Speed') || w.type.includes('Cambi') ? `Serie: ${w.series} × ${w.distance}m, Recupero: ${w.recovery}min` :
                w.minutes ? `Durata: ${w.minutes}min` : '-'
              }
            </div>
            ${w.groups && w.groups.length>0 ? `
              <div style="margin-top:8px;padding:8px;background:#F9F5ED;border-radius:4px;border-left:3px solid var(--amber);">
                ${w.groups.map(g=>`
                  <div style="font-size:10px;margin-bottom:4px;color:var(--pitch);">
                    <strong>${esc(g.name)}</strong>: ${g.players.length} giocatori
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `).join('')}
    </div>
  `;
  
  const categorySelect = document.getElementById('workoutCategory');
  const typeSelect = document.getElementById('workoutType');
  const paramsDiv = document.getElementById('workoutParamsDiv');
  
  const updateTypeOptions = ()=>{
    const category = categorySelect.value;
    const types = WORKOUT_CATEGORIES[category] || [];
    typeSelect.innerHTML = types.map(t=>`<option>${t}</option>`).join('');
    updateParams();
  };
  
  const updateParams = ()=>{
    const category = categorySelect.value;
    const type = typeSelect.value;
    
    if(category==='Tecnico-tattico'){
      paramsDiv.innerHTML = `
        <div class="grid2" style="margin-top:12px;">
          <div><label>Numero di squadre</label><input id="wNumTeams" type="number" min="1" max="10" value="2"></div>
          <div><label>Con portieri</label><input id="wWithGoalkeepers" type="checkbox"></div>
        </div>
        <div id="wTeamsPlayersDiv"></div>
        <div class="grid2" style="margin-top:12px;">
          <div><label>Totale giocatori (auto)</label><input id="wTotalPlayers" type="number" readonly></div>
          <div></div>
        </div>
        <div class="grid2" style="margin-top:12px;">
          <div><label>Lunghezza campo (m)</label><input id="wFieldLength" type="number" min="5" value="30"></div>
          <div><label>Larghezza campo (m)</label><input id="wFieldWidth" type="number" min="5" value="20"></div>
        </div>
        <div class="grid2" style="margin-top:12px;">
          <div><label>Metri quadri/giocatore (auto)</label><input id="wSquareMetersPerPlayer" type="number" readonly></div>
          <div></div>
        </div>
        <div class="grid2" style="margin-top:12px;">
          <div><label>Serie</label><input id="wSeries" type="number" min="1" value="1"></div>
          <div><label>Minuti per serie</label><input id="wMinutesPerSeries" type="number" min="1" value="10"></div>
        </div>
        <div class="grid2" style="margin-top:12px;">
          <div><label>Recupero (min)</label><input id="wRecovery" type="number" min="0" value="1"></div>
          <div><label>Durata totale (auto)</label><input id="wTotalDuration" type="number" readonly></div>
        </div>
      `;
      
      const numTeamsInput = document.getElementById('wNumTeams');
      const teamsPlayersDiv = document.getElementById('wTeamsPlayersDiv');
      
      const updateTeamsInputs = ()=>{
        const numTeams = parseInt(numTeamsInput.value)||1;
        let html = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px;">';
        for(let i=0; i<numTeams; i++){
          html += `<div><label>Squadra ${i+1} giocatori</label><input class="wTeamPlayers" type="number" min="1" value="${i===0?3:2}" data-team="${i}"></div>`;
        }
        html += '</div>';
        teamsPlayersDiv.innerHTML = html;
        
        const teamInputs = teamsPlayersDiv.querySelectorAll('.wTeamPlayers');
        teamInputs.forEach(inp=>inp.addEventListener('input', updateCalculations));
        updateCalculations();
      };
      
      const updateCalculations = ()=>{
        const teamInputs = document.querySelectorAll('.wTeamPlayers');
        let totalPlayers = 0;
        teamInputs.forEach(inp=>totalPlayers += parseInt(inp.value)||1);
        
        document.getElementById('wTotalPlayers').value = totalPlayers;
        
        const length = parseInt(document.getElementById('wFieldLength').value)||1;
        const width = parseInt(document.getElementById('wFieldWidth').value)||1;
        const totalArea = length * width;
        const mpp = totalPlayers>0 ? Math.round(totalArea / totalPlayers * 10) / 10 : 0;
        document.getElementById('wSquareMetersPerPlayer').value = mpp;
        
        const series = parseInt(document.getElementById('wSeries').value)||1;
        const minutesPerSeries = parseInt(document.getElementById('wMinutesPerSeries').value)||1;
        const recovery = parseInt(document.getElementById('wRecovery').value)||0;
        const totalDuration = (series * minutesPerSeries) + ((series-1) * recovery);
        document.getElementById('wTotalDuration').value = totalDuration;
      };
      
      numTeamsInput.addEventListener('change', updateTeamsInputs);
      document.getElementById('wFieldLength').addEventListener('input', updateCalculations);
      document.getElementById('wFieldWidth').addEventListener('input', updateCalculations);
      document.getElementById('wSeries').addEventListener('input', updateCalculations);
      document.getElementById('wMinutesPerSeries').addEventListener('input', updateCalculations);
      document.getElementById('wRecovery').addEventListener('input', updateCalculations);
      
      updateTeamsInputs();
      
    }else if(category==='Atletico'){
      const params = ATHLETIC_PARAMS[type] || {fields: []};
      let html = '';
      
      if(params.fields.includes('exercise')){
        html += `<div><label>Esercizio</label><select id="wExercise">${FORCE_EXERCISES.map(e=>`<option>${e}</option>`).join('')}</select></div>`;
      }
      if(params.fields.includes('series')){
        html += `<div><label>Serie</label><input id="wSeries" type="number" min="1" value="4"></div>`;
      }
      if(params.fields.includes('reps')){
        html += `<div><label>Ripetizioni</label><input id="wReps" type="number" min="1" value="8"></div>`;
      }
      if(params.fields.includes('minutes')){
        html += `<div><label>Minuti</label><input id="wMinutes" type="number" min="1" value="10"></div>`;
      }
      if(params.fields.includes('minutesPerSeries')){
        html += `<div><label>Minuti per serie</label><input id="wMinutesPerSeries" type="number" min="1" value="2"></div>`;
      }
      if(params.fields.includes('distance')){
        html += `<div><label>Distanza (m)</label><select id="wDistance"><option value="10">10m</option><option value="20">20m</option><option value="30">30m</option><option value="40">40m</option></select></div>`;
      }
      if(params.fields.includes('recovery')){
        html += `<div><label>Recupero (min)</label><input id="wRecovery" type="number" min="0" value="1"></div>`;
      }
      if(params.fields.includes('description')){
        html += `<div><label>Note</label><textarea id="wDescription" placeholder="Descrizione del test/esercizio"></textarea></div>`;
      }
      
      if(html){
        paramsDiv.innerHTML = `<div class="grid2" style="margin-top:12px;">${html}</div>`;
      }else{
        paramsDiv.innerHTML = '';
      }

      if(params.groups){

/* ---------- CALENDARIO (Sessioni) ---------- */
/* Helper functions for matches */
function getTodayEvents(){
  const today = todayStr();
  return STATE.events.filter(e => e.date === today && e.type === 'Partita');
}

function getNextMatch(){
  const today = todayStr();
  return STATE.events.find(e => e.date >= today && e.type === 'Partita' && e.date !== today) || null;
}

function getLastMatch(){
  const today = todayStr();
  return STATE.events.slice().reverse().find(e => e.date < today && e.type === 'Partita') || null;
}

function getMatchStats(match){
  const stats = {
    goals: {},
    assists: {},
    lineup: {}
  };
  if(match.goals){
    match.goals.forEach(g => {
      stats.goals[g.playerId] = (stats.goals[g.playerId] || 0) + 1;
    });
  }
  if(match.assists){
    match.assists.forEach(a => {
      stats.assists[a.playerId] = (stats.assists[a.playerId] || 0) + 1;
    });
  }
  if(match.lineup){
    match.lineup.forEach(l => {
      stats.lineup[l.playerId] = l;
    });
  }
  return stats;
}

function getMatchesAroundDate(date){
  const matches = STATE.events.filter(e=>e.type==='Partita').sort((a,b)=>a.date.localeCompare(b.date));
  const before = matches.reverse().find(m=>m.date<date) || null;
  const after = matches.find(m=>m.date>date) || null;
  return {before, after};
}

function calculateMD(date){
  const {before, after} = getMatchesAroundDate(date);
  
  // Se non c'è nessuna partita
  if(!before && !after) return null;
  
  // Solo partita precedente
  if(before && !after) {
    const daysAfter = Math.floor((new Date(date) - new Date(before.date)) / (1000*60*60*24));
    return `MD+${daysAfter}`;
  }
  
  // Solo partita successiva
  if(!before && after) {
    const daysBefore = Math.floor((new Date(after.date) - new Date(date)) / (1000*60*60*24));
    return `MD-${daysBefore}`;
  }
  
  // Entrambe le partite: formato MD+X/-Y
  const daysAfterBefore = Math.floor((new Date(date) - new Date(before.date)) / (1000*60*60*24));
  const daysBeforeAfter = Math.floor((new Date(after.date) - new Date(date)) / (1000*60*60*24));
  return `MD+${daysAfterBefore}/-${daysBeforeAfter}`;
}

function getTodayWorkout(){
  const today = todayStr();
  return STATE.events.find(e => e.date === today && e.type === 'Allenamento') || null;
}

function getPlayersOfMovement(){
  return STATE.players.filter(p => p.role !== 'Portiere' && p.status !== 'Infortunato');
}

function getTodayPresenceCount(eventId){
  const event = STATE.events.find(e => e.id === eventId);
  if(!event) return {present: 0, total: getPlayersOfMovement().length};
  return {present: event.presentCount || 0, total: getPlayersOfMovement().length};
}

function isPlayerPresentToday(playerId){
  const todayEvent = getTodayWorkout();
  if(!todayEvent || !todayEvent.presentPlayers) return null;
  return todayEvent.presentPlayers.includes(playerId);
}

      <h3>📊 Timeline Evento (5 giorni)</h3>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px;">
        ${(() => {
          const today = todayStr();
          const result = [];
          for(let i=-2; i<=2; i++){
            // Calcola la data usando la timezone locale
            const baseDate = new Date(today.split('-')[0], parseInt(today.split('-')[1])-1, parseInt(today.split('-')[2]));
            baseDate.setDate(baseDate.getDate() + i);
            const year = baseDate.getFullYear();
            const month = String(baseDate.getMonth()+1).padStart(2, '0');
            const day = String(baseDate.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            
            const dayEvents = upcoming.filter(e=>e.date===dateStr).sort((a,b)=>(a.time||'00:00').localeCompare(b.time||'00:00'));
            const defaultLabel = i === -2 ? 'L-2' : i === -1 ? 'L-1' : i === 0 ? 'OGGI' : i === 1 ? 'D+1' : 'D+2';
            const isToday = i === 0;
            
            // Se ci sono eventi, usa il nome del primo, altrimenti usa il label di default
            let dayLabel = defaultLabel;
            if(dayEvents.length > 0){
              const firstEvent = dayEvents[0];
              dayLabel = firstEvent.type === 'Partita' ? '⚽ Partita' : '🏋️ Allenamento';
            }
            
            let html = `<div style="border:2px solid ${isToday ? 'var(--ok)' : 'var(--line)'};border-radius:8px;padding:12px;background:${isToday ? '#E3EFE7' : 'var(--chalk)'};min-height:140px;">`;
            html += `<div style="font-size:11px;font-weight:600;color:${isToday ? 'var(--ok)' : 'var(--ink-soft)'};text-transform:uppercase;margin-bottom:8px;">${dayLabel}</div>`;
            html += `<div style="font-size:10px;color:var(--ink-soft);margin-bottom:12px;">${fmtDate(dateStr)}</div>`;
            
            if(dayEvents.length === 0){
              html += `<div style="font-size:11px;color:#999;text-align:center;padding:16px 0;">-</div>`;
            } else {
              dayEvents.forEach(e=>{
                const isMatch = e.type === 'Partita';
                html += `<div style="background:white;padding:8px;border-radius:4px;margin-bottom:8px;border-left:3px solid ${isMatch ? 'var(--amber)' : 'var(--pitch)'};font-size:10px;cursor:pointer;" class="timelineEvent" data-event-id="${e.id}">`;
                html += `<div style="font-weight:600;color:var(--pitch);margin-bottom:2px;">${isMatch ? '⚽' : '🏋️'} ${esc(e.title.substring(0,14))}</div>`;
                html += `<div style="color:var(--ink-soft);font-size:9px;">${e.time ? e.time : ''}</div>`;
                if(e.md) html += `<div style="color:var(--amber);font-size:8px;font-weight:600;">${esc(e.md)}</div>`;
                if(isMatch && e.result) html += `<div style="color:var(--amber);font-weight:600;font-size:10px;margin-top:3px;">${e.result.goalsFor}-${e.result.goalsAgainst}</div>`;
                html += `</div>`;
              });
            }
            
            html += `</div>`;
            result.push(html);
          }
          return result.join('');
        })()}
      </div>
    </div>
    
    <div class="card">
      <h3>📋 Tutti gli Eventi (${upcoming.length})</h3>
      ${upcoming.length===0 ? '<div class="empty">Nessun evento</div>' :
        upcoming.map(e=>{
          const isMatch = e.type === 'Partita';
          return `
            <div style="padding:14px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;">
              <div style="display:flex;justify-content:space-between;align-items:start;">
                <div style="flex:1;">
                  <h4 style="margin:0 0 6px 0;color:var(--pitch);">${isMatch ? '⚽' : '🏋️'} ${esc(e.title)}</h4>
                  <div style="font-size:12px;color:var(--ink-soft);">
                    📅 ${fmtDate(e.date)} ${e.time ? '🕐 '+e.time : ''}
                    ${isMatch ? `<div style="margin-top:4px;">${esc(e.matchType||'Partita')} ${e.result ? `| <strong style="color:var(--pitch);">${e.result.goalsFor}-${e.result.goalsAgainst}</strong>` : ''}</div>` : ''}
                    ${!isMatch ? `<div style="margin-top:4px;font-size:11px;color:var(--amber);font-weight:600;">${e.md ? e.md + ' · ' : ''}Durata: ${getSessionDuration(e)}min</div>` : ''}
                  </div>
                </div>
                ${isStaff ? `<button class="btn secondary" id="evt_edit_${e.id}" style="font-size:11px;padding:6px 10px;margin-right:6px;">Dettagli</button><button class="btn secondary deleteEventBtn" data-event-id="${e.id}" style="font-size:11px;padding:6px 10px;">Elimina</button>` : ''}
              </div>
              ${!isMatch ? `
                <div style="margin-top:8px;font-size:11px;color:var(--pitch);padding:6px;background:var(--chalk);border-radius:4px;">
                  👥 Presenti: ${e.presentCount || 0} / ${getPlayersOfMovement().length}
                </div>
              ` : ''}
              ${isMatch && e.events && e.events.length > 0 ? `
                <div style="margin-top:8px;font-size:11px;color:var(--amber);padding:6px;background:var(--chalk);border-radius:4px;">
                  📊 ${e.events.filter(ev=>ev.type==='goal').length} gol | ${e.events.filter(ev=>ev.type==='assist').length} assist
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
    </div>
  `;
  
  if(isStaff){
    // Toggle between Partita and Allenamento
    document.getElementById('typePartita').addEventListener('change', ()=>{
      document.getElementById('matchFields').style.display = 'block';
      document.getElementById('trainingFields').style.display = 'none';
      checkResultVisibility();
    });
    
    document.getElementById('typeAllenamento').addEventListener('change', ()=>{
      document.getElementById('matchFields').style.display = 'none';
      document.getElementById('trainingFields').style.display = 'block';
      updateAllenamentoTitle();
    });
    
    // Update title when date or MD changes
    const updateAllenamentoTitle = ()=>{
      const date = document.getElementById('evDate').value;
      let md = document.getElementById('evMD').value.trim();
      if(!md) md = calculateMD(date) || 'Allenamento';
      document.getElementById('evTitle').value = md;
    };
    
    document.getElementById('evDate').addEventListener('change', updateAllenamentoTitle);
    document.getElementById('evMD').addEventListener('change', updateAllenamentoTitle);
    document.getElementById('evMD').addEventListener('keyup', updateAllenamentoTitle);
    
    // Show result container only if date is in the past
    const checkResultVisibility = ()=>{
      const date = document.getElementById('evDate').value;
      const today = todayStr();
      document.getElementById('resultContainer').style.display = date < today ? 'block' : 'none';
    };
    
    document.getElementById('evDate').addEventListener('change', checkResultVisibility);
    checkResultVisibility();
    
    // Create event
    if(document.getElementById('createEventBtn')){
      document.getElementById('createEventBtn').addEventListener('click', async ()=>{
        const date = document.getElementById('evDate').value;
        const time = document.getElementById('evTime').value;
        const eventType = document.querySelector('input[name="eventType"]:checked').value;
        
        if(eventType === 'partita'){
          const opponent = document.getElementById('matchOpponent').value.trim();
          const position = document.querySelector('input[name="homeAway"]:checked').value;
          const matchType = document.getElementById('matchType').value;
          
          if(!opponent){ showToast('Inserisci avversario'); return; }
          
          const teamName = STATE.teamConfig.name || 'Squadra';
          const title = position === 'home' ? `${teamName} - ${opponent}` : `${opponent} - ${teamName}`;
          
          const matchObj = {
            id:uid(), 
            date, time, title, type: 'Partita',
            matchType: matchType,
            opponent: opponent,
            position: position, // 'home' or 'away'
            result: null,
            events: [], // Timeline events
            lineup: [],
            duration: 90
          };
          
          // Add result if date is in past
          if(date < todayStr()){
            const goalsFor = parseInt(document.getElementById('matchGoalsFor').value || '0');
            const goalsAgainst = parseInt(document.getElementById('matchGoalsAgainst').value || '0');
            matchObj.result = {goalsFor, goalsAgainst};
          }
          
          STATE.events.push(matchObj);
          await saveKey('events', STATE.events);
          showToast('Partita creata');
          render();
        } else {
          let title = document.getElementById('evTitle').value.trim();
          if(!title){
            let md = document.getElementById('evMD').value.trim();
            if(!md) md = calculateMD(date) || 'Allenamento';
            title = md;
          }
          
          const workoutIds = Array.from(document.querySelectorAll('#workoutCheckboxes input:checked')).map(cb=>cb.value);
          // workoutIds può essere vuoto - le esercitazioni sono opzionali
          
          let md = document.getElementById('evMD').value.trim();
          if(!md) md = calculateMD(date) || '';
          
          STATE.events.push({id:uid(), date, time, title, type:'Allenamento', workoutIds, md});
          await saveKey('events', STATE.events);
          showToast('✅ Sessione creata' + (md ? ` (${md})` : '') + (workoutIds.length > 0 ? ` con ${workoutIds.length} esercitazione(i)` : ' (senza esercitazioni)'));
          render();
        }
      });
    }
    
    // Paste event
    if(document.getElementById('pasteEventBtn')){
      document.getElementById('pasteEventBtn').addEventListener('click', async ()=>{
        if(!window.clipboardEvent || window.clipboardEvent.type !== 'allenamento'){
          showToast('❌ Nessuna sessione copiata');
          return;
        }
        
        const date = document.getElementById('evDate').value;
        const time = document.getElementById('evTime').value;
        const clipboard = JSON.parse(JSON.stringify(window.clipboardEvent.data));
        
        // Crea nuova sessione con la data selezionata
        let md = calculateMD(date) || 'Allenamento';
        const workoutIds = clipboard.workoutIds || [];
        
        STATE.events.push({id:uid(), date, time, title: md, type:'Allenamento', workoutIds, md});
        await saveKey('events', STATE.events);
        showToast('✅ Sessione incollata per ' + fmtDate(date) + (workoutIds.length > 0 ? ` con ${workoutIds.length} esercitazione(i)` : ''));
        render();
      });
    }
  }
  
  // Edit and delete match
  if(isStaff){
    el.querySelectorAll('[id^="evt_edit_"]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const eventId = b.id.substring(9);
        const event = STATE.events.find(e=>e.id===eventId);
        if(!event) return;
        if(event.type === 'Partita'){
          renderMatchDetails(event);
        } else if(event.type === 'Allenamento'){
          renderEditAllenamentoModal(event);
        }
      });
    });
    
    // Delete event - using class and data attribute
    el.querySelectorAll('.deleteEventBtn').forEach(b=>{
      b.addEventListener('click', async (e)=>{
        e.preventDefault();
        e.stopPropagation();
        if(!confirm('Sei sicuro di voler eliminare questo evento? L\'azione non può essere annullata.')) return;
        const eventId = b.dataset.eventId;
        STATE.events = STATE.events.filter(evt=>evt.id!==eventId);
        await saveKey('events', STATE.events);
        showToast('✅ Evento eliminato');
        render();
      });
    });
  }
  
  // Timeline event click
  el.querySelectorAll('.timelineEvent').forEach(card=>{
    card.addEventListener('click', ()=>{
      const eventId = card.dataset.eventId;
      const event = STATE.events.find(e=>e.id===eventId);
      if(!event) return;
      if(event.type === 'Partita' && isStaff){
        renderMatchDetails(event);
      } else if(event.type === 'Allenamento' && isStaff){
        renderAllenamentoDetails(event);
      }
    });
  });
}




/* ---------- MATCH DETAILS ---------- */
function renderAllenamentoDetails(event){
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;box-sizing:border-box;overflow-y:auto;';
  
  modal.innerHTML = `
    <div style="background:white;border-radius:12px;max-width:600px;width:100%;padding:24px;margin:auto;">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:20px;">
        <div>
          <h2 style="margin:0;color:var(--pitch);">🏋️ ${esc(event.title)}</h2>
          <div style="font-size:12px;color:var(--ink-soft);">📅 ${fmtDate(event.date)} 🕐 ${event.time || '-'} ${event.md ? '| ' + esc(event.md) : ''}</div>
        </div>
        <button id="closeAllenamentoModal" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;">✕</button>
      </div>
      
      <div style="border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:20px;">
        <h4 style="margin:0 0 12px 0;color:var(--pitch);font-size:13px;">Esercitazioni</h4>
        
        ${event.workoutIds && event.workoutIds.length > 0 ? `
          <div style="margin-bottom:12px;">
            ${event.workoutIds.map(wid => {
              const workout = STATE.workouts.find(w => w.id === wid);
              return workout ? `
                <div style="padding:8px;background:var(--chalk);border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">
                  <div style="font-size:12px;">
                    <strong>${esc(workout.name)}</strong> (${calcWorkoutDuration(workout)}min)
                  </div>
                  <button class="del-workout-btn" data-workout-id="${wid}" style="background:none;border:none;color:var(--clay);cursor:pointer;font-size:12px;">✕</button>
                </div>
              ` : '';
            }).join('')}
          </div>
        ` : '<div style="font-size:12px;color:#999;margin-bottom:12px;padding:12px;background:var(--chalk);border-radius:6px;">Nessuna esercitazione</div>'}
        
        <div style="border-top:1px solid var(--line);padding-top:12px;">
          <label style="margin-bottom:8px;display:block;font-size:12px;">Aggiungi esercitazione:</label>
          <div style="display:flex;gap:8px;margin-bottom:8px;">
            <select id="addWorkoutSelect" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:4px;font-size:12px;">
              <option value="">-- Seleziona --</option>
              ${STATE.workouts.map(w=>`<option value="${w.id}">${esc(w.name)} (${calcWorkoutDuration(w)}min)</option>`).join('')}
            </select>
            <button id="addWorkoutBtn" class="btn" style="padding:8px 16px;font-size:12px;">+ Aggiungi</button>
          </div>
        </div>
      </div>
      
      <div style="text-align:right;display:flex;gap:12px;justify-content:flex-end;">
        <button id="copyAllenamentoBtn" class="btn secondary" style="padding:8px 20px;">📋 Copia</button>
        <button id="saveAllenamentoBtn" class="btn" style="padding:8px 20px;">Salva</button>
      </div>
    </div>
  `;
  
  document.body.appendChild(modal);
  
  // Close button
  document.getElementById('closeAllenamentoModal').addEventListener('click', ()=>{
    modal.remove();
  });
  
  // Close on backdrop click
  modal.addEventListener('click', (e)=>{
    if(e.target === modal) modal.remove();
  });
  
  // Delete workout
  modal.querySelectorAll('.del-workout-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const wid = btn.dataset.workoutId;
      event.workoutIds = event.workoutIds.filter(id => id !== wid);
      renderAllenamentoDetails(event); // Refresh
    });
  });
  
  // Add workout
  document.getElementById('addWorkoutBtn').addEventListener('click', ()=>{
    const selectEl = document.getElementById('addWorkoutSelect');
    const wid = selectEl.value;
    if(!wid){
      showToast('Seleziona un esercitazione');
      return;
    }
    if(!event.workoutIds) event.workoutIds = [];
    if(!event.workoutIds.includes(wid)){
      event.workoutIds.push(wid);
    }
    selectEl.value = '';
    renderAllenamentoDetails(event); // Refresh
  });
  
  // Copy button
  document.getElementById('copyAllenamentoBtn').addEventListener('click', ()=>{
    // Salva temporaneamente in clipboard interno
    window.clipboardEvent = {type: 'allenamento', data: JSON.parse(JSON.stringify(event))};
    showToast('📋 Sessione copiata! Seleziona una data e premi "Incolla"');
    modal.remove();
  });
  
  // Save
  document.getElementById('saveAllenamentoBtn').addEventListener('click', async ()=>{
    const idx = STATE.events.findIndex(e => e.id === event.id);
    if(idx >= 0){
      STATE.events[idx] = event;
      await saveKey('events', STATE.events);
      showToast('✅ Allenamento aggiornato');
      render();
      modal.remove();
    }
  });
}

          <div style="font-size:12px;color:var(--ink-soft);">${esc(workout.category)} · ${esc(workout.type)}</div>
        </div>
        <button id="closeDetailsModal" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;">✕</button>

        ` : '<div style="font-size:12px;color:#999;margin-bottom:12px;padding:12px;background:var(--chalk);border-radius:6px;">Nessuna sessione</div>'}

          <label style="margin-bottom:8px;display:block;font-size:12px;">Aggiungi sessione:</label>
          <div style="display:flex;gap:8px;margin-bottom:8px;">
            <select id="addWorkoutToEventSelect" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:4px;font-size:12px;">
              <option value="">-- Seleziona --</option>
              ${STATE.workouts.map(w=>`<option value="${w.id}">${esc(w.name)} (${calcWorkoutDuration(w)}min)</option>`).join('')}
            </select>
            <button id="addWorkoutToEventBtn" class="btn" style="padding:8px 12px;font-size:12px;">+ Aggiungi</button>
          </div>
        </div>
      </div>
      
      <div style="text-align:right;display:flex;gap:12px;justify-content:flex-end;">
        <button id="closeEditAllenamentoBtn" class="btn secondary" style="padding:8px 20px;">Chiudi</button>
        <button id="saveEditAllenamentoBtn" class="btn" style="padding:8px 20px;">Salva</button>
      </div>
    </div>
  `;
  
  document.body.appendChild(modal);
  
  document.getElementById('closeEditAllenamento').addEventListener('click', () => modal.remove());
  document.getElementById('closeEditAllenamentoBtn').addEventListener('click', () => modal.remove());
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });
  
  // Delete workout from event
  modal.querySelectorAll('.del-workout-from-event').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const wid = btn.dataset.workoutId;
      event.workoutIds = event.workoutIds.filter(id => id !== wid);
      renderEditAllenamentoModal(event);
    });
  });
  
  // Click on workout to see details
  modal.querySelectorAll('.workout-preview').forEach(el=>{
    el.addEventListener('click', ()=>{
      const wid = el.dataset.workoutId;
      const workout = STATE.workouts.find(w => w.id === wid);
      if(workout) showWorkoutDetailsModal(workout);
    });
  });
  
  // Add workout to event
  document.getElementById('addWorkoutToEventBtn').addEventListener('click', ()=>{
    const selectEl = document.getElementById('addWorkoutToEventSelect');
    const wid = selectEl.value;
    if(!wid){
      showToast('Seleziona una sessione');
      return;
    }
    if(!event.workoutIds) event.workoutIds = [];
    if(!event.workoutIds.includes(wid)){
      event.workoutIds.push(wid);
    }
    selectEl.value = '';
    renderEditAllenamentoModal(event);
  });
  
  // Save changes
  document.getElementById('saveEditAllenamentoBtn').addEventListener('click', async ()=>{
    const idx = STATE.events.findIndex(e => e.id === event.id);
    if(idx >= 0){
      STATE.events[idx] = event;
      await saveKey('events', STATE.events);
      showToast('✅ Allenamento aggiornato');
      render();
      modal.remove();
    }
  });
}

function renderMatchDetails(match){

          <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;">
            ${isHome ? `
              <div style="text-align:center;">
                <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">🏠 ${esc(teamName)}</div>
                <select id="homeGoals" style="padding:10px;font-size:18px;font-weight:700;border:1px solid var(--line);border-radius:6px;text-align:center;">
                  ${Array.from({length:11}, (_,i)=>`<option value="${i}" ${match.result?.goalsFor===i?'selected':''}>${i}</option>`).join('')}
                </select>

            ` : `

                <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">✈️ ${esc(match.opponent)}</div>
                <select id="homeGoals" style="padding:10px;font-size:18px;font-weight:700;border:1px solid var(--line);border-radius:6px;text-align:center;">
                  ${Array.from({length:11}, (_,i)=>`<option value="${i}" ${match.result?.goalsAgainst===i?'selected':''}>${i}</option>`).join('')}
                </select>
              </div>
            `}
            <div style="font-size:16px;font-weight:700;color:var(--ink-soft);">-</div>
            ${isHome ? `
              <div style="text-align:center;">
                <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">✈️ ${esc(match.opponent)}</div>
                <select id="awayGoals" style="padding:10px;font-size:18px;font-weight:700;border:1px solid var(--line);border-radius:6px;text-align:center;">
                  ${Array.from({length:11}, (_,i)=>`<option value="${i}" ${match.result?.goalsAgainst===i?'selected':''}>${i}</option>`).join('')}
                </select>
              </div>
            ` : `
              <div style="text-align:center;">
                <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">🏠 ${esc(teamName)}</div>
                <select id="awayGoals" style="padding:10px;font-size:18px;font-weight:700;border:1px solid var(--line);border-radius:6px;text-align:center;">
                  ${Array.from({length:11}, (_,i)=>`<option value="${i}" ${match.result?.goalsFor===i?'selected':''}>${i}</option>`).join('')}
                </select>
              </div>
            `}
          </div>
        </div>
        
        <!-- TIMELINE EVENTI -->
        <div style="border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:20px;">
          <h4 style="margin:0 0 12px 0;color:var(--pitch);font-size:13px;">📊 Timeline (${match.events?.length || 0} eventi)</h4>
          
          ${match.events && match.events.length > 0 ? `
            <div style="margin-bottom:12px;max-height:200px;overflow-y:auto;">
              ${match.events.sort((a,b)=>a.minute-b.minute).map((evt, idx)=>`
                <div style="padding:8px;background:var(--chalk);border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:12px;">
                  <div>
                    <span style="font-weight:600;">${evt.minute}'</span>
                    <span style="margin-left:8px;">${evt.type==='goal'?'⚽':'🎯'} ${esc(STATE.players.find(p=>p.id==evt.playerId)?.name||'?')}</span>
                    ${evt.type==='goal'?`<span style="color:var(--ok);font-weight:600;margin-left:4px;"> GOL</span>`:`<span style="color:var(--amber);margin-left:4px;"> ASSIST</span>`}
                  </div>
                  <button class="del-evt-btn" data-evt-idx="${idx}" style="background:none;border:none;color:var(--clay);cursor:pointer;font-size:12px;">✕</button>
                </div>
              `).join('')}
            </div>
          ` : '<div style="font-size:12px;color:#999;text-align:center;margin-bottom:12px;">Nessun evento</div>'}
          
          <div style="border-top:1px solid var(--line);padding-top:12px;">
            <div class="grid2" style="gap:8px;margin-bottom:8px;">
              <select id="eventType" style="padding:8px;border:1px solid var(--line);border-radius:4px;font-size:12px;">
                <option value="goal">⚽ Goal</option>
                <option value="assist">🎯 Assist</option>
              </select>
              <input id="eventMinute" type="number" min="0" max="120" placeholder="Min." style="padding:8px;border:1px solid var(--line);border-radius:4px;font-size:12px;text-align:center;">

            <div style="margin-bottom:8px;">
              <select id="eventPlayer" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;font-size:12px;">
                <option value="">Seleziona giocatore...</option>

            <button id="addEventBtn" class="btn" style="width:100%;padding:8px;">+ Aggiungi evento</button>

      <!-- MODULO (SEMPRE) -->

      <!-- FORMAZIONE (SEMPRE) -->

          <h5 style="margin:0 0 10px 0;font-size:12px;color:var(--pitch);background:var(--chalk);padding:6px;border-radius:4px;">🔴 STARTING XI</h5>
          <div style="max-height:200px;overflow-y:auto;">
            ${STATE.players.filter(p=>match.lineup?.some(l=>l.playerId==p.id&&l.status==='starter')).length > 0 ? `
              ${STATE.players.filter(p=>match.lineup?.some(l=>l.playerId==p.id&&l.status==='starter')).map(p=>{
                const lineupEntry = match.lineup?.find(l=>l.playerId==p.id);
                return `
                  <div style="padding:8px;background:#FAFAFA;border-radius:4px;margin-bottom:6px;display:flex;gap:8px;align-items:center;font-size:12px;">
                    <span style="color:var(--ink-soft);font-size:11px;min-width:20px;">${p.role}</span>
                    <span style="flex:1;font-weight:600;">${esc(p.name)}</span>
                    <input type="number" class="lineup-minutes" data-player-id="${p.id}" min="0" max="90" value="${lineupEntry?.minutes||90}" style="width:50px;padding:4px;border:1px solid var(--line);border-radius:4px;text-align:center;font-size:11px;">
                    <span style="color:var(--ink-soft);font-size:11px;">min</span>
                  </div>
                `;
              }).join('')}
            ` : '<div style="font-size:12px;color:#999;text-align:center;padding:8px;">Nessun titolare</div>'}
          </div>
        </div>
        <div>
          <h5 style="margin:0 0 10px 0;font-size:12px;color:var(--pitch);background:var(--chalk);padding:6px;border-radius:4px;">🟡 PANCHINA</h5>
          <div style="max-height:200px;overflow-y:auto;">
            ${STATE.players.filter(p=>!match.lineup?.some(l=>l.playerId==p.id&&l.status==='starter')).map(p=>{
              const lineupEntry = match.lineup?.find(l=>l.playerId==p.id);
              return `
                <div style="padding:8px;background:#FAFAFA;border-radius:4px;margin-bottom:6px;font-size:12px;">
                  <div style="display:flex;gap:8px;align-items:center;margin-bottom:${lineupEntry?.minutes>0?'6px':'0px'};">
                    <span style="color:var(--ink-soft);font-size:11px;min-width:20px;">${p.role}</span>
                    <span style="flex:1;font-weight:600;">${esc(p.name)}</span>
                    <label style="font-size:11px;">
                      <input type="checkbox" class="player-starter-toggle" data-player-id="${p.id}" ${match.lineup?.some(l=>l.playerId==p.id&&l.status==='starter')?'checked':''}>
                      Titolare
                    </label>
                  </div>
                  ${lineupEntry && lineupEntry.minutes > 0 ? `
                    <div style="margin-left:28px;padding:6px;background:white;border-radius:4px;border:1px solid var(--line);">
                      <div style="margin-bottom:4px;font-size:11px;color:var(--ink-soft);">Minuti: </div>
                      <input type="number" class="lineup-minutes" data-player-id="${p.id}" min="0" max="90" value="${lineupEntry.minutes}" style="width:50px;padding:4px;border:1px solid var(--line);border-radius:4px;text-align:center;font-size:11px;">
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </div>
      
      <div style="display:flex;gap:8px;">
        <button id="saveMatchBtn" class="btn" style="flex:1;">💾 Salva Partita</button>
        <button id="closeMatchModal2" class="btn secondary" style="flex:0.3;">Chiudi</button>
      </div>
    </div>
  `;
  
  document.body.appendChild(modal);
  
  const closeBtn = document.getElementById('closeMatchModal');
  const closeBtn2 = document.getElementById('closeMatchModal2');
  
  if(closeBtn) closeBtn.addEventListener('click', ()=>modal.remove());
  if(closeBtn2) closeBtn2.addEventListener('click', ()=>modal.remove());
  
  // Add event (only for past matches)
  if(isPast && document.getElementById('addEventBtn')){
    document.getElementById('addEventBtn').addEventListener('click', ()=>{
      const type = document.getElementById('eventType').value;
      const minute = parseInt(document.getElementById('eventMinute').value);
      const playerId = parseInt(document.getElementById('eventPlayer').value);
      
      if(!playerId || minute < 0 || minute > 120){
        showToast('Completa campi');
        return;
      }
      
      if(!match.events) match.events = [];
      match.events.push({type, minute, playerId});
      renderMatchDetails(match);
      modal.remove();
    });
  }
  
  // Delete event
  modal.querySelectorAll('.del-evt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.evtIdx);
      if(match.events) match.events.splice(idx, 1);
      renderMatchDetails(match);
      modal.remove();
    });
  });
  
  // Save match
  if(document.getElementById('saveMatchBtn')){
    document.getElementById('saveMatchBtn').addEventListener('click', async ()=>{
      if(isPast){
        const homeGoalsVal = parseInt(document.getElementById('homeGoals').value || '0');
        const awayGoalsVal = parseInt(document.getElementById('awayGoals').value || '0');
        
        match.result = {
          goalsFor: isHome ? homeGoalsVal : awayGoalsVal,
          goalsAgainst: isHome ? awayGoalsVal : homeGoalsVal
        };
      }
      
      match.modulo = document.getElementById('modulo').value.trim();
      
      // Collect lineup
      match.lineup = [];
      modal.querySelectorAll('.lineup-minutes').forEach(inp=>{
        const playerId = parseInt(inp.dataset.playerId);
        const minutes = parseInt(inp.value || '0');
        const isStar = modal.querySelector(`.player-starter-toggle[data-player-id="${playerId}"]`)?.checked || false;
        
        match.lineup.push({
          playerId,
          minutes: minutes,
          status: isStar ? 'starter' : 'sub'
        });
      });
      
      await saveKey('events', STATE.events);
      showToast('✅ Partita salvata');
      modal.remove();
      render();
    });
  }
}

    const updateRangeValues = ()=>{
      document.getElementById('hiStressVal').textContent = document.getElementById('hiStress').value + '/5';
      document.getElementById('hiSleepVal').textContent = document.getElementById('hiSleep').value + '/5';
      document.getElementById('hiMusclesVal').textContent = document.getElementById('hiMuscles').value + '/5';
      document.getElementById('hiMoodVal').textContent = document.getElementById('hiMood').value + '/5';
    };
    
    document.getElementById('hiStress').addEventListener('input', updateRangeValues);
    document.getElementById('hiSleep').addEventListener('input', updateRangeValues);
    document.getElementById('hiMuscles').addEventListener('input', updateRangeValues);
    document.getElementById('hiMood').addEventListener('input', updateRangeValues);
    
    document.getElementById('saveHooperBtn').addEventListener('click', async ()=>{
      const stress = parseInt(document.getElementById('hiStress').value)||3;
      const sleep = parseInt(document.getElementById('hiSleep').value)||3;
      const muscles = parseInt(document.getElementById('hiMuscles').value)||3;
      const mood = parseInt(document.getElementById('hiMood').value)||3;
      
      STATE.hooperLog.push({id:uid(), playerId:STATE.currentPlayerId, date:today, stress, sleep, muscles, mood});
      await saveKey('hooper-log', STATE.hooperLog);
      showToast('Hooper Index salvato');
      render();
    });
  }
  
  if(document.getElementById('rpeInput')){
    document.getElementById('rpeInput').addEventListener('input', ()=>{
      document.getElementById('rpeVal').textContent = document.getElementById('rpeInput').value + '/10';
    });
  }
  
  if(document.getElementById('addRpeBtn')){
    document.getElementById('addRpeBtn').addEventListener('click', async ()=>{
      const sessionId = document.getElementById('rpeSession').value;
      const rpe = parseInt(document.getElementById('rpeInput').value) || 5;
      
      if(!sessionId){
        showToast('Seleziona una sessione');
        return;
      }
      
      STATE.rpeLog.push({id:uid(), playerId:STATE.currentPlayerId, date:today, sessionId, rpe});
      await saveKey('rpe-log', STATE.rpeLog);
      showToast('RPE salvato');
      render();
    });
  }
  
  if(document.getElementById('addPainBtn')){
    document.getElementById('addPainBtn').addEventListener('click', async ()=>{
      const zone = document.getElementById('painZone').value;
      const type = document.getElementById('painType').value;
      const intensity = parseInt(document.getElementById('painIntensity').value)||5;
      const notes = document.getElementById('painNotes').value.trim();
      
      STATE.painLog.push({id:uid(), playerId:STATE.currentPlayerId, date:today, zone, type, intensity, notes});
      await saveKey('pain-log', STATE.painLog);
      showToast('Dolore registrato');
      render();
    });
  }
  
  el.querySelectorAll('[data-del-pain]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm('Sei sicuro di voler eliminare questo dolore? L\'azione non può essere annullata.')) return;
      STATE.painLog = STATE.painLog.filter(p=>p.id!==b.dataset.delPain);
      await saveKey('pain-log', STATE.painLog);
      showToast('Dolore eliminato');
      render();
    });
  });
  } catch(err) {
    console.error('Errore in renderWellness:', err);
    el.innerHTML = `<div class="page-head"><h1>Wellness</h1></div><div class="card" style="background:#F0DAD6;border:1px solid #B5473A;color:#8B3429;"><p>❌ Errore interno: ${esc(err.message)}</p></div>`;
  }
}

function renderPlayerCalendario(el){

  const todayWorkout = getTodayWorkout();
  const isPresent = todayWorkout ? isPlayerPresentToday(playerId) : null;
  
  const pastEvents = allEvents.filter(e => e.date < today);
  const todayEvents = allEvents.filter(e => e.date === today);
  const futureEvents = allEvents.filter(e => e.date > today);

    <div class="page-head"><h1>Calendario</h1><p>I tuoi impegni</p></div>

        </div>
        <div style="background:rgba(255,255,255,0.1);border-radius:8px;padding:12px;text-align:center;">
          ${isPresent === null ? `

        <h3>Oggi</h3>
        ${todayEvents.map(e => {
          const isMatch = e.type === 'Partita';
          return `
            <div style="padding:12px;background:var(--chalk);border-radius:6px;margin-bottom:8px;">
              <div style="font-weight:600;color:var(--pitch);margin-bottom:4px;">${isMatch ? '⚽' : '🏋️'} ${esc(e.title)}</div>

            </div>
          `;
        }).join('')}
      </div>
    ` : ''}
    
    ${futureEvents.length > 0 ? `
      <div class="card">
        <h3>Prossimi impegni</h3>
        ${futureEvents.map(e => {
          const isMatch = e.type === 'Partita';
          return `
            <div style="padding:12px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;">
              <div style="font-weight:600;color:var(--pitch);margin-bottom:4px;">${isMatch ? '⚽' : '🏋️'} ${esc(e.title)}</div>
              <div style="font-size:12px;color:var(--ink-soft);">

            </div>
          `;
        }).join('')}
      </div>
    ` : ''}
    
    ${pastEvents.length > 0 ? `
      <div class="card">
        <h3>Impegni passati</h3>
        ${pastEvents.slice(-10).reverse().map(e => {
          const isMatch = e.type === 'Partita';
          return `
            <div style="padding:12px;background:#F9F9F9;border-radius:6px;margin-bottom:8px;opacity:0.7;">

        if(backup.events) STATE.events = backup.events;
        if(backup.workouts) STATE.workouts = backup.workouts;
        if(backup.tests) STATE.tests = backup.tests;
        if(backup.rpe) STATE.rpeLog = backup.rpe;

        await saveKey('tests', STATE.tests);

        render();
      }catch(err){
        showToast('❌ Errore nel ripristino backup - file non valido');
      }
    };
    reader.readAsText(file);
  });
}

// ========== FIRESTORE REAL-TIME SYNC ==========
async function setupFirestoreSync(){
  if(!db || !TEAM_ID) return;
  
  console.log('🔄 Inizializzando sincronizzazione real-time Firestore...');
  
  try{
    // Ascolta i cambiamenti nella collezione 'data' della squadra
    db.collection('teams').doc(TEAM_ID).collection('data').onSnapshot(snapshot => {
      console.log('📡 Dati aggiornati da Firestore:', snapshot.size, 'documenti');
      snapshot.docChanges().forEach(change => {
        if(change.type === 'added' || change.type === 'modified'){
          const key = change.doc.id;
          const data = change.doc.data().value;
          
          // Aggiorna lo STATE corrispondente
          if(key === 'players') STATE.players = data;
          if(key === 'workouts') STATE.workouts = data;
          if(key === 'events') STATE.events = data;
          if(key === 'tests') STATE.tests = data;
          if(key === 'rpe-log') STATE.rpeLog = data;
          if(key === 'hooper-log') STATE.hooperLog = data;
          if(key === 'pain-log') STATE.painLog = data;
          if(key === 'team-config') STATE.teamConfig = data;
          
          console.log('✅ Sincronizzato:', key);
        }
      });
      
      // Aggiorna la UI se è necessario
      if(STATE.loggedIn) render();
    }, err => {
      console.error('❌ Errore sincronizzazione Firestore:', err);
    });
  }catch(err){
    console.error('❌ Errore setup sync Firestore:', err);
  }
}

// Avvia Firebase e poi i dati

});
</script>
