     FIREBASE (compat SDK, stesso pattern di Team Hub Pro)

<style>
:root{
  --bg:#14161B;
  --surface:#1D2027;
  --surface-2:#262A32;
  --line:#343943;
  --ink:#F2F1ED;
  --ink-soft:#A7ACB6;
  --accent:#E0A458;
  --accent-soft:#3A2F20;
  --accent2:#7FA87F;
  --accent2-soft:#20281F;
  --danger:#D9694F;
  --danger-soft:#2C1E1A;
  --radius:6px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Big Shoulders Display',sans-serif;
  font-weight:700;
  letter-spacing:0.01em;
  line-height:1.05;
}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}

/* ---------- LOGIN ---------- */
#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.login-card{
  width:100%;
  max-width:380px;
}
.login-brand{
  font-size:15px;
  color:var(--accent);
  font-weight:600;
  letter-spacing:0.04em;
  margin-bottom:6px;
}
.login-top-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
}
.admin-link{
  background:none;
  border:none;
  color:var(--ink-soft);
  font-size:11px;
  padding:2px 4px;
  opacity:0.55;
  text-decoration:underline;
  text-underline-offset:2px;
}
.admin-link:hover{opacity:0.85;}
.admin-link.active{color:var(--accent); opacity:1;}
.login-card h1{
  font-size:40px;
  margin-bottom:28px;
  color:var(--ink);
}
.role-toggle{
  display:flex;
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:20px;
}
.role-toggle button{
  flex:1;
  background:var(--surface);
  color:var(--ink-soft);
  border:none;
  padding:12px;
  font-size:14px;
  font-weight:600;
  transition:background .15s, color .15s;
}
.role-toggle button.active{
  background:var(--accent-soft);
  color:var(--accent);
}
.field{margin-bottom:14px;}
.field label{
  display:block;
  font-size:13px;
  color:var(--ink-soft);
  margin-bottom:6px;
}
.field input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--ink);
  padding:12px;
  border-radius:var(--radius);
  font-size:15px;
}
.field input:focus{outline:2px solid var(--accent); outline-offset:-1px;}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--accent);
  color:#1A140A;
  border:none;
  padding:12px 20px;
  border-radius:var(--radius);
  font-size:15px;
  font-weight:700;
  width:100%;
  margin-top:6px;
}
.btn:focus-visible, button:focus-visible, .nav-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.btn.secondary{background:var(--surface-2); color:var(--ink); border:1px solid var(--line);}
.btn.danger{background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger);}
.btn.small{padding:8px 14px; font-size:13px; width:auto;}
.login-note{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:16px;
  line-height:1.5;
}

/* ---------- APP SHELL ---------- */
#appShell{display:none; min-height:100vh;}
#appShell.active{display:flex;}
.sidebar{
  width:230px;
  flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  padding:20px 0;
  position:sticky;
  top:0;
  height:100vh;
}
.sidebar-head{padding:0 20px 20px; border-bottom:1px solid var(--line); margin-bottom:12px;}
.sidebar-head .brand{font-size:22px; color:var(--ink);}
.sidebar-head .role-tag{font-size:12px; color:var(--accent); margin-top:2px;}
.nav{flex:1; display:flex; flex-direction:column; gap:2px; padding:0 10px;}
.nav-btn{
  display:flex; align-items:center; gap:10px;
  background:none; border:none; color:var(--ink-soft);
  padding:11px 12px; border-radius:var(--radius); font-size:14px; font-weight:500;
  text-align:left; width:100%;
}
.nav-btn:hover{background:var(--surface-2); color:var(--ink);}
.nav-btn.active{background:var(--accent-soft); color:var(--accent);}
.sidebar-foot{padding:12px 20px 0; border-top:1px solid var(--line); margin-top:12px;}
.sidebar-foot .who{font-size:13px; color:var(--ink-soft); margin-bottom:10px;}
.logout-btn{background:none; border:1px solid var(--line); color:var(--ink-soft); padding:8px 12px; border-radius:var(--radius); font-size:13px; width:100%;}

.main{flex:1; padding:32px 40px; max-width:1100px;}
.page-head{margin-bottom:28px;}
.page-head h1{font-size:32px;}
.page-head p{color:var(--ink-soft); font-size:14px; margin-top:4px;}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
}
.card + .card{margin-top:14px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.stat-num{font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:600; color:var(--ink);}
.stat-label{font-size:12px; color:var(--ink-soft); margin-top:2px;}

.list-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 0; border-bottom:1px solid var(--line);
}
.list-row:last-child{border-bottom:none;}
.list-row-title{font-size:15px; font-weight:600;}
.list-row-sub{font-size:13px; color:var(--ink-soft); margin-top:2px;}
.tag{
  display:inline-block; font-size:11px; padding:3px 8px; border-radius:4px;
  background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line);
}
.empty-state{
  text-align:center; padding:50px 20px; color:var(--ink-soft);
}
.empty-state .display{font-size:22px; color:var(--ink); margin-bottom:8px;}

.modal-backdrop{
  display:none; position:fixed; inset:0; background:rgba(10,11,14,.7);
  align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:50;
}
.modal-backdrop.active{display:flex;}
.modal{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  width:100%; max-width:560px; padding:26px;
}
.modal h2{font-size:24px; margin-bottom:18px;}
.modal-actions{display:flex; gap:10px; margin-top:20px;}

.day-block{border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
.day-block-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.day-block-head input{background:transparent; border:none; color:var(--ink); font-size:16px; font-weight:700; font-family:'Big Shoulders Display'; width:70%;}
.ex-row{display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:8px; align-items:center; margin-bottom:8px;}
.ex-row input{background:var(--surface-2); border:1px solid var(--line); color:var(--ink); padding:8px; border-radius:4px; font-size:13px;}
.ex-row input.mono-field{font-family:'IBM Plex Mono',monospace;}
.icon-btn{background:none; border:none; color:var(--ink-soft); font-size:16px; padding:6px;}
.icon-btn:hover{color:var(--danger);}

/* Gym mode */
.gym-set-row{
  display:grid; grid-template-columns:auto 1fr 1fr 1fr auto; gap:10px; align-items:center;
  padding:12px; border:1px solid var(--line); border-radius:var(--radius); margin-bottom:8px;
}
.gym-set-row.done{border-color:var(--accent2); background:var(--accent2-soft);}
.gym-set-num{font-family:'IBM Plex Mono'; color:var(--ink-soft); font-size:13px;}
.gym-set-row input{background:var(--surface-2); border:1px solid var(--line); color:var(--ink); padding:9px; border-radius:4px; font-family:'IBM Plex Mono'; font-size:15px; text-align:center;}
.check-btn{background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); width:38px; height:38px; border-radius:4px; font-size:16px;}
.check-btn.done{background:var(--accent2); color:#12200F; border-color:var(--accent2);}
.ex-header{font-size:20px; margin:22px 0 10px;}
.ex-header:first-child{margin-top:0;}
.target-line{font-size:12px; color:var(--ink-soft); margin-bottom:10px;}

select{
  background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
  padding:10px 12px; border-radius:var(--radius); font-size:14px; width:100%;
}
label.field-label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px;}

textarea{
  width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
  padding:10px; border-radius:var(--radius); font-size:14px; font-family:'Inter'; resize:vertical;
}

.wellness-scale{display:flex; gap:6px; margin-bottom:16px;}
.wellness-scale button{
  flex:1; padding:10px 0; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft);
  border-radius:4px; font-family:'IBM Plex Mono'; font-size:14px;
}
.wellness-scale button.active{background:var(--accent); color:#1A140A; border-color:var(--accent);}

@media(max-width:820px){
  #appShell.active{flex-direction:column;}
  .sidebar{width:100%; height:auto; position:relative; flex-direction:row; align-items:center; padding:14px 16px; overflow-x:auto;}
  .sidebar-head, .sidebar-foot{display:none;}
  .nav{flex-direction:row; padding:0;}
  .nav-btn{white-space:nowrap;}
  .main{padding:20px 18px;}
  .grid-2{grid-template-columns:1fr;}
  .ex-row{grid-template-columns:1fr 1fr; grid-template-areas:"name name" "serie reps" "target del";}
}
</style>
</head>

  const fbApp = firebase.initializeApp(firebaseConfig);
  db = firebase.firestore(fbApp);
  firebaseReady = true;
}catch(e){ console.warn('Firebase non configurato, uso solo localStorage', e); }

// ADMIN: password fissa, modificabile qui. È un cerotto, non sicurezza vera —
// va bene solo perché l'admin sei tu, e per ora l'unico modo di entrare come admin.

let COACH_ID = null; // impostato dopo il login coach, con l'id del suo record nel registro

/* ---------- persistenza dati coach: Firestore se configurato, altrimenti localStorage ---------- */
async function saveKey(key, value, coachId){
  const cid = coachId || COACH_ID;
  localStorage.setItem('gtc_'+cid+'_'+key, JSON.stringify(value));
  if(firebaseReady){
    try{
      await db.collection('coaches').doc(cid).collection('data').doc(key).set({value});
    }catch(e){ console.warn('Errore salvataggio Firestore', e); }
  }
}
async function loadKey(key, fallback, coachId){
  const cid = coachId || COACH_ID;
  if(firebaseReady){
    try{
      const doc = await db.collection('coaches').doc(cid).collection('data').doc(key).get();
      if(doc.exists) return doc.data().value;
    }catch(e){ console.warn('Errore lettura Firestore', e); }
  }
  const local = localStorage.getItem('gtc_'+cid+'_'+key);
  return local ? JSON.parse(local) : fallback;
}

/* ---------- registro coach: creato dall'admin, usato per il login coach ---------- */
async function getCoachRegistry(){
  if(firebaseReady){
    try{
      const snap = await db.collection('coaches').get();
      return snap.docs.filter(d => d.data().username).map(d => ({id:d.id, ...d.data()}));
    }catch(e){ console.warn('Errore lettura registro coach', e); }
  }
  return JSON.parse(localStorage.getItem('gtc_coach_registry') || '[]');
}
async function addCoachToRegistry(entry){
  entry.id = uid('coach');
  entry.createdAt = Date.now();
  if(firebaseReady){
    try{
      await db.collection('coaches').doc(entry.id).set(
        {nome:entry.nome, cognome:entry.cognome, username:entry.username, codice:entry.codice, createdAt:entry.createdAt},
        {merge:true}
      );
    }catch(e){ console.warn('Errore scrittura registro coach', e); }
  }else{
    const list = JSON.parse(localStorage.getItem('gtc_coach_registry') || '[]');
    list.push(entry);
    localStorage.setItem('gtc_coach_registry', JSON.stringify(list));
  }
  return entry;
}
async function findCoachByCredentials(username, codice){
  const list = await getCoachRegistry();
  return list.find(c => c.username === username && c.codice === codice);
}
async function findClientAcrossCoaches(code){
  const coaches = await getCoachRegistry();
  for(const co of coaches){
    const clients = await loadKey('clients', [], co.id);
    const match = clients.find(c => c.id === code);
    if(match) return {coachId: co.id, client: match};
  }
  return null;
}
function genSixDigitCode(){
  return Math.floor(100000 + Math.random()*900000).toString();
}

/* ============================================================
   STATO GLOBALE
   ============================================================ */
const STATE = {
  role: null,        // 'coach' | 'client'
  userName: '',
  page: 'dashboard',
  templates: [],
  clients: [],        // {id, nome, obiettivo, note, assignedTemplateId, programma_attivo, maxes:{}, logs:[], wellness:{}}

document.getElementById('adminSmallLink').onclick = () => setRole(selectedRole === 'admin' ? 'coach' : 'admin');

document.getElementById('roleClientBtn').onclick = () => setRole('client');
function setRole(r){
  selectedRole = r;
  document.getElementById('roleCoachBtn').classList.toggle('active', r==='coach');
  document.getElementById('roleClientBtn').classList.toggle('active', r==='client');
  document.getElementById('adminSmallLink').classList.toggle('active', r==='admin');
  document.getElementById('mainRoleToggle').style.display = r==='admin' ? 'none' : 'flex';
  document.getElementById('adminPassField').style.display = r==='admin' ? 'block' : 'none';
  document.getElementById('coachUserField').style.display = r==='coach' ? 'block' : 'none';
  document.getElementById('coachCodeField').style.display = r==='coach' ? 'block' : 'none';
  document.getElementById('clientNameField').style.display = r==='client' ? 'block' : 'none';
  document.getElementById('clientCodeField').style.display = r==='client' ? 'block' : 'none';
}

document.getElementById('loginBtn').onclick = async () => {
  if(selectedRole === 'admin'){
    const pass = document.getElementById('loginAdminPass').value;
    if(pass !== ADMIN_PASSWORD){ alert('Password errata'); return; }
    STATE.role = 'admin';
    STATE.userName = 'Admin';
    enterApp();
    return;
  }

  if(selectedRole === 'coach'){
    const username = document.getElementById('loginCoachUser').value.trim();
    const codice = document.getElementById('loginCoachCode').value.trim();
    if(!username || !codice){ alert('Inserisci username e codice'); return; }
    const coach = await findCoachByCredentials(username, codice);
    if(!coach){ alert('Username o codice non validi. Chiedi il codice al tuo admin.'); return; }
    COACH_ID = coach.id;
    STATE.role = 'coach';
    STATE.userName = coach.nome + ' ' + coach.cognome;
    await loadAll();
    enterApp();
    return;
  }

  // cliente
  const name = document.getElementById('loginName').value.trim();
  const code = document.getElementById('loginClientCode').value.trim();
  if(!name || !code){ alert('Inserisci nome e codice atleta'); return; }
  const found = await findClientAcrossCoaches(code);
  if(!found){
    alert('Atleta non trovato. Controlla il codice ricevuto dal tuo coach.');
    return;
  }
  COACH_ID = found.coachId;
  STATE.role = 'client';
  STATE.userName = name;
  await loadAll();
  STATE.activeClientId = found.client.id;
  enterApp();
};

function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').classList.add('active');
  const roleLabels = {admin:'Admin', coach:'Coach', client:'Atleta'};
  document.getElementById('sidebarRole').textContent = roleLabels[STATE.role];
  document.getElementById('whoAmI').textContent = STATE.userName;
  buildNav();
  const landing = {admin:'admin', coach:'dashboard', client:'gym'};
  goPage(landing[STATE.role]);
}

function openTemplateModal(existing){
  const t = existing ? JSON.parse(JSON.stringify(existing)) : {id: uid('tpl'), nome:'Nuovo template', giorni:[]};
  renderTemplateModalBody(t, !existing);
}
function renderTemplateModalBody(t, isNew){
  document.getElementById('modalBody').innerHTML = `
    <h2>${isNew ? 'Nuovo template' : 'Modifica template'}</h2>
    <div class="field"><label>Nome template</label><input type="text" id="mTplNome" value="${t.nome}"></div>
    <div id="tplGiorni"></div>
    <button class="btn secondary small" id="addGiornoBtn" style="width:auto; margin-bottom:10px;">+ Aggiungi giorno</button>
    <div class="modal-actions">
      <button class="btn secondary" id="modalCancel">Annulla</button>
      <button class="btn" id="modalSaveTemplate">Salva template</button>
    </div>
  `;
  document.getElementById('modalBackdrop').classList.add('active');

  function renderGiorni(){
    document.getElementById('tplGiorni').innerHTML = t.giorni.map((g,gi) => `
      <div class="day-block">
        <div class="day-block-head">
          <input type="text" value="${g.nome}" data-giorno-nome="${gi}">
          <button class="icon-btn" data-del-giorno="${gi}">✕</button>
        </div>
        ${g.esercizi.map((e,ei) => `
          <div class="ex-row">
            <input type="text" placeholder="Esercizio" value="${e.esercizio}" data-ex-field="${gi}.${ei}.esercizio">
            <input type="number" placeholder="Serie" value="${e.serie}" data-ex-field="${gi}.${ei}.serie">
            <input type="number" placeholder="Reps" value="${e.reps}" data-ex-field="${gi}.${ei}.reps">
            <input type="text" class="mono-field" placeholder="Target (75%1RM / RIR2)" value="${e.target}" data-ex-field="${gi}.${ei}.target">
            <button class="icon-btn" data-del-ex="${gi}.${ei}">✕</button>
          </div>
        `).join('')}
        <button class="btn secondary small" data-add-ex="${gi}" style="width:auto;">+ Esercizio</button>
      </div>
    `).join('');

    document.querySelectorAll('[data-giorno-nome]').forEach(inp => inp.onchange = e => {
      t.giorni[+inp.dataset.giornoNome].nome = e.target.value;
    });
    document.querySelectorAll('[data-ex-field]').forEach(inp => inp.onchange = e => {
      const [gi,ei,field] = inp.dataset.exField.split('.');
      let v = e.target.value;
      if(field==='serie'||field==='reps') v = parseInt(v)||0;
      t.giorni[+gi].esercizi[+ei][field] = v;
    });
    document.querySelectorAll('[data-del-giorno]').forEach(b => b.onclick = () => {
      t.giorni.splice(+b.dataset.delGiorno,1); renderGiorni();
    });
    document.querySelectorAll('[data-del-ex]').forEach(b => b.onclick = () => {
      const [gi,ei] = b.dataset.delEx.split('.');
      t.giorni[+gi].esercizi.splice(+ei,1); renderGiorni();
    });
    document.querySelectorAll('[data-add-ex]').forEach(b => b.onclick = () => {
      t.giorni[+b.dataset.addEx].esercizi.push({esercizio:'', serie:3, reps:10, target:'RIR2', riposo_sec:90});
      renderGiorni();
    });
  }
  renderGiorni();

  document.getElementById('addGiornoBtn').onclick = () => {
    t.giorni.push({nome:'Nuovo giorno', esercizi:[]});
    renderGiorni();
  };
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalSaveTemplate').onclick = async () => {
    t.nome = document.getElementById('mTplNome').value.trim() || t.nome;
    const idx = STATE.templates.findIndex(x=>x.id===t.id);
    if(idx>=0) STATE.templates[idx] = t; else STATE.templates.push(t);
    await persistTemplates();
    closeModal();
    render();
  };
}

/* ============================================================
   LOG ALLENAMENTO (Gym Mode)
   ============================================================ */
function renderGym(){
  let client;
  if(STATE.role === 'client'){
    client = STATE.clients.find(c=>c.id===STATE.activeClientId);
  }else{
    if(!STATE.activeClientId && STATE.clients.length) STATE.activeClientId = STATE.clients[0].id;
    client = STATE.clients.find(c=>c.id===STATE.activeClientId);
  }

  const clientPicker = STATE.role === 'coach' ? `
    <div class="field" style="max-width:300px;">
      <label class="field-label">Visualizza atleta</label>
      <select id="gymClientSel">
        ${STATE.clients.map(c=>`<option value="${c.id}" ${c.id===STATE.activeClientId?'selected':''}>${c.nome}</option>`).join('')}
      </select>
    </div>
  ` : '';

  if(!client){
    return `<div class="page-head"><h1>Log allenamento</h1></div>${clientPicker}<div class="card">${emptyState('Nessun atleta selezionato','Crea o scegli un atleta.')}</div>`;
  }
  if(!client.programma_attivo){
    return `<div class="page-head"><h1>Log allenamento</h1><p>${client.nome}</p></div>${clientPicker}<div class="card">${emptyState('Nessun programma assegnato', STATE.role==='coach' ? 'Vai su "Assegna programma" per crearne uno.' : 'Il tuo coach non ti ha ancora assegnato un programma.')}</div>`;
  }

  const prog = client.programma_attivo;
  const dayOptions = prog.giorni.map((g,i)=>`<option value="${i}">${g.nome}</option>`).join('');
  const dayIdx = client._gymDayIdx || 0;
  const day = prog.giorni[dayIdx];

  return `
    <div class="page-head">
      <h1>${prog.nome}</h1>
      <p>${client.nome}</p>
    </div>
    ${clientPicker}
    <div class="field" style="max-width:320px;">
      <label class="field-label">Giorno</label>
      <select id="gymDaySel">${dayOptions}</select>
    </div>
    <div id="gymDayBody">${renderGymDayBody(client, day)}</div>
    <div class="card" style="margin-top:18px;">
      <button class="btn" id="finishSessionBtn">Chiudi sessione e salva</button>
    </div>
  `;
}

function renderGymDayBody(client, day){
  if(!client._gymLog) client._gymLog = {};
  return day.esercizi.map((ex, exi) => {
    const key = ex.esercizio + '_' + exi;
    if(!client._gymLog[key]) client._gymLog[key] = Array.from({length:ex.serie}, ()=>({peso:'',reps:'',rir:'',done:false}));
    const sets = client._gymLog[key];
    return `
      <h3 class="ex-header">${ex.esercizio}</h3>
      <div class="target-line">Target: ${ex.target} · ${ex.serie} serie x ${ex.reps} reps · riposo ${ex.riposo_sec}s</div>
      ${sets.map((s,si) => `
        <div class="gym-set-row ${s.done?'done':''}">
          <div class="gym-set-num">#${si+1}</div>
          <input type="number" placeholder="kg" value="${s.peso}" data-set="${key}.${si}.peso">
          <input type="number" placeholder="reps" value="${s.reps}" data-set="${key}.${si}.reps">
          <input type="number" placeholder="RIR" value="${s.rir}" data-set="${key}.${si}.rir">
          <button class="check-btn ${s.done?'done':''}" data-check="${key}.${si}">✓</button>
        </div>
      `).join('')}
    `;
  }).join('');
}

  const today = new Date().toISOString().slice(0,10);

  return `
    <div class="page-head"><h1>Wellness</h1><p>${client.nome} · ${today}</p></div>

      <label class="field-label">Qualità del sonno (1-5)</label>

      <div class="wellness-scale" data-scale="stress">${scaleButtons(w.stress)}</div>
      <label class="field-label">Energia (1-5)</label>
      <div class="wellness-scale" data-scale="energia">${scaleButtons(w.energia)}</div>

function scaleButtons(current){

}

      <p>Crea gli account coach: username scelto da te, codice generato automaticamente</p>
    </div>
    <button class="btn small" id="newCoachBtn" style="width:auto; margin-bottom:18px;">+ Nuovo coach</button>
    <div class="card" id="coachRegistryCard">Caricamento...</div>
  `;
}
async function loadAndRenderCoachRegistry(){
  _coachRegistryCache = await getCoachRegistry();
  const card = document.getElementById('coachRegistryCard');
  if(!card) return;
  card.innerHTML = _coachRegistryCache.length === 0 ? emptyState('Nessun coach ancora', 'Crea il primo account coach.') :
    _coachRegistryCache.map(c => `
      <div class="list-row">
        <div>
          <div class="list-row-title">${c.nome} ${c.cognome}</div>
          <div class="list-row-sub">username: <span class="mono">${c.username}</span></div>
        </div>
        <span class="tag mono" style="font-size:14px; padding:6px 10px;">${c.codice}</span>
      </div>
    `).join('');
}
function openNewCoachModal(){
  document.getElementById('modalBody').innerHTML = `
    <h2>Nuovo coach</h2>
    <div class="field"><label>Nome</label><input type="text" id="mCoNome"></div>
    <div class="field"><label>Cognome</label><input type="text" id="mCoCognome"></div>
    <div class="field"><label>Username</label><input type="text" id="mCoUsername" placeholder="usato per il login"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="modalCancel">Annulla</button>
      <button class="btn" id="modalSaveCoach">Crea e genera codice</button>
    </div>
  `;
  document.getElementById('modalBackdrop').classList.add('active');
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalSaveCoach').onclick = async () => {
    const nome = document.getElementById('mCoNome').value.trim();
    const cognome = document.getElementById('mCoCognome').value.trim();
    const username = document.getElementById('mCoUsername').value.trim();
    if(!nome || !username){ alert('Nome e username sono obbligatori'); return; }
    const existing = await getCoachRegistry();
    if(existing.some(c => c.username === username)){ alert('Username già in uso, scegline un altro'); return; }
    const codice = genSixDigitCode();
    const entry = await addCoachToRegistry({nome, cognome, username, codice});
    document.getElementById('modalBody').innerHTML = `
      <h2>Coach creato</h2>
      <p style="color:var(--ink-soft); font-size:14px; margin-bottom:16px;">
        Comunica queste credenziali a ${entry.nome}. Il codice non verrà mostrato di nuovo qui — se lo perde, elimina il coach e ricrealo.
      </p>
      <div class="card" style="text-align:center; padding:24px;">
        <div class="stat-label">Username</div>
        <div class="stat-num" style="font-size:22px;">${entry.username}</div>
        <div style="height:14px;"></div>
        <div class="stat-label">Codice</div>
        <div class="stat-num" style="font-size:36px; color:var(--accent);">${entry.codice}</div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="modalCloseAfterCoach">Chiudi</button>
      </div>
    `;
    document.getElementById('modalCloseAfterCoach').onclick = async () => {
      closeModal();
      await loadAndRenderCoachRegistry();
    };
  };
}

/* ============================================================
   IMPOSTAZIONI
   ============================================================ */
function renderSettings(){
  return `
    <div class="page-head"><h1>Impostazioni</h1></div>
    <div class="card">
      <h3 style="font-size:16px; margin-bottom:10px;">Stato Firebase</h3>
      <p style="color:var(--ink-soft); font-size:14px; line-height:1.6;">
        ${firebaseReady
          ? 'Connesso a Firestore. I dati vengono salvati anche in cloud, non solo nel browser.'
          : 'Non connesso. I dati restano solo in questo browser (localStorage) — se cambi dispositivo o cancelli la cache li perdi. Per collegare Firestore, apri il file index.html e sostituisci il blocco firebaseConfig con quello del tuo progetto GIMTONIC Coaching su Firebase.'}
      </p>
    </div>
    <div class="card">
      <h3 style="font-size:16px; margin-bottom:10px;">Promemoria sicurezza</h3>
      <p style="color:var(--ink-soft); font-size:14px; line-height:1.6;">
        Il login ad oggi è: password admin fissa nel codice, e username/codice coach verificati leggendo Firestore in chiaro (regole ancora aperte a tutti). Funziona, ma chiunque legga il file sorgente vede la password admin, e le regole Firestore permettono lettura/scrittura a chiunque abbia il link. Prima di avere molti atleti reali, va sostituito con Firebase Authentication vera e regole Firestore che verificano l'identità lato server.
      </p>
    </div>
  `;
}

/* ============================================================
   EVENT HANDLERS DI PAGINA (delegati dopo ogni render)
   ============================================================ */
function attachPageHandlers(){
  // Admin
  const newCoachBtn = document.getElementById('newCoachBtn');
  if(newCoachBtn) newCoachBtn.onclick = openNewCoachModal;
  if(document.getElementById('coachRegistryCard')) loadAndRenderCoachRegistry();

  // Clienti
  const newClientBtn = document.getElementById('newClientBtn');
  if(newClientBtn) newClientBtn.onclick = () => openClientModal(null);
  document.querySelectorAll('[data-edit-client]').forEach(b => b.onclick = () => {
    const c = STATE.clients.find(x=>x.id===b.dataset.editClient);
    openClientModal(c);
  });
  document.querySelectorAll('[data-del-client]').forEach(b => b.onclick = async () => {
    if(!confirm('Eliminare questo atleta e tutti i suoi dati?')) return;
    STATE.clients = STATE.clients.filter(x=>x.id!==b.dataset.delClient);
    await persistClients();
    render();
  });

  // Templates
  const newTplBtn = document.getElementById('newTemplateBtn');
  if(newTplBtn) newTplBtn.onclick = () => openTemplateModal(null);
  document.querySelectorAll('[data-edit-template]').forEach(b => b.onclick = () => {
    const t = STATE.templates.find(x=>x.id===b.dataset.editTemplate);
    openTemplateModal(t);
  });
  document.querySelectorAll('[data-del-template]').forEach(b => b.onclick = async () => {
    if(!confirm('Eliminare questo template dalla libreria?')) return;
    STATE.templates = STATE.templates.filter(x=>x.id!==b.dataset.delTemplate);
    await persistTemplates();
    render();
  });

  // Assegna
  const assignBtn = document.getElementById('doAssignBtn');
  if(assignBtn) assignBtn.onclick = async () => {
    const clientId = document.getElementById('assignClientSel').value;
    const tplId = document.getElementById('assignTplSel').value;
    const client = STATE.clients.find(c=>c.id===clientId);
    const tpl = STATE.templates.find(t=>t.id===tplId);
    // copia profonda scollegata dal template originale
    client.programma_attivo = JSON.parse(JSON.stringify(tpl));
    client.programma_attivo.origine_template = tpl.id;
    client._gymDayIdx = 0;
    client._gymLog = {};
    await persistClients();
    alert('Programma assegnato a ' + client.nome + '. È una copia indipendente: modificarla non tocca il template originale.');
    goPage('gym');
  };

  // Gym mode
  const gymClientSel = document.getElementById('gymClientSel');
  if(gymClientSel) gymClientSel.onchange = e => { STATE.activeClientId = e.target.value; render(); };
  const gymDaySel = document.getElementById('gymDaySel');
  if(gymDaySel){
    const client = STATE.clients.find(c=>c.id===STATE.activeClientId);
    gymDaySel.value = client._gymDayIdx || 0;
    gymDaySel.onchange = e => {
      client._gymDayIdx = parseInt(e.target.value);
      client._gymLog = {};
      render();
    };
  }
  document.querySelectorAll('[data-set]').forEach(inp => inp.onchange = e => {
    const client = STATE.clients.find(c=>c.id===STATE.activeClientId);
    const [key, si, field] = inp.dataset.set.split('.');
    client._gymLog[key][+si][field] = e.target.value;
  });
  document.querySelectorAll('[data-check]').forEach(btn => btn.onclick = () => {
    const client = STATE.clients.find(c=>c.id===STATE.activeClientId);
    const [key, si] = btn.dataset.check.split('.');
    client._gymLog[key][+si].done = !client._gymLog[key][+si].done;
    document.getElementById('gymDayBody').innerHTML = renderGymDayBody(client, client.programma_attivo.giorni[client._gymDayIdx||0]);
    attachPageHandlers();
  });
  const finishBtn = document.getElementById('finishSessionBtn');
  if(finishBtn) finishBtn.onclick = async () => {
    const client = STATE.clients.find(c=>c.id===STATE.activeClientId);
    const day = client.programma_attivo.giorni[client._gymDayIdx||0];
    const esercizi = day.esercizi.map((ex,exi) => {
      const key = ex.esercizio + '_' + exi;
      return {esercizio: ex.esercizio, sets: (client._gymLog[key]||[]).map(s=>({peso:s.peso,reps:s.reps,rir:s.rir,timestamp:Date.now()}))};
    });
    if(!client.logs) client.logs = [];
    client.logs.push({data: Date.now(), giorno_nome: day.nome, esercizi});
    client._gymLog = {};
    await persistClients();
    alert('Sessione salvata.');
    render();
  };

  // Wellness
  const wellClientSel = document.getElementById('wellClientSel');
  if(wellClientSel) wellClientSel.onchange = e => { STATE.activeClientId = e.target.value; render(); };
  document.querySelectorAll('[data-scale]').forEach(group => {
    group.querySelectorAll('button').forEach(btn => btn.onclick = () => {
      group.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  const saveWellBtn = document.getElementById('saveWellnessBtn');
  if(saveWellBtn) saveWellBtn.onclick = async () => {
    const client = STATE.clients.find(c=>c.id===STATE.activeClientId);
    const today = new Date().toISOString().slice(0,10);
    if(!client.wellness) client.wellness = {};
    const entry = {};
    document.querySelectorAll('[data-scale]').forEach(group => {
      const activeBtn = group.querySelector('button.active');
      entry[group.dataset.scale] = activeBtn ? parseInt(activeBtn.dataset.val) : 0;
    });
    client.wellness[today] = entry;
    await persistClients();
    alert('Check-in salvato.');
  };
}
</script>
