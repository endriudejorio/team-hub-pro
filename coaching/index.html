<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GIMTONIC Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<!-- ========================================================
     FIREBASE (compat SDK, stesso pattern di Team Hub Pro)
     Sostituisci firebaseConfig con quello del TUO progetto
     Firebase per GIMTONIC Coaching (NON quello di Team Hub Pro).
     ======================================================== -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<style>
:root{
  --bg:#0F1114;
  --surface:#1A1D21;
  --surface-2:#24282E;
  --line:#2E333A;
  --ink:#F5F6F7;
  --ink-soft:#9BA1AA;
  --accent:#3B82F6;
  --accent-soft:#14263F;
  --accent2:#22C55E;
  --accent2-soft:#0F2A18;
  --danger:#EF4444;
  --danger-soft:#2C1618;
  --radius:8px;
}
body[data-theme="light"]{
  --bg:#F7F8FA;
  --surface:#FFFFFF;
  --surface-2:#F1F3F5;
  --line:#E2E5E9;
  --ink:#16191D;
  --ink-soft:#6B7280;
  --accent:#2563EB;
  --accent-soft:#E7EFFD;
  --accent2:#16A34A;
  --accent2-soft:#E6F5EC;
  --danger:#DC2626;
  --danger-soft:#FDEBEB;
}
body[data-theme="light"] .set-type-btn.type-W{background:#FEF3C7; color:#B45309; border-color:#F59E0B;}
body[data-theme="light"] .set-type-btn.type-D{background:#F3E8FF; color:#7E22CE; border-color:#A855F7;}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Inter',system-ui,sans-serif;
  font-weight:700;
  letter-spacing:-0.02em;
  line-height:1.2;
}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}

/* ---------- LOGIN ---------- */
#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.login-card{
  width:100%;
  max-width:380px;
}
.login-brand{
  font-size:15px;
  color:var(--accent);
  font-weight:600;
  letter-spacing:0.04em;
  margin-bottom:6px;
}
.login-top-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
}
.admin-link{
  background:none;
  border:none;
  color:var(--ink-soft);
  font-size:11px;
  padding:2px 4px;
  opacity:0.55;
  text-decoration:underline;
  text-underline-offset:2px;
}
.admin-link:hover{opacity:0.85;}
.admin-link.active{color:var(--accent); opacity:1;}
.login-card h1{
  font-size:36px;
  margin-bottom:28px;
  color:var(--ink);
}
.role-toggle{
  display:flex;
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:20px;
}
.role-toggle button{
  flex:1;
  background:var(--surface);
  color:var(--ink-soft);
  border:none;
  padding:12px;
  font-size:14px;
  font-weight:600;
  transition:background .15s, color .15s;
}
.role-toggle button.active{
  background:var(--accent-soft);
  color:var(--accent);
}
.field{margin-bottom:14px;}
.field label{
  display:block;
  font-size:13px;
  color:var(--ink-soft);
  margin-bottom:6px;
}
.field input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--ink);
  padding:12px;
  border-radius:var(--radius);
  font-size:15px;
}
.field input:focus{outline:2px solid var(--accent); outline-offset:-1px;}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--accent);
  color:#FFFFFF;
  border:none;
  padding:12px 20px;
  border-radius:var(--radius);
  font-size:15px;
  font-weight:700;
  width:100%;
  margin-top:6px;
}
.btn:focus-visible, button:focus-visible, .nav-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.btn.secondary{background:var(--surface-2); color:var(--ink); border:1px solid var(--line);}
.btn.danger{background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger);}
.btn.small{padding:8px 14px; font-size:13px; width:auto;}
.login-note{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:16px;
  line-height:1.5;
}

/* ---------- APP SHELL ---------- */
#appShell{display:none; min-height:100vh;}
#appShell.active{display:flex;}
.sidebar{
  width:230px;
  flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  padding:20px 0;
  position:sticky;
  top:0;
  height:100vh;
}
.sidebar-head{padding:0 20px 20px; border-bottom:1px solid var(--line); margin-bottom:12px;}
.sidebar-head .brand{font-size:22px; color:var(--ink);}
.sidebar-head .role-tag{font-size:12px; color:var(--accent); margin-top:2px;}
.nav{flex:1; display:flex; flex-direction:column; gap:2px; padding:0 10px;}
.nav-btn{
  display:flex; align-items:center; gap:10px;
  background:none; border:none; color:var(--ink-soft);
  padding:11px 12px; border-radius:var(--radius); font-size:14px; font-weight:500;
  text-align:left; width:100%;
}
.nav-btn:hover{background:var(--surface-2); color:var(--ink);}
.nav-btn.active{background:var(--accent-soft); color:var(--accent);}
.sidebar-foot{padding:12px 20px 0; border-top:1px solid var(--line); margin-top:12px;}
.sidebar-foot .who{font-size:13px; color:var(--ink-soft); margin-bottom:10px;}
.logout-btn{background:none; border:1px solid var(--line); color:var(--ink-soft); padding:8px 12px; border-radius:var(--radius); font-size:13px; width:100%;}

.main{flex:1; padding:32px 40px; max-width:1100px;}
body:has(#workoutTimerBar[style*='flex']) .main{padding-top:56px;}
.page-head{margin-bottom:28px;}
.page-head h1{font-size:32px;}
.page-head p{color:var(--ink-soft); font-size:14px; margin-top:4px;}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
}
.card + .card{margin-top:14px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.stat-num{font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:600; color:var(--ink);}
.stat-label{font-size:12px; color:var(--ink-soft); margin-top:2px;}

.list-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 0; border-bottom:1px solid var(--line);
}
.list-row:last-child{border-bottom:none;}
.list-row-title{font-size:15px; font-weight:600;}
.list-row-sub{font-size:13px; color:var(--ink-soft); margin-top:2px;}
.tag{
  display:inline-block; font-size:11px; padding:3px 8px; border-radius:4px;
  background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line);
}
.empty-state{
  text-align:center; padding:50px 20px; color:var(--ink-soft);
}
.empty-state .display{font-size:22px; color:var(--ink); margin-bottom:8px;}

.modal-backdrop{
  display:none; position:fixed; inset:0; background:rgba(10,11,14,.7);
  align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:50;
}
.modal-backdrop.active{display:flex;}
.modal{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  width:100%; max-width:560px; padding:26px;
}
.modal h2{font-size:24px; margin-bottom:18px;}
.modal-actions{display:flex; gap:10px; margin-top:20px;}

.day-block{border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
.day-block-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.day-block-head input{background:transparent; border:none; color:var(--ink); font-size:16px; font-weight:700; width:70%;}
.ex-row{display:grid; grid-template-columns:auto 2fr 0.8fr 0.8fr 1fr auto auto auto; gap:5px; align-items:center; margin-bottom:6px;}
.ex-row-wrap{border-radius:6px; padding:6px; margin-bottom:6px; border:1px solid transparent;}
.ex-row-wrap.in-superset{border-left:3px solid var(--accent); background:var(--accent-soft);}
.ex-row-wrap.dragging{opacity:.4;}
.ex-row-wrap.drag-over{border-color:var(--accent);}
.drag-handle{cursor:grab; color:var(--ink-soft); font-size:15px; user-select:none;}
.ex-note{width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); padding:6px 8px; border-radius:4px; font-size:12px;}
.icon-btn.ss-on{color:var(--accent);}
.icon-btn.tt-on{color:#F0B429;}
.ss-badge{display:inline-block; font-size:10px; padding:2px 6px; border-radius:3px; background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent); margin-left:8px; vertical-align:middle;}
.media-link{
  display:inline-block; font-size:12px; color:var(--accent); text-decoration:none;
  padding:6px 10px; border:1px solid var(--accent); border-radius:4px; margin-bottom:8px;
}
.media-link:hover{background:var(--accent-soft);}
.cue-display{font-size:12px; color:var(--ink-soft); margin-bottom:8px; font-style:italic;}
.ex-note-display{font-size:12px; color:var(--accent); margin-bottom:8px; padding:6px 10px; background:var(--accent-soft); border-radius:4px;}
.pr-badge{display:inline-block; font-size:10px; padding:2px 6px; border-radius:3px; background:var(--accent2-soft); color:var(--accent2); border:1px solid var(--accent2); margin-left:6px;}
.ex-row input{background:var(--surface-2); border:1px solid var(--line); color:var(--ink); padding:8px; border-radius:4px; font-size:13px;}
.ex-row input.mono-field{font-family:'IBM Plex Mono',monospace;}
.icon-btn{background:none; border:none; color:var(--ink-soft); font-size:16px; padding:6px;}
.icon-btn:hover{color:var(--danger);}

/* Gym mode */
.gym-set-row{
  display:flex; flex-direction:column; gap:8px;
  padding:12px; border:1px solid var(--line); border-radius:var(--radius); margin-bottom:8px;
}
.gym-set-row.done{border-color:var(--accent2); background:var(--accent2-soft);}
.gym-set-top{display:grid; grid-template-columns:auto 1fr 1fr auto; gap:10px; align-items:center;}
.set-type-btn{
  width:32px; height:32px; border-radius:6px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink-soft); font-size:12px; font-weight:700;
}
.set-type-btn.type-W{background:#3A2E10; color:#F0B429; border-color:#F0B429;}
.set-type-btn.type-D{background:#2B1B3D; color:#A855F7; border-color:#A855F7;}
.set-type-btn.type-F{background:var(--danger-soft); color:var(--danger); border-color:var(--danger);}
.gym-set-num{font-family:'IBM Plex Mono'; color:var(--ink-soft); font-size:13px;}
.workout-timer-bar{
  position:fixed; top:0; left:0; right:0; z-index:59;
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:8px 20px; display:flex; align-items:center; justify-content:center; gap:12px;
}
.wt-dot{width:8px; height:8px; border-radius:50%; background:var(--accent2); animation:wtpulse 2s infinite;}
.wt-dot.paused{background:var(--ink-soft); animation:none;}
@keyframes wtpulse{0%,100%{opacity:1;} 50%{opacity:.3;}}
.rest-timer-bar{
  position:fixed; bottom:0; left:0; right:0; z-index:60;
  background:var(--surface); border-top:1px solid var(--accent);
  padding:14px 24px; display:flex; align-items:center; justify-content:center; gap:16px;
}
.mini-input{width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); padding:9px; border-radius:4px; font-size:14px; text-align:center;}
.gym-set-row input{background:var(--surface-2); border:1px solid var(--line); color:var(--ink); padding:9px; border-radius:4px; font-family:'IBM Plex Mono'; font-size:15px; text-align:center;}
.time-btn{
  background:var(--surface-2); border:1px solid #F0B429; color:#F0B429;
  padding:9px; border-radius:4px; font-family:'IBM Plex Mono'; font-size:14px; font-weight:600;
}
.set-timer-bar{
  position:fixed; bottom:0; left:0; right:0; z-index:61;
  background:var(--surface); border-top:2px solid #F0B429;
  padding:14px 24px; display:flex; align-items:center; justify-content:center; gap:16px;
}
.check-btn{background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); width:38px; height:38px; border-radius:4px; font-size:16px;}
.check-btn.done{background:var(--accent2); color:#FFFFFF; border-color:var(--accent2);}
.gym-scale-row{display:flex; gap:5px; flex-wrap:wrap;}
.scale-btn{
  background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft);
  padding:7px 0; border-radius:4px; font-family:'IBM Plex Mono'; font-size:13px; flex:1; min-width:38px;
}
.scale-btn.active{background:var(--accent); color:#FFFFFF; border-color:var(--accent); font-weight:600;}
.ex-header{font-size:20px; margin:22px 0 10px;}
.ex-header:first-child{margin-top:0;}
.week-progress{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
.week-dot{
  width:36px; height:36px; border-radius:50%; border:1px solid var(--line);
  background:var(--surface); color:var(--ink-soft); font-size:13px; font-weight:600;
}
.week-dot.past{background:var(--accent2-soft); color:var(--accent2); border-color:var(--accent2);}
.week-dot.active{background:var(--accent); color:#FFF; border-color:var(--accent);}
.target-line{font-size:12px; color:var(--ink-soft); margin-bottom:10px;}
.prev-line{
  font-size:12px; color:var(--ink-soft); margin-bottom:10px;
  font-family:'IBM Plex Mono',monospace; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:8px 10px; background:var(--surface-2); border-radius:4px; border-left:2px solid var(--line);
}
.prev-label{color:var(--ink); font-weight:600;}
.sugg-chip{
  background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent);
  padding:3px 8px; border-radius:4px; font-size:11px; font-weight:600;
}

select{
  background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
  padding:10px 12px; border-radius:var(--radius); font-size:14px; width:100%;
}
label.field-label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px;}

textarea{
  width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
  padding:10px; border-radius:var(--radius); font-size:14px; font-family:'Inter'; resize:vertical;
}

.wellness-scale{display:flex; gap:6px; margin-bottom:16px;}
.wellness-scale button{
  flex:1; padding:10px 0; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft);
  border-radius:4px; font-family:'IBM Plex Mono'; font-size:14px;
}
.wellness-scale button.active{background:var(--accent); color:#FFFFFF; border-color:var(--accent);}

@media(max-width:820px){
  #appShell.active{flex-direction:column;}
  .sidebar{width:100%; height:auto; position:relative; flex-direction:row; align-items:center; padding:14px 16px; overflow-x:auto;}
  .sidebar-head, .sidebar-foot{display:none;}
  .nav{flex-direction:row; padding:0;}
  .nav-btn{white-space:nowrap;}
  .main{padding:20px 18px;}
  .grid-2{grid-template-columns:1fr;}
  .ex-row{grid-template-columns:1fr 1fr; grid-template-areas:"name name" "serie reps" "target del";}
}
</style>
</head>
<body>

<!-- ========================= LOGIN ========================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-top-row">
      <div class="login-brand">GIMTONIC</div>
      <div style="display:flex; gap:12px; align-items:center;">
        <button id="themeToggleLogin" class="admin-link">Tema</button>
        <button id="adminSmallLink" class="admin-link">Admin</button>
      </div>
    </div>
    <h1>Coaching</h1>
    <div class="role-toggle" id="mainRoleToggle">
      <button id="roleCoachBtn" class="active" data-role="coach">Coach</button>
      <button id="roleClientBtn" data-role="client">Atleta</button>
    </div>

    <!-- Admin: solo password -->
    <div class="field" id="adminPassField" style="display:none;">
      <label>Password admin</label>
      <input type="password" id="loginAdminPass" placeholder="Password">
    </div>

    <!-- Coach: username + codice dati dall'admin -->
    <div class="field" id="coachUserField">
      <label>Username</label>
      <input type="text" id="loginCoachUser" placeholder="Il tuo username">
    </div>
    <div class="field" id="coachCodeField">
      <label>Codice</label>
      <input type="text" inputmode="numeric" maxlength="6" id="loginCoachCode" placeholder="Codice a 6 cifre">
    </div>

    <!-- Atleta: nome + codice -->
    <div class="field" id="clientNameField" style="display:none;">
      <label>Nome</label>
      <input type="text" id="loginName" placeholder="Il tuo nome">
    </div>
    <div class="field" id="clientCodeField" style="display:none;">
      <label>Codice atleta</label>
      <input type="text" id="loginClientCode" placeholder="Ricevuto dal tuo coach">
    </div>

    <button class="btn" id="loginBtn">Entra</button>
    <div class="login-note" id="loginNote">
      Demo locale: i dati restano nel browser finché non colleghi Firebase (vedi Impostazioni una volta dentro).
    </div>
  </div>
</div>

<!-- ========================= APP ========================= -->
<div id="appShell">
  <div class="sidebar">
    <div class="sidebar-head">
      <div class="brand display">GIMTONIC</div>
      <div class="role-tag" id="sidebarRole">Coach</div>
    </div>
    <div class="nav" id="navList"></div>
    <div class="sidebar-foot">
      <div class="who" id="whoAmI"></div>
      <button class="logout-btn" id="themeToggleBtn" style="margin-bottom:8px;">Tema chiaro</button>
      <button class="logout-btn" id="logoutBtn">Esci</button>
    </div>
  </div>
  <div class="main" id="pageContent"></div>
</div>

<div class="workout-timer-bar" id="workoutTimerBar" style="display:none;">
  <span class="wt-dot"></span>
  <span style="font-size:12px; color:var(--ink-soft);">Sessione</span>
  <span class="mono" id="workoutTimerValue" style="font-size:18px; font-weight:600;">00:00</span>
  <button class="btn secondary small" id="workoutTimerToggle" style="width:auto; padding:5px 12px;">Pausa</button>
</div>
<div class="set-timer-bar" id="setTimerBar" style="display:none;">
  <span style="font-size:13px; color:var(--ink-soft);">Esecuzione</span>
  <span class="mono" id="setTimerValue" style="font-size:26px; font-weight:600; color:#F0B429;">00:00</span>
  <button class="btn secondary small" id="setTimerStop" style="width:auto;">Stop</button>
</div>
<div class="rest-timer-bar" id="restTimerBar" style="display:none;">
  <span style="font-size:13px; color:var(--ink-soft);">Recupero</span>
  <span class="mono" id="restTimerValue" style="font-size:22px; font-weight:600;">00:00</span>
  <button class="btn secondary small" id="restTimerSkip">Salta</button>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBody"></div>
</div>

<script>
/* ============================================================
   FIRESTORE CONFIG — sostituisci con il progetto Firebase
   creato per GIMTONIC Coaching (NON quello di Team Hub Pro)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAJaMEYyv_dUlwRzC4P1ae08o-qRgpXAhY",
  authDomain: "gimtonic-coaching.firebaseapp.com",
  projectId: "gimtonic-coaching",
  storageBucket: "gimtonic-coaching.firebasestorage.app",
  messagingSenderId: "429886763766",
  appId: "1:429886763766:web:9230b784240e22abbaf2d7"
};

let db = null;
let firebaseReady = false;
try{
  const fbApp = firebase.initializeApp(firebaseConfig);
  db = firebase.firestore(fbApp);
  firebaseReady = true;
}catch(e){ console.warn('Firebase non configurato, uso solo localStorage', e); }

// ADMIN: password fissa, modificabile qui. È un cerotto, non sicurezza vera —
// va bene solo perché l'admin sei tu, e per ora l'unico modo di entrare come admin.
// ADMIN: password ora salvata su Firestore (o localStorage in demo locale),
// modificabile dall'app in Impostazioni. Prima esecuzione = default sotto.
const ADMIN_PASSWORD_DEFAULT = "gimtonic2026";
async function getAdminPassword(){
  if(firebaseReady){
    try{
      const doc = await db.collection('config').doc('admin').get();
      if(doc.exists && doc.data().password) return doc.data().password;
    }catch(e){ console.warn('Errore lettura password admin', e); }
  }
  return localStorage.getItem('gtc_admin_password') || ADMIN_PASSWORD_DEFAULT;
}
async function setAdminPassword(newPass){
  localStorage.setItem('gtc_admin_password', newPass);
  if(firebaseReady){
    await db.collection('config').doc('admin').set({password:newPass}, {merge:true});
  }
}

let COACH_ID = null; // impostato dopo il login coach, con l'id del suo record nel registro

/* ---------- persistenza dati coach: Firestore se configurato, altrimenti localStorage ---------- */
async function saveKey(key, value, coachId){
  const cid = coachId || COACH_ID;
  localStorage.setItem('gtc_'+cid+'_'+key, JSON.stringify(value));
  if(firebaseReady){
    try{
      await db.collection('coaches').doc(cid).collection('data').doc(key).set({value});
    }catch(e){ console.warn('Errore salvataggio Firestore', e); }
  }
}
async function loadKey(key, fallback, coachId){
  const cid = coachId || COACH_ID;
  if(firebaseReady){
    try{
      const doc = await db.collection('coaches').doc(cid).collection('data').doc(key).get();
      if(doc.exists) return doc.data().value;
    }catch(e){ console.warn('Errore lettura Firestore', e); }
  }
  const local = localStorage.getItem('gtc_'+cid+'_'+key);
  return local ? JSON.parse(local) : fallback;
}

/* ---------- registro coach: creato dall'admin, usato per il login coach ---------- */
async function getCoachRegistry(){
  if(firebaseReady){
    try{
      const snap = await db.collection('coaches').get();
      return snap.docs.filter(d => d.data().username).map(d => ({id:d.id, ...d.data()}));
    }catch(e){ console.warn('Errore lettura registro coach', e); }
  }
  return JSON.parse(localStorage.getItem('gtc_coach_registry') || '[]');
}
async function addCoachToRegistry(entry){
  entry.id = uid('coach');
  entry.createdAt = Date.now();
  if(firebaseReady){
    // Non ingoiare l'errore: se le regole Firestore negano la scrittura,
    // l'admin deve saperlo subito, non vedere un falso "creato con successo"
    await db.collection('coaches').doc(entry.id).set(
      {nome:entry.nome, cognome:entry.cognome, username:entry.username, codice:entry.codice, createdAt:entry.createdAt},
      {merge:true}
    );
  }else{
    const list = JSON.parse(localStorage.getItem('gtc_coach_registry') || '[]');
    list.push(entry);
    localStorage.setItem('gtc_coach_registry', JSON.stringify(list));
  }
  return entry;
}
async function findCoachByCredentials(username, codice){
  const list = await getCoachRegistry();
  return list.find(c => c.username === username && c.codice === codice);
}
async function findClientAcrossCoaches(code){
  const coaches = await getCoachRegistry();
  for(const co of coaches){
    const clients = await loadKey('clients', [], co.id);
    const match = clients.find(c => c.id === code);
    if(match) return {coachId: co.id, client: match};
  }
  return null;
}
function genSixDigitCode(){
  return Math.floor(100000 + Math.random()*900000).toString();
}

let selectedRole = 'coach';
document.getElementById('adminSmallLink').onclick = () => setRole(selectedRole === 'admin' ? 'coach' : 'admin');
document.getElementById('roleCoachBtn').onclick = () => setRole('coach');
document.getElementById('roleClientBtn').onclick = () => setRole('client');
function setRole(r){
  selectedRole = r;
  document.getElementById('roleCoachBtn').classList.toggle('active', r==='coach');
  document.getElementById('roleClientBtn').classList.toggle('active', r==='client');
  document.getElementById('adminSmallLink').classList.toggle('active', r==='admin');
  document.getElementById('mainRoleToggle').style.display = r==='admin' ? 'none' : 'flex';
  document.getElementById('adminPassField').style.display = r==='admin' ? 'block' : 'none';
  document.getElementById('coachUserField').style.display = r==='coach' ? 'block' : 'none';
  document.getElementById('coachCodeField').style.display = r==='coach' ? 'block' : 'none';
  document.getElementById('clientNameField').style.display = r==='client' ? 'block' : 'none';
  document.getElementById('clientCodeField').style.display = r==='client' ? 'block' : 'none';
}

document.getElementById('loginBtn').onclick = async () => {
  if(selectedRole === 'admin'){
    const pass = document.getElementById('loginAdminPass').value;
    if(pass !== await getAdminPassword()){ alert('Password errata'); return; }
    STATE.role = 'admin';
    STATE.userName = 'Admin';
    enterApp();
    return;
  }

  if(selectedRole === 'coach'){
    const username = document.getElementById('loginCoachUser').value.trim();
    const codice = document.getElementById('loginCoachCode').value.trim();
    if(!username || !codice){ alert('Inserisci username e codice'); return; }
    const coach = await findCoachByCredentials(username, codice);
    if(!coach){ alert('Username o codice non validi. Chiedi il codice al tuo admin.'); return; }
    COACH_ID = coach.id;
    STATE.role = 'coach';
    STATE.userName = coach.nome + ' ' + coach.cognome;
    await loadAll();
    enterApp();
    return;
  }

  // cliente
  const name = document.getElementById('loginName').value.trim();
  const code = document.getElementById('loginClientCode').value.trim();
  if(!name || !code){ alert('Inserisci nome e codice atleta'); return; }
  const found = await findClientAcrossCoaches(code);
  if(!found){
    alert('Atleta non trovato. Controlla il codice ricevuto dal tuo coach.');
    return;
  }
  COACH_ID = found.coachId;
  STATE.role = 'client';
  STATE.userName = name;
  await loadAll();
  STATE.activeClientId = found.client.id;
  enterApp();
};

function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').classList.add('active');
  const roleLabels = {admin:'Admin', coach:'Coach', client:'Atleta'};
  document.getElementById('sidebarRole').textContent = roleLabels[STATE.role];
  document.getElementById('whoAmI').textContent = STATE.userName;
  buildNav();
  const landing = {admin:'admin', coach:'dashboard', client:'gym'};
  goPage(landing[STATE.role]);
}

function buildNav(){
  let items;
  if(STATE.role === 'admin') items = NAV_ADMIN;
  else if(STATE.role === 'coach') items = NAV_COACH;
  else {
    const cl = STATE.clients.find(c=>c.id===STATE.activeClientId);
    items = (cl && cl.autonomo)
      ? [NAV_CLIENT[0], {id:'mieiprogrammi', label:'I miei programmi', icon:'▤'}, ...NAV_CLIENT.slice(1)]
      : NAV_CLIENT;
  }
  const nav = document.getElementById('navList');
  nav.innerHTML = items.map(n => `<button class="nav-btn" data-nav="${n.id}"><span>${n.icon}</span>${n.label}</button>`).join('');
  nav.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => goPage(b.dataset.nav));
}

  STATE.page = page;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === page));

}

          return `

              <div class="list-row-title">${c.nome}</div>
              <div class="list-row-sub">${c.programma_attivo ? c.programma_attivo.nome : 'Nessun programma'}${c.programma_attivo ? ' · Sett. '+((c.settimana_corrente||0)+1)+'/'+getSettimane(c.programma_attivo).length : ''}${c.programma_attivo && c.programma_attivo.origine === 'atleta' ? ' <span style="color:var(--accent);">· autoassegnato</span>' : ''}</div>
            </div>
            <span class="tag" style="color:${col}; border-color:${col};">${ad ? ad.fatte+'/'+ad.previste+' ('+ad.pct+'%)' : '—'}</span>
          </div>`;
        }).join('')
      }

    ${renderActivityFeed()}
  `;

function buildActivityFeed(limit){
  const items = [];
  STATE.clients.forEach(cl => {
    (cl.logs||[]).forEach(l => {
      const nSets = (l.esercizi||[]).reduce((s,e)=>s+(e.sets||[]).filter(x=>x.reps).length,0);
      items.push({
        tipo:'sessione', data:l.data, atleta:cl.nome,
        testo: l.giorno_nome,
        extra: `${(l.esercizi||[]).length} esercizi · ${nSets} serie${l.durata_min?' · '+l.durata_min+' min':''}${l.sRPE?' · sRPE '+l.sRPE:''}`
      });
    });
    (cl.misure||[]).forEach(m => items.push({
      tipo:'misura', data:m.data, atleta:cl.nome, testo:'Misura registrata', extra:`${m.peso} kg`
    }));
    Object.keys(cl.wellness||{}).forEach(d => {
      const w = cl.wellness[d];
      items.push({tipo:'wellness', data:new Date(d).getTime(), atleta:cl.nome, testo:'Check-in wellness',
        extra:`Sonno ${w.sonno}/5 · Energia ${w.energia}/5`});
    });
  });
  return items.sort((a,b)=>b.data-a.data).slice(0, limit||20);
}
function renderActivityFeed(){
  const items = buildActivityFeed(20);
  const icone = {sessione:'●', misura:'⚖', wellness:'◔'};
  const colori = {sessione:'var(--accent)', misura:'var(--accent2)', wellness:'var(--ink-soft)'};
  return `
    <div class="card" style="margin-top:20px;">
      <h3 style="font-size:18px; margin-bottom:4px;">Feed attività</h3>
      <p style="color:var(--ink-soft); font-size:12px; margin-bottom:12px;">Tutto quello che i tuoi atleti hanno registrato, in ordine cronologico</p>
      ${items.length===0 ? emptyState('Nessuna attività','Quando gli atleti registreranno qualcosa, comparirà qui.') :
        items.map(i => `
          <div class="list-row">
            <div style="display:flex; gap:12px; align-items:flex-start;">
              <span style="color:${colori[i.tipo]}; font-size:14px; margin-top:2px;">${icone[i.tipo]}</span>
              <div>
                <div class="list-row-title">${i.atleta} — ${i.testo}</div>
                <div class="list-row-sub">${i.extra}</div>
              </div>
            </div>
            <span class="tag mono">${new Date(i.data).toLocaleDateString('it-IT',{day:'2-digit',month:'short'})}</span>
          </div>`).join('')}
    </div>`;
}

    </div>
    <div id="exerciseListCard" class="card">${renderExerciseListInner('', '', '')}</div>
  `;
}
function renderExerciseListInner(search, categoriaFilter, attrezzoFilter){
  let list = STATE.exercises;
  if(categoriaFilter) list = list.filter(e=>e.categoria===categoriaFilter);
  if(attrezzoFilter) list = list.filter(e=>e.attrezzo===attrezzoFilter);
  if(search) list = list.filter(e=>e.nome.toLowerCase().includes(search.toLowerCase()));
  if(list.length===0) return emptyState('Nessun esercizio trovato','Prova un altro filtro o crea un nuovo esercizio.');

  const grouped = {};
  list.forEach(e => { (grouped[e.categoria] = grouped[e.categoria]||[]).push(e); });

  const tipoLabel = {bilaterale:'Bilaterale', monolaterale:'Monolaterale', monopodalico:'Monopodalico', isometrico:'Isometrico', cardio:'Cardio/Cond.'};

  return Object.keys(grouped).map(cat => `
    <h3 style="font-size:16px; margin:18px 0 8px; color:var(--accent);">${cat}</h3>
    ${grouped[cat].map(e => `
      <div class="list-row">
        <div>
          <div class="list-row-title">${e.nome}</div>
          <div class="list-row-sub">${tipoLabel[e.tipo]||e.tipo}${e.attrezzo?' · '+e.attrezzo:''}${e.media?' · <span style="color:var(--accent);">▶ media</span>':''}</div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn secondary small" data-edit-exercise="${e.id}">Modifica</button>
          <button class="btn danger small" data-del-exercise="${e.id}">Elimina</button>
        </div>
      </div>
    `).join('')}
  `).join('');
}

function renderTemplateModalBody(t, isNew, owner){
  document.getElementById('modalBody').innerHTML = `
    <h2>${isNew ? 'Nuovo template' : 'Modifica template'}</h2>
    <div class="field"><label>Nome template</label><input type="text" id="mTplNome" value="${t.nome}"></div>
    <div class="field"><label>Durata (settimane)</label><input type="number" min="1" max="52" id="mTplSettimane" value="${t.durata_settimane||4}"></div>
    <div id="tplGiorni"></div>
    <datalist id="exerciseNamesList">
      ${STATE.exercises.map(e=>`<option value="${e.nome}">`).join('')}
    </datalist>
    <button class="btn secondary small" id="addGiornoBtn" style="width:auto; margin-bottom:10px;">+ Aggiungi giorno</button>
    <div class="modal-actions">
      <button class="btn secondary" id="modalCancel">Annulla</button>
      <button class="btn" id="modalSaveTemplate">Salva template</button>
    </div>
  `;
  document.getElementById('modalBackdrop').classList.add('active');

  function renderGiorni(){
    document.getElementById('tplGiorni').innerHTML = t.giorni.map((g,gi) => `
      <div class="day-block" draggable="true" data-drag-day="${gi}">
        <div class="day-block-head">
          <span class="drag-handle" title="Trascina per riordinare">⠿</span>
          <input type="text" value="${g.nome}" data-giorno-nome="${gi}">
          <button class="icon-btn" data-del-giorno="${gi}">✕</button>
        </div>
        ${g.esercizi.map((e,ei) => `
          <div class="ex-row-wrap ${e.superset?'in-superset':''}" draggable="true" data-drag-ex="${gi}.${ei}">
            <div class="ex-row">
              <span class="drag-handle" title="Trascina per riordinare">⠿</span>
              <input type="text" placeholder="Esercizio" value="${e.esercizio}" list="exerciseNamesList" data-ex-field="${gi}.${ei}.esercizio">
              <input type="number" placeholder="Serie" value="${e.serie}" data-ex-field="${gi}.${ei}.serie">
              <input type="number" placeholder="${e.a_tempo?'Sec':'Reps'}" value="${e.reps}" data-ex-field="${gi}.${ei}.reps">
              <input type="text" class="mono-field" placeholder="Target" value="${e.target}" data-ex-field="${gi}.${ei}.target">
              <button class="icon-btn ${e.a_tempo?'tt-on':''}" data-toggle-tt="${gi}.${ei}" title="Esercizio a tempo (secondi invece di reps)">⏱</button>
              <button class="icon-btn ${e.superset?'ss-on':''}" data-toggle-ss="${gi}.${ei}" title="Superset con il precedente">⇄</button>
              <button class="icon-btn" data-del-ex="${gi}.${ei}">✕</button>
            </div>
            <input type="text" class="ex-note" placeholder="Note per l'atleta (opzionale)" value="${e.note||''}" data-ex-field="${gi}.${ei}.note">
          </div>
        `).join('')}
        <button class="btn secondary small" data-add-ex="${gi}" style="width:auto;">+ Esercizio</button>
      </div>
    `).join('');

    document.querySelectorAll('[data-giorno-nome]').forEach(inp => inp.onchange = e => {
      t.giorni[+inp.dataset.giornoNome].nome = e.target.value;
    });
    document.querySelectorAll('[data-ex-field]').forEach(inp => inp.onchange = e => {
      const [gi,ei,field] = inp.dataset.exField.split('.');
      let v = e.target.value;
      if(field==='serie'||field==='reps') v = parseInt(v)||0;
      t.giorni[+gi].esercizi[+ei][field] = v;
    });
    document.querySelectorAll('[data-del-giorno]').forEach(b => b.onclick = () => {
      t.giorni.splice(+b.dataset.delGiorno,1); renderGiorni();
    });
    document.querySelectorAll('[data-del-ex]').forEach(b => b.onclick = () => {
      const [gi,ei] = b.dataset.delEx.split('.');
      t.giorni[+gi].esercizi.splice(+ei,1); renderGiorni();
    });
    document.querySelectorAll('[data-toggle-tt]').forEach(b => b.onclick = () => {
      const [gi,ei] = b.dataset.toggleTt.split('.');
      const exo = t.giorni[+gi].esercizi[+ei];
      exo.a_tempo = !exo.a_tempo;
      if(exo.a_tempo && (!exo.reps || exo.reps < 5)) exo.reps = 30;
      renderGiorni();
    });
    document.querySelectorAll('[data-toggle-ss]').forEach(b => b.onclick = () => {
      const [gi,ei] = b.dataset.toggleSs.split('.');
      if(+ei === 0){ alert('Il primo esercizio del giorno non può essere in superset con il precedente'); return; }
      const exo = t.giorni[+gi].esercizi[+ei];
      exo.superset = !exo.superset;
      renderGiorni();
    });
    // drag & drop esercizi
    let dragEx = null;
    document.querySelectorAll('[data-drag-ex]').forEach(el => {
      el.ondragstart = e => { dragEx = el.dataset.dragEx; e.dataTransfer.effectAllowed='move'; el.classList.add('dragging'); };
      el.ondragend = () => { el.classList.remove('dragging'); dragEx = null; };
      el.ondragover = e => { e.preventDefault(); el.classList.add('drag-over'); };
      el.ondragleave = () => el.classList.remove('drag-over');
      el.ondrop = e => {
        e.preventDefault(); el.classList.remove('drag-over');
        if(!dragEx) return;
        const [fg,fe] = dragEx.split('.').map(Number);
        const [tg,te] = el.dataset.dragEx.split('.').map(Number);
        if(fg !== tg) return; // riordino solo dentro lo stesso giorno
        const arr = t.giorni[fg].esercizi;
        const [moved] = arr.splice(fe,1);
        arr.splice(te,0,moved);
        renderGiorni();
      };
    });
    // drag & drop giorni
    let dragDay = null;
    document.querySelectorAll('[data-drag-day]').forEach(el => {
      el.ondragstart = e => { if(e.target !== el) return; dragDay = +el.dataset.dragDay; e.dataTransfer.effectAllowed='move'; };
      el.ondragover = e => { e.preventDefault(); };
      el.ondrop = e => {
        e.preventDefault();
        if(dragDay === null) return;
        const to = +el.dataset.dragDay;
        if(dragDay === to) return;
        const [moved] = t.giorni.splice(dragDay,1);
        t.giorni.splice(to,0,moved);
        dragDay = null;
        renderGiorni();
      };
    });
    document.querySelectorAll('[data-add-ex]').forEach(b => b.onclick = () => {
      t.giorni[+b.dataset.addEx].esercizi.push({esercizio:'', serie:3, reps:10, target:'RIR2', riposo_sec:90, note:'', superset:false, a_tempo:false});
      renderGiorni();
    });
  }
  renderGiorni();

  document.getElementById('addGiornoBtn').onclick = () => {
    t.giorni.push({nome:'Nuovo giorno', esercizi:[]});
    renderGiorni();
  };
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalSaveTemplate').onclick = async () => {
    t.nome = document.getElementById('mTplNome').value.trim() || t.nome;
    t.durata_settimane = parseInt(document.getElementById('mTplSettimane').value) || 4;
    if(owner === 'atleta'){
      const cl = STATE.clients.find(x=>x.id===STATE.activeClientId);
      if(!cl.templates_propri) cl.templates_propri = [];
      const i = cl.templates_propri.findIndex(x=>x.id===t.id);
      if(i>=0) cl.templates_propri[i] = t; else cl.templates_propri.push(t);
      await persistClients();
    }else{
      const idx = STATE.templates.findIndex(x=>x.id===t.id);
      if(idx>=0) STATE.templates[idx] = t; else STATE.templates.push(t);
      await persistTemplates();
    }
    closeModal();
    render();
  };
}

/* ============================================================
   LOG ALLENAMENTO (Gym Mode)
   ============================================================ */
function renderGym(){
  let client;
  if(STATE.role === 'client'){
    client = STATE.clients.find(c=>c.id===STATE.activeClientId);
  }else{
    if(!STATE.activeClientId && STATE.clients.length) STATE.activeClientId = STATE.clients[0].id;
    client = STATE.clients.find(c=>c.id===STATE.activeClientId);
  }

  const clientPicker = STATE.role === 'coach' ? `
    <div class="field" style="max-width:300px;">
      <label class="field-label">Visualizza atleta</label>
      <select id="gymClientSel">
        ${STATE.clients.map(c=>`<option value="${c.id}" ${c.id===STATE.activeClientId?'selected':''}>${c.nome}</option>`).join('')}
      </select>
    </div>
  ` : '';

  if(!client){
    return `<div class="page-head"><h1>Log allenamento</h1></div>${clientPicker}<div class="card">${emptyState('Nessun atleta selezionato','Crea o scegli un atleta.')}</div>`;
  }
  if(!client.programma_attivo){
    return `<div class="page-head"><h1>Log allenamento</h1><p>${client.nome}</p></div>${clientPicker}<div class="card">${emptyState('Nessun programma assegnato', STATE.role==='coach' ? 'Vai su "Assegna programma" per crearne uno.' : 'Il tuo coach non ti ha ancora assegnato un programma.')}</div>`;
  }

  const prog = client.programma_attivo;
  const settimane = getSettimane(prog);
  const wIdx = Math.min(client.settimana_corrente || 0, settimane.length-1);
  const giorniSett = settimane[wIdx].giorni;
  const dayIdx = Math.min(client._gymDayIdx || 0, giorniSett.length-1);
  const day = giorniSett[dayIdx];

  return `
    <div class="page-head">
      <h1>${prog.nome}</h1>
      <p>${client.nome} · Settimana ${wIdx+1} di ${settimane.length}${prog.origine === 'atleta' ? ' · programma autoassegnato' : ''}</p>
    </div>
    ${clientPicker}
    <div class="week-progress">
      ${settimane.map((s,i)=>`<button class="week-dot ${i===wIdx?'active':''} ${i<wIdx?'past':''}" data-week="${i}">${i+1}</button>`).join('')}
    </div>
    <div class="field" style="max-width:320px;">
      <label class="field-label">Giorno</label>
      <select id="gymDaySel">${giorniSett.map((g,i)=>`<option value="${i}" ${i===dayIdx?'selected':''}>${g.nome}</option>`).join('')}</select>
    </div>
    <div id="gymDayBody">${renderGymDayBody(client, day)}</div>
    <div class="card" style="margin-top:18px;">
      <button class="btn" id="finishSessionBtn">Chiudi sessione e salva</button>
    </div>
  `;
}

// Retrocompatibile: programmi assegnati prima del multi-settimana hanno solo .giorni
function getSettimane(prog){
  if(prog.settimane && prog.settimane.length) return prog.settimane;
  return [{nome:'Settimana 1', giorni: prog.giorni || []}];
}
function getGiornoCorrente(client){
  const settimane = getSettimane(client.programma_attivo);
  const wIdx = Math.min(client.settimana_corrente || 0, settimane.length-1);
  const giorni = settimane[wIdx].giorni;
  return giorni[Math.min(client._gymDayIdx || 0, giorni.length-1)];
}

/* ---------- timer di recupero (widget fisso, indipendente dal render della pagina) ---------- */
let _restTimerInterval = null;
function startRestTimer(seconds){
  const bar = document.getElementById('restTimerBar');
  const valueEl = document.getElementById('restTimerValue');
  if(!bar || !seconds || seconds <= 0) return;
  clearInterval(_restTimerInterval);
  let remaining = seconds;
  bar.style.display = 'flex';
  function tick(){
    const m = Math.floor(remaining/60).toString().padStart(2,'0');
    const s = (remaining%60).toString().padStart(2,'0');
    valueEl.textContent = m+':'+s;
    if(remaining <= 0){
      clearInterval(_restTimerInterval);
      bar.style.display = 'none';
      try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
      try{
        const ctx = new (window.AudioContext||window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.frequency.value = 880;
        osc.connect(ctx.destination);
        osc.start();
        setTimeout(()=>osc.stop(), 350);
      }catch(e){}
      return;
    }
    remaining--;
  }
  tick();
  _restTimerInterval = setInterval(tick, 1000);
}
/* ---------- countdown esercizi a tempo ---------- */
let _setTimerInterval = null, _setTimerCtx = null;
function beep(freq){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.frequency.value = freq || 880;
    osc.connect(ctx.destination);
    osc.start();
    setTimeout(()=>osc.stop(), 350);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
}
function startSetTimer(target, key, si){
  clearInterval(_setTimerInterval);
  _setTimerCtx = {key, si:+si, target:+target, elapsed:0};
  const bar = document.getElementById('setTimerBar');
  const val = document.getElementById('setTimerValue');
  bar.style.display = 'flex';
  startWorkoutTimer();
  function tick(){
    const rimasti = _setTimerCtx.target - _setTimerCtx.elapsed;
    val.textContent = fmtMMSS(Math.max(0, rimasti));
    if(rimasti <= 0){ finishSetTimer(_setTimerCtx.target); return; }
    _setTimerCtx.elapsed++;
  }
  tick();
  _setTimerInterval = setInterval(tick, 1000);
}
function finishSetTimer(secondiFatti){
  clearInterval(_setTimerInterval);
  document.getElementById('setTimerBar').style.display = 'none';
  if(!_setTimerCtx) return;
  const {key, si} = _setTimerCtx;
  const client = STATE.clients.find(c=>c.id===STATE.activeClientId);
  if(client && client._gymLog[key]){
    client._gymLog[key][si].reps = secondiFatti;
    client._gymLog[key][si].done = true;
    const day = getGiornoCorrente(client);
    const exIdx = day.esercizi.findIndex((ex,i) => (ex.esercizio+'_'+i) === key);
    if(exIdx >= 0) startRestTimer(day.esercizi[exIdx].riposo_sec);
    document.getElementById('gymDayBody').innerHTML = renderGymDayBody(client, day);
    attachPageHandlers();
  }
  beep(880);
  _setTimerCtx = null;
}
document.getElementById('setTimerStop').onclick = () => {
  if(_setTimerCtx) finishSetTimer(_setTimerCtx.elapsed);
};

/* ============================================================
   PROGRESSIONE — parametri modificabili + motore di proposta
   ============================================================ */
const PROGRESSIONE_DEFAULT = {
  troppo_leggero: 7,
  leggero: 4,
  giusto: 2,
  limite: 0,
  troppo_pesante: -5,
  fallita: -10
};
function getProgressioneParams(client){
  return Object.assign({}, PROGRESSIONE_DEFAULT, client.progressioneParams || {});
}
function getLastPerformance(client, esercizioNome){
  const logs = (client.logs||[]).slice().sort((a,b)=>b.data-a.data);
  for(const l of logs){
    const found = (l.esercizi||[]).find(e => e.esercizio === esercizioNome);
    if(found && (found.sets||[]).some(s => s.peso || s.reps)) return {data:l.data, sets:found.sets};
  }
  return null;
}
const SCALA_ORDINE = {L:1, M:2, MP:3, P:4, C:5, RM:5};
function computeProgressionProposal(client, ex){
  const last = getLastPerformance(client, ex.esercizio);
  if(!last) return null;
  const params = getProgressioneParams(client);
  const sets = last.sets.filter(s => (s.peso || s.reps) && (s.tipo||'N') !== 'W');
  if(sets.length === 0) return null;

  const pesi = sets.map(s=>parseFloat(s.peso)||0).filter(p=>p>0);
  const pesoBase = pesi.length ? Math.max(...pesi) : 0;
  const repsOk = sets.every(s => (parseFloat(s.reps)||0) >= (parseFloat(ex.reps)||0));
  const codici = sets.map(s=>s.sforzo).filter(Boolean);

  if(codici.length === 0) return {pesoBase, pct:0, motivo:'Nessuno sforzo registrato', last};
  if(codici.includes('X')) return {pesoBase, pct:params.fallita, motivo:'Serie fallita (🚫)', last};

  const idxUltima = sets.length - 1;
  if(sets.some((s,i) => i < idxUltima && (s.sforzo==='C' || s.sforzo==='RM')))
    return {pesoBase, pct:params.troppo_pesante, motivo:"C/RM prima dell'ultima serie", last};
  if(sets[idxUltima] && (sets[idxUltima].sforzo==='C' || sets[idxUltima].sforzo==='RM'))
    return {pesoBase, pct:params.limite, motivo:'C/RM solo ultima serie — carico al limite', last};
  if(!repsOk) return {pesoBase, pct:0, motivo:'Reps target non raggiunte', last};

  const maxCodice = codici.reduce((a,b)=> (SCALA_ORDINE[b]||0) > (SCALA_ORDINE[a]||0) ? b : a, codici[0]);
  if(SCALA_ORDINE[maxCodice] <= 2) return {pesoBase, pct:params.troppo_leggero, motivo:'Sforzo max L/M — sottostimato', last};
  if(maxCodice === 'MP') return {pesoBase, pct:params.leggero, motivo:'Sforzo max M/P', last};
  return {pesoBase, pct:params.giusto, motivo:'Sforzo max P, reps raggiunte', last};
}
function arrotondaCarico(kg){ return Math.round(kg / 2.5) * 2.5; }

// e1RM stimato con formula di Epley: 1RM = peso x (1 + reps/30)
// Affidabile entro ~10 reps; oltre, la stima si degrada parecchio.
function calcE1RM(peso, reps){
  const p = parseFloat(peso)||0, r = parseFloat(reps)||0;
  if(p<=0 || r<=0 || r>15) return 0;
  return p * (1 + r/30);
}
function getE1RMHistory(client, esercizioNome){
  const punti = [];
  (client.logs||[]).slice().sort((a,b)=>a.data-b.data).forEach(l => {
    const found = (l.esercizi||[]).find(e => e.esercizio === esercizioNome);
    if(!found) return;
    let best = 0;
    (found.sets||[]).forEach(s => {
      if((s.tipo||'N') === 'W' || s.a_tempo) return;
      const v = calcE1RM(s.peso, s.reps);
      if(v > best) best = v;
    });
    if(best > 0) punti.push({data:l.data, e1rm: Math.round(best*10)/10});
  });
  return punti;
}
// PR = miglior e1RM mai registrato su quell'esercizio (warmup esclusi)
function getPRs(client){
  const prs = {};
  (client.logs||[]).forEach(l => (l.esercizi||[]).forEach(exl => {
    (exl.sets||[]).forEach(s => {
      if((s.tipo||'N') === 'W' || s.a_tempo) return;
      const v = calcE1RM(s.peso, s.reps);
      if(v <= 0) return;
      if(!prs[exl.esercizio] || v > prs[exl.esercizio].e1rm){
        prs[exl.esercizio] = {e1rm: Math.round(v*10)/10, peso: s.peso, reps: s.reps, data: l.data};
      }
    });
  }));
  return prs;
}
function isPRSet(client, esercizioNome, peso, reps){
  const v = calcE1RM(peso, reps);
  if(v <= 0) return false;
  const prs = getPRs(client);
  return !prs[esercizioNome] || v > prs[esercizioNome].e1rm;
}
function getTuttiEserciziLoggati(client){
  const set = new Set();
  (client.logs||[]).forEach(l => (l.esercizi||[]).forEach(e => set.add(e.esercizio)));
  return [...set];
}
function formatLastPerf(last){
  if(!last) return null;
  const parts = last.sets.filter(s=>s.peso||s.reps).map(s => {
    const sc = s.sforzo ? (SFORZO_SCALE.find(x=>x.code===s.sforzo)||{}).label : '';
    return `${s.peso||'—'}×${s.reps||'—'}${sc?' '+sc:''}`;
  });
  return {data: new Date(last.data).toLocaleDateString('it-IT'), testo: parts.join('  ·  ')};
}

    if(!client._gymLog[key]) client._gymLog[key] = Array.from({length:ex.serie}, ()=>({
      peso: (client.carichi_correnti && client.carichi_correnti[ex.esercizio]) ? client.carichi_correnti[ex.esercizio] : '',
      reps:'', sforzo:'', tipo:'N', done:false
    }));

      <h3 class="ex-header">${ex.esercizio}${ex.superset?'<span class="ss-badge">SUPERSET</span>':''}</h3>

        return `<div class="prev-line"><span class="prev-label">Precedente ${perf.data}</span> ${perf.testo} ${sugg}</div>`;

function computeMonotonyStrain(client){
  const days = [];
  for(let i=6; i>=0; i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const dayStart = d.getTime();
    const dayEnd = dayStart + 24*3600*1000;
    const ua = (client.logs||[]).filter(l => l.data>=dayStart && l.data<dayEnd).reduce((s,l)=>s+(l.ua||0),0);
    days.push(ua);
  }
  const mean = days.reduce((a,b)=>a+b,0) / days.length;
  const variance = days.reduce((a,b)=>a+Math.pow(b-mean,2),0) / days.length;
  const sd = Math.sqrt(variance);
  const monotony = sd===0 ? (mean>0 ? Infinity : 0) : mean/sd;
  const weeklyLoad = days.reduce((a,b)=>a+b,0);
  const strain = weeklyLoad * (isFinite(monotony) ? monotony : 0);
  return {days, mean, sd, monotony, weeklyLoad, strain};
}
function renderMonotonyStrainCard(client){
  const r = computeMonotonyStrain(client);
  const monotonyDisplay = isFinite(r.monotony) ? r.monotony.toFixed(2) : '∞';
  const elevata = !isFinite(r.monotony) || r.monotony > 2.0;
  const flagColor = elevata ? 'var(--danger)' : 'var(--accent2)';
  const flagLabel = elevata ? 'Monotonia elevata' : 'Nella norma';
  return `
    <div class="card" style="margin-top:14px;">
      <h3 style="font-size:16px; margin-bottom:4px;">Carico interno, monotonia e strain</h3>
      <p style="color:var(--ink-soft); font-size:12px; margin-bottom:12px; line-height:1.5;">
        UA = durata × sforzo percepito (sRPE) di ogni sessione, ultimi 7 giorni. Monotonia sopra ~2.0 (Foster) è storicamente associata a maggior rischio quando il carico è anche alto — è un segnale da incrociare col resto, non un verdetto da solo.
      </p>
      <div class="grid-2">

        <div class="card"><div class="stat-num">${monotonyDisplay}</div><div class="stat-label">Monotonia</div></div>

}

function computeAderenza(client){

// da letteratura (Israetel et al., volume landmarks). Punto di partenza,
// non regola fissa: la risposta individuale prevale sempre.
const VOLUME_LANDMARKS = {
  'Petto': {mev:8, mav:16, mrv:22},
  'Dorso': {mev:10, mav:18, mrv:25},
  'Spalle': {mev:8, mav:18, mrv:26},

  'Polpacci': {mev:8, mav:14, mrv:20}
};
function computeWeeklySetsByCategory(client){
  const weekAgo = Date.now() - 7*24*3600*1000;
  const counts = {};
  (client.logs||[]).forEach(l => {
    if(l.data < weekAgo) return;
    (l.esercizi||[]).forEach(exLog => {
      const libEx = STATE.exercises.find(e => e.nome === exLog.esercizio);
      const cat = libEx ? libEx.categoria : 'Non categorizzato';
      const setsCount = (exLog.sets||[]).filter(s => (parseFloat(s.reps)||0) > 0 && (s.tipo||'N') !== 'W').length;
      counts[cat] = (counts[cat]||0) + setsCount;
    });
  });
  return counts;
}
function getEffectiveLandmark(client, cat){
  const ov = client.volumeOverrides && client.volumeOverrides[cat];

}

function computeWeeklyVolume(logs){
  const buckets = {};
  logs.forEach(l => {
    const d = new Date(l.data);
    const day = d.getDay();
    const diffToMonday = (day===0 ? -6 : 1-day);
    const monday = new Date(d); monday.setDate(d.getDate()+diffToMonday); monday.setHours(0,0,0,0);
    const key = monday.toISOString().slice(0,10);
    let vol = 0;
    // gli esercizi a tempo registrano secondi, non ripetizioni: fuori dal volume load
    (l.esercizi||[]).forEach(ex => (ex.sets||[]).forEach(s => {
      if(s.a_tempo) return;
      vol += (parseFloat(s.peso)||0) * (parseFloat(s.reps)||0);
    }));
    buckets[key] = (buckets[key]||0) + vol;
  });
  const keys = Object.keys(buckets).sort();
  return {
    labels: keys.map(k => new Date(k).toLocaleDateString('it-IT', {day:'2-digit', month:'short'})),
    values: keys.map(k => Math.round(buckets[k]))
  };
}

    ${renderMuscleUsageCard(client)}

    ${STATE.role === 'coach' ? renderVolumeLandmarksCard(client) : ''}
    ${STATE.role === 'coach' ? renderMonotonyStrainCard(client) : ''}
    <div class="card" style="margin-top:14px;">
      <h3 style="font-size:16px; margin-bottom:12px;">Sessioni recenti</h3>
      ${logs.length===0 ? emptyState('Ancora nessuna sessione','Vai su Log allenamento e registra la prima sessione.') :
        logs.slice().reverse().slice(0,10).map(l => `
          <div class="list-row">
            <div>
              <div class="list-row-title">${l.giorno_nome}</div>
              <div class="list-row-sub">${new Date(l.data).toLocaleDateString('it-IT')}</div>
            </div>
            <span class="tag mono">${l.esercizi.length} esercizi</span>
          </div>
        `).join('')
      }
    </div>
  `;
}

/* ============================================================
   GESTIONE COACH (solo admin)
   ============================================================ */
let _coachRegistryCache = [];
function renderAdmin(){
  return `
    <div class="page-head">
      <h1>Gestione coach</h1>
      <p>Crea gli account coach: username scelto da te, codice generato automaticamente</p>
    </div>
    <button class="btn small" id="newCoachBtn" style="width:auto; margin-bottom:18px;">+ Nuovo coach</button>
    <div class="card" id="coachRegistryCard">Caricamento...</div>
  `;
}
async function loadAndRenderCoachRegistry(){
  _coachRegistryCache = await getCoachRegistry();
  const card = document.getElementById('coachRegistryCard');
  if(!card) return;
  card.innerHTML = _coachRegistryCache.length === 0 ? emptyState('Nessun coach ancora', 'Crea il primo account coach.') :
    _coachRegistryCache.map(c => `
      <div class="list-row">
        <div>
          <div class="list-row-title">${c.nome} ${c.cognome}</div>
          <div class="list-row-sub">username: <span class="mono">${c.username}</span></div>
        </div>
        <span class="tag mono" style="font-size:14px; padding:6px 10px;">${c.codice}</span>
      </div>
    `).join('');
}
function openNewCoachModal(){
  document.getElementById('modalBody').innerHTML = `
    <h2>Nuovo coach</h2>
    <div class="field"><label>Nome</label><input type="text" id="mCoNome"></div>
    <div class="field"><label>Cognome</label><input type="text" id="mCoCognome"></div>
    <div class="field"><label>Username</label><input type="text" id="mCoUsername" placeholder="usato per il login"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="modalCancel">Annulla</button>
      <button class="btn" id="modalSaveCoach">Crea e genera codice</button>
    </div>
  `;
  document.getElementById('modalBackdrop').classList.add('active');
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalSaveCoach').onclick = async () => {
    const nome = document.getElementById('mCoNome').value.trim();
    const cognome = document.getElementById('mCoCognome').value.trim();
    const username = document.getElementById('mCoUsername').value.trim();
    if(!nome || !username){ alert('Nome e username sono obbligatori'); return; }
    const existing = await getCoachRegistry();
    if(existing.some(c => c.username === username)){ alert('Username già in uso, scegline un altro'); return; }
    const codice = genSixDigitCode();
    let entry;
    try{
      entry = await addCoachToRegistry({nome, cognome, username, codice});
    }catch(e){
      alert('Salvataggio fallito: ' + e.message + '\n\nProbabile causa: le regole Firestore non permettono la scrittura su /coaches/{id}. Controlla le regole nella console Firebase.');
      console.error(e);
      return;
    }
    document.getElementById('modalBody').innerHTML = `
      <h2>Coach creato</h2>
      <p style="color:var(--ink-soft); font-size:14px; margin-bottom:16px;">
        Comunica queste credenziali a ${entry.nome}. Il codice non verrà mostrato di nuovo qui — se lo perde, elimina il coach e ricrealo.
      </p>
      <div class="card" style="text-align:center; padding:24px;">
        <div class="stat-label">Username</div>
        <div class="stat-num" style="font-size:22px;">${entry.username}</div>
        <div style="height:14px;"></div>
        <div class="stat-label">Codice</div>
        <div class="stat-num" style="font-size:36px; color:var(--accent);">${entry.codice}</div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="modalCloseAfterCoach">Chiudi</button>
      </div>
    `;
    document.getElementById('modalCloseAfterCoach').onclick = async () => {
      closeModal();
      await loadAndRenderCoachRegistry();
    };
  };
}

/* ============================================================
   IMPOSTAZIONI
   ============================================================ */
function renderSettings(){
  return `
    <div class="page-head"><h1>Impostazioni</h1></div>
    ${STATE.role === 'admin' ? `
    <div class="card">
      <h3 style="font-size:16px; margin-bottom:10px;">Password admin</h3>
      <div class="field"><label>Nuova password</label><input type="password" id="newAdminPass" placeholder="Scrivi la nuova password"></div>
      <button class="btn small" id="saveAdminPassBtn">Salva nuova password</button>
    </div>
    ` : ''}
    <div class="card">
      <h3 style="font-size:16px; margin-bottom:10px;">Stato Firebase</h3>
      <p style="color:var(--ink-soft); font-size:14px; line-height:1.6;">
        ${firebaseReady
          ? 'Connesso a Firestore. I dati vengono salvati anche in cloud, non solo nel browser.'
          : 'Non connesso. I dati restano solo in questo browser (localStorage) — se cambi dispositivo o cancelli la cache li perdi. Per collegare Firestore, apri il file index.html e sostituisci il blocco firebaseConfig con quello del tuo progetto GIMTONIC Coaching su Firebase.'}
      </p>
    </div>
    <div class="card">
      <h3 style="font-size:16px; margin-bottom:10px;">Promemoria sicurezza</h3>
      <p style="color:var(--ink-soft); font-size:14px; line-height:1.6;">
        Il login ad oggi è: password admin fissa nel codice, e username/codice coach verificati leggendo Firestore in chiaro (regole ancora aperte a tutti). Funziona, ma chiunque legga il file sorgente vede la password admin, e le regole Firestore permettono lettura/scrittura a chiunque abbia il link. Prima di avere molti atleti reali, va sostituito con Firebase Authentication vera e regole Firestore che verificano l'identità lato server.
      </p>
    </div>
  `;
}

/* ============================================================
   EVENT HANDLERS DI PAGINA (delegati dopo ogni render)
   ============================================================ */
function attachPageHandlers(){
  // Admin
  const saveAdminPassBtn = document.getElementById('saveAdminPassBtn');
  if(saveAdminPassBtn) saveAdminPassBtn.onclick = async () => {
    const val = document.getElementById('newAdminPass').value.trim();
    if(val.length < 4){ alert('Usa almeno 4 caratteri'); return; }
    try{
      await setAdminPassword(val);
      alert('Password aggiornata.');
      document.getElementById('newAdminPass').value = '';
    }catch(e){
      alert('Salvataggio fallito: ' + e.message + '\n\nControlla che le regole Firestore permettano /config/{doc}.');
    }
  };
  const newCoachBtn = document.getElementById('newCoachBtn');
  if(newCoachBtn) newCoachBtn.onclick = openNewCoachModal;
  if(document.getElementById('coachRegistryCard')) loadAndRenderCoachRegistry();

  // Libreria esercizi
  const newExerciseBtn = document.getElementById('newExerciseBtn');
  if(newExerciseBtn) newExerciseBtn.onclick = () => openExerciseModal(null);
  const exSearchInput = document.getElementById('exSearchInput');
  const exCategoriaFilter = document.getElementById('exCategoriaFilter');
  function refreshExerciseList(){
    const card = document.getElementById('exerciseListCard');
    if(!card) return;
    const exAttrezzoFilter = document.getElementById('exAttrezzoFilter');
    card.innerHTML = renderExerciseListInner(
      exSearchInput?exSearchInput.value:'',
      exCategoriaFilter?exCategoriaFilter.value:'',
      exAttrezzoFilter?exAttrezzoFilter.value:'');
    card.querySelectorAll('[data-edit-exercise]').forEach(b => b.onclick = () => {
      openExerciseModal(STATE.exercises.find(x=>x.id===b.dataset.editExercise));
    });
    card.querySelectorAll('[data-del-exercise]').forEach(b => b.onclick = async () => {
      if(!confirm('Eliminare questo esercizio dalla libreria?')) return;
      STATE.exercises = STATE.exercises.filter(x=>x.id!==b.dataset.delExercise);
      await persistExercises();
      refreshExerciseList();
    });
  }
  if(exSearchInput) exSearchInput.oninput = refreshExerciseList;
  if(exCategoriaFilter) exCategoriaFilter.onchange = refreshExerciseList;
  const exAttrFilter = document.getElementById('exAttrezzoFilter');
  if(exAttrFilter) exAttrFilter.onchange = refreshExerciseList;
  if(document.getElementById('exerciseListCard')) refreshExerciseList();

  // Clienti
  const newClientBtn = document.getElementById('newClientBtn');
  if(newClientBtn) newClientBtn.onclick = () => openClientModal(null);
  document.querySelectorAll('[data-edit-client]').forEach(b => b.onclick = () => {
    const c = STATE.clients.find(x=>x.id===b.dataset.editClient);
    openClientModal(c);
  });
  document.querySelectorAll('[data-del-client]').forEach(b => b.onclick = async () => {
    if(!confirm('Eliminare questo atleta e tutti i suoi dati?')) return;
    STATE.clients = STATE.clients.filter(x=>x.id!==b.dataset.delClient);
    await persistClients();
    render();
  });

  // Templates
  const newTplBtn = document.getElementById('newTemplateBtn');
  if(newTplBtn) newTplBtn.onclick = () => openTemplateModal(null);
  document.querySelectorAll('[data-edit-template]').forEach(b => b.onclick = () => {
    const t = STATE.templates.find(x=>x.id===b.dataset.editTemplate);
    openTemplateModal(t);
  });
  document.querySelectorAll('[data-del-template]').forEach(b => b.onclick = async () => {
    if(!confirm('Eliminare questo template dalla libreria?')) return;
    STATE.templates = STATE.templates.filter(x=>x.id!==b.dataset.delTemplate);
    await persistTemplates();
    render();
  });

  // Assegna
  const assignBtn = document.getElementById('doAssignBtn');
  if(assignBtn) assignBtn.onclick = async () => {
    const selezionati = [...document.querySelectorAll('.assign-client-cb:checked')].map(cb=>cb.value);
    if(selezionati.length === 0){ alert('Seleziona almeno un atleta'); return; }
    const tplId = document.getElementById('assignTplSel').value;
    const tpl = STATE.templates.find(t=>t.id===tplId);
    const nSett = tpl.durata_settimane || 4;
    selezionati.forEach(cid => {
      const client = STATE.clients.find(c=>c.id===cid);
      // copia profonda scollegata dal template originale, una per atleta
      client.programma_attivo = {
        nome: tpl.nome,
        durata_settimane: nSett,
        origine: 'coach',
        origine_template: tpl.id,
        settimane: Array.from({length:nSett}, (_,i)=>({
          nome: 'Settimana ' + (i+1),
          giorni: JSON.parse(JSON.stringify(tpl.giorni))
        }))
      };
      client.settimana_corrente = 0;
      client._gymDayIdx = 0;
      client._gymLog = {};
    });
    STATE.activeClientId = selezionati[0];
    await persistClients();
    alert(selezionati.length === 1
      ? 'Programma assegnato. È una copia indipendente: modificarla non tocca il template originale.'
      : 'Programma assegnato a ' + selezionati.length + ' atleti. Ognuno ha la sua copia indipendente.');
    goPage('gym');
  };

  // Gym mode
  const gymClientSel = document.getElementById('gymClientSel');
  if(gymClientSel) gymClientSel.onchange = e => { STATE.activeClientId = e.target.value; render(); };
  document.querySelectorAll('[data-week]').forEach(b => b.onclick = async () => {
    const client = STATE.clients.find(c=>c.id===STATE.activeClientId);
    client.settimana_corrente = parseInt(b.dataset.week);
    client._gymDayIdx = 0;
    client._gymLog = {};
    await persistClients();
    render();
  });
  const gymDaySel = document.getElementById('gymDaySel');
  if(gymDaySel){
    const client = STATE.clients.find(c=>c.id===STATE.activeClientId);
    gymDaySel.onchange = e => {
      client._gymDayIdx = parseInt(e.target.value);
      client._gymLog = {};
      render();
    };
  }
  document.querySelectorAll('[data-set]').forEach(inp => inp.onchange = e => {
    const client = STATE.clients.find(c=>c.id===STATE.activeClientId);
    const [key, si, field] = inp.dataset.set.split('.');
    client._gymLog[key][+si][field] = e.target.value;
  });
  document.querySelectorAll('[data-settimer]').forEach(btn => btn.onclick = () => {
    const [key, si, target] = btn.dataset.settimer.split('.');
    startSetTimer(target, key, si);
  });
  document.querySelectorAll('[data-settype]').forEach(btn => btn.onclick = () => {
    const client = STATE.clients.find(c=>c.id===STATE.activeClientId);
    const [key, si] = btn.dataset.settype.split('.');
    const ciclo = ['N','W','D','F'];
    const cur = client._gymLog[key][+si].tipo || 'N';
    client._gymLog[key][+si].tipo = ciclo[(ciclo.indexOf(cur)+1) % ciclo.length];
    document.getElementById('gymDayBody').innerHTML = renderGymDayBody(client, getGiornoCorrente(client));
    attachPageHandlers();
  });
  document.querySelectorAll('[data-scale-set]').forEach(btn => btn.onclick = () => {
    const client = STATE.clients.find(c=>c.id===STATE.activeClientId);
    const [key, si, code] = btn.dataset.scaleSet.split('.');
    client._gymLog[key][+si].sforzo = code;
    document.getElementById('gymDayBody').innerHTML = renderGymDayBody(client, getGiornoCorrente(client));
    attachPageHandlers();
  });
  document.querySelectorAll('[data-check]').forEach(btn => btn.onclick = () => {
    const client = STATE.clients.find(c=>c.id===STATE.activeClientId);
    const day = getGiornoCorrente(client);
    const [key, si] = btn.dataset.check.split('.');
    const wasDone = client._gymLog[key][+si].done;
    client._gymLog[key][+si].done = !wasDone;
    if(!wasDone){
      startWorkoutTimer();
      const exIdx = day.esercizi.findIndex((ex,i) => (ex.esercizio+'_'+i) === key);
      if(exIdx >= 0) startRestTimer(day.esercizi[exIdx].riposo_sec);
    }
    document.getElementById('gymDayBody').innerHTML = renderGymDayBody(client, day);
    attachPageHandlers();
  });
  const finishBtn = document.getElementById('finishSessionBtn');
  if(finishBtn) finishBtn.onclick = () => openCloseSessionModal();

  // I miei programmi (atleta autonomo)
  const newMioBtn = document.getElementById('newMioProgrammaBtn');
  if(newMioBtn) newMioBtn.onclick = () => openTemplateModal(null, 'atleta');
  document.querySelectorAll('[data-edit-mio]').forEach(b => b.onclick = () => {
    const cl = STATE.clients.find(c=>c.id===STATE.activeClientId);
    openTemplateModal((cl.templates_propri||[]).find(t=>t.id===b.dataset.editMio), 'atleta');
  });
  document.querySelectorAll('[data-del-mio]').forEach(b => b.onclick = async () => {
    if(!confirm('Eliminare questo programma?')) return;
    const cl = STATE.clients.find(c=>c.id===STATE.activeClientId);
    cl.templates_propri = (cl.templates_propri||[]).filter(t=>t.id!==b.dataset.delMio);
    await persistClients();
    render();
  });
  document.querySelectorAll('[data-usa-mio]').forEach(b => b.onclick = async () => {
    const cl = STATE.clients.find(c=>c.id===STATE.activeClientId);
    const tpl = (cl.templates_propri||[]).find(t=>t.id===b.dataset.usaMio);
    if(!tpl.giorni.length){ alert('Aggiungi almeno un giorno con esercizi prima di usarlo'); return; }
    if(cl.programma_attivo && !confirm('Questo sostituisce il programma attivo. Continuare?')) return;
    const nSett = tpl.durata_settimane || 4;
    cl.programma_attivo = {
      nome: tpl.nome,
      durata_settimane: nSett,
      origine: 'atleta',
      origine_template: tpl.id,
      settimane: Array.from({length:nSett}, (_,i)=>({
        nome: 'Settimana ' + (i+1),
        giorni: JSON.parse(JSON.stringify(tpl.giorni))
      }))
    };
    cl.settimana_corrente = 0;
    cl._gymDayIdx = 0;
    cl._gymLog = {};
    await persistClients();
    goPage('gym');
  });

  // Progressione
  const progrClientSel = document.getElementById('progrClientSel');
  if(progrClientSel) progrClientSel.onchange = e => { STATE.activeClientId = e.target.value; render(); };
  const editProgrParamsBtn = document.getElementById('editProgrParamsBtn');
  if(editProgrParamsBtn) editProgrParamsBtn.onclick = openProgrParamsModal;
  document.querySelectorAll('[data-progr-apply]').forEach(b => b.onclick = async () => {
    const nome = b.dataset.progrApply;
    const client = STATE.clients.find(c=>c.id===STATE.activeClientId);
    const val = parseFloat(document.querySelector(`[data-progr-val="${nome}"]`).value);
    if(!val || val <= 0){ alert('Inserisci un carico valido'); return; }
    if(!client.carichi_correnti) client.carichi_correnti = {};
    client.carichi_correnti[nome] = val;
    await persistClients();
    render();
  });

  // Wellness
  const wellClientSel = document.getElementById('wellClientSel');
  if(wellClientSel) wellClientSel.onchange = e => { STATE.activeClientId = e.target.value; render(); };

  // Storico/Progressi
  const progressClientSel = document.getElementById('progressClientSel');
  if(progressClientSel) progressClientSel.onchange = e => { STATE.activeClientId = e.target.value; render(); };
  if(document.getElementById('volumeChart')) drawVolumeChart();
  if(document.getElementById('e1rmChart')) drawE1RMChart();
  if(document.getElementById('pesoChart')) drawPesoChart();
  if(document.getElementById('muscleChart')) drawMuscleChart();
  const e1rmSel = document.getElementById('e1rmSel');
  if(e1rmSel) e1rmSel.onchange = e => {
    const client = STATE.clients.find(c=>c.id===STATE.activeClientId);
    client._e1rmSel = e.target.value;
    render();
  };
  const addMisuraBtn = document.getElementById('addMisuraBtn');
  if(addMisuraBtn) addMisuraBtn.onclick = openMisuraModal;
  document.querySelectorAll('[data-edit-landmarks]').forEach(b => b.onclick = () => openVolumeLandmarksModal(b.dataset.editLandmarks));
  document.querySelectorAll('[data-scale]').forEach(group => {
    group.querySelectorAll('button').forEach(btn => btn.onclick = () => {
      group.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  const saveWellBtn = document.getElementById('saveWellnessBtn');
  if(saveWellBtn) saveWellBtn.onclick = async () => {
    const client = STATE.clients.find(c=>c.id===STATE.activeClientId);
    const today = new Date().toISOString().slice(0,10);
    if(!client.wellness) client.wellness = {};
    const entry = {};
    document.querySelectorAll('[data-scale]').forEach(group => {
      const activeBtn = group.querySelector('button.active');
      entry[group.dataset.scale] = activeBtn ? parseInt(activeBtn.dataset.val) : 0;
    });
    client.wellness[today] = entry;
    await persistClients();
    alert('Check-in salvato.');
  };
}
</script>
