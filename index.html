              </select>
              <input id="piTitle" type="text" value="${esc(titoloCorrente)}" placeholder="Titolo personalizzato" style="display:${isCustom?'block':'none'};">
            `;
          })()}
        </div>
        <div><label>Data</label><input id="piDate" type="date" value="${piano.date||''}"></div>
      </div>

      <label style="margin-top:14px;display:block;">Testo libero (opzionale, senza vincoli)</label>
      <textarea id="piFreeText" rows="4" placeholder="Descrivi liberamente il lavoro da fare, obiettivi, indicazioni..." style="width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:12.5px;">${esc(piano.freeText||'')}</textarea>

      <h4 style="margin:18px 0 8px 0;font-size:13px;">Esercizi strutturati</h4>
      <div id="piExercises">
        ${(piano.exercises||[]).map((ex,i)=>editorEsercizio(ex, i)).join('')}
      </div>
      <button class="btn secondary" id="piAddExercise" style="width:100%;font-size:12px;padding:8px;margin-top:6px;">+ Aggiungi esercizio</button>

      ${(piano.playerComment || (piano.exercises||[]).some(ex=>ex.playerComment)) ? `
        <div style="margin-top:18px;padding:12px;background:#F0F7F1;border:1px solid var(--ok);border-radius:6px;">
          <h4 style="margin:0 0 8px 0;color:var(--ok);font-size:12px;">Commenti del giocatore</h4>
          ${piano.playerComment ? `<div style="font-size:12.5px;margin-bottom:8px;"><strong>Sul piano:</strong> ${esc(piano.playerComment)}</div>` : ''}
          ${(piano.exercises||[]).filter(ex=>ex.playerComment).map(ex=>`
            <div style="font-size:11.5px;color:var(--ink);border-left:2px solid var(--ok);padding-left:8px;margin:6px 0;">
              <strong>${esc(ex.name||'esercizio')}:</strong> ${esc(ex.playerComment)}
            </div>
          `).join('')}
          ${piano.playerRPE != null ? `<div style="font-size:12.5px;margin-top:8px;"><strong>RPE fine allenamento:</strong> ${piano.playerRPE}/10</div>` : ''}
        </div>
      ` : ''}

      <div style="margin-top:20px;display:flex;gap:8px;">
        <button class="btn pi-save-btn" style="flex:1;background:${tipoColor};">Salva piano</button>
        <button class="btn secondary pi-back-btn2" style="padding:8px 20px;">Chiudi</button>
      </div>
    </div>
  `;

  const back = ()=>{
    el.dataset.editPlanId = '';
    renderPianiIndividuali(el, tipo);
  };
  el.querySelector('.pi-back-btn').addEventListener('click', back);
  el.querySelector('.pi-back-btn2').addEventListener('click', back);

  /* Dropdown titolo: se scelgo un'opzione predefinita la scrivo nell'input nascosto,
     se scelgo "Personalizzato" mostro l'input testuale. */
  const titleSel = document.getElementById('piTitleSelect');
  const titleInput = document.getElementById('piTitle');
  if(titleSel){
    titleSel.addEventListener('change', ()=>{
      const v = titleSel.value;
      if(v === '__custom__'){
        titleInput.style.display = 'block';
        titleInput.value = '';
        titleInput.focus();
      } else {
        titleInput.style.display = 'none';
        titleInput.value = v;
      }
    });
  }

  const addExBtn = document.getElementById('piAddExercise');
  addExBtn.addEventListener('click', ()=>{
    if(!Array.isArray(piano.exercises)) piano.exercises = [];
    piano.exercises.push({
      id: uid(),
      name: '',
      series: null,
      reps: null,
      tut: '',
      kg: null,
      distance: null,
      recovery: null,
      rpeTarget: null,
      notes: '',
      playerComment: ''
    });
    renderPianoEditor(el, planId, tipo);
  });

  /* Rimozione esercizi */
  el.querySelectorAll('.pi-ex-del').forEach(b=>{
    b.addEventListener('click', ()=>{
      const idx = parseInt(b.dataset.idx, 10);
      piano.exercises.splice(idx, 1);
      renderPianoEditor(el, planId, tipo);
    });
  });

  document.querySelector('.pi-save-btn').addEventListener('click', async ()=>{
    piano.title = document.getElementById('piTitle').value.trim();
    piano.date = document.getElementById('piDate').value || todayStr();
    piano.freeText = document.getElementById('piFreeText').value;
    /* Leggo i campi di ogni esercizio */
    (piano.exercises||[]).forEach((ex, i)=>{
      const g = id => document.getElementById('piEx' + id + i);
      if(g('Name')) ex.name = g('Name').value.trim();
      if(g('Series')) ex.series = g('Series').value ? parseInt(g('Series').value,10) : null;
      if(g('Reps')) ex.reps = g('Reps').value ? parseInt(g('Reps').value,10) : null;
      if(g('Tut')) ex.tut = g('Tut').value.trim();
      if(g('Kg')) ex.kg = g('Kg').value ? parseFloat(g('Kg').value) : null;
      if(g('Distance')) ex.distance = g('Distance').value ? parseInt(g('Distance').value,10) : null;
      if(g('Recovery')) ex.recovery = g('Recovery').value ? parseInt(g('Recovery').value,10) : null;
      if(g('RpeTarget')) ex.rpeTarget = g('RpeTarget').value ? parseInt(g('RpeTarget').value,10) : null;
      if(g('Notes')) ex.notes = g('Notes').value;
    });
    await saveKey('individualPlans', STATE.individualPlans);
    showToast('Piano salvato');
    back();
  });
}

/* --- Modulo di inserimento e modifica --- */
function formInfortunio(inj, onDone){
  const nuovo = !inj;
  const old = document.getElementById('infortunioModal');
  if(old) old.remove();

  const modal = document.createElement('div');
  modal.id = 'infortunioModal';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:flex-start;justify-content:center;z-index:10001;padding:20px;box-sizing:border-box;overflow-y:auto;';

  const v = inj || {};
  modal.innerHTML = `
    <div style="background:white;border-radius:12px;max-width:560px;width:100%;padding:24px;margin:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h2 style="margin:0;color:var(--pitch);">${nuovo ? 'Registra infortunio' : 'Modifica infortunio'}</h2>
        <button id="infClose" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;">&#10005;</button>
      </div>

      <label>Giocatore</label>
      <select id="infPlayer" ${nuovo ? '' : 'disabled'}>
        <option value="">Seleziona...</option>
        ${STATE.players.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name)))
          .map(p=>`<option value="${p.id}" ${String(v.playerId)===String(p.id)?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select>

      <div class="grid2" style="gap:12px;">
        <div><label>Data infortunio</label><input id="infStart" type="date" value="${v.dateStart || todayStr()}" max="${todayStr()}"></div>
        <div><label>Zona</label><select id="infZone">${BODY_ZONES.map(z=>`<option ${v.zone===z?'selected':''}>${z}</option>`).join('')}</select></div>
      </div>

      <div class="grid2" style="gap:12px;">
        <div><label>Tipo</label><select id="infType">${INJURY_TYPES.map(t=>`<option ${v.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
        <div><label>Meccanismo</label><select id="infMech">${INJURY_MECHANISMS.map(m=>`<option ${v.mechanism===m?'selected':''}>${m}</option>`).join('')}</select></div>
      </div>

      <div class="grid2" style="gap:12px;">
        <div><label>Contesto</label><select id="infCtx">${INJURY_CONTEXTS.map(cx=>`<option ${v.context===cx?'selected':''}>${cx}</option>`).join('')}</select></div>
        <div><label>Rientro previsto</label><input id="infExpected" type="date" value="${v.expectedReturn || ''}"></div>
      </div>

      <label>Diagnosi</label>
      <input id="infDiag" type="text" value="${esc(v.diagnosis || '')}" placeholder="Es. lesione di primo grado del bicipite femorale">

      <label>Note</label>
      <textarea id="infNotes" placeholder="Dinamica, esami, indicazioni del medico">${esc(v.notes || '')}</textarea>

      ${!nuovo ? `
        <div class="grid2" style="gap:12px;">
          <div><label>Data rientro effettiva</label><input id="infEnd" type="date" value="${v.dateEnd || ''}" max="${todayStr()}"></div>
          <div><label>Stato</label><select id="infStatus">${INJURY_STATUS.map(st=>`<option value="${st.value}" ${v.status===st.value?'selected':''}>${st.label}</option>`).join('')}</select></div>
        </div>` : ''}

      <div style="font-size:11.5px;color:var(--ink-soft);margin-top:12px;padding:10px;background:var(--chalk);border-radius:6px;">
        ${nuovo ? 'Registrando l infortunio il giocatore passa automaticamente allo stato Infortunato.' : 'Chiudendo l episodio il giocatore torna Disponibile.'}
      </div>

      <div class="btn-row" style="justify-content:flex-end;">
        <button id="infCancel" class="btn secondary">Annulla</button>
        <button id="infSave" class="btn">${nuovo ? 'Registra' : 'Salva'}</button>
      </div>
    </div>`;

  document.body.appendChild(modal);
  const chiudi = ()=> modal.remove();
  document.getElementById('infClose').addEventListener('click', chiudi);
  document.getElementById('infCancel').addEventListener('click', chiudi);
  modal.addEventListener('click', e=>{ if(e.target === modal) chiudi(); });

  document.getElementById('infSave').addEventListener('click', async ()=>{
    const playerId = nuovo ? document.getElementById('infPlayer').value : v.playerId;
    if(!playerId){ showToast('Seleziona il giocatore'); return; }
    const dateStart = document.getElementById('infStart').value;
    if(!dateStart){ showToast('Indica la data'); return; }
    if(dateStart > todayStr()){ showToast('La data non puo essere futura'); return; }

    const dati = {
      playerId: String(playerId),
      dateStart: dateStart,
      zone: document.getElementById('infZone').value,
      type: document.getElementById('infType').value,
      mechanism: document.getElementById('infMech').value,
      context: document.getElementById('infCtx').value,
      expectedReturn: document.getElementById('infExpected').value,
      diagnosis: document.getElementById('infDiag').value.trim(),
      notes: document.getElementById('infNotes').value.trim()
    };

    const p = STATE.players.find(x=>String(x.id)===String(playerId));

    if(nuovo){
      if(!confirm('Registrare l infortunio di ' + (p?p.name:'') + '?\n\nIl giocatore passera allo stato Infortunato.')) return;
      if(!Array.isArray(STATE.injuries)) STATE.injuries = [];
      STATE.injuries.push(Object.assign({id: uid(), status:'attivo', stage:'riposo', dateEnd:''}, dati));
      if(p){
        p.status = 'Infortunato';
        p.returnDate = dati.expectedReturn || '';
        await saveKey('players', STATE.players);
      }
    } else {
      const fine = document.getElementById('infEnd');
      const stato = document.getElementById('infStatus');
      Object.assign(inj, dati);
      inj.dateEnd = fine ? fine.value : inj.dateEnd;
      inj.status = stato ? stato.value : inj.status;
      if(inj.status === 'risolto' && !inj.dateEnd) inj.dateEnd = todayStr();
      if(p){
        if(inj.status === 'risolto'){ p.status = 'Disponibile'; p.returnDate = ''; }
        else if(inj.status === 'rtp'){ p.status = 'RTP'; p.returnDate = dati.expectedReturn || ''; }
        else { p.status = 'Infortunato'; p.returnDate = dati.expectedReturn || ''; }
        await saveKey('players', STATE.players);
      }
    }

    await saveKey('injuries', STATE.injuries);
    showToast(nuovo ? 'Infortunio registrato' : 'Modifiche salvate');
    chiudi();
    if(onDone) onDone();
  });
}

/* ---------- AREA PERFORMANCE ---------- */
function renderPerformance(el){
  const tab = el.dataset.perfTab || 'test';
  const tabBtn = (id, label)=>
    `<button class="perf-tab" data-tab="${id}" style="padding:9px 16px;border:none;border-bottom:3px solid ${tab===id?'var(--amber)':'transparent'};background:none;font-size:13px;font-weight:${tab===id?'700':'500'};color:${tab===id?'var(--pitch)':'var(--ink-soft)'};cursor:pointer;">${label}</button>`;

  el.innerHTML = `
    <div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;">
      <div><h1>Area Performance</h1><p>Test, carico e rendimento</p></div>
      <button class="btn secondary" id="printPerformanceBtn" style="font-size:12px;padding:8px 14px;white-space:nowrap;">Recap PDF</button>
    </div>
    <div style="display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;">
      ${tabBtn('test','Test')}
      ${tabBtn('confronti','Confronti')}
      ${tabBtn('carico','Carico')}
      ${tabBtn('grafici','Grafici')}
      ${tabBtn('rpe','RPE sessioni')}
      ${tabBtn('piani','Piani individuali')}
      ${tabBtn('stagione','Stagione')}
    </div>
    <div id="perfContent"></div>
  `;

  el.querySelectorAll('.perf-tab').forEach(b=>{
    b.addEventListener('click', ()=>{
      el.dataset.perfTab = b.dataset.tab;
      renderPerformance(el);
    });
  });

  const printPerfBtn = document.getElementById('printPerformanceBtn');
  if(printPerfBtn) printPerfBtn.addEventListener('click', printAreaPerformance);

  const content = document.getElementById('perfContent');
  if(!content) return;

  if(tab === 'test') renderTest(content);
  else if(tab === 'confronti') renderPerfConfronti(content);
  else if(tab === 'carico') renderPerfCarico(content);
  else if(tab === 'grafici') renderPerfGrafici(content);
  else if(tab === 'rpe') renderPerfRPE(content);
  else if(tab === 'piani') renderPianiIndividuali(content, 'integrazione');
  else renderPerfStagione(content);
}

    <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center;">
      <span style="font-size:11px;color:var(--ink-soft);">Periodo:</span>
      ${[30,60,90,180].map(d=>`<button class="graf-range" data-days="${d}" style="padding:5px 10px;border:1px solid ${rangeDays===d?'var(--pitch)':'var(--line)'};background:${rangeDays===d?'var(--pitch)':'white'};color:${rangeDays===d?'white':'var(--ink)'};border-radius:4px;font-size:11px;cursor:pointer;">${d}gg</button>`).join('')}
    </div>
    <div id="grafContent"></div>
  `;

  el.querySelectorAll('.graf-subtab').forEach(b=>{
    b.addEventListener('click', ()=>{ el.dataset.grafState = b.dataset.sub; renderPerfGrafici(el); });
  });
  el.querySelectorAll('.graf-range').forEach(b=>{
    b.addEventListener('click', ()=>{ el.dataset.grafRange = b.dataset.days; renderPerfGrafici(el); });
  });

  const c = document.getElementById('grafContent');
  if(state === 'squadra') renderGrafSquadra(c, rangeDays);
  else if(state === 'giocatore') renderGrafGiocatore(c, selectedPid, rangeDays, rosaMovimento, el);
  else renderGrafConfronti(c, selectedPid, compareIds, rangeDays, rosaMovimento, el);
}

function renderGrafSquadra(el, days){
  const acwrData = serieACWRSquadra(days);
  const wellData = serieWellnessSquadra(days);
  const rpeData = serieRPESquadra(days);

  /* Statistica di copertura: quanti RPE / wellness sono stati compilati nel periodo,
     e da quanti giocatori diversi. Se il grafico ha "pochi dati", tipicamente e' perche'
     l'adesione dei giocatori e' bassa, non un bug del calcolo. */
  const soglia = new Date(todayStr() + 'T00:00:00').getTime() - days * 86400000;
  const rpePeriodo = STATE.rpeLog.filter(r => {
    if(r.source === 'plan') return false;
    const t = new Date(r.date + 'T00:00:00').getTime();
    if(t < soglia) return false;
    const p = STATE.players.find(x => String(x.id) === String(r.playerId));
    return p && !isPortiere(p);
  });
  const wellPeriodo = STATE.hooperLog.filter(h => {
    if(isLegacyHooper(h)) return false;
    const t = new Date(h.date + 'T00:00:00').getTime();
    if(t < soglia) return false;
    const p = STATE.players.find(x => String(x.id) === String(h.playerId));
    return p && !isPortiere(p);
  });
  const rosaSize = STATE.players.filter(p => !isPortiere(p)).length;
  const compilatoriRPE = new Set(rpePeriodo.map(r => r.playerId)).size;
  const compilatoriWell = new Set(wellPeriodo.map(h => h.playerId)).size;

  el.innerHTML = `
    <div class="card" style="background:#F7F5EC;border-left:3px solid var(--amber);">
      <h4 style="margin:0 0 8px 0;font-size:12px;color:var(--pitch);">Copertura dati nel periodo (${days} giorni)</h4>
      <div style="font-size:12px;color:var(--ink);line-height:1.7;">
        <strong>RPE:</strong> ${rpePeriodo.length} inserimenti da ${compilatoriRPE}/${rosaSize} giocatori<br>
        <strong>Wellness:</strong> ${wellPeriodo.length} compilazioni da ${compilatoriWell}/${rosaSize} giocatori
      </div>
      ${(compilatoriRPE < rosaSize * 0.5 || compilatoriWell < rosaSize * 0.5) ? `
        <div style="margin-top:8px;font-size:11px;color:var(--clay);">
          Adesione bassa: se i grafici sotto sembrano vuoti e' perche' meno di meta' della rosa compila regolarmente.
        </div>
      ` : ''}
    </div>

    <div class="card">
      <h3>ACWR di squadra</h3>
      <div style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">Rapporto carico settimana / media 4 settimane. Zone: verde ottimale (0.8-1.3), ambra in salita (1.3-1.5), rosso rischio (&gt;1.5).</div>
      ${lineChartSVG({
        series:[{name:'Media squadra', color:'#16352A', data:acwrData}],
        yLabel:'ACWR',
        zones:[
          {min:0.8, max:1.3, color:'#3F7A5C'},
          {min:1.3, max:1.5, color:'#C9922B'},
          {min:1.5, max:3, color:'#B5473A'}
        ]
      })}
    </div>

    <div class="card">
      <h3>Freschezza wellness</h3>
      <div style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">Media percentuale della squadra (100% = tutti freschi).</div>
      ${lineChartSVG({
        series:[{name:'Media squadra', color:'#3F7A5C', data:wellData}],
        yLabel:'%', yMin:0, yMax:100
      })}
    </div>

    <div class="card">
      <h3>RPE medio per sessione</h3>
      <div style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">Media dell'RPE di squadra su ogni allenamento/partita.</div>
      ${lineChartSVG({
        series:[{name:'RPE medio', color:'#C9922B', data:rpeData}],
        yLabel:'RPE', yMin:0, yMax:10
      })}
    </div>
  `;
}

function renderGrafConfronti(el, mainPid, compareIds, days, rosa, parent){
  const colori = ['#16352A', '#C9922B', '#B5473A', '#3F7A5C'];

  /* Prepara serie: giocatore principale + confronti + media squadra */
  const buildSeries = (fn, seriesLabel) => {
    const series = [];
    /* Media squadra come riferimento */
    const teamFn = seriesLabel === 'ACWR' ? serieACWRSquadra
                : seriesLabel === 'Freschezza' ? serieWellnessSquadra
                : seriesLabel === 'RPE' ? serieRPESquadra
                : null;
    if(teamFn){
      series.push({name:'Media squadra', color:'#5C5648', opacity:0.5, data: teamFn(days)});
    }
    if(mainPid){
      const p = STATE.players.find(x => String(x.id) === String(mainPid));
      if(p) series.push({name: p.name, color: colori[0], data: fn(mainPid, days)});
    }
    compareIds.forEach((pid, i)=>{
      const p = STATE.players.find(x => String(x.id) === String(pid));
      if(p) series.push({name: p.name, color: colori[(i+1) % colori.length], data: fn(pid, days)});
    });
    return series;
  };

  const seriesACWR = buildSeries(serieACWRGiocatore, 'ACWR');
  const seriesWell = buildSeries(serieWellnessGiocatore, 'Freschezza');
  const seriesRPE  = buildSeries(serieRPEGiocatore, 'RPE');

  const allSelected = [mainPid].concat(compareIds).filter(Boolean);

  el.innerHTML = `
    <div class="card">
      <label style="font-size:11px;">Giocatore principale</label>
      <select id="grafMainSelect" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:13px;margin-bottom:10px;">
        ${rosa.map(p => `<option value="${p.id}" ${String(p.id)===String(mainPid)?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select>
      <label style="font-size:11px;">Confronta con (max 3)</label>
      <div id="grafCompareList" style="max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:6px;">
        ${rosa.filter(p => String(p.id) !== String(mainPid)).map(p => `
          <label style="display:flex;align-items:center;gap:6px;padding:3px 4px;font-size:12px;cursor:pointer;">
            <input type="checkbox" class="graf-compare-chk" value="${p.id}" ${compareIds.includes(String(p.id))?'checked':''}>
            <span>${esc(p.name)}</span>
          </label>
        `).join('')}
      </div>
      <div style="font-size:11px;color:var(--ink-soft);margin-top:6px;">Il confronto include sempre la media squadra come linea grigia.</div>
    </div>

    <div class="card">
      <h3>ACWR</h3>
      ${lineChartSVG({
        series: seriesACWR,
        yLabel:'ACWR',
        zones:[
          {min:0.8, max:1.3, color:'#3F7A5C'},
          {min:1.3, max:1.5, color:'#C9922B'},
          {min:1.5, max:3, color:'#B5473A'}
        ]
      })}
    </div>

    <div class="card">
      <h3>Freschezza wellness</h3>
      ${lineChartSVG({
        series: seriesWell,
        yLabel:'%', yMin:0, yMax:100
      })}
    </div>

    <div class="card">
      <h3>RPE per sessione</h3>
      ${lineChartSVG({
        series: seriesRPE,
        yLabel:'RPE', yMin:0, yMax:10
      })}
    </div>
  `;

  const mainSel = document.getElementById('grafMainSelect');
  if(mainSel) mainSel.addEventListener('change', ()=>{
    parent.dataset.grafPlayerId = mainSel.value;
    renderPerfGrafici(parent);
  });
  el.querySelectorAll('.graf-compare-chk').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const selected = Array.from(el.querySelectorAll('.graf-compare-chk:checked')).slice(0, 3).map(c=>c.value);
      /* Se piu' di 3, deseleziona l'ultimo */
      if(el.querySelectorAll('.graf-compare-chk:checked').length > 3){
        chk.checked = false;
        showToast('Massimo 3 giocatori da confrontare');
        return;
      }
      parent.dataset.grafCompareIds = selected.join(',');
      renderPerfGrafici(parent);
    });
  });
}

/* --- RPE per sessione: ogni evento passato con RPE, compilazione e carichi --- */
function renderPerfRPE(el){
  const today = todayStr();
  /* Considero solo eventi passati o di oggi. Escludo RPE dai piani individuali (source=plan) */
  const eventiPassati = STATE.events
    .filter(e => (e.type === 'Allenamento' || e.type === 'Partita') && e.date <= today && e.id !== 'rpe-import-session')
    .sort((a,b) => String(b.date).localeCompare(String(a.date)));

  /* Statistiche aggregate ultimi 7 e 28 giorni */
  const in7 = STATE.rpeLog.filter(r => r.source !== 'plan' && daysSince(r.date) <= 7);
  const in28 = STATE.rpeLog.filter(r => r.source !== 'plan' && daysSince(r.date) <= 28);
  const avg7 = in7.length ? in7.reduce((s,r)=>s+Number(r.rpe||0),0)/in7.length : null;
  const load7 = in7.reduce((s,r)=>s+Number(r.rpe||0)*Number(r.minutes||0),0);
  const avg28 = in28.length ? in28.reduce((s,r)=>s+Number(r.rpe||0),0)/in28.length : null;

  el.innerHTML = `
    <div class="tiles" style="margin-bottom:20px;">
      <div class="tile"><div class="tile-accent" style="background:var(--amber);"></div><div class="tile-lbl">Media RPE 7 giorni</div><div class="tile-val" style="color:${avg7 !== null ? (avg7>=7?'var(--clay)':avg7>=5?'var(--amber-dark)':'var(--ok)') : 'var(--ink-soft)'};">${avg7 !== null ? Math.round(avg7*10)/10 : '—'}</div><div class="tile-sub">${in7.length} sessioni</div></div>
      <div class="tile"><div class="tile-accent" style="background:var(--pitch);"></div><div class="tile-lbl">Carico 7 giorni</div><div class="tile-val">${Math.round(load7)}</div><div class="tile-sub">UA totali</div></div>
      <div class="tile"><div class="tile-accent" style="background:var(--amber-dark);"></div><div class="tile-lbl">Media RPE 28 giorni</div><div class="tile-val" style="color:${avg28 !== null ? (avg28>=7?'var(--clay)':avg28>=5?'var(--amber-dark)':'var(--ok)') : 'var(--ink-soft)'};">${avg28 !== null ? Math.round(avg28*10)/10 : '—'}</div><div class="tile-sub">${in28.length} sessioni</div></div>
      <div class="tile"><div class="tile-accent" style="background:var(--ok);"></div><div class="tile-lbl">Sessioni passate</div><div class="tile-val">${eventiPassati.length}</div><div class="tile-sub">totali</div></div>
    </div>

    <div class="card">
      <h3>Sessioni con RPE</h3>
      <div style="font-size:11px;color:var(--ink-soft);margin-bottom:12px;">Clicca su una sessione per aprirne il dettaglio.</div>
      ${eventiPassati.length === 0
        ? '<div class="empty">Nessuna sessione passata registrata.</div>'
        : eventiPassati.slice(0, 30).map(e=>{
          const rpes = (STATE.rpeLog || []).filter(r => r.sessionId === e.id && r.source !== 'plan');
          const avg = rpes.length ? rpes.reduce((s,r)=>s+Number(r.rpe||0),0)/rpes.length : null;
          const load = rpes.reduce((s,r)=>s+Number(r.rpe||0)*Number(r.minutes||0),0);
          const attesi = Array.isArray(e.presentPlayers) ? e.presentPlayers.length : (Array.isArray(e.starters) ? e.starters.length : 0);
          const color = avg !== null ? (avg>=7?'var(--clay)':avg>=5?'var(--amber-dark)':avg>=3?'var(--amber)':'var(--ok)') : 'var(--ink-soft)';
          const isMatch = e.type === 'Partita';
          return `<div class="rpe-session-row" data-event-id="${e.id}" style="display:grid;grid-template-columns:auto 1fr auto auto auto;gap:10px;align-items:center;padding:10px;background:${isMatch?'#FDF3E7':'#F0F7F1'};border-radius:6px;margin-bottom:6px;cursor:pointer;border-left:3px solid ${isMatch?'var(--amber)':'var(--pitch)'};">
            <span style="font-size:11px;color:var(--ink-soft);width:70px;">${fmtDate(e.date)}</span>
            <span style="font-size:12.5px;font-weight:600;color:var(--pitch);">${esc(e.title||e.type)}</span>
            <span style="font-size:11px;color:var(--ink-soft);white-space:nowrap;">${rpes.length}${attesi?'/'+attesi:''} compil.</span>
            <span style="font-size:11px;color:var(--ink-soft);white-space:nowrap;">${Math.round(load)} UA</span>
            <span style="font-size:14px;font-weight:700;color:${color};min-width:44px;text-align:right;">${avg !== null ? Math.round(avg*10)/10 : '—'}</span>
          </div>`;
        }).join('')
      }
      ${eventiPassati.length > 30 ? `<div style="font-size:11px;color:var(--ink-soft);text-align:center;margin-top:8px;">+${eventiPassati.length - 30} sessioni piu' vecchie</div>` : ''}
    </div>
  `;

  el.querySelectorAll('.rpe-session-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const e = STATE.events.find(ev => ev.id === row.dataset.eventId);
      if(!e) return;
      if(e.type === 'Partita') renderMatchDetails(e);
      else renderAllenamentoDetails(e);
    });
  });
}

/* --- Confronti: un tipo di test alla volta, tutta la squadra --- */
function renderPerfConfronti(el){
  const tipiUsati = [];
  STATE.tests.forEach(t=>{ if(t.type && tipiUsati.indexOf(t.type) === -1 && (t.results||[]).length) tipiUsati.push(t.type); });

  if(tipiUsati.length === 0){
    el.innerHTML = '<div class="card"><div class="empty">Nessun risultato ancora inserito. Crea un test e registra i valori per vedere i confronti.</div></div>';
    return;
  }

  const tipo = el.dataset.tipo && tipiUsati.indexOf(el.dataset.tipo) !== -1 ? el.dataset.tipo : tipiUsati[0];
  const unita = (TEST_SPECS[tipo] || {}).unit || '';
  const basso = lowerIsBetter(tipo);

  // Ultimo risultato di ciascun giocatore, in classifica
  const perGiocatore = {};
  testResultsByType(tipo).forEach(r=>{ if(!perGiocatore[r.playerId]) perGiocatore[r.playerId] = r; });
  const righe = Object.keys(perGiocatore).map(pid=>{
    const p = STATE.players.find(x=>String(x.id)===pid);
    return {p, pid, snap: testSnapshot(pid, tipo)};
  }).filter(x=>x.p && x.snap)
    .sort((a,b)=> basso ? a.snap.ultimo.value - b.snap.ultimo.value : b.snap.ultimo.value - a.snap.ultimo.value);

  const media = righe.length ? righe.reduce((a,x)=>a+x.snap.ultimo.value,0)/righe.length : 0;

  // Medie per ruolo
  const ruoli = [];
  righe.forEach(x=>{ if(x.p.role && ruoli.indexOf(x.p.role) === -1) ruoli.push(x.p.role); });

  el.innerHTML = `
    <div class="card">
      <label style="margin-top:0;">Tipo di test</label>
      <select id="perfTipoSelect">
        ${tipiUsati.map(t=>`<option value="${esc(t)}" ${t===tipo?'selected':''}>${esc(t)}</option>`).join('')}
      </select>
      <div style="font-size:11.5px;color:var(--ink-soft);margin-top:8px;">
        ${esc((TEST_SPECS[tipo]||{}).description || '')} — ${basso ? 'valore piu basso = migliore' : 'valore piu alto = migliore'}
      </div>
    </div>

    <div class="tiles" style="grid-template-columns:repeat(3,1fr);">
      <div class="tile">
        <div class="tile-lbl">Media squadra</div>
        <div class="tile-big">${Math.round(media*100)/100}<small> ${esc(unita)}</small></div>
        <div class="tile-sub">${righe.length} giocatori testati</div>
      </div>
      <div class="tile">
        <div class="tile-accent" style="background:var(--ok);"></div>
        <div class="tile-lbl">Migliore</div>
        <div class="tile-big" style="font-size:22px;">${righe.length ? esc(String(righe[0].p.name).split(' ')[0]) : '—'}</div>
        <div class="tile-sub">${righe.length ? righe[0].snap.ultimo.value + ' ' + esc(unita) : ''}</div>
      </div>
      <div class="tile">
        <div class="tile-lbl">Ultima rilevazione</div>
        <div class="tile-big" style="font-size:22px;">${righe.length ? fmtDate(righe[0].snap.ultimo.date) : '—'}</div>
        <div class="tile-sub">${STATE.tests.filter(t=>t.type===tipo).length} sessioni registrate</div>
      </div>
    </div>

    ${ruoli.length > 1 ? `
      <div class="card">
        <h3>Media per ruolo</h3>
        ${ruoli.map(r=>{
          const m = testMediaPerRuolo(tipo, r);
          if(!m) return '';
          return `<div class="mini-row"><span>${esc(r)} <span style="color:var(--ink-soft);">(${m.n})</span></span><strong>${Math.round(m.media*100)/100} ${esc(unita)}</strong></div>`;
        }).join('')}
      </div>` : ''}

    <div class="card">
      <h3>Classifica squadra</h3>
      <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;">Ultimo valore di ciascuno. Tocca un giocatore per la scheda completa.</div>
      <div style="border:1px solid var(--line);border-radius:6px;overflow:hidden;">
        ${righe.map((x,i)=>{
          const sn = x.snap;
          const diffMedia = Math.round((sn.ultimo.value - media)*100)/100;
          const segno = diffMedia > 0 ? '+' : '';
          return `
            <div class="perf-row" data-player-id="${x.pid}" style="padding:10px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;cursor:pointer;">
              <div style="font-size:13px;font-weight:700;color:${i===0?'var(--amber-dark)':'var(--ink-soft)'};">${i+1}</div>
              <div style="min-width:0;">
                <div style="font-size:13px;font-weight:600;">${esc(x.p.name)}</div>
                <div style="font-size:10.5px;color:var(--ink-soft);">
                  ${esc(x.p.role || '—')} · ${fmtDate(sn.ultimo.date)}
                  ${sn.delta !== null ? ' · <span style="color:' + (sn.migliorato ? 'var(--ok)' : 'var(--clay)') + ';font-weight:600;">' +
                     (sn.migliorato ? 'migliorato' : 'peggiorato') + ' di ' + Math.abs(Math.round(sn.delta*100)/100) + ' ' + esc(unita) + '</span>' : ' · prima rilevazione'}
                </div>
              </div>
              <div style="text-align:right;white-space:nowrap;">
                <div style="font-size:16px;font-weight:700;color:var(--pitch);">${sn.ultimo.value}</div>
                <div style="font-size:10px;color:${sn.meglioDellaMedia ? 'var(--ok)' : 'var(--ink-soft)'};">${segno}${diffMedia} vs media</div>
              </div>
            </div>`;
        }).join('')}
      </div>
    </div>

    ${tipo === 'CMJ' ? `
      <div class="card">
        <h3>Fatica neuromuscolare</h3>
        <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;">
          Confronto fra il salto attuale e il miglior valore registrato. Un calo oltre il ${CMJ_SOGLIA_ALLARME}% e un segnale di affaticamento residuo.
        </div>
        ${(()=>{
          const cali = STATE.players.map(p=>({p, f: cmjFatica(p.id)})).filter(x=>x.f)
            .sort((a,b)=>b.f.calo - a.f.calo);
          if(cali.length === 0) return '<div class="empty">Servono almeno due rilevazioni CMJ per giocatore.</div>';
          return cali.map(x=>`
            <div class="mini-row" style="border-bottom:1px solid var(--line);padding:7px 0;">
              <span>${esc(x.p.name)} <span style="color:var(--ink-soft);font-size:11px;">${x.f.riferimento} &rarr; ${x.f.attuale} cm</span></span>
              <strong style="color:${x.f.colore};">${x.f.calo > 0 ? '-' : '+'}${Math.abs(x.f.calo)}% · ${x.f.etichetta}</strong>
            </div>`).join('');
        })()}
      </div>` : ''}
  `;

  const sel = document.getElementById('perfTipoSelect');
  if(sel) sel.addEventListener('change', ()=>{ el.dataset.tipo = sel.value; renderPerfConfronti(el); });

  el.querySelectorAll('.perf-row').forEach(row=>{
    row.addEventListener('click', ()=> showPlayerReport(row.dataset.playerId));
  });
}

/* --- Carico: ACWR di tutta la rosa --- */
function renderPerfCarico(el){
  const conDati = [], senzaDati = [];
  STATE.players.forEach(p=>{
    const a = getACWR(p.id);
    if(a && !a.insufficient) conDati.push({p, a}); else senzaDati.push({p, a});
  });
  conDati.sort((x,y)=> y.a.ratio - x.a.ratio);
  const media = conDati.length ? conDati.reduce((s,x)=>s+x.a.ratio,0)/conDati.length : null;

  const gruppo = (titolo, zone, colore)=>{
    const righe = conDati.filter(x=> zone.indexOf(x.a.zone) !== -1);
    if(righe.length === 0) return '';
    return `
      <div class="card">
        <h3 style="color:${colore};">${titolo} (${righe.length})</h3>
        ${righe.map(x=>`
          <div class="perf-row mini-row" data-player-id="${x.p.id}" style="cursor:pointer;border-bottom:1px solid var(--line);padding:8px 0;">
            <span>${esc(x.p.name)}<br><span style="font-size:10.5px;color:var(--ink-soft);">settimana ${x.a.acute} UA · media 4 sett. ${x.a.chronicWeekly} UA</span></span>
            <strong style="color:${x.a.color};">${x.a.ratio}</strong>
          </div>`).join('')}
      </div>`;
  };

  el.innerHTML = `
    <div class="tiles" style="grid-template-columns:repeat(3,1fr);">
      <div class="tile">
        <div class="tile-lbl">Media squadra</div>
        <div class="tile-big">${media !== null ? Math.round(media*100)/100 : '—'}</div>
        <div class="tile-sub">zona ottimale 0.8 - 1.3</div>
      </div>
      <div class="tile">
        <div class="tile-accent" style="background:${conDati.filter(x=>x.a.zone==='high').length ? 'var(--clay)' : 'var(--ok)'};"></div>
        <div class="tile-lbl">Oltre 1.5</div>
        <div class="tile-big" style="color:${conDati.filter(x=>x.a.zone==='high').length ? 'var(--clay)' : 'var(--ok)'};">${conDati.filter(x=>x.a.zone==='high').length}</div>
        <div class="tile-sub">carico cresciuto troppo</div>
      </div>
      <div class="tile">
        <div class="tile-lbl">Monitorati</div>
        <div class="tile-big">${conDati.length}<small>/${STATE.players.length}</small></div>
        <div class="tile-sub">servono 3 settimane di RPE</div>
      </div>
    </div>

    ${gruppo('Zona rischio, oltre 1.5', ['high'], 'var(--clay)')}
    ${gruppo('In salita, 1.3 - 1.5', ['warn'], 'var(--amber-dark)')}
    ${gruppo('Zona ottimale', ['ok'], 'var(--ok)')}
    ${gruppo('Scarico o fermi', ['low','none'], 'var(--amber-dark)')}

    ${senzaDati.length ? `
      <div class="card">
        <h3>Dati insufficienti (${senzaDati.length})</h3>
        <div style="font-size:12px;color:var(--ink-soft);">${senzaDati.map(x=>esc(x.p.name)).join(', ')}</div>
      </div>` : ''}
  `;

  el.querySelectorAll('.perf-row').forEach(row=>{
    row.addEventListener('click', ()=> showPlayerReport(row.dataset.playerId));
  });
}

/* --- Stagione: minuti, gol, assist --- */
function renderPerfStagione(el){
  const righe = STATE.players.map(p=>({p, s: getSeasonStats(p.id), att: getTrainingAttendance(p.id)}))
    .sort((a,b)=> b.s.minutes - a.s.minutes);

  const totMin = righe.reduce((a,x)=>a+x.s.minutes,0);
  const totGol = righe.reduce((a,x)=>a+x.s.goals,0);
  const totAss = righe.reduce((a,x)=>a+x.s.assists,0);
  const partite = STATE.events.filter(e=>e.type==='Partita' && Array.isArray(e.lineup) && e.lineup.length).length;

  el.innerHTML = `
    <div class="tiles" style="grid-template-columns:repeat(4,1fr);">
      <div class="tile"><div class="tile-lbl">Partite</div><div class="tile-big">${partite}</div><div class="tile-sub">con formazione inserita</div></div>
      <div class="tile"><div class="tile-lbl">Minuti totali</div><div class="tile-big">${totMin}</div><div class="tile-sub">distribuiti nella rosa</div></div>
      <div class="tile"><div class="tile-lbl">Gol</div><div class="tile-big" style="color:var(--amber-dark);">${totGol}</div><div class="tile-sub">di squadra</div></div>
      <div class="tile"><div class="tile-lbl">Assist</div><div class="tile-big" style="color:var(--amber-dark);">${totAss}</div><div class="tile-sub">di squadra</div></div>
    </div>

    <div class="card">
      <h3>Rendimento individuale</h3>
      ${partite === 0 ? '<div class="empty">Nessuna formazione inserita. I minuti si calcolano dai titolari e dai cambi registrati nelle partite.</div>' : `
      <table>
        <thead><tr><th>Giocatore</th><th>Min.</th><th>Part.</th><th>Tit.</th><th>Gol</th><th>Ass.</th><th>Allen.</th></tr></thead>
        <tbody>
          ${righe.map(x=>`
            <tr class="perf-row" data-player-id="${x.p.id}" style="cursor:pointer;">
              <td><strong>${esc(x.p.name)}</strong><div style="font-size:10px;color:var(--ink-soft);">${esc(x.p.role||'—')}</div></td>
              <td><strong>${x.s.minutes || '—'}</strong></td>
              <td>${x.s.matches || '—'}</td>
              <td>${x.s.starts || '—'}</td>
              <td style="color:${x.s.goals?'var(--amber-dark)':'inherit'};font-weight:${x.s.goals?'700':'400'};">${x.s.goals || '—'}</td>
              <td style="color:${x.s.assists?'var(--amber-dark)':'inherit'};font-weight:${x.s.assists?'700':'400'};">${x.s.assists || '—'}</td>
              <td>${x.att.percent !== null ? x.att.percent + '%' : '—'}</td>
            </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
  `;

  el.querySelectorAll('.perf-row').forEach(row=>{
    row.addEventListener('click', ()=> showPlayerReport(row.dataset.playerId));
  });
}

function renderTest(el){
  const selectedTestId = el.dataset.selectedTestId || null;
  const selectedTest = selectedTestId ? STATE.tests.find(t=>t.id===selectedTestId) : null;
  
  el.innerHTML = `
    <div class="page-head"><h1>Test</h1><p>Crea test e registra i risultati</p></div>
    
    ${!selectedTestId ? `
    <div class="card">
      <h3>Nuovo test</h3>
      <div class="grid2">
        <div><label>Nome del test</label><input id="testName" type="text" placeholder="Es. Test 30-15 - Settimana 1"></div>
        <div><label>Tipo di test</label><select id="testType">${Object.keys(TEST_SPECS).map(t=>`<option>${t}</option>`).join('')}</select></div>
      </div>
      <div class="grid2">
        <div><label>Data</label><input id="testDate" type="date" value="${todayStr()}"></div>
        <div><label>Unità di misura</label><input id="testUnit" type="text" readonly></div>
      </div>
      <div id="descDisplay" style="font-size:12px;color:var(--ink-soft);margin-top:8px;padding:8px;background:var(--chalk);border-radius:6px;"></div>
      <div class="btn-row"><button class="btn" id="createTestBtn">Crea test</button></div>
    </div>
    ` : ''}
    
    <div class="card">
      <h3>Test disponibili (${STATE.tests.length})</h3>
      ${STATE.tests.length===0 ? '<div class="empty">Nessun test creato</div>' :
        STATE.tests.slice().reverse().map(t=>`
          <div style="border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;background:var(--chalk);">
            <div style="display:flex;justify-content:space-between;align-items:start;">
              <div>
                <h4 style="margin:0 0 6px 0;color:var(--pitch);font-size:13px;">${esc(t.name)}</h4>
                <span style="font-size:11px;color:var(--ink-soft);">${fmtDate(t.date)} | ${t.type}${t.unit ? ' (' + t.unit + ')' : ''} | ${t.results?.length||0} giocatori</span>
              </div>
              <div style="display:flex;gap:6px;">
                <button style="background:none;border:none;color:${selectedTestId===t.id?'var(--amber)':'var(--ink-soft)'};cursor:pointer;font-size:14px;" data-select-test="${t.id}">→</button>
                <button style="background:none;border:none;color:var(--clay);cursor:pointer;font-size:12px;" data-del-test="${t.id}">×</button>
              </div>
            </div>
            ${selectedTestId===t.id ? `
              <div style="border-top:1px solid var(--line);padding-top:12px;">
                <h4 style="margin:0 0 12px 0;font-size:13px;color:var(--pitch);">Inserisci valori test${t.unit ? ' (' + t.unit + ')' : ''}</h4>
                <table style="width:100%;border-collapse:collapse;">
                  <thead>
                    <tr style="background:var(--chalk);border-bottom:1px solid var(--line);">
                      <th style="text-align:left;padding:8px;font-size:12px;font-weight:600;color:var(--ink-soft);">Giocatore</th>
                      <th style="text-align:center;padding:8px;font-size:12px;font-weight:600;color:var(--ink-soft);">Valore</th>
                      <th style="text-align:center;padding:8px;font-size:12px;font-weight:600;color:var(--ink-soft);">Azioni</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${STATE.players.map(p=>{
                      const result = t.results?.find(r=>r.playerId===p.id);
                      return `
                        <tr data-player-row="${p.id}" style="border-bottom:1px solid #EEEAD9;">
                          <td style="padding:10px;font-size:13px;">${esc(p.name)}</td>
                          <td style="padding:10px;text-align:center;">
                            <input type="number" step="0.01" class="test-value-input" data-player-id="${p.id}" value="${result?.value||''}" placeholder="-" style="width:80px;padding:6px;border:1px solid var(--line);border-radius:4px;text-align:center;">
                          </td>
                          <td style="padding:10px;text-align:center;">
                            ${result ? 
                              `<button class="test-remove-btn" data-player-id="${p.id}" style="background:none;border:none;color:var(--clay);cursor:pointer;font-size:13px;font-weight:600;">×</button>` 
                              : `<button class="test-add-btn" data-player-id="${p.id}" style="background:none;border:none;color:var(--ok);cursor:pointer;font-size:13px;font-weight:600;">+</button>`
                            }
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
                <button class="btn" id="saveTestResultsBtn" style="margin-top:12px;">Salva Risultati</button>
              </div>
            ` : ''}
          </div>
        `).join('')}
    </div>
  `;
  
  const typeSelect = document.getElementById('testType');
  if(typeSelect){
    const updateUnit = ()=>{
      const spec = TEST_SPECS[typeSelect.value];
      if(!spec) return;   // valore non riconosciuto: non blocco la pagina
      const u = document.getElementById('testUnit');
      const d = document.getElementById('descDisplay');
      if(u) u.value = spec.unit;
      if(d) d.textContent = spec.description;
    };
    updateUnit();
    typeSelect.addEventListener('change', updateUnit);
  }
  
  if(document.getElementById('createTestBtn')){
    document.getElementById('createTestBtn').addEventListener('click', async ()=>{
      const name = document.getElementById('testName').value.trim();
      const type = document.getElementById('testType').value;
      const date = document.getElementById('testDate').value;
      if(!name){ showToast('Inserisci il nome del test'); return; }
      const spec = TEST_SPECS[type];
      STATE.tests.push({id:uid(), name, type, unit:(spec ? spec.unit : ''), date, results:[]});
      await saveKey('tests', STATE.tests);
      showToast('Test creato');
      render();
    });
  }
  
  el.querySelectorAll('[data-select-test]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      el.dataset.selectedTestId = el.dataset.selectedTestId===b.dataset.selectTest ? null : b.dataset.selectTest;
      renderTest(el);
    });
  });
  
  el.querySelectorAll('[data-del-test]').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Sei sicuro di voler eliminare questo test? L\'azione non può essere annullata.')) return;
      STATE.tests = STATE.tests.filter(t=>t.id!==b.dataset.delTest);
      await saveKey('tests', STATE.tests);
      renderTest(el);
    });
  });
  
  // New: handle test results with input fields
  if(selectedTest && document.getElementById('saveTestResultsBtn')){
    document.getElementById('saveTestResultsBtn').addEventListener('click', async ()=>{
      const inputs = el.querySelectorAll('.test-value-input');
      let count = 0;
      selectedTest.results = [];
      
      inputs.forEach(inp=>{
        const playerId = inp.dataset.playerId; // gli id sono testuali: niente parseInt
        const value = inp.value.trim();
        if(value){
          selectedTest.results.push({playerId, value: parseFloat(value)});
          count++;
        }
      });
      
      if(count === 0){
        showToast('Inserisci almeno un valore');
        return;
      }
      
      await saveKey('tests', STATE.tests);
      showToast(`${count} risultati salvati`);
      renderTest(el);
    });

    // Add giocatore button - focus input
    el.querySelectorAll('.test-add-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const playerId = btn.dataset.playerId;
        const input = el.querySelector(`.test-value-input[data-player-id="${playerId}"]`);
        if(input) {
          input.focus();
          input.select();
        }
      });
    });

    // Remove giocatore button
    el.querySelectorAll('.test-remove-btn').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        if(!confirm('Sei sicuro di voler rimuovere questo giocatore dal test?')) return;
        const playerId = btn.dataset.playerId;
        const input = el.querySelector(`.test-value-input[data-player-id="${playerId}"]`);
        if(input) input.value = '';
        if(selectedTest.results){
          selectedTest.results = selectedTest.results.filter(r=>r.playerId!==playerId);
          await saveKey('tests', STATE.tests);
          showToast('Giocatore rimosso');
          renderTest(el);
        }
      });
    });
  }
}

          <div></div>
        </div>

      const teamsPlayersDiv = document.getElementById('wTeamsPlayersDiv');
      
      const updateTeamsInputs = ()=>{
        const numTeams = parseInt(numTeamsInput.value)||1;
        let html = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px;">';
        for(let i=0; i<numTeams; i++){
          html += `<div><label>Squadra ${i+1} giocatori</label><input class="wTeamPlayers" type="number" min="1" value="${i===0?3:2}" data-team="${i}"></div>`;
        }
        html += '</div>';
        teamsPlayersDiv.innerHTML = html;
        
        const teamInputs = teamsPlayersDiv.querySelectorAll('.wTeamPlayers');
        teamInputs.forEach(inp=>inp.addEventListener('input', updateCalculations));
        updateCalculations();
      };
      
      const updateCalculations = ()=>{
        const teamInputs = document.querySelectorAll('.wTeamPlayers');
        let totalPlayers = 0;
        teamInputs.forEach(inp=>totalPlayers += parseInt(inp.value)||1);
        
        document.getElementById('wTotalPlayers').value = totalPlayers;
        
        const length = parseInt(document.getElementById('wFieldLength').value)||1;
        const width = parseInt(document.getElementById('wFieldWidth').value)||1;
        const totalArea = length * width;
        const mpp = totalPlayers>0 ? Math.round(totalArea / totalPlayers * 10) / 10 : 0;
        document.getElementById('wSquareMetersPerPlayer').value = mpp;
        
        const series = parseInt(document.getElementById('wSeries').value)||1;
        const minutesPerSeries = parseInt(document.getElementById('wMinutesPerSeries').value)||1;
        const recovery = parseInt(document.getElementById('wRecovery').value)||0;
        const totalDuration = (series * minutesPerSeries) + ((series-1) * recovery);
        document.getElementById('wTotalDuration').value = totalDuration;
      };
      
      numTeamsInput.addEventListener('change', updateTeamsInputs);
      document.getElementById('wFieldLength').addEventListener('input', updateCalculations);
      document.getElementById('wFieldWidth').addEventListener('input', updateCalculations);
      document.getElementById('wSeries').addEventListener('input', updateCalculations);
      document.getElementById('wMinutesPerSeries').addEventListener('input', updateCalculations);
      document.getElementById('wRecovery').addEventListener('input', updateCalculations);
      
      updateTeamsInputs();
      
    }else if(category==='Atletico'){
      const params = ATHLETIC_PARAMS[type] || {fields: []};

/* ---------- CALENDARIO (Sessioni) ---------- */
/* Helper functions for matches */
function getTodayEvents(){
  const today = todayStr();
  return STATE.events.filter(e => e.date === today && e.type === 'Partita');
}

function getNextMatch(){
  const today = todayStr();
  return STATE.events.find(e => e.date >= today && e.type === 'Partita' && e.date !== today) || null;
}

function getLastMatch(){
  const today = todayStr();
  return STATE.events.slice().reverse().find(e => e.date < today && e.type === 'Partita') || null;
}

function getMatchStats(match){
  const stats = {
    goals: {},
    assists: {},
    lineup: {}
  };
  /* Formato nuovo: eventi in match.events con type 'goal' o 'assist'. Se manca, ricado sui vecchi array. */
  if(Array.isArray(match.events) && match.events.length){
    match.events.forEach(evt => {
      if(evt.type === 'goal'){
        stats.goals[evt.playerId] = (stats.goals[evt.playerId] || 0) + 1;
      } else if(evt.type === 'assist'){
        stats.assists[evt.playerId] = (stats.assists[evt.playerId] || 0) + 1;
      }
    });
  } else {
    if(match.goals){
      match.goals.forEach(g => {
        stats.goals[g.playerId] = (stats.goals[g.playerId] || 0) + 1;
      });
    }
    if(match.assists){
      match.assists.forEach(a => {
        stats.assists[a.playerId] = (stats.assists[a.playerId] || 0) + 1;
      });
    }
  }
  /* Anche qui uso il calcolo al volo, con fallback su match.lineup per compatibilita' */
  if(Array.isArray(match.starters) && match.starters.length > 0){
    const calc = computeMatchMinutes(match);
    Object.keys(calc).forEach(pid=>{
      stats.lineup[pid] = {playerId: pid, minutes: calc[pid].minutes, status: calc[pid].status};
    });
  } else if(match.lineup){
    match.lineup.forEach(l => {
      stats.lineup[l.playerId] = l;
    });
  }
  return stats;
}

function getMatchesAroundDate(date){
  const matches = STATE.events.filter(e=>e.type==='Partita').sort((a,b)=>a.date.localeCompare(b.date));
  const before = matches.reverse().find(m=>m.date<date) || null;
  const after = matches.find(m=>m.date>date) || null;
  return {before, after};
}

function calculateMD(date){
  const {before, after} = getMatchesAroundDate(date);
  
  // Se non c'è nessuna partita
  if(!before && !after) return null;
  
  // Solo partita precedente
  if(before && !after) {
    const daysAfter = Math.floor((new Date(date) - new Date(before.date)) / (1000*60*60*24));
    return `MD+${daysAfter}`;
  }
  
  // Solo partita successiva
  if(!before && after) {
    const daysBefore = Math.floor((new Date(after.date) - new Date(date)) / (1000*60*60*24));
    return `MD-${daysBefore}`;
  }
  
  // Entrambe le partite: formato MD+X/-Y
  const daysAfterBefore = Math.floor((new Date(date) - new Date(before.date)) / (1000*60*60*24));
  const daysBeforeAfter = Math.floor((new Date(after.date) - new Date(date)) / (1000*60*60*24));
  return `MD+${daysAfterBefore}/-${daysBeforeAfter}`;
}

function getTodayWorkout(){
  const today = todayStr();
  return STATE.events.find(e => e.date === today && e.type === 'Allenamento') || null;
}

function isGoalkeeper(p){
  return (p.role || '').toLowerCase().indexOf('portiere') !== -1;
}

function getPlayersOfMovement(){
  return STATE.players.filter(p => !isGoalkeeper(p));
}

function getGoalkeepers(){
  return STATE.players.filter(p => isGoalkeeper(p));
}

/* Un giocatore puo' segnare la presenza solo se e' Disponibile */
function canMarkPresence(player){
  return player && player.status === 'Disponibile';
}

/* Riepilogo completo della presenza per un evento */
function getPresenceBreakdown(eventId){
  const event = STATE.events.find(e => e.id === eventId);
  const present = (event && Array.isArray(event.presentPlayers)) ? event.presentPlayers : [];
  const isIn = p => present.includes(p.id);

  const movement = getPlayersOfMovement();
  const keepers = getGoalkeepers();

  const movAvail = movement.filter(p => p.status === 'Disponibile');
  const keepAvail = keepers.filter(p => p.status === 'Disponibile');

  return {
    presentIds: present,
    movement: {
      available: movAvail,
      present: movAvail.filter(isIn),
      absent: movAvail.filter(p => !isIn(p)),
      injured: movement.filter(p => p.status === 'Infortunato'),
      returning: movement.filter(p => p.status === 'RTP' || p.status === 'In valutazione' || p.status === 'In rientro')
    },
    keepers: {
      available: keepAvail,
      present: keepAvail.filter(isIn),
      absent: keepAvail.filter(p => !isIn(p)),
      injured: keepers.filter(p => p.status === 'Infortunato'),
      returning: keepers.filter(p => p.status === 'RTP' || p.status === 'In valutazione' || p.status === 'In rientro')
    }
  };
}

function getTodayPresenceCount(eventId){
  const b = getPresenceBreakdown(eventId);
  return {
    present: b.movement.present.length + b.keepers.present.length,
    total: b.movement.available.length + b.keepers.available.length
  };
}

function isPlayerPresentToday(playerId){
  const todayEvent = getTodayWorkout();
  if(!todayEvent || !Array.isArray(todayEvent.presentPlayers)) return null;
  return todayEvent.presentPlayers.includes(playerId);
}

async function setPlayerPresence(eventId, playerId, present){
  const event = STATE.events.find(e => e.id === eventId);
  if(!event) return false;
  if(!Array.isArray(event.presentPlayers)) event.presentPlayers = [];
  const idx = event.presentPlayers.indexOf(playerId);
  if(present && idx === -1) event.presentPlayers.push(playerId);
  if(!present && idx !== -1) event.presentPlayers.splice(idx, 1);
  event.presentCount = event.presentPlayers.length;
  await saveKey('events', STATE.events);
  return true;
}

/* ---------- CONVOCAZIONI ---------- */
function isConvocato(event, playerId){
  return !!(event && Array.isArray(event.convocati) && event.convocati.includes(String(playerId)));
}

/* La prossima partita per cui il giocatore risulta convocato o escluso */
function getNextMatchForPlayer(playerId){
  const today = todayStr();
  const future = STATE.events
    .filter(e => e.type === 'Partita' && e.date && e.date >= today && Array.isArray(e.convocati))
    .sort((a,b) => String(a.date).localeCompare(String(b.date)));
  return future[0] || null;
}

async function toggleConvocato(eventId, playerId){
  const event = STATE.events.find(e => e.id === eventId);
  if(!event) return;
  if(!Array.isArray(event.convocati)) event.convocati = [];
  const id = String(playerId);
  const i = event.convocati.indexOf(id);
  if(i === -1) event.convocati.push(id); else event.convocati.splice(i, 1);
  await saveKey('events', STATE.events);
}

/* ---------- FORMAZIONE GRAFICA (SVG + click-to-place) ----------
   Il modello dati:
   - match.starters: array di playerId dei titolari (esisteva gia', continuo a usarlo per non rompere niente)
   - match.formationSlots: mappa { slotIdx -> playerId } che fissa la posizione grafica del titolare
     Se un giocatore e' in starters ma non ha slot assegnato, viene mostrato "senza posizione" sotto al campo
   Le sostituzioni continuano a vivere in match.substitutions: il subentrante prende il posto grafico dell'uscente. */

/* Iniziali di un nome per il pallino sul campo (max 2 lettere) */
function playerInitials(name){
  if(!name) return '?';
  const parts = String(name).trim().split(/\s+/);
  if(parts.length === 1) return parts[0].substring(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

/* Cognome di un giocatore per l'etichetta sotto al pallino */
function playerShortLabel(name){
  if(!name) return '';
  const parts = String(name).trim().split(/\s+/);
  return (parts.length > 1 ? parts[parts.length-1] : parts[0]).substring(0,10);
}

/* Chi occupa uno slot in questo momento, considerando le sostituzioni */
function currentPlayerInSlot(match, slotIdx){
  const slots = match.formationSlots || {};
  const originalPid = slots[slotIdx];
  if(!originalPid) return null;
  const subs = (match.substitutions || []).slice().sort((a,b)=>(a.minute||0)-(b.minute||0));
  let currentPid = String(originalPid);
  let subbedOut = false;
  for(const sw of subs){
    if(String(sw.outPlayerId) === currentPid){
      currentPid = String(sw.inPlayerId);
      subbedOut = true;
    }
  }
  const reds = match.redCards || [];
  const wasRed = reds.some(r => String(r.playerId) === currentPid);
  return {playerId: currentPid, originalPlayerId: String(originalPid), subbedOut, wasRed};
}

/* Disegna il campo con gli slot del modulo selezionato */
function renderPitchSVG(match){
  const modulo = match.modulo;
  const formation = FORMATIONS[modulo];
  if(!formation){
    return '<div style="padding:24px;text-align:center;font-size:12.5px;color:var(--ink-soft);background:#F7F5EC;border-radius:8px;border:1px dashed var(--line);">Seleziona un modulo dall\'elenco per disegnare la formazione sul campo.</div>';
  }
  let svg = `<svg viewBox="0 0 100 100" style="width:100%;max-width:360px;height:auto;display:block;margin:0 auto;background:linear-gradient(180deg,#2F7A4E 0%,#276941 100%);border-radius:8px;border:2px solid var(--pitch-dark);" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="2" width="96" height="96" fill="none" stroke="white" stroke-width="0.4" opacity="0.85"/>
    <line x1="2" y1="50" x2="98" y2="50" stroke="white" stroke-width="0.3" opacity="0.85"/>
    <circle cx="50" cy="50" r="7" fill="none" stroke="white" stroke-width="0.3" opacity="0.85"/>
    <circle cx="50" cy="50" r="0.6" fill="white" opacity="0.85"/>
    <rect x="25" y="84" width="50" height="14" fill="none" stroke="white" stroke-width="0.3" opacity="0.85"/>
    <rect x="37" y="92" width="26" height="6" fill="none" stroke="white" stroke-width="0.3" opacity="0.85"/>
    <rect x="25" y="2" width="50" height="14" fill="none" stroke="white" stroke-width="0.3" opacity="0.85"/>
    <rect x="37" y="2" width="26" height="6" fill="none" stroke="white" stroke-width="0.3" opacity="0.85"/>`;

  formation.forEach((pos, i)=>{
    const occ = currentPlayerInSlot(match, i);
    let fill = 'rgba(255,255,255,0.14)', stroke = 'rgba(255,255,255,0.7)', strokeDash = '1.2 1.2', label = '+', name = '', textColor = 'white';
    if(occ){
      const pl = STATE.players.find(x => String(x.id) === String(occ.playerId));
      if(pl){
        label = playerInitials(pl.name);
        name = playerShortLabel(pl.name);
        strokeDash = '';
        if(occ.wasRed){
          fill = '#B5473A'; stroke = 'white'; textColor = 'white';
        } else if(occ.subbedOut){
          fill = '#3F7A5C'; stroke = 'white'; textColor = 'white';
        } else {
          fill = '#C9922B'; stroke = 'white'; textColor = '#0E241C';
        }
      }
    }
    svg += `<g class="pitch-slot" data-slot-idx="${i}" style="cursor:pointer;">
      <circle cx="${pos.x}" cy="${pos.y}" r="5.8" fill="${fill}" stroke="${stroke}" stroke-width="0.7" stroke-dasharray="${strokeDash}"/>
      <text x="${pos.x}" y="${pos.y+0.3}" text-anchor="middle" dominant-baseline="central" font-size="3.4" font-weight="700" fill="${textColor}" style="pointer-events:none;font-family:Inter,sans-serif;">${label}</text>
      ${name ? `<text x="${pos.x}" y="${pos.y+9}" text-anchor="middle" font-size="2.6" font-weight="600" fill="white" style="pointer-events:none;font-family:Inter,sans-serif;paint-order:stroke;stroke:rgba(0,0,0,0.55);stroke-width:0.5;">${esc(name)}</text>` : ''}
    </g>`;
  });

  svg += '</svg>';

  /* Titolari senza slot: elenco sotto al campo, cosi' l'utente puo' assegnarli */
  const starters = Array.isArray(match.starters) ? match.starters.map(String) : [];
  const slotsMap = match.formationSlots || {};
  const assigned = new Set(Object.values(slotsMap).map(String));
  const unassigned = starters.filter(pid => !assigned.has(pid));
  let extra = '';
  if(unassigned.length){
    extra = `<div style="margin-top:10px;padding:8px 10px;background:#FFF8E7;border:1px solid var(--amber);border-radius:6px;font-size:11.5px;color:var(--ink);">
      <strong>Titolari senza posizione:</strong> ${unassigned.map(pid=>{
        const p = STATE.players.find(x => String(x.id) === pid);
        return p ? esc(p.name) : 'giocatore rimosso';
      }).join(', ')}<br>
      <span style="color:var(--ink-soft);font-size:10.5px;">Tocca una casella libera del campo per assegnare la posizione.</span>
    </div>`;
  }
  return svg + extra;
}

function updatePitchStarterCount(match){
  const el = document.getElementById('pitchStarterCount');
  if(!el) return;
  const n = Array.isArray(match.starters) ? match.starters.length : 0;
  el.textContent = n + ' / 11 in campo';
  el.style.color = n === 11 ? 'var(--ok)' : (n > 11 ? 'var(--clay)' : 'var(--ink-soft)');
}

/* Aggancia i click ai pallini del campo e apre il picker contestuale */
function bindPitchInteractions(match){
  const pitch = document.getElementById('pitchContainer');
  if(!pitch) return;
  pitch.querySelectorAll('.pitch-slot').forEach(g=>{
    g.addEventListener('click', ()=>{
      const idx = parseInt(g.dataset.slotIdx, 10);
      openPitchPicker(match, idx);
    });
  });
}

/* Picker inline: se lo slot e' vuoto mostra i convocati disponibili, filtrati per ruolo suggerito;
   se e' pieno mostra le azioni possibili (sostituzione, espulsione, rimozione). */
function openPitchPicker(match, slotIdx){
  const picker = document.getElementById('pitchPicker');
  if(!picker) return;
  const formation = FORMATIONS[match.modulo];
  if(!formation) return;

  const slotDef = formation[slotIdx];
  const occ = currentPlayerInSlot(match, slotIdx);

  const close = ()=>{ picker.style.display = 'none'; picker.innerHTML = ''; };

  if(!occ){
    /* Slot vuoto: mostro i convocati non ancora piazzati, ordinati per ruolo compatibile */
    const slotsMap = match.formationSlots || {};
    const assigned = new Set(Object.values(slotsMap).map(String));
    const convocati = (match.convocati || []).map(String);
    const candidateIds = convocati.length ? convocati : STATE.players.filter(p=>p.status==='Disponibile').map(p=>String(p.id));
    const candidates = candidateIds
      .filter(pid => !assigned.has(pid))
      .map(pid => STATE.players.find(p => String(p.id) === pid))
      .filter(Boolean)
      .sort((a,b)=>{
        /* Se lo slot e' portiere, i portieri vanno in cima */
        const aIsGK = /portiere/i.test(a.role||'');
        const bIsGK = /portiere/i.test(b.role||'');
        if(slotDef.r === 'P'){
          if(aIsGK && !bIsGK) return -1;
          if(!aIsGK && bIsGK) return 1;
        } else {
          if(aIsGK && !bIsGK) return 1;
          if(!aIsGK && bIsGK) return -1;
        }
        return String(a.name).localeCompare(String(b.name));
      });

    picker.innerHTML = `
      <div style="border:1px solid var(--amber);background:#FFFBEF;border-radius:8px;padding:12px;margin-top:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <strong style="font-size:12.5px;color:var(--pitch);">Assegna posizione: ${FORMATION_ROLE_LABELS[slotDef.r] || 'Giocatore'}</strong>
          <button type="button" class="btn secondary" id="pitchPickerCloseBtn" style="font-size:11px;padding:4px 10px;">Annulla</button>
        </div>
        ${candidates.length === 0
          ? '<div style="font-size:12px;color:var(--ink-soft);padding:8px 0;">Nessun convocato disponibile. Aggiungi convocati nella sezione qui sopra, oppure imposta lo stato dei giocatori su Disponibile.</div>'
          : `<div style="max-height:220px;overflow-y:auto;">
              ${candidates.map(p=>`
                <button type="button" class="pitch-assign-btn" data-player-id="${p.id}" style="width:100%;text-align:left;padding:8px 10px;margin-bottom:4px;background:white;border:1px solid var(--line);border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
                  <span style="font-size:12.5px;font-weight:600;">${esc(p.name)}</span>
                  <span style="font-size:10.5px;color:var(--ink-soft);">${esc(p.role || '—')}</span>
                </button>
              `).join('')}
            </div>`
        }
      </div>`;
    picker.style.display = 'block';

    document.getElementById('pitchPickerCloseBtn').addEventListener('click', close);
    picker.querySelectorAll('.pitch-assign-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const pid = btn.dataset.playerId;
        if(!match.formationSlots) match.formationSlots = {};
        match.formationSlots[slotIdx] = pid;
        /* Assicuro che sia tra i titolari */
        if(!Array.isArray(match.starters)) match.starters = [];
        if(!match.starters.map(String).includes(String(pid))) match.starters.push(pid);
        await saveKey('events', STATE.events);
        close();
        refreshPitch(match);
      });
    });
    return;
  }

  /* Slot pieno: azioni contestuali */
  const pl = STATE.players.find(x => String(x.id) === String(occ.playerId));
  const plName = pl ? pl.name : 'giocatore';
  const isPast = match.date && match.date < todayStr();
  picker.innerHTML = `
    <div style="border:1px solid var(--amber);background:#FFFBEF;border-radius:8px;padding:12px;margin-top:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong style="font-size:12.5px;color:var(--pitch);">${esc(plName)}${occ.subbedOut ? ' (entrato al posto di ' + esc((STATE.players.find(x=>String(x.id)===occ.originalPlayerId)||{}).name||'') + ')' : ''}</strong>
        <button type="button" class="btn secondary" id="pitchPickerCloseBtn" style="font-size:11px;padding:4px 10px;">Chiudi</button>
      </div>
      ${isPast ? `
        <div style="display:flex;flex-direction:column;gap:6px;">
          <button type="button" id="pitchActionSub" class="btn secondary" style="width:100%;text-align:left;font-size:12.5px;">Sostituisci al minuto...</button>
          <button type="button" id="pitchActionRed" class="btn secondary" style="width:100%;text-align:left;font-size:12.5px;color:var(--clay);">Espulsione (rosso) al minuto...</button>
          <button type="button" id="pitchActionRemove" class="btn secondary" style="width:100%;text-align:left;font-size:12.5px;">Rimuovi dalla formazione</button>
        </div>
      ` : `
        <div style="display:flex;flex-direction:column;gap:6px;">
          <button type="button" id="pitchActionRemove" class="btn secondary" style="width:100%;text-align:left;font-size:12.5px;">Rimuovi dalla formazione</button>
        </div>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:8px;">Sostituzioni ed espulsioni si registrano solo per partite gia' giocate.</div>
      `}
    </div>`;
  picker.style.display = 'block';

  document.getElementById('pitchPickerCloseBtn').addEventListener('click', close);

  const removeBtn = document.getElementById('pitchActionRemove');
  if(removeBtn){
    removeBtn.addEventListener('click', async ()=>{
      /* Se il giocatore era il titolare originale, rimuovo lo slot;
         se era subentrato, tolgo la sostituzione */
      if(String(occ.playerId) === String(occ.originalPlayerId)){
        if(match.formationSlots) delete match.formationSlots[slotIdx];
        if(Array.isArray(match.starters)){
          match.starters = match.starters.filter(pid => String(pid) !== String(occ.originalPlayerId));
        }
      } else if(Array.isArray(match.substitutions)){
        /* Rimuovo l'ultima sostituzione che ha portato in campo questo giocatore su questa catena */
        const idx = match.substitutions.findIndex(s => String(s.inPlayerId) === String(occ.playerId) && String(s.outPlayerId) === String(occ.originalPlayerId));
        if(idx !== -1) match.substitutions.splice(idx, 1);
      }
      await saveKey('events', STATE.events);
      close();
      refreshPitch(match);
    });
  }

  const subBtn = document.getElementById('pitchActionSub');
  if(subBtn){
    subBtn.addEventListener('click', ()=>{
      openPitchSubDialog(match, slotIdx, occ);
    });
  }

  const redBtn = document.getElementById('pitchActionRed');
  if(redBtn){
    redBtn.addEventListener('click', ()=>{
      openPitchRedDialog(match, slotIdx, occ);
    });
  }
}

/* Sostituzione: chiedo minuto + chi entra (fra i convocati non ancora in campo) */
function openPitchSubDialog(match, slotIdx, occ){
  const picker = document.getElementById('pitchPicker');
  if(!picker) return;
  const dur = matchDuration(match);
  const inField = new Set();
  const formation = FORMATIONS[match.modulo] || [];
  formation.forEach((_,i)=>{
    const cur = currentPlayerInSlot(match, i);
    if(cur) inField.add(String(cur.playerId));
  });
  const convocati = (match.convocati || []).map(String);
  const pool = convocati.length ? convocati : STATE.players.filter(p=>p.status==='Disponibile').map(p=>String(p.id));
  const bench = pool
    .filter(pid => !inField.has(pid))
    .map(pid => STATE.players.find(p => String(p.id) === pid))
    .filter(Boolean)
    .sort((a,b)=>String(a.name).localeCompare(String(b.name)));

  const outName = (STATE.players.find(x=>String(x.id)===String(occ.playerId))||{}).name || '';
  picker.innerHTML = `
    <div style="border:1px solid var(--amber);background:#FFFBEF;border-radius:8px;padding:12px;margin-top:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong style="font-size:12.5px;color:var(--pitch);">Sostituisci ${esc(outName)}</strong>
        <button type="button" class="btn secondary" id="pitchPickerCloseBtn" style="font-size:11px;padding:4px 10px;">Annulla</button>
      </div>
      <label style="font-size:11.5px;color:var(--ink-soft);">Minuto della sostituzione</label>
      <input type="number" id="pitchSubMinute" min="1" max="${dur}" value="60" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;">
      <label style="font-size:11.5px;color:var(--ink-soft);">Entra al suo posto</label>
      ${bench.length === 0
        ? '<div style="font-size:12px;color:var(--ink-soft);padding:6px 0;">Nessun sostituto disponibile in panchina.</div>'
        : `<select id="pitchSubIn" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;">
            ${bench.map(p=>`<option value="${p.id}">${esc(p.name)}${p.role?' — '+esc(p.role):''}</option>`).join('')}
          </select>
          <button type="button" id="pitchSubConfirm" class="btn" style="width:100%;">Conferma sostituzione</button>`
      }
    </div>`;
  document.getElementById('pitchPickerCloseBtn').addEventListener('click', ()=>{ picker.style.display='none'; picker.innerHTML=''; });
  const confirm = document.getElementById('pitchSubConfirm');
  if(confirm){
    confirm.addEventListener('click', async ()=>{
      const minute = parseInt(document.getElementById('pitchSubMinute').value, 10);
      const inId = document.getElementById('pitchSubIn').value;
      if(isNaN(minute) || minute < 1 || minute > dur){ showToast('Minuto non valido'); return; }
      if(!inId){ showToast('Scegli chi entra'); return; }
      if(!Array.isArray(match.substitutions)) match.substitutions = [];
      match.substitutions.push({
        id: 'sub_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
        minute,
        outPlayerId: String(occ.playerId),
        inPlayerId: String(inId)
      });
      await saveKey('events', STATE.events);
      picker.style.display='none'; picker.innerHTML='';
      refreshPitch(match);
      showToast('Sostituzione registrata');
    });
  }
}

/* Ridisegna il campo, aggiorna il conteggio titolari e riaggancia gli handler.
   NON ricarica l'intero modale, per non perdere lo scroll. */
function refreshPitch(match){
  const container = document.getElementById('pitchContainer');
  if(!container) return;
  container.innerHTML = renderPitchSVG(match);
  bindPitchInteractions(match);
  updatePitchStarterCount(match);
