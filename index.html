<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAM HUB PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch: #1A1A1A;
    --pitch-dark: #0D0D0D;
    --chalk: #F4F1E8;
    --paper: #FFFFFF;
    --amber: #C9922B;
    --amber-dark: #9C6E1C;
    --clay: #B5473A;
    --clay-soft: #F0DAD6;
    --ok: #404040;
    --line: #DCD6C4;
    --ink: #000000;
    --ink-soft: #333333;
    --radius: 10px;
    --radius-sm: 6px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--chalk);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:'Oswald',sans-serif;letter-spacing:0.01em;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}

  .app{display:flex;min-height:100vh;}
  .login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--pitch);color:var(--chalk);padding:20px;}
  .login-card{background:var(--paper);color:var(--ink);border-radius:var(--radius);padding:40px;max-width:380px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.2);}
  .login-card h1{margin-top:0;font-size:24px;text-align:center;color:var(--pitch);}
  .login-logo{width:72px;height:72px;border-radius:50%;background:var(--amber);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--pitch-dark);}
  .login-form label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;margin-top:12px;}
  .login-form input,.login-form select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;}
  .login-form input:focus,.login-form select:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}
  .login-btn{width:100%;padding:12px;background:var(--pitch);color:var(--chalk);border:none;border-radius:var(--radius-sm);font-weight:600;margin-top:18px;cursor:pointer;}
  .login-btn:hover{background:var(--pitch-dark);}

  .sidebar{width:220px;flex-shrink:0;background:var(--pitch);color:var(--chalk);display:flex;flex-direction:column;padding:20px 0;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 18px 20px 18px;border-bottom:1px solid rgba(244,241,232,0.14);margin-bottom:14px;}
  .brand-logo{width:38px;height:38px;border-radius:50%;background:var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;color:var(--pitch-dark);font-size:15px;}
  .brand-name{font-family:'Oswald';font-size:17px;font-weight:600;}
  .brand-sub{font-size:10.5px;color:#B9C6BC;text-transform:uppercase;letter-spacing:0.08em;}

  .nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;flex:1;}
  .nav-btn{display:flex;align-items:center;gap:11px;padding:10px 12px;border:none;background:transparent;color:#CFD8CC;border-radius:var(--radius-sm);text-align:left;font-size:14px;font-weight:500;transition:background 0.15s;}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0.35;flex-shrink:0;transition:all 0.15s;}
  .nav-btn.active .nav-dot{opacity:1;width:7px;height:7px;background:var(--pitch);}
  .nav-btn:hover .nav-dot{opacity:0.7;}
  .nav-btn:hover{background:rgba(244,241,232,0.08);}
  .nav-btn.active{background:var(--amber);color:var(--pitch-dark);font-weight:600;}

  .sidebar-foot{padding:12px 18px 0 18px;font-size:11px;color:#8DA095;border-top:1px solid rgba(244,241,232,0.1);margin-top:10px;padding-top:12px;}
  .logout-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(244,241,232,0.2);color:var(--chalk);padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;margin-top:8px;width:100%;}
  .logout-btn:hover{background:rgba(255,255,255,0.15);}

  .main{flex:1;padding:32px 40px;max-width:1200px;overflow-y:auto;}
  .page-head{margin-bottom:24px;}
  .page-head h1{font-size:26px;margin:0 0 4px 0;color:var(--pitch);}
  .page-head p{margin:0;color:var(--ink-soft);font-size:14px;}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .card h3{margin:0 0 14px 0;font-size:15px;color:var(--pitch);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;margin-top:12px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;color:var(--ink);
  }
  input[type=range]{
    width:100%;height:6px;border-radius:3px;background:var(--line);outline:none;-webkit-appearance:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--amber);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:18px;height:18px;border-radius:50%;background:var(--amber);cursor:pointer;border:none;
  }
  textarea{resize:vertical;min-height:60px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--pitch);background:var(--pitch);color:var(--chalk);font-size:13.5px;font-weight:600;}
  .btn:hover{background:var(--pitch-dark);}
  .btn.secondary{background:var(--paper);color:var(--pitch);border-color:var(--line);}
  .btn.secondary:hover{background:#F2EFE4;}
  .btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:8px 10px;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid #EEEAD9;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#FAF8F0;}

  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge.ok{background:#E3EFE7;color:var(--ok);}
  .badge.warn{background:#F7EAD3;color:var(--amber-dark);}
  .badge.bad{background:var(--clay-soft);color:var(--clay);}

  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .stat{flex:1;min-width:140px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:all 0.2s;}
  .stat:hover{border-color:var(--amber);box-shadow:0 2px 8px rgba(0,0,0,0.08);}
  .stat .num{font-family:'Oswald';font-size:28px;color:var(--pitch);}
  .stat .lbl{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}

  .workout-item{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;background:var(--chalk);}
  .workout-item h4{margin:0 0 6px 0;font-size:13px;color:var(--pitch);font-weight:600;}
  .workout-item-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;font-size:12px;margin-bottom:4px;}
  .workout-item-val{color:var(--amber);font-weight:600;}

  .session-exercise{border:1px solid var(--amber);border-left:4px solid var(--amber);padding:8px;margin-bottom:6px;background:#FFF9F0;font-size:12px;}
  .session-exercise-name{font-weight:600;color:var(--pitch);margin-bottom:2px;}
  .session-exercise-detail{color:var(--ink-soft);font-size:11px;}

  .checkbox-group{border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--chalk);max-height:300px;overflow-y:auto;}
  .checkbox-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #EEEAD9;}
  .checkbox-item:last-child{border-bottom:none;}
  .checkbox-item input{width:auto;margin:0;}
  .checkbox-item label{margin:0;font-weight:400;}

  /* DASHBOARD A RIQUADRI */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
  .tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;position:relative;overflow:hidden;}
  .tile.tap{cursor:pointer;}
  .tile.tap:hover{border-color:var(--amber);}
  .tile-lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);font-weight:700;margin-bottom:6px;}
  .tile-big{font-size:34px;font-weight:700;line-height:1;color:var(--pitch);font-family:'Oswald',sans-serif;}
  .tile-big small{font-size:15px;color:var(--ink-soft);font-weight:600;}
  .tile-sub{font-size:11px;color:var(--ink-soft);margin-top:5px;line-height:1.35;}
  .tile-accent{position:absolute;left:0;top:0;bottom:0;width:4px;}

  .alerts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-left-width:4px;border-radius:var(--radius-sm);cursor:pointer;}
  .alert:hover{background:#FAF8F0;}
  .alert-t{font-size:12.5px;font-weight:600;color:var(--pitch);line-height:1.3;}
  .alert-s{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .form-strip{display:flex;gap:5px;}
  .form-chip{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;font-family:'Oswald',sans-serif;cursor:pointer;}

  .mini-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;}

  @media(max-width:1100px){ .tiles{grid-template-columns:repeat(2,1fr);} .alerts{grid-template-columns:1fr;} }
  @media(max-width:560px){ .tiles{grid-template-columns:repeat(2,1fr);gap:8px;} .tile{padding:11px;} .tile-big{font-size:26px;} }

  /* BOLLETTINO STAMPABILE */
  #printSheet{display:none;}
  @media print{
    @page{ size:A4; margin:14mm; }
    html, body{background:white!important; margin:0!important; padding:0!important;}
    /* Nascondo tutto tranne il foglio di stampa. Usare :not e' piu' robusto
       che affidarsi alla sola specificita' del selettore #printSheet. */
    body > *:not(#printSheet){display:none!important;}
    /* Su iPhone Safari alcuni contenitori con position:fixed potrebbero comunque
       apparire. Li nascondo esplicitamente. */
    body > .app{display:none!important;}
    body > #root{display:none!important;}
    /* Nessun elemento generato dinamicamente deve sopravvivere alla stampa */
    body > div:not(#printSheet), body > section:not(#printSheet){display:none!important;}
    #printSheet{display:block!important;position:static!important;color:#000;font-family:'Inter',sans-serif;background:white!important;padding:0!important;margin:0!important;width:auto!important;visibility:visible!important;opacity:1!important;}
    #printSheet *{visibility:visible!important;}
    #printSheet .ps-head{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;}
    #printSheet h1{font-family:'Oswald',sans-serif;font-size:20pt;margin:0;letter-spacing:0.02em;}
    #printSheet .ps-date{font-size:10pt;text-align:right;}
    #printSheet h2{font-family:'Oswald',sans-serif;font-size:11pt;margin:14px 0 6px 0;text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid #999;padding-bottom:3px;}
    #printSheet .ps-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px;}
    #printSheet .ps-box{border:1px solid #000;padding:7px;}
    #printSheet .ps-box .n{font-family:'Oswald',sans-serif;font-size:19pt;line-height:1;}
    #printSheet .ps-box .l{font-size:7.5pt;text-transform:uppercase;letter-spacing:0.04em;}
    #printSheet .ps-box .s{font-size:8pt;color:#333;margin-top:3px;}
    #printSheet table{width:100%;border-collapse:collapse;font-size:9pt;}
    #printSheet th{text-align:left;border-bottom:1px solid #000;padding:3px 4px;font-size:7.5pt;text-transform:uppercase;}
    #printSheet td{padding:3px 4px;border-bottom:1px solid #ddd;}
    #printSheet .ps-alert{border-left:3px solid #000;padding:4px 8px;margin-bottom:4px;font-size:9pt;page-break-inside:avoid;}
    #printSheet .ps-foot{margin-top:16px;padding-top:6px;border-top:1px solid #999;font-size:7.5pt;color:#555;}
    #printSheet .ps-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    #printSheet .avoid{page-break-inside:avoid;}
  }

  /* MOBILE RESPONSIVE */
  @media(max-width:768px){
    .app{flex-direction:column;}
    .sidebar{width:100%;position:fixed;top:0;left:0;right:0;flex-direction:row;padding:10px;z-index:1000;height:auto;border-bottom:1px solid rgba(244,241,232,0.14);}
    .brand{padding:0 10px;margin-bottom:0;border-bottom:none;}
    .brand-logo{width:32px;height:32px;font-size:12px;}
    .brand-name{font-size:14px;}
    .brand-sub{font-size:9px;}
    .nav{flex-direction:row;flex:1;gap:5px;padding:0 5px;overflow-x:auto;}
    .nav-btn{padding:8px 10px;font-size:12px;gap:5px;}
    .nav-btn .nav-dot{width:5px;height:5px;}
    .sidebar-foot{padding:0;margin:0;border:none;font-size:0;}
    .sidebar-foot .role-label{display:none;}
    .logout-btn{width:auto;margin:0;padding:6px 10px;font-size:11px;white-space:nowrap;}
    .main{margin-top:60px;padding:20px 12px;}
    .page-head h1{font-size:22px;}
    .page-head p{font-size:12px;}
    .card{padding:14px;}
    .btn{padding:10px 14px;font-size:13px;}
    .grid2,.grid3{grid-template-columns:1fr;}
    input,select,textarea{font-size:16px;padding:10px;}
  }
  
  @media(max-width:480px){
    .sidebar{padding:8px 5px;}
    .brand{padding:0 5px;}
    .brand-logo{width:28px;height:28px;font-size:11px;}
    .brand-name{font-size:13px;}
    .nav-btn{padding:6px 8px;font-size:11px;}
    .main{margin-top:50px;padding:16px 10px;}
    .page-head h1{font-size:18px;}
    .card{padding:12px;margin-bottom:16px;}
    .btn{padding:12px;font-size:14px;width:100%;}
    .card h3{font-size:16px;}
    .card h4{font-size:13px;}
    .grid2,.grid3{grid-template-columns:1fr;gap:12px;}
    .workout-item-row{grid-template-columns:1fr;}
    input,select,textarea,button{font-size:16px;padding:12px;}
    .login-card{padding:20px 16px;}
    .login-card h1{font-size:18px;}
    .login-btn{padding:14px;}
  }
</style>

<script>
// Rete di sicurezza: invece della schermata bianca, mostra l'errore.
(function(){
  function mostraErrore(testo){
    var r = document.getElementById('root');
    if(!r) return;
    if(r.getAttribute('data-errore')) return;   // solo il primo
    r.setAttribute('data-errore','1');
    r.innerHTML =
      '<div style="font-family:-apple-system,sans-serif;max-width:640px;margin:40px auto;padding:24px;">' +
      '<h2 style="color:#B5473A;margin:0 0 8px 0;">L\'applicazione non e partita</h2>' +
      '<p style="color:#333;font-size:14px;">Mostra questo messaggio a chi ti assiste.</p>' +
      '<pre style="background:#F4F1E8;border:1px solid #DCD6C4;border-radius:6px;padding:12px;' +
      'font-size:12px;white-space:pre-wrap;word-break:break-word;">' + testo + '</pre>' +
      '<button onclick="location.reload()" style="padding:10px 16px;background:#1A1A1A;color:#fff;' +
      'border:none;border-radius:6px;font-weight:600;">Riprova</button></div>';
  }
  window.addEventListener('error', function(e){
    mostraErrore((e.message||'errore') + '\n' + (e.filename||'') + ' riga ' + (e.lineno||'?'));
  });
  window.addEventListener('unhandledrejection', function(e){
    mostraErrore('Promessa non gestita: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  // Se dopo 12 secondi non c'e' ancora nulla a schermo, qualcosa e' bloccato
  setTimeout(function(){
    var r = document.getElementById('root');
    if(r && r.innerHTML.trim().length < 40){
      mostraErrore('Nessuna risposta dopo 12 secondi.\nPossibile blocco nella connessione a Firestore.');
    }
  }, 12000);
})();
</script>

function sezioniConsentite(){
  if(STATE.role === 'admin') return SEZIONI.map(s=>s.id).concat(['impostazioni','impostazioniAdmin']);

    // Staff generico (login con codice "staff"): accesso completo, come prima
    return SEZIONI.map(s=>s.id).concat(['impostazioni']);
  }
  return [];
}

function puoAccedere(sezione){
  return sezioniConsentite().indexOf(sezione) !== -1;
}

/* ---------- ANALISI PERFORMANCE ----------
   Un numero da solo non dice niente: conta il confronto con se stessi,
   con la squadra e con il proprio ruolo. */

/* Per certi test il valore basso e' migliore (tempi), per altri il valore alto (salti, distanze) */
const TEST_LOWER_IS_BETTER = ['Sprint 20m','Sprint 30m','T-Test COD','Navetta 5-10-15m'];

function lowerIsBetter(tipo){
  return TEST_LOWER_IS_BETTER.indexOf(tipo) !== -1;
}

/* Tutti i risultati di un tipo di test, ordinati dal piu' recente */
function testResultsByType(tipo){
  const out = [];
  STATE.tests.filter(t => t.type === tipo).forEach(t=>{
    (t.results || []).forEach(r=>{
      if(typeof r.value === 'number' && !isNaN(r.value)){
        out.push({playerId: String(r.playerId), value: r.value, date: t.date, testId: t.id, testName: t.name});
      }
    });
  });
  return out.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}

/* Storico di un giocatore su un tipo di test */
function playerTestHistory(playerId, tipo){
  return testResultsByType(tipo).filter(r => r.playerId === String(playerId));
}

/* Il miglior risultato di sempre: record personale */
function personalBest(playerId, tipo){
  const st = playerTestHistory(playerId, tipo);
  if(st.length === 0) return null;
  return st.reduce((best, r)=>{
    if(!best) return r;
    return lowerIsBetter(tipo) ? (r.value < best.value ? r : best)
                               : (r.value > best.value ? r : best);
  }, null);
}

/* Quadro completo di un giocatore su un tipo di test */
function testSnapshot(playerId, tipo){
  const storia = playerTestHistory(playerId, tipo);
  if(storia.length === 0) return null;

  const ultimo = storia[0];
  const precedente = storia[1] || null;
  const record = personalBest(playerId, tipo);

  // Media di squadra sull'ultima rilevazione di ciascuno
  const perGiocatore = {};
  testResultsByType(tipo).forEach(r=>{ if(!perGiocatore[r.playerId]) perGiocatore[r.playerId] = r; });
  const valori = Object.keys(perGiocatore).map(k=>perGiocatore[k].value);
  const media = valori.length ? valori.reduce((a,b)=>a+b,0)/valori.length : null;

  const delta = precedente ? ultimo.value - precedente.value : null;
  const vsMedia = media !== null ? ultimo.value - media : null;
  const vsRecord = record ? ultimo.value - record.value : null;

  // Un miglioramento e' un calo sui tempi, un aumento sugli altri
  const migliorato = delta === null ? null : (lowerIsBetter(tipo) ? delta < 0 : delta > 0);
  // "meglioDellaMedia" invece di "sopra": su un tempo, sopra la media e' peggio
  const meglioDellaMedia = vsMedia === null ? null : (lowerIsBetter(tipo) ? vsMedia < 0 : vsMedia > 0);

  // Posizione in squadra
  const classifica = Object.keys(perGiocatore)
    .map(k=>({playerId:k, value:perGiocatore[k].value}))
    .sort((a,b)=> lowerIsBetter(tipo) ? a.value-b.value : b.value-a.value);
  const posizione = classifica.findIndex(x=>x.playerId === String(playerId)) + 1;

  return {
    ultimo, precedente, record, media,
    delta, migliorato, vsMedia, meglioDellaMedia, vsRecord,
    posizione, suTotale: classifica.length,
    rilevazioni: storia.length
  };
}

/* Media per ruolo: un centrale e un esterno non hanno gli stessi numeri */
function testMediaPerRuolo(tipo, ruolo){
  const perGiocatore = {};
  testResultsByType(tipo).forEach(r=>{ if(!perGiocatore[r.playerId]) perGiocatore[r.playerId] = r; });
  const valori = Object.keys(perGiocatore)
    .filter(pid=>{
      const p = STATE.players.find(x=>String(x.id)===pid);
      return p && p.role === ruolo;
    })
    .map(pid=>perGiocatore[pid].value);
  if(valori.length === 0) return null;
  return {media: valori.reduce((a,b)=>a+b,0)/valori.length, n: valori.length};
}

/* CMJ come sentinella della fatica neuromuscolare.
   Riferimento = miglior valore registrato. Un calo oltre il 10% e' un segnale. */
const CMJ_SOGLIA_ATTENZIONE = 5;   // percento
const CMJ_SOGLIA_ALLARME = 10;

function cmjFatica(playerId){
  const storia = playerTestHistory(playerId, 'CMJ');
  if(storia.length < 2) return null;
  const riferimento = personalBest(playerId, 'CMJ');
  const ultimo = storia[0];
  if(!riferimento || riferimento.value === 0) return null;

  const calo = ((riferimento.value - ultimo.value) / riferimento.value) * 100;
  let livello, etichetta, colore;
  if(calo >= CMJ_SOGLIA_ALLARME){ livello='allarme'; etichetta='Fatica neuromuscolare'; colore='var(--clay)'; }
  else if(calo >= CMJ_SOGLIA_ATTENZIONE){ livello='attenzione'; etichetta='Calo da verificare'; colore='var(--amber-dark)'; }
  else { livello='ok'; etichetta='Nella norma'; colore='var(--ok)'; }

  return {
    calo: Math.round(calo*10)/10,
    riferimento: riferimento.value,
    attuale: ultimo.value,
    data: ultimo.date,
    giorni: daysSince(ultimo.date),
    livello, etichetta, colore
  };
}

/* ---------- HOOPER INDEX ----------
   Scala 1-7 come in letteratura (Hooper & Mackinnon, 1995).
   Su ogni voce 1 = condizione migliore, 7 = condizione peggiore.
   Somma delle 4 voci: 4 = ottimo, 28 = pessimo. Alto = affaticato. */
const HOOPER_ITEMS = [
  {key:'sleep',   label:'Qualita del sonno',       low:'Ho dormito benissimo', high:'Non ho quasi dormito'},
  {key:'stress',  label:'Livello di stress',        low:'Per niente stressato', high:'Molto stressato'},
  {key:'fatigue', label:'Fatica generale',          low:'Pienamente riposato',  high:'Esausto'},
  {key:'soreness',label:'Indolenzimento muscolare', low:'Nessun dolore',        high:'Molto indolenzito'}
];

const HOOPER_MIN = 4;
const HOOPER_MAX = 28;

/* Fasce di lettura immediata sul punteggio grezzo 4-28 */
function hooperBand(score){
  if(score <= 8)  return {label:'Ottimo',    color:'var(--ok)',         advice:'Condizione ottimale'};
  if(score <= 12) return {label:'Buono',     color:'var(--ok)',         advice:'Nessun segnale critico'};
  if(score <= 17) return {label:'Discreto',  color:'var(--amber-dark)', advice:'Da tenere d\'occhio'};
  if(score <= 22) return {label:'Attenzione',color:'var(--clay)',       advice:'Valutare il carico'};
  return {label:'Critico', color:'var(--clay)', advice:'Confronto diretto con il giocatore'};
}

/* Percentuale di freschezza: 100% = pienamente pronto (HI 4), 0% = scarico (HI 28).
   Piu' intuitiva del punteggio grezzo: alta = sta bene, come una batteria. */
function hooperPercent(score){
  if(score === null || typeof score === 'undefined') return null;
  const pct = Math.round((28 - score) / 24 * 100);
  return Math.max(0, Math.min(100, pct));
}

/* Compatibilita': le voci vecchie usavano muscles/mood su scala 1-5 */
function hooperScore(entry){
  if(!entry) return null;
  if(entry.scale === 7 || (typeof entry.fatigue !== 'undefined' && typeof entry.soreness !== 'undefined')){
    return (entry.sleep||0) + (entry.stress||0) + (entry.fatigue||0) + (entry.soreness||0);
  }
  return null; // voce con la vecchia scala: non confrontabile, non la mescolo
}

function isLegacyHooper(entry){
  return entry && hooperScore(entry) === null;
}

/* Giorni di indisponibilita': fino alla data di rientro, o fino a oggi se ancora aperto */
function injuryDaysLost(inj){
  if(!inj || !inj.dateStart) return 0;
  const fine = inj.dateEnd || todayStr();
  const a = new Date(inj.dateStart + 'T00:00:00');
  const b = new Date(fine + 'T00:00:00');
  return Math.max(0, Math.round((b - a) / 86400000));
}

function getInjuries(playerId){
  const list = STATE.injuries || [];
  const filtered = playerId ? list.filter(i => String(i.playerId) === String(playerId)) : list;
  return filtered.slice().sort((a,b)=>String(b.dateStart).localeCompare(String(a.dateStart)));
}

function getOpenInjuries(playerId){
  return getInjuries(playerId).filter(i => i.status !== 'risolto');
}

/* Zona corporea semplificata, per capire dove si concentrano i problemi */
function zonaSemplice(zona){
  return String(zona || '')
    .replace(/\s*(Destr[ao]|Sinistr[ao]|Centrale)\s*$/i, '')
    .trim() || 'Non indicata';
}

/* Quante volte la squadra si e' fatta male nella stessa zona */
function infortuniPerZona(){
  const mappa = {};
  getInjuries().forEach(i=>{
    const z = zonaSemplice(i.zone);
    if(!mappa[z]) mappa[z] = {zona:z, n:0, giorni:0, giocatori:{}};
    mappa[z].n++;
    mappa[z].giorni += injuryDaysLost(i);
    mappa[z].giocatori[String(i.playerId)] = true;
  });
  return Object.keys(mappa).map(z=>({
    zona: z, n: mappa[z].n, giorni: mappa[z].giorni,
    giocatori: Object.keys(mappa[z].giocatori).length
  })).sort((a,b)=> b.n - a.n || b.giorni - a.giorni);
}

/* Ricadute: stessa zona, stesso giocatore, piu' di una volta */
function ricadute(){
  const mappa = {};
  getInjuries().forEach(i=>{
    const k = String(i.playerId) + '|' + zonaSemplice(i.zone);
    if(!mappa[k]) mappa[k] = [];
    mappa[k].push(i);
  });
  return Object.keys(mappa).filter(k => mappa[k].length > 1).map(k=>{
    const [pid, zona] = k.split('|');
    return {
      player: STATE.players.find(p=>String(p.id)===pid),
      zona, episodi: mappa[k].length,
      giorni: mappa[k].reduce((a,i)=>a+injuryDaysLost(i),0)
    };
  }).sort((a,b)=>b.episodi-a.episodi);
}

/* Quadro dell'infermeria */
function quadroInfermeria(){
  const aperti = getOpenInjuries();
  const totGiorni = getInjuries().reduce((a,i)=>a+injuryDaysLost(i),0);
  const stagione = getInjuries().length;
  const indisponibili = STATE.players.filter(p=>p.status !== 'Disponibile');
  const doloriAperti = STATE.players.reduce((a,p)=>a + getOpenPainIssues(p.id).length, 0);
  return {aperti, totGiorni, stagione, indisponibili, doloriAperti};
}

function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('it-IT', {day:'2-digit', month:'short', year:'numeric'});
}
function calcAge(birthDateStr){
  const today = new Date();
  const birth = new Date(birthDateStr);
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if(m<0 || (m===0 && today.getDate()<birth.getDate())) age--;
  return age;
}
function daysAgo(n){
  const d = new Date();
  d.setDate(d.getDate()-n);
  return d.toISOString().slice(0,10);
}

// ========== STORAGE FUNCTIONS (localStorage + Firestore) ==========
async function saveKey(key, value){
  // PROTEZIONE: se il caricamento iniziale e' fallito, lo stato in memoria
  // non rappresenta i dati veri. Scrivere ora li cancellerebbe.
  if(LOAD_FAILED){
    console.error('SCRITTURA BLOCCATA per', key, '- il caricamento iniziale era fallito');
    showToast('Dati non caricati correttamente: ricarica la pagina prima di salvare');
    return false;
  }

  // Salva sempre la copia locale
  try{
    localStorage.setItem(key, JSON.stringify(value));
  }catch(e){
    console.error('Errore salvataggio locale:', e.message);
  }

  if(db && TEAM_ID){
    try{
      await db.collection('teams').doc(TEAM_ID).collection('data').doc(key).set({
        value: value,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        playerId: STATE.currentPlayerId || 'admin'
      });
      return true;
    }catch(e){
      console.error('Salvataggio su Firestore fallito:', e.message);
      showToast('Salvataggio non riuscito: controlla la connessione');
      return false;
    }
  }
  return true;
}

/* Stato dell'ultima lettura: serve a non scrivere quando non si e' letto */
let LOAD_FAILED = false;
const LOAD_STATUS = {};

async function loadKey(key, fallback){
  // Distinguo tre casi: dato letto, documento assente, lettura fallita.
  // Confonderli significa sovrascrivere dati veri con un array vuoto.
  if(db && TEAM_ID){
    try{
      const doc = await db.collection('teams').doc(TEAM_ID).collection('data').doc(key).get();
      if(doc.exists && typeof doc.data().value !== 'undefined'){
        const result = doc.data().value;
        try{ localStorage.setItem(key, JSON.stringify(result)); }catch(e){}
        return result;
      }
      // Documento assente davvero: nessun dato salvato per questa chiave
      LOAD_STATUS[key] = 'vuoto';
      return fallback;
    }catch(e){
      console.error('LETTURA FALLITA per', key, '-', e.message);
      LOAD_STATUS[key] = 'errore';
      LOAD_FAILED = true;
    }
  } else {
    LOAD_STATUS[key] = 'errore';
    LOAD_FAILED = true;
  }

  // Riserva locale: meglio dei dati vecchi che nessun dato
  try{
    const stored = localStorage.getItem(key);
    if(stored){
      console.warn('Uso la riserva locale per', key);
      return JSON.parse(stored);
    }
  }catch(e){}

  return fallback;
}

}

/* ============================================================
   GRAFICI CARTESIANI SVG
   Sistema di grafici custom, senza dipendenze esterne.
   Funzioni:
   - lineChartSVG: linea temporale, singola o multipla
   - barChartSVG: barre verticali
   - stackedBarChartSVG: barre impilate per categorie
   Ogni grafico e' responsive (viewBox), touch-friendly.
   ============================================================ */

/* Funzioni utili condivise */
function _chartFormatDate(d){
  if(!d) return '';
  const parts = String(d).split('-');
  if(parts.length >= 3) return parts[2] + '/' + parts[1];
  return d;
}

function _chartNiceScale(min, max, ticks){
  if(min === max){ min = min - 1; max = max + 1; }
  const range = max - min;
  const rough = range / (ticks || 5);
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  let step;
  if(norm < 1.5) step = 1 * mag;
  else if(norm < 3) step = 2 * mag;
  else if(norm < 7) step = 5 * mag;
  else step = 10 * mag;
  const niceMin = Math.floor(min / step) * step;
  const niceMax = Math.ceil(max / step) * step;
  const values = [];
  for(let v = niceMin; v <= niceMax + step*0.001; v += step) values.push(Math.round(v * 1000) / 1000);
  return {min: niceMin, max: niceMax, values, step};
}

/* Linea temporale con uno o piu' dataset.
   Uso: lineChartSVG({series: [{name, color, data:[{x,y}]}], height, yLabel, yMin, yMax, zones}) */
function lineChartSVG(opts){
  const s = opts.series || [];
  const height = opts.height || 220;
  const width = 800;   /* viewBox width, il grafico e' comunque responsive */
  const padL = 40, padR = 20, padT = 20, padB = 42;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;

  /* Determina il dominio X (tutte le date uniche ordinate) */
  const xValues = [];
  s.forEach(serie => (serie.data || []).forEach(p => { if(xValues.indexOf(p.x) === -1) xValues.push(p.x); }));
  xValues.sort();
  if(xValues.length === 0){
    return `<div style="padding:30px;text-align:center;font-size:12px;color:var(--ink-soft);background:#F7F5EC;border-radius:6px;">Dati insufficienti per il grafico.</div>`;
  }

  /* Y auto scala */
  let allY = [];
  s.forEach(serie => (serie.data || []).forEach(p => { if(p.y != null && !isNaN(p.y)) allY.push(p.y); }));
  if(allY.length === 0){
    return `<div style="padding:30px;text-align:center;font-size:12px;color:var(--ink-soft);background:#F7F5EC;border-radius:6px;">Nessun valore da rappresentare.</div>`;
  }
  const yMinRaw = opts.yMin != null ? opts.yMin : Math.min(...allY);
  const yMaxRaw = opts.yMax != null ? opts.yMax : Math.max(...allY);
  const scale = _chartNiceScale(yMinRaw, yMaxRaw, 5);
  const yMin = scale.min, yMax = scale.max;

  const xPos = i => padL + (xValues.length === 1 ? plotW/2 : (i / (xValues.length - 1)) * plotW);
  const yPos = v => padT + plotH - ((v - yMin) / (yMax - yMin || 1)) * plotH;

  /* Zone colorate di sfondo (es. zona rischio ACWR) */
  let zonesHTML = '';
  if(Array.isArray(opts.zones)){
    opts.zones.forEach(z => {
      const y1 = yPos(z.max);
      const y2 = yPos(z.min);
      zonesHTML += `<rect x="${padL}" y="${y1}" width="${plotW}" height="${y2 - y1}" fill="${z.color}" opacity="0.14"/>`;
    });
  }

  /* Griglia orizzontale + label Y */
  let gridHTML = '';
  scale.values.forEach(v=>{
    const y = yPos(v);
    gridHTML += `<line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="#E5E1D5" stroke-width="1"/>`;
    gridHTML += `<text x="${padL - 6}" y="${y + 3}" font-size="9" text-anchor="end" fill="#8A8578" font-family="Inter,sans-serif">${v}</text>`;
  });

  /* Label X: mostro solo alcune date per non affollare */
  let xLabelsHTML = '';
  const maxLabels = 8;
  const stepLabels = Math.max(1, Math.ceil(xValues.length / maxLabels));
  xValues.forEach((x, i)=>{
    if(i % stepLabels === 0 || i === xValues.length - 1){
      const px = xPos(i);
      xLabelsHTML += `<text x="${px}" y="${height - padB + 14}" font-size="9" text-anchor="middle" fill="#8A8578" font-family="Inter,sans-serif">${_chartFormatDate(x)}</text>`;
    }
  });

  /* Linee dei dataset */
  let seriesHTML = '';
  let legendHTML = '';
  s.forEach(serie => {
    const color = serie.color || 'var(--pitch)';
    const data = (serie.data || []).filter(p => p.y != null && !isNaN(p.y));
    if(data.length === 0) return;
    /* Path */
    const points = data.map(p => ({x: xPos(xValues.indexOf(p.x)), y: yPos(p.y)}));
    let d = '';
    points.forEach((pt, i) => {
      d += (i === 0 ? 'M' : 'L') + pt.x + ' ' + pt.y + ' ';
    });
    if(data.length > 1){
      seriesHTML += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="${serie.opacity != null ? serie.opacity : 0.95}"/>`;
    }
    /* Punti */
    points.forEach((pt, i) => {
      seriesHTML += `<circle cx="${pt.x}" cy="${pt.y}" r="3" fill="${color}" stroke="white" stroke-width="1.5"><title>${esc(serie.name || '')} — ${_chartFormatDate(data[i].x)}: ${data[i].y}</title></circle>`;
    });
    if(serie.name){
      legendHTML += `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:11px;color:var(--ink);"><span style="display:inline-block;width:11px;height:3px;background:${color};border-radius:2px;"></span>${esc(serie.name)}</span>`;
    }
  });

  const yLabelHTML = opts.yLabel ? `<text x="8" y="${padT + plotH/2}" font-size="10" fill="#8A8578" text-anchor="middle" transform="rotate(-90 8 ${padT + plotH/2})" font-family="Inter,sans-serif">${esc(opts.yLabel)}</text>` : '';

  return `
    ${legendHTML ? `<div style="margin-bottom:6px;">${legendHTML}</div>` : ''}
    <svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block;" preserveAspectRatio="none">
      ${zonesHTML}
      ${gridHTML}
      <line x1="${padL}" y1="${padT + plotH}" x2="${width - padR}" y2="${padT + plotH}" stroke="#5C5648" stroke-width="1.2"/>
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#5C5648" stroke-width="1.2"/>
      ${xLabelsHTML}
      ${yLabelHTML}
      ${seriesHTML}
    </svg>
  `;
}

/* Grafico a barre verticali.
   Uso: barChartSVG({data:[{label, value, color?}], height, yLabel, yMax?}) */
function barChartSVG(opts){
  const data = opts.data || [];
  const height = opts.height || 220;
  const width = 800;
  const padL = 40, padR = 16, padT = 16, padB = 46;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;

  if(data.length === 0){
    return `<div style="padding:30px;text-align:center;font-size:12px;color:var(--ink-soft);background:#F7F5EC;border-radius:6px;">Nessun dato.</div>`;
  }

  const maxVal = opts.yMax != null ? opts.yMax : Math.max(...data.map(d=>d.value||0), 1);
  const scale = _chartNiceScale(0, maxVal, 5);
  const yMax = scale.max;

  const barW = Math.max(4, plotW / data.length * 0.72);
  const gap = (plotW - barW * data.length) / (data.length + 1);

  let gridHTML = '';
  scale.values.forEach(v=>{
    const y = padT + plotH - (v / yMax) * plotH;
    gridHTML += `<line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="#E5E1D5" stroke-width="1"/>`;
    gridHTML += `<text x="${padL - 6}" y="${y + 3}" font-size="9" text-anchor="end" fill="#8A8578" font-family="Inter,sans-serif">${v}</text>`;
  });

  let barsHTML = '';
  data.forEach((d, i) => {
    const x = padL + gap + i * (barW + gap);
    const h = ((d.value || 0) / yMax) * plotH;
    const y = padT + plotH - h;
    const color = d.color || 'var(--pitch)';
    barsHTML += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${color}" opacity="0.9" rx="2"><title>${esc(d.label || '')}: ${d.value}</title></rect>`;
    /* Valore in cima alla barra (se sopra la soglia) */
    if(h > 20){
      barsHTML += `<text x="${x + barW/2}" y="${y - 4}" font-size="9" text-anchor="middle" fill="#5C5648" font-family="Inter,sans-serif">${d.value}</text>`;
    }
    /* Label sotto */
    const rot = data.length > 8 ? `transform="rotate(-30 ${x + barW/2} ${height - padB + 12})"` : '';
    barsHTML += `<text x="${x + barW/2}" y="${height - padB + 14}" font-size="9" text-anchor="${data.length > 8 ? 'end' : 'middle'}" fill="#8A8578" font-family="Inter,sans-serif" ${rot}>${esc(String(d.label || '').substring(0, 12))}</text>`;
  });

  const yLabelHTML = opts.yLabel ? `<text x="8" y="${padT + plotH/2}" font-size="10" fill="#8A8578" text-anchor="middle" transform="rotate(-90 8 ${padT + plotH/2})" font-family="Inter,sans-serif">${esc(opts.yLabel)}</text>` : '';

  return `
    <svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block;" preserveAspectRatio="none">
      ${gridHTML}
      <line x1="${padL}" y1="${padT + plotH}" x2="${width - padR}" y2="${padT + plotH}" stroke="#5C5648" stroke-width="1.2"/>
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#5C5648" stroke-width="1.2"/>
      ${yLabelHTML}
      ${barsHTML}
    </svg>
  `;
}

/* ============================================================
   ESTRAZIONE SERIE TEMPORALI PER GRAFICI
   ============================================================ */

function _analyticsDateRange(days){
  const dates = [];
  const today = new Date(todayStr() + 'T00:00:00');
  for(let i = days - 1; i >= 0; i--){
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    dates.push(d.toISOString().slice(0,10));
  }
  return dates;
}

function serieACWRGiocatore(playerId, days){
  const dates = _analyticsDateRange(days || 60);
  const pid = String(playerId);
  const entries = STATE.rpeLog.filter(r => String(r.playerId) === pid);
  return dates.map(dateStr => {
    const target = new Date(dateStr + 'T00:00:00').getTime();
    const day = 86400000;
    const acuto = entries
      .filter(r => { const t = new Date(r.date + 'T00:00:00').getTime(); return t <= target && t > target - 7*day; })
      .reduce((s,r)=>s + Number(r.rpe||0)*Number(r.minutes||0), 0);
    const cronico28 = entries
      .filter(r => { const t = new Date(r.date + 'T00:00:00').getTime(); return t <= target && t > target - 28*day; })
      .reduce((s,r)=>s + Number(r.rpe||0)*Number(r.minutes||0), 0);
    const cronico = cronico28 / 4;
    if(cronico === 0) return {x: dateStr, y: null};
    return {x: dateStr, y: Math.round((acuto / cronico) * 100) / 100};
  }).filter(p => p.y != null);
}

function serieACWRSquadra(days){
  const dates = _analyticsDateRange(days || 60);
  const rosa = STATE.players.filter(p => !isPortiere(p));
  return dates.map(dateStr => {
    const acwrs = [];
    rosa.forEach(p => {
      const target = new Date(dateStr + 'T00:00:00').getTime();
      const day = 86400000;
      const entries = STATE.rpeLog.filter(r => String(r.playerId) === String(p.id));
      const acuto = entries
        .filter(r => { const t = new Date(r.date + 'T00:00:00').getTime(); return t <= target && t > target - 7*day; })
        .reduce((s,r)=>s + Number(r.rpe||0)*Number(r.minutes||0), 0);
      const cronico28 = entries
        .filter(r => { const t = new Date(r.date + 'T00:00:00').getTime(); return t <= target && t > target - 28*day; })
        .reduce((s,r)=>s + Number(r.rpe||0)*Number(r.minutes||0), 0);
      const cronico = cronico28 / 4;
      if(cronico > 0) acwrs.push(acuto / cronico);
    });
    if(acwrs.length === 0) return {x: dateStr, y: null};
    const avg = acwrs.reduce((s,v)=>s+v,0) / acwrs.length;
    return {x: dateStr, y: Math.round(avg * 100) / 100};
  }).filter(p => p.y != null);
}

function serieWellnessGiocatore(playerId, days){
  const dates = _analyticsDateRange(days || 60);
  const pid = String(playerId);
  const log = STATE.hooperLog.filter(h => String(h.playerId) === pid && !isLegacyHooper(h));
  return dates.map(dateStr => {
    const h = log.find(x => x.date === dateStr);
    if(!h) return {x: dateStr, y: null};
    return {x: dateStr, y: hooperPercent(hooperScore(h))};
  }).filter(p => p.y != null);
}

function serieWellnessSquadra(days){
  const dates = _analyticsDateRange(days || 60);
  /* Rosa: tutti i giocatori di movimento (portieri esclusi). NON filtro per stato attuale,
     altrimenti i dati storici di chi ora è infortunato/RTP escono dalla media, e il grafico
     appare praticamente vuoto. Non filtro nemmeno per statusAtEntry: nella media di squadra
     entrano tutti i wellness registrati dai giocatori di movimento, indipendentemente dallo
     stato al momento della compilazione. Cosi' il grafico ha piu' dati. */
  const rosa = STATE.players.filter(p => !isPortiere(p));
  return dates.map(dateStr => {
    const scores = [];
    rosa.forEach(p => {
      const h = STATE.hooperLog.find(x => String(x.playerId) === String(p.id) && x.date === dateStr && !isLegacyHooper(x));
      if(h) scores.push(hooperPercent(hooperScore(h)));
    });
    if(scores.length === 0) return {x: dateStr, y: null};
    return {x: dateStr, y: Math.round(scores.reduce((s,v)=>s+v,0) / scores.length)};
  }).filter(p => p.y != null);
}

function serieRPEGiocatore(playerId, days){
  const pid = String(playerId);
  const soglia = new Date(todayStr() + 'T00:00:00').getTime() - (days || 60) * 86400000;
  return STATE.rpeLog
    .filter(r => String(r.playerId) === pid && r.source !== 'plan')
    .filter(r => new Date(r.date + 'T00:00:00').getTime() >= soglia)
    .sort((a,b) => String(a.date).localeCompare(String(b.date)))
    .map(r => ({x: r.date, y: Number(r.rpe || 0)}));
}

function serieRPESquadra(days){
  const soglia = new Date(todayStr() + 'T00:00:00').getTime() - (days || 60) * 86400000;
  const bySession = {};
  STATE.rpeLog.filter(r => r.source !== 'plan').forEach(r => {
    if(new Date(r.date + 'T00:00:00').getTime() < soglia) return;
    const p = STATE.players.find(x => String(x.id) === String(r.playerId));
    if(!p || isPortiere(p)) return;
    const key = r.sessionId || r.date;
    if(!bySession[key]) bySession[key] = {date: r.date, rpes: []};
    bySession[key].rpes.push(Number(r.rpe || 0));
  });
  /* Un punto per ogni sessione (o data se non c'e' sessionId). Nessuna soglia minima:
     se una sessione ha solo 1-2 RPE, il punto lo mostro comunque, cosi' l'utente vede
     tutti i dati raccolti. Il grafico "pochi dati" tipicamente riflette una realta':
     non tutti compilano l'RPE, soprattutto delle partite (per cui il flusso di
     inserimento e' comparso solo dalla v1.7). */
  return Object.values(bySession)
    .map(g => ({x: g.date, y: Math.round(g.rpes.reduce((s,v)=>s+v,0) / g.rpes.length * 10) / 10}))
    .sort((a,b) => String(a.x).localeCompare(String(b.x)));
}

function serieMinutiPerSettimana(playerId, weeks){
  const pid = String(playerId);
  const n = weeks || 10;
  const today = new Date(todayStr() + 'T00:00:00');
  const dayOfWeek = today.getDay();
  const thisSunday = new Date(today);
  thisSunday.setDate(today.getDate() + (7 - dayOfWeek) % 7);
  const buckets = [];
  for(let w = n - 1; w >= 0; w--){
    const end = new Date(thisSunday); end.setDate(end.getDate() - w * 7);
    const start = new Date(end); start.setDate(end.getDate() - 6);
    const startStr = start.toISOString().slice(0,10);
    const endStr = end.toISOString().slice(0,10);
    let minuti = 0;
    STATE.events.filter(e => e.type === 'Partita' && e.date >= startStr && e.date <= endStr).forEach(m => {
      if(Array.isArray(m.starters) && m.starters.length > 0){
        const calc = computeMatchMinutes(m);
        if(calc[pid]) minuti += calc[pid].minutes;
      } else if(Array.isArray(m.lineup)){
        const row = m.lineup.find(l => String(l.playerId) === pid);
        if(row) minuti += row.minutes || 0;
      }
    });
    buckets.push({label: end.getDate() + '/' + (end.getMonth()+1), value: minuti});
  }
  return buckets;
}

/* Ritorna SVG con silhouette + hotspot cliccabili colorati.
   dati = {zoneName: count}. onZoneClick opzionale. */
function bodyMapSVG(dati, opts){
  const options = opts || {};
  const maxCount = Math.max(1, ...Object.values(dati || {}).map(v=>v||0));

  /* Colore hotspot: da giallo chiaro (1 infortunio) a rosso scuro (max) */
  const colorFor = n => {
    if(!n) return null;
    const intensity = n / maxCount;
    if(intensity <= 0.33) return '#F4C542';
    if(intensity <= 0.66) return '#E67B25';
    return '#B5473A';
  };

  const renderHotspots = (view) => {
    return Object.entries(BODY_MAP_COORDS)
      .filter(([_, c]) => c.view === view)
      .map(([zone, c]) => {
        const n = (dati || {})[zone] || 0;
        const col = colorFor(n);
        const outlineCol = n > 0 ? col : '#C9C4B4';
        const fillCol = n > 0 ? col : 'transparent';
        const opacity = n > 0 ? 0.85 : 0.5;
        return `<g class="body-hotspot" data-zone="${esc(zone)}" style="cursor:${options.interactive ? 'pointer' : 'default'};">
          <circle cx="${c.x}" cy="${c.y}" r="${c.r}" fill="${fillCol}" stroke="${outlineCol}" stroke-width="1.5" opacity="${opacity}"><title>${esc(zone)}${n>0?': '+n+' infortun'+(n===1?'io':'i'):''}</title></circle>
          ${n > 1 ? `<text x="${c.x}" y="${c.y + 2}" font-size="7" font-weight="700" text-anchor="middle" fill="white" style="pointer-events:none;font-family:Inter,sans-serif;">${n}</text>` : ''}
        </g>`;
      }).join('');
  };

  return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:520px;margin:0 auto;">
      <div style="text-align:center;">
        <div style="font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;">Frontale</div>

      <span><span style="display:inline-block;width:10px;height:10px;background:#B5473A;border-radius:50%;vertical-align:middle;margin-right:4px;"></span>${Math.max(3, Math.ceil(maxCount*0.66)+1)}+ casi</span>

function calcWorkoutDuration(workout){
  if(workout.category==='Tecnico-tattico'){
    const series = workout.series || 1;
    const minutesPerSeries = workout.minutesPerSeries || 1;
    const recovery = workout.recovery || 0;
    return (series * minutesPerSeries) + ((series-1) * recovery);
  }
  if(workout.category==='Atletico'){
    const type = workout.type;
    if(type==='Riscaldamento coordinativo' || type==='Core stability e propriocezione' || type==='Forza resistente' || type==='Potenza metabolica ed High-Intensity Interval Training (HIIT)' || type==='Lavoro intermittente'){
      return (workout.series * workout.minutesPerSeries) + ((workout.series-1) * workout.recovery);
    }else if(type==='Speed & Agility (Velocità pura)' || type==='Cambi di direzione (COD)' || type==='Forza massima'){
      return (workout.series * 1) + ((workout.series-1) * workout.recovery);
    }else if(type==='Riscaldamento generale (Warm-up)' || type==='Prevenzione infortuni (Screening e protocolli)' || type==='Resistenza aerobica a secco' || type==='Rigenerazione e scarico (Recovery)'){
      return workout.minutes || 0;
    }else if(type.startsWith('Test')){
      return 0; // Test non hanno durata calcolata
    }
  }
  return 0;
}

function getSessionDuration(session){
  if(!session.workoutIds) return 0;
  return session.workoutIds.reduce((sum, wid)=>{
    const w = STATE.workouts.find(wo=>wo.id===wid);
    return sum + (w ? calcWorkoutDuration(w) : 0);
  }, 0);
}

function playerLoadStats(playerId){
  const entries = STATE.rpeLog.filter(r=>r.playerId===playerId);
  const acuteFrom = daysAgo(7), chronicFrom = daysAgo(28);
  
  let acute = entries.filter(e=>e.date>=acuteFrom).reduce((s,e)=>{
    const evt = STATE.events.find(ev=>ev.id===e.sessionId);
    const duration = evt ? getSessionDuration(evt) : 0;
    return s+(e.rpe*duration);
  },0);
  
  const chronicSum = entries.filter(e=>e.date>=chronicFrom).reduce((s,e)=>{
    const evt = STATE.events.find(ev=>ev.id===e.sessionId);
    const duration = evt ? getSessionDuration(evt) : 0;
    return s+(e.rpe*duration);
  },0);
  
  const chronicWeekly = chronicSum/4;
  const acwr = chronicWeekly>0 ? (acute/chronicWeekly) : (acute>0?2:0);
  return {acute, chronicWeekly, acwr};
}

/* Confronta la media degli ultimi N giorni con quella dei N precedenti.
   Sul punteggio grezzo un calo = miglioramento, quindi inverto il segno per la lettura. */
function getHooperTrend(playerId, windowDays){
  const win = windowDays || 7;
  const entries = getHooperEntries(playerId);
  if(entries.length < 2) return null;

  const today = new Date(todayStr() + 'T00:00:00');
  const dayDiff = d => Math.round((today - new Date(d + 'T00:00:00')) / 86400000);

  const recent = entries.filter(e => dayDiff(e.date) < win);
  const previous = entries.filter(e => { const d = dayDiff(e.date); return d >= win && d < win*2; });
  if(recent.length === 0 || previous.length === 0) return null;

  const avg = arr => arr.reduce((sum,e)=> sum + hooperScore(e), 0) / arr.length;
  const recentAvg = avg(recent);
  const previousAvg = avg(previous);
  const delta = recentAvg - previousAvg; // positivo = punteggio salito = sta peggio

  let direction, label, color;
  if(Math.abs(delta) < 1.5){
    direction = 'stable'; label = 'Stabile'; color = 'var(--ink-soft)';
  } else if(delta < 0){
    direction = 'better'; label = 'In miglioramento'; color = 'var(--ok)';
  } else {
    direction = 'worse'; label = 'In peggioramento'; color = 'var(--clay)';
  }

  return {
    direction, label, color,
    delta: Math.round(delta * 10) / 10,
    // Variazione in punti di freschezza: piu' leggibile del punteggio grezzo.
    // Un calo di punteggio (miglioramento) diventa un +% di freschezza.
    deltaPercent: Math.round((hooperPercent(recentAvg) - hooperPercent(previousAvg))),
    recentAvg: Math.round(recentAvg * 10) / 10,
    previousAvg: Math.round(previousAvg * 10) / 10,
    recentPercent: hooperPercent(recentAvg),
    previousPercent: hooperPercent(previousAvg),
    recentCount: recent.length,
    previousCount: previous.length,
    windowDays: win
  };
}

  HOOPER_ITEMS.forEach(it => {

    if(!worst || v > worst.value) worst = {key:it.key, label:it.label, value:v};
  });
  return worst;
}

    giocatori: renderGiocatori,
    performance: renderPerformance,
    medica: renderMedica,
    allenamenti: renderAllenamenti,
    calendario: renderCalendario,
    impostazioni: renderImpostazioni,
  };
  const playerRenderers = {
    wellness: renderWellness,
    calendario: renderPlayerCalendario,
    piani: renderPianiGiocatore,
    profilo: renderProfiloGiocatore,
  };
  const adminRenderers = {
    dashboard: renderDashboard,
    giocatori: renderGiocatori,
    performance: renderPerformance,
    medica: renderMedica,
    allenamenti: renderAllenamenti,
    calendario: renderCalendario,
    impostazioni: renderImpostazioni,
    impostazioniAdmin: renderImpostazioniAdmin,
  };
  const renderers = STATE.role==='staff' ? staffRenderers : STATE.role==='admin' ? adminRenderers : playerRenderers;

  // Uno staff non puo' aprire una sezione non sua, nemmeno per via diretta
  if(STATE.role === 'staff' && !puoAccedere(STATE.page)){
    const primaConsentita = sezioniConsentite()[0] || 'dashboard';
    STATE.page = primaConsentita;
  }

  (renderers[STATE.page]||renderDashboard)(content);
}

const DEVICE_CODE_KEY = 'thp-device-code';
const LOGIN_FAIL_KEY = 'thp-login-fails';
const MAX_LOGIN_ATTEMPTS = 5;

/* Dopo 5 errori l'attesa cresce: 30s, 60s, 120s... fino a 15 minuti */
function loginLockRemaining(){
  try{
    const raw = localStorage.getItem(LOGIN_FAIL_KEY);
    if(!raw) return 0;
    const st = JSON.parse(raw);
    if(!st || st.count < MAX_LOGIN_ATTEMPTS) return 0;
    const extra = st.count - MAX_LOGIN_ATTEMPTS;
    const waitMs = Math.min(30000 * Math.pow(2, extra), 900000);
    const remaining = st.last + waitMs - Date.now();
    return remaining > 0 ? Math.ceil(remaining / 1000) : 0;
  }catch(e){ return 0; }
}

function registerFailedLogin(){
  try{
    const raw = localStorage.getItem(LOGIN_FAIL_KEY);
    const st = raw ? JSON.parse(raw) : {count:0, last:0};
    st.count = (st.count || 0) + 1;
    st.last = Date.now();
    localStorage.setItem(LOGIN_FAIL_KEY, JSON.stringify(st));
    return st.count;
  }catch(e){ return 0; }
}

function clearFailedLogins(){
  try{ localStorage.removeItem(LOGIN_FAIL_KEY); }catch(e){}
}

const CODE_LENGTH = 6;

/* Sequenze troppo facili da tirare a indovinare: mai assegnarle */
const WEAK_CODES = [
  '000000','111111','222222','333333','444444','555555','666666','777777','888888','999999',
  '123456','654321','012345','543210','121212','123123','112233','101010','010101','696969',
  '111222','123321','456789','987654','200000','999000'
];

/* Estrazione casuale con il generatore crittografico del browser quando disponibile */
function randomDigits(n){
  let out = '';
  if(typeof crypto !== 'undefined' && crypto.getRandomValues){
    const buf = new Uint32Array(n);
    crypto.getRandomValues(buf);
    for(let i=0;i<n;i++) out += String(buf[i] % 10);
  } else {
    for(let i=0;i<n;i++) out += String(Math.floor(Math.random()*10));
  }
  return out;
}

function isWeakCode(code){
  if(WEAK_CODES.indexOf(code) !== -1) return true;
  // tutte cifre uguali
  if(/^(\d)\1{5}$/.test(code)) return true;
  // sei cifre consecutive crescenti o decrescenti
  let asc = true, desc = true;
  for(let i=1;i<code.length;i++){
    const d = Number(code[i]) - Number(code[i-1]);
    if(d !== 1) asc = false;
    if(d !== -1) desc = false;
  }
  return asc || desc;
}

/* Genera un codice a 6 cifre garantito diverso da tutti quelli gia' assegnati */
function generateAccessCode(taken){
  const used = {};
  const source = taken || (STATE.accessCodes || {});
  Object.keys(source).forEach(k => { used[normalizeCode(source[k])] = true; });

  for(let attempt=0; attempt<5000; attempt++){
    const c = randomDigits(CODE_LENGTH);
    if(used[c]) continue;
    if(isWeakCode(c)) continue;
    return c;
  }
  return null; // praticamente impossibile con 23 giocatori
}

/* Tiene solo le cifre: il giocatore puo' scrivere con spazi o trattini */
function normalizeCode(code){
  return String(code || '').replace(/\D/g, '');
}

/* Formato leggibile: 482 917 */
function formatCode(code){
  const c = normalizeCode(code);
  return c.length === 6 ? c.slice(0,3) + ' ' + c.slice(3) : c;
}

function getAccessCode(playerId){
  return (STATE.accessCodes && STATE.accessCodes[playerId]) || null;
}

function findPlayerByCode(code){
  const target = normalizeCode(code);
  if(!target || !STATE.accessCodes) return null;
  const ids = Object.keys(STATE.accessCodes);
  for(let i=0;i<ids.length;i++){
    if(normalizeCode(STATE.accessCodes[ids[i]]) === target) return String(ids[i]);
  }
  return null;
}

async function setAccessCode(playerId, code){
  const c = normalizeCode(code);
  if(c.length !== CODE_LENGTH){
    showToast('Errore nella generazione del codice');
    return false;
  }
  if(!STATE.accessCodes) STATE.accessCodes = {};
  STATE.accessCodes[playerId] = c;
  await saveKey('accessCodes', STATE.accessCodes);
  return true;
}

function showWellnessDetail(){
  const inMedia = [], fuoriMedia = [], senza = [], portieri = [];
  STATE.players.forEach(p=>{
    const hi = getLatestHooperIndex(p.id);
    if(!hi){ senza.push(p); return; }
    const r = {p, hi, trend: getHooperTrend(p.id, 7)};
    /* I portieri hanno una sezione a parte: individualmente visibili, fuori dalla media. */
    if(isPortiere(p) && countsInTeamStats(p) && entryCountsInTeamStats(hi.data)){
      portieri.push(r); return;
    }
    if(countsInTeamAggregate(p) && entryCountsInTeamStats(hi.data)) inMedia.push(r); else fuoriMedia.push(r);
  });
  inMedia.sort((a,b)=> b.hi.score - a.hi.score);
  fuoriMedia.sort((a,b)=> b.hi.score - a.hi.score);
  portieri.sort((a,b)=> b.hi.score - a.hi.score);

  const media = inMedia.length ? inMedia.reduce((a,x)=>a+x.hi.score,0)/inMedia.length : null;
  const mediaPortieri = portieri.length ? portieri.reduce((a,x)=>a+x.hi.score,0)/portieri.length : null;
  const disponibili = STATE.players.filter(countsInTeamAggregate).length;   /* denominatore senza portieri */
  const oggi = inMedia.filter(x=> daysSince(x.hi.date) === 0).length;

  const riga = (x, dentro)=>({
    playerId: x.p.id,
    name: x.p.name + (x.p.status !== 'Disponibile' ? ' · ' + statusMeta(x.p.status).label : ''),
    sub: (daysSince(x.hi.date) === 0 ? 'oggi' : daysSince(x.hi.date) === 1 ? 'ieri' : daysSince(x.hi.date) + ' giorni fa')
         + (dentro && media !== null ? ' · ' + (x.hi.score > media ? '+' : '') + (Math.round((x.hi.score - media)*10)/10) + ' rispetto alla media' : '')
         + (x.trend ? ' · ' + x.trend.label.toLowerCase() : ''),
    value: x.hi.score + '<span style="font-size:11px;color:var(--ink-soft);">/28</span>',
    color: x.hi.band.color,
    valueSub: x.hi.band.label

  showTileDetail({
    title: 'Wellness — Hooper Index',
    subtitle: 'Dal piu affaticato. Punteggio basso significa giocatore fresco.',
    summary: [
      {label:'Media dei disponibili', value: media !== null ? Math.round(media*10)/10 : '—',
       color: media !== null ? hooperBand(Math.round(media)).color : 'var(--ink-soft)',
       note: media !== null ? hooperBand(Math.round(media)).label : ''},
      {label:'Compilato oggi', value: oggi + '/' + disponibili},
      {label:'Fuori media', value: fuoriMedia.length, color: fuoriMedia.length ? 'var(--amber-dark)' : 'var(--ok)',
       note:'RTP, valutaz., infortunati'}
    ],
    sections: [
      {title:'Disponibili — fanno media', rows: inMedia.map(x=>riga(x,true))},
      {title:'Portieri (a parte' + (mediaPortieri !== null ? ' · media ' + Math.round(mediaPortieri*10)/10 : '') + ')', color:'var(--pitch)', rows: portieri.map(x=>riga(x,false))},
      {title:'Fuori media — monitorati', color:'var(--amber-dark)', rows: fuoriMedia.map(x=>riga(x,false))},
      {title:'Nessuna rilevazione', color:'var(--ink-soft)', rows: senza.map(p=>({
        playerId: p.id, name: p.name, sub: statusMeta(p.status).label, value:'—', color:'var(--ink-soft)'
      }))}

  });

function showAcwrDetail(){
  const conDati = [], pochiDati = [], fermi = [], portieriDati = [];
  STATE.players.forEach(p=>{
    const a = getACWR(p.id);
    if(!countsInTeamStats(p)){ fermi.push({p, a}); return; }
    /* I portieri restano visibili individualmente ma non contano nelle medie. */
    if(isPortiere(p)){
      if(a && !a.insufficient) portieriDati.push({p, a});

    if(a && !a.insufficient) conDati.push({p, a});

  portieriDati.sort((x,y)=> y.a.ratio - x.a.ratio);

function showRosaDetail(){
  const perStato = {};
  PLAYER_STATUSES.forEach(st=> perStato[st.value] = []);
  STATE.players.forEach(p=>{
    const k = perStato[p.status] ? p.status : 'Disponibile';
    perStato[k].push(p);
  });

  const eta = STATE.players.map(p=>calcAge(p.birthDate)).filter(a=> typeof a === 'number' && a > 0);
  const etaMedia = eta.length ? Math.round(eta.reduce((a,b)=>a+b,0)/eta.length*10)/10 : null;
  const disponibili = perStato['Disponibile'].length;

  showTileDetail({
    title: 'Rosa',
    subtitle: STATE.players.length + ' giocatori in organico',
    summary: [
      {label:'Disponibili', value: disponibili, color:'var(--ok)'},
      {label:'Non disponibili', value: STATE.players.length - disponibili, color: (STATE.players.length - disponibili) ? 'var(--clay)' : 'var(--ok)'},
      {label:'Eta media', value: etaMedia !== null ? etaMedia : '—'}
    ],
    sections: PLAYER_STATUSES.map(st=>({
      title: st.label, color: st.color,
      rows: perStato[st.value].sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(p=>{
        const hi = getLatestHooperIndex(p.id);
        const pain = getOpenPainIssues(p.id);
        const season = getSeasonStats(p.id);
        return {
          playerId: p.id,
          name: p.name,
          sub: (p.role || 'ruolo da assegnare')
               + (season.minutes ? ' · ' + season.minutes + ' min in stagione' : '')
               + (pain.length ? ' · ' + pain.length + ' dolore/i aperto/i' : '')
               + (st.needsDate && p.returnDate ? ' · rientro ' + fmtDate(p.returnDate) : ''),
          value: hi ? hi.score : '—',
          color: hi ? hi.band.color : 'var(--ink-soft)',
          valueSub: hi ? 'HI' : 'nessun HI'
        };
      })
    })),
    footer: 'Tocca un giocatore per aprire la sua scheda completa.'
  });
}

/* ---------- BOLLETTINO GIORNALIERO ----------
   Genera un foglio A4 e apre la stampa: da li' si salva come PDF. */
function buildDailyReport(){
  const dayNames = ['Domenica','Lunedi','Martedi','Mercoledi','Giovedi','Venerdi','Sabato'];
  const oggi = new Date(todayStr()+'T00:00:00');
  const workout = getTodayWorkout();
  const bd = workout ? getPresenceBreakdown(workout.id) : null;
  const pres = workout ? getTodayPresenceCount(workout.id) : null;
  const w = getTeamWellness();
  const alerts = getTeamAlerts();

  const results = getRecentResults(5);

  const acwrAll = STATE.players
    .filter(countsInTeamAggregate)   /* portieri esclusi dalle aggregate di squadra */
    .map(p => ({player:p, acwr:getACWR(p.id)}))
    .filter(x => x.acwr && !x.acwr.insufficient);
  const acwrRisk = acwrAll.filter(x => x.acwr.zone === 'high' || x.acwr.zone === 'warn')
    .sort((a,b)=>b.acwr.ratio - a.acwr.ratio);

  const nonDisponibili = STATE.players.filter(p => p.status !== 'Disponibile');
  const disponibili = STATE.players.length - nonDisponibili.length;

  // Elenco giocatori con i dati del giorno
  const righe = STATE.players.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(p=>{
    const hi = getLatestHooperIndex(p.id);
    const ac = getACWR(p.id);
    const pain = getOpenPainIssues(p.id);
    const presente = workout && Array.isArray(workout.presentPlayers) && workout.presentPlayers.includes(p.id);
    return {
      nome: p.name,
      ruolo: p.role || '-',
      stato: statusMeta(p.status).label,
      hi: hi ? hi.score : null,
      hiFresco: hi ? daysSince(hi.date) <= 1 : false,
      acwr: (ac && !ac.insufficient) ? ac.ratio : null,
      dolori: pain.length ? pain.map(i=>i.zone + ' ' + i.lastIntensity).join(', ') : '',
      presente: workout ? (presente ? 'SI' : (p.status === 'Disponibile' ? 'no' : '-')) : '-'
    };
  });

  return `
    <div class="ps-head">
      <div>
        <h1>${esc(STATE.teamConfig.name || 'Squadra')}</h1>
        <div style="font-size:9pt;letter-spacing:0.08em;text-transform:uppercase;">Bollettino giornaliero</div>
      </div>
      <div class="ps-date">
        <strong>${dayNames[oggi.getDay()]} ${fmtDate(todayStr())}</strong><br>
        ${workout ? esc(workout.title) + (workout.time ? ' &middot; ' + esc(workout.time) : '') : 'Nessuna sessione'}
      </div>
    </div>

    <div class="ps-kpi avoid">
      <div class="ps-box">
        <div class="l">Presenti</div>
        <div class="n">${workout ? pres.present + '/' + pres.total : '-'}</div>
        <div class="s">${workout ? bd.movement.present.length + '/' + bd.movement.available.length + ' mov. &middot; ' + bd.keepers.present.length + '/' + bd.keepers.available.length + ' port.' : 'nessuna sessione'}</div>
      </div>
      <div class="ps-box">
        <div class="l">Wellness</div>
        <div class="n">${w.avgOggi !== null ? w.avgOggi : '-'}</div>
        <div class="s">${w.bandOggi ? w.bandOggi.label + ' &middot; ' : ''}${w.compilatiOggi}/${w.attesiOggi} compilati</div>
      </div>
      <div class="ps-box">
        <div class="l">Disponibili</div>
        <div class="n">${disponibili}/${STATE.players.length}</div>
        <div class="s">${nonDisponibili.length ? nonDisponibili.length + ' fuori' : 'rosa al completo'}</div>
      </div>
      <div class="ps-box">
        <div class="l">ACWR oltre 1.3</div>
        <div class="n">${acwrAll.length ? acwrRisk.length : '-'}</div>
        <div class="s">${acwrAll.length ? acwrAll.length + ' monitorati' : 'dati insufficienti'}</div>
      </div>
    </div>

    ${alerts.length ? `
      <h2>Da controllare (${alerts.length})</h2>
      ${alerts.slice(0,10).map(a=>`
        <div class="ps-alert"><strong>${esc(a.text)}</strong><br><span style="color:#444;">${esc(a.sub)}</span></div>
      `).join('')}
    ` : '<h2>Da controllare</h2><div style="font-size:9pt;">Nessuna segnalazione.</div>'}

    <div class="ps-cols avoid">
      <div>
        ${nonDisponibili.length ? `
          <h2>Non disponibili</h2>
          <table>
            <thead><tr><th>Giocatore</th><th>Stato</th><th>Rientro</th></tr></thead>
            <tbody>
              ${nonDisponibili.map(p=>`<tr><td>${esc(p.name)}</td><td>${statusMeta(p.status).label}</td><td>${p.returnDate ? fmtDate(p.returnDate) : '-'}</td></tr>`).join('')}
            </tbody>
          </table>` : ''}
      </div>
      <div>
        ${results.length ? `
          <h2>Ultime partite</h2>
          <table>
            <thead><tr><th>Data</th><th>Partita</th><th>Ris.</th></tr></thead>
            <tbody>
              ${results.map(r=>`<tr><td>${fmtDate(r.match.date)}</td><td>${esc(r.match.title)}</td><td><strong>${r.esito} ${r.gf}-${r.ga}</strong></td></tr>`).join('')}
            </tbody>
          </table>` : ''}
      </div>
    </div>

    <h2>Quadro squadra</h2>
    <table>
      <thead>
        <tr><th>Giocatore</th><th>Ruolo</th><th>Stato</th><th>Fresch.</th><th>ACWR</th><th>Dolori aperti</th><th>Pres.</th></tr>
      </thead>
      <tbody>
        ${righe.map(r=>`
          <tr>
            <td>${esc(r.nome)}</td>
            <td>${esc(r.ruolo)}</td>
            <td>${esc(r.stato)}</td>
            <td>${r.hi !== null ? r.hi + (r.hiFresco ? '' : '*') : '-'}</td>
            <td>${r.acwr !== null ? r.acwr : '-'}</td>
            <td>${esc(r.dolori) || '-'}</td>
            <td>${r.presente}</td>
          </tr>`).join('')}
      </tbody>
    </table>

    <div class="ps-foot">
      Fresch. = freschezza (Hooper Index in percentuale): 100% pienamente pronto, 0% scarico. Passa sopra il valore per il punteggio grezzo.
      L'asterisco indica una rilevazione non aggiornata a oggi.
      ACWR = carico ultima settimana diviso media delle ultime quattro; zona ottimale fra 0.8 e 1.3.
      <br>Generato il ${fmtDate(todayStr())} alle ${new Date().toTimeString().slice(0,5)} &middot; Team Hub Pro &middot; documento a uso interno dello staff.
    </div>
  `;
}

function printDailyReport(){
  const old = document.getElementById('printSheet');
  if(old) old.remove();

  const sheet = document.createElement('div');
  sheet.id = 'printSheet';
  sheet.innerHTML = buildDailyReport();
  document.body.appendChild(sheet);

  const cleanup = ()=>{
    const el = document.getElementById('printSheet');
    if(el) el.remove();
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);

  // Lascia al browser il tempo di applicare gli stili di stampa (su mobile serve piu' tempo)
  setTimeout(()=>{
    window.print();
    setTimeout(cleanup, 1500);
  }, 300);
}

/* Helper generico: prepara un foglio stampabile con contenuto libero e stampa. */
function printGenericSheet(htmlContent){
  const old = document.getElementById('printSheet');
  if(old) old.remove();
  const sheet = document.createElement('div');
  sheet.id = 'printSheet';
  sheet.innerHTML = htmlContent;
  document.body.appendChild(sheet);
  const cleanup = ()=>{
    const el = document.getElementById('printSheet');
    if(el) el.remove();
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  setTimeout(()=>{
    window.print();
    setTimeout(cleanup, 1500);
  }, 300);
}

/* --- RECAP SINGOLA SESSIONE ---
   Allenamento: presenti, RPE per giocatore, esercitazioni, durata, differenziato.
   Partita: risultato, formazione, minuti, marcatori, sostituzioni, RPE. */
function printSessionRecap(eventId){
  const ev = STATE.events.find(e => e.id === eventId);
  if(!ev){ showToast('Sessione non trovata'); return; }
  const isMatch = ev.type === 'Partita';
  const rpes = STATE.rpeLog.filter(r => r.sessionId === ev.id && r.source !== 'plan');
  const avgRpe = rpes.length ? rpes.reduce((s,r)=>s+Number(r.rpe||0),0)/rpes.length : null;
  const load = rpes.reduce((s,r)=>s+Number(r.rpe||0)*Number(r.minutes||0),0);

  let bodyHtml = '';
  if(isMatch){
    /* PARTITA */
    const calc = (Array.isArray(ev.starters) && ev.starters.length) ? computeMatchMinutes(ev) : {};
    const lineup = Object.keys(calc).map(pid => {
      const p = STATE.players.find(x => String(x.id) === pid);
      return p ? {p, minutes: calc[pid].minutes, status: calc[pid].status} : null;
    }).filter(Boolean).sort((a,b) => b.minutes - a.minutes);

    const goals = (ev.events||[]).filter(x => x.type === 'goal');
    const assists = (ev.events||[]).filter(x => x.type === 'assist');

    bodyHtml = `
      <div class="ps-kpi avoid">
        <div class="ps-box"><div class="l">Risultato</div><div class="n">${ev.result ? ev.result.goalsFor + '-' + ev.result.goalsAgainst : '-'}</div><div class="s">${esc(ev.matchType||'')}</div></div>
        <div class="ps-box"><div class="l">Modulo</div><div class="n" style="font-size:16pt;">${esc(ev.modulo||'-')}</div><div class="s">${lineup.filter(l=>l.status==='starter').length}/11 titolari</div></div>
        <div class="ps-box"><div class="l">RPE medio</div><div class="n">${avgRpe !== null ? Math.round(avgRpe*10)/10 : '-'}</div><div class="s">${rpes.length} risp.</div></div>
        <div class="ps-box"><div class="l">Carico</div><div class="n">${Math.round(load)}</div><div class="s">UA</div></div>
      </div>

      ${lineup.length ? `
        <h2>Formazione e minuti</h2>
        <table>
          <thead><tr><th>Giocatore</th><th>Ruolo</th><th>Ingresso</th><th>Minuti</th></tr></thead>
          <tbody>
            ${lineup.map(l => `<tr><td>${esc(l.p.name)}</td><td>${esc(l.p.role||'-')}</td><td>${l.status === 'starter' ? 'Titolare' : 'Subentrato'}</td><td><strong>${l.minutes}</strong></td></tr>`).join('')}
          </tbody>
        </table>
      ` : ''}

      ${goals.length || assists.length ? `
        <h2>Marcatori e assist</h2>
        <table>
          <thead><tr><th>Min</th><th>Tipo</th><th>Giocatore</th></tr></thead>
          <tbody>
            ${(ev.events||[]).slice().sort((a,b)=>Number(a.minute)-Number(b.minute)).map(e => {
              const p = STATE.players.find(x => String(x.id) === String(e.playerId));
              return `<tr><td>${e.minute}'</td><td>${e.type === 'goal' ? 'Gol' : 'Assist'}</td><td>${p ? esc(p.name) : '-'}</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      ` : ''}

      ${(ev.substitutions||[]).length || (ev.redCards||[]).length ? `
        <h2>Cambi ed espulsioni</h2>
        <table>
          <thead><tr><th>Min</th><th>Evento</th></tr></thead>
          <tbody>
            ${[
              ...((ev.substitutions||[]).map(s => ({minute: s.minute, txt: 'Esce ' + (STATE.players.find(x=>String(x.id)===String(s.outPlayerId))||{name:'-'}).name + ', entra ' + (STATE.players.find(x=>String(x.id)===String(s.inPlayerId))||{name:'-'}).name}))),
              ...((ev.redCards||[]).map(r => ({minute: r.minute, txt: 'Rosso: ' + (STATE.players.find(x=>String(x.id)===String(r.playerId))||{name:'-'}).name})))
            ].sort((a,b)=>Number(a.minute)-Number(b.minute)).map(i => `<tr><td>${i.minute}'</td><td>${esc(i.txt)}</td></tr>`).join('')}
          </tbody>
        </table>
      ` : ''}
    `;
  } else {
    /* ALLENAMENTO */
    const durata = getSessionDuration(ev);
    const presenti = Array.isArray(ev.presentPlayers) ? ev.presentPlayers : [];
    const eserc = (ev.workoutIds || []).map(wid => STATE.workouts.find(w => w.id === wid)).filter(Boolean);

    bodyHtml = `
      <div class="ps-kpi avoid">
        <div class="ps-box"><div class="l">Durata</div><div class="n">${durata || '-'}</div><div class="s">minuti</div></div>
        <div class="ps-box"><div class="l">Presenti</div><div class="n">${presenti.length}</div><div class="s">${ev.md ? esc(ev.md) : ''}</div></div>
        <div class="ps-box"><div class="l">RPE medio</div><div class="n">${avgRpe !== null ? Math.round(avgRpe*10)/10 : '-'}</div><div class="s">${rpes.length} risp.</div></div>
        <div class="ps-box"><div class="l">Carico</div><div class="n">${Math.round(load)}</div><div class="s">UA</div></div>
      </div>

      ${eserc.length ? `
        <h2>Esercitazioni (${eserc.length})</h2>
        <table>
          <thead><tr><th>Nome</th><th>Tipo</th><th>Durata</th></tr></thead>
          <tbody>
            ${eserc.map(w => `<tr><td>${esc(w.name)}</td><td>${esc(w.type||'-')}</td><td>${calcWorkoutDuration(w)} min</td></tr>`).join('')}
          </tbody>
        </table>
      ` : ''}

      ${rpes.length ? `
        <h2>RPE per giocatore</h2>
        <table>
          <thead><tr><th>Giocatore</th><th>Minuti</th><th>RPE</th><th>Carico</th></tr></thead>
          <tbody>
            ${rpes.map(r => {
              const p = STATE.players.find(x => String(x.id) === String(r.playerId));
              return `<tr><td>${p ? esc(p.name) : '-'}</td><td>${r.minutes||0}</td><td><strong>${r.rpe}/10</strong></td><td>${Math.round(Number(r.rpe||0)*Number(r.minutes||0))}</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      ` : ''}
    `;
  }

  const dayNames = ['Domenica','Lunedi','Martedi','Mercoledi','Giovedi','Venerdi','Sabato'];
  const evDate = new Date(ev.date + 'T00:00:00');

  printGenericSheet(`
    <div class="ps-head">
      <div>
        <h1>${esc(ev.title || ev.type)}</h1>
        <div style="font-size:9pt;letter-spacing:0.08em;text-transform:uppercase;">${esc(ev.type)} · ${esc(STATE.teamConfig.name || 'Squadra')}</div>
      </div>
      <div class="ps-date"><strong>${dayNames[evDate.getDay()]} ${fmtDate(ev.date)}</strong>${ev.time ? '<br>' + esc(ev.time) : ''}</div>
    </div>
    ${bodyHtml}
  `);
}

function renderDashboard(el){
  /* Router: la dashboard cambia in base al ruolo dell'utente staff.
     - Admin e ruoli non riconosciuti vedono la dashboard completa (originale).
     - Allenatore e Vice vedono la dashboard "mister": prossima partita, formazione, disponibilita, risultati.
     - Preparatore atletico vede la dashboard "preparatore": ACWR, wellness, carico, prossima sessione.
     - Fisioterapista vede la dashboard "medica": infortuni, dolori, rientri, wellness in peggioramento.
     Ogni vista ha in fondo il link "Vista completa" per accedere alla dashboard piena. */
  if(STATE.role === 'staff' && STATE.currentStaff){
    const rk = STATE.currentStaff.roleKey;
    if(rk === 'Allenatore' || rk === 'Vice')  return renderDashboardMister(el);
    if(rk === 'Preparatore')                  return renderDashboardPreparatore(el);
    if(rk === 'Fisioterapista')               return renderDashboardFisio(el);
  }
  return renderDashboardCompleta(el);
}

function renderDashboardCompleta(el){
  const today = new Date(todayStr()+'T00:00:00');
  const dayNames = ['Domenica','Lunedi','Martedi','Mercoledi','Giovedi','Venerdi','Sabato'];

  const pres = todayWorkout ? getTodayPresenceCount(todayWorkout.id) : null;

  const alerts = getTeamAlerts();

  // RPE che non appartengono a nessun giocatore in rosa: segnale di dati disallineati
  const rpeOrfani = STATE.rpeLog.filter(r => !STATE.players.find(p => String(p.id) === String(r.playerId))).length;

  // Promemoria backup esterno: solo per staff/admin, se non fatto da oltre 7 giorni
  const ggBackup = giorniDaUltimoBackupEsterno();
  const mostraPromemoriaBackup = (STATE.role !== 'player') && (ggBackup === null || ggBackup >= 7);
  const w = getTeamWellness();
  const results = getRecentResults(6);

  const acwrAll = STATE.players
    .filter(countsInTeamAggregate)   /* portieri esclusi dalle aggregate di squadra */
    .map(p => ({player:p, acwr:getACWR(p.id)}))
    .filter(x => x.acwr && !x.acwr.insufficient);
  const acwrRisk = acwrAll.filter(x => x.acwr.zone === 'high');

  const disponibili = STATE.players.filter(p=>p.status==='Disponibile').length;
  const fuori = STATE.players.length - disponibili;
  const urgenti = alerts.filter(a=>a.priority === 1).length;

  const bilancio = results.reduce((acc,r)=>{ acc[r.esito]=(acc[r.esito]||0)+1; return acc; }, {});

  el.innerHTML = `
