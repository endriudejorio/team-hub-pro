/* ============================================================
   LAVORO DIFFERENZIATO
   Blocco opzionale di una sessione di allenamento: divide la rosa in
   due gruppi (recupero + intensivo), tipicamente il giorno dopo partita.
   Chi ha giocato di piu' fa recupero, chi ha giocato poco fa lavoro
   intenso. I portieri sono fuori (fanno lavoro loro).

   Il blocco vive dentro l'evento del calendario come `event.differenziato`:
   NON tocca l'archivio esercitazioni. Le personalizzazioni fatte qui
   restano nella singola giornata.
   ============================================================ */

const DIFF_SOGLIA_MINUTI_DEFAULT = 60;
const DIFF_GIORNI_LOOKBACK = 3;

/* Cerca l'ultima partita giocata nei giorni precedenti a `dateStr`, entro
   la finestra di lookback. Ritorna il match o null. */
function ultimaPartitaGiocataPrima(dateStr){
  const target = new Date(dateStr + 'T00:00:00');
  const inizioFinestra = new Date(target);
  inizioFinestra.setDate(inizioFinestra.getDate() - DIFF_GIORNI_LOOKBACK);
  const inizioStr = inizioFinestra.toISOString().slice(0,10);
  return STATE.events
    .filter(e => e.type === 'Partita' && e.date < dateStr && e.date >= inizioStr)
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)))
    [0] || null;
}

/* Calcola l'auto-split: chi ha giocato >= soglia va nel recupero,
   chi ha giocato meno va nell'intensivo. Portieri sempre esclusi.
   Restituisce { recupero: [ids], intensivo: [ids], partitaId, sogliaMinuti }. */
function calcolaAutoSplitDifferenziato(dateStr, sogliaMinuti){
  const soglia = sogliaMinuti || DIFF_SOGLIA_MINUTI_DEFAULT;
  const partita = ultimaPartitaGiocataPrima(dateStr);
  const rosa = STATE.players.filter(p => !isPortiere(p) && p.status !== 'Infortunato');
  if(!partita){
    /* Nessuna partita recente: metto tutti nell'intensivo per default. */
    return {
      recupero: [],
      intensivo: rosa.map(p => String(p.id)),
      partitaId: null,
      partitaData: null,
      sogliaMinuti: soglia,
      note: 'Nessuna partita nei ' + DIFF_GIORNI_LOOKBACK + ' giorni precedenti: tutti nel gruppo intensivo di default.'
    };
  }
  const minuti = computeMatchMinutes(partita);
  const recupero = [];
  const intensivo = [];
  rosa.forEach(p=>{
    const m = minuti[String(p.id)];
    const minGiocati = m ? m.minutes : 0;
    if(minGiocati >= soglia) recupero.push(String(p.id));
    else intensivo.push(String(p.id));
  });
  return {
    recupero, intensivo,
    partitaId: partita.id,
    partitaData: partita.date,
    sogliaMinuti: soglia,
    note: 'Split da partita del ' + fmtDate(partita.date) + ': chi ha giocato ≥' + soglia + '\' fa recupero, gli altri intensivo.'
  };
}

/* Crea la configurazione differenziata di default per una sessione. */
function creaDifferenziatoDefault(dateStr, sogliaMinuti){
  const split = calcolaAutoSplitDifferenziato(dateStr, sogliaMinuti);
  return {
    attivo: true,
    autoSplitDaPartitaId: split.partitaId,
    autoSplitDaPartitaData: split.partitaData,
    sogliaMinuti: split.sogliaMinuti,
    recupero: {
      giocatoriIds: split.recupero,
      modalita: 'VAM',              /* VAM in linea di default; alternativa 'VIFT' con COD */
      percentualeIntensita: 65,     /* % di VIFT o VAM */
      durataMinuti: 25,
      extra: []                     /* [{ nome, durataMinuti, descrizione? }, ...] */
    },
    intensivo: {
      giocatoriIds: split.intensivo,
      esercitazioniIds: [],         /* pescate dall'archivio */
      note: ''
    },
    creatoIl: new Date().toISOString()
  };
}

/* Durata stimata del differenziato per un giocatore in un evento.
   Serve al calcolo carico (RPE x minuti). */
function durataDifferenziatoPerGiocatore(event, playerId){
  const d = event && event.differenziato;
  if(!d || !d.attivo) return 0;
  const pid = String(playerId);
  if(d.recupero && d.recupero.giocatoriIds && d.recupero.giocatoriIds.map(String).includes(pid)){
    let tot = d.recupero.durataMinuti || 0;
    (d.recupero.extra || []).forEach(x => { tot += (x.durataMinuti || 0); });
    return tot;
  }
  if(d.intensivo && d.intensivo.giocatoriIds && d.intensivo.giocatoriIds.map(String).includes(pid)){
    let tot = 0;
    (d.intensivo.esercitazioniIds || []).forEach(wid=>{
      const w = STATE.workouts.find(x => x.id === wid);
      if(w) tot += calcWorkoutDuration(w);
    });
    return tot;
  }
  return 0;
}

/* Editor del differenziato: modale con auto-split, due colonne (recupero/intensivo),
   configurazione dettagliata di ciascun gruppo. */
function apriEditorDifferenziato(eventId, onSave){
  const event = STATE.events.find(e => e.id === eventId);
  if(!event){ showToast('Sessione non trovata'); return; }
  if(!event.differenziato){
    event.differenziato = creaDifferenziatoDefault(event.date, DIFF_SOGLIA_MINUTI_DEFAULT);
  }
  const d = event.differenziato;

  const modal = document.createElement('div');
  modal.id = 'diffModal';
  /* Non uso class="modal" (nel CSS non esiste), applico direttamente lo stile overlay
     come fanno gli altri modali del file. Senza questo, il modale finiva inline sotto
     l'ultimo elemento della pagina e restava visibile su tutte le schermate. */
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:flex-start;justify-content:center;z-index:9999;padding:20px;box-sizing:border-box;overflow-y:auto;';
  /* Click su sfondo chiude il modale (comportamento standard degli altri modali del file) */
  modal.addEventListener('click', (e)=>{
    if(e.target === modal) modal.remove();
  });

  /* Render principale dell'editor. Ridisegno tutto il contenuto quando
     l'utente cambia qualcosa che influenza la vista. */
  const rerender = ()=>{
    const recIds = new Set((d.recupero.giocatoriIds || []).map(String));
    const intIds = new Set((d.intensivo.giocatoriIds || []).map(String));
    const rosaMovimento = STATE.players.filter(p => !isPortiere(p));
    const nonAssegnati = rosaMovimento.filter(p=>{
      const id = String(p.id);
      return !recIds.has(id) && !intIds.has(id);
    });

    /* Info sulla partita da cui e' derivato lo split */
    const partitaInfo = d.autoSplitDaPartitaData
      ? 'Auto-split calcolato dalla partita del <strong>' + fmtDate(d.autoSplitDaPartitaData) + '</strong> · soglia <strong>' + d.sogliaMinuti + '\'</strong>'
      : 'Nessuna partita recente entro ' + DIFF_GIORNI_LOOKBACK + ' giorni: split iniziale a mano.';

    /* Elenco esercitazioni pescabili per il gruppo intensivo, con filtro */
    const filtroTipo = d._filtroTipo || '';
    const filtroCat  = d._filtroCat  || '';
    const eseSelezionate = new Set((d.intensivo.esercitazioniIds || []));
    const eseFiltrate = STATE.workouts.filter(w=>{
      if(filtroTipo && w.type !== filtroTipo) return false;
      if(filtroCat && w.category !== filtroCat) return false;
      return true;
    });
    const tipiUnici  = [...new Set(STATE.workouts.map(w=>w.type).filter(Boolean))].sort();
    const catUniche  = [...new Set(STATE.workouts.map(w=>w.category).filter(Boolean))].sort();

    /* Elenco portieri: sempre fuori */
    const portieri = STATE.players.filter(isPortiere);

    modal.innerHTML = `
      <div class="modal-content" style="max-width:900px;max-height:90vh;overflow-y:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <h2 style="margin:0;">Lavoro differenziato · ${fmtDate(event.date)}</h2>
          <button class="btn secondary" id="diffCloseTop" style="font-size:12px;padding:6px 12px;">Chiudi</button>
        </div>

        <div style="background:#F7F5EC;padding:10px 12px;border-radius:6px;margin-bottom:14px;font-size:12px;">
          ${partitaInfo}
          <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
            <label style="font-size:11px;">Soglia minuti</label>
            <input type="number" id="diffSoglia" value="${d.sogliaMinuti}" min="10" max="120" style="width:70px;padding:4px 6px;font-size:12px;">
            <button type="button" class="btn secondary" id="diffRecalc" style="font-size:11px;padding:4px 10px;">Ricalcola split automatico</button>
          </div>
        </div>

        ${portieri.length > 0 ? `
          <div style="font-size:11px;color:var(--ink-soft);margin-bottom:12px;padding:8px 10px;background:#F7F5EC;border-radius:6px;">
            <strong>Portieri (esclusi dal differenziato):</strong> ${portieri.map(p=>esc(p.name)).join(', ')}
          </div>
        ` : ''}

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">

          <!-- ========== GRUPPO RECUPERO ========== -->
          <div style="border:1px solid var(--line);border-radius:8px;padding:12px;background:#F0F7F1;">
            <h3 style="margin:0 0 10px 0;color:var(--ok);font-size:14px;">Recupero (${recIds.size})</h3>
            <div style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">Aerobico blando, tipicamente chi ha giocato molto in partita.</div>

            <label style="font-size:11px;">Modalità</label>
            <select id="diffRecModalita" style="width:100%;padding:6px;font-size:12px;margin-bottom:8px;">
              <option value="VAM"  ${d.recupero.modalita==='VAM'?'selected':''}>VAM in linea</option>
              <option value="VIFT" ${d.recupero.modalita==='VIFT'?'selected':''}>VIFT con cambio direzione (COD ×1.15)</option>
            </select>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
              <div>
                <label style="font-size:11px;">% intensità</label>
                <input type="number" id="diffRecPct" value="${d.recupero.percentualeIntensita}" min="50" max="100" style="width:100%;padding:6px;font-size:12px;">
              </div>
              <div>
                <label style="font-size:11px;">Durata (min)</label>
                <input type="number" id="diffRecDur" value="${d.recupero.durataMinuti}" min="5" max="90" style="width:100%;padding:6px;font-size:12px;">
              </div>
            </div>

            <label style="font-size:11px;">Attività extra</label>
            <div id="diffRecExtra" style="margin-bottom:6px;">
              ${(d.recupero.extra || []).map((x,i)=>`
                <div style="display:grid;grid-template-columns:1fr 60px auto;gap:4px;align-items:center;margin-bottom:4px;">
                  <input type="text" data-extra-nome="${i}" value="${esc(x.nome)}" placeholder="Nome" style="padding:5px;font-size:11px;">
                  <input type="number" data-extra-dur="${i}" value="${x.durataMinuti}" min="1" max="60" style="padding:5px;font-size:11px;">
                  <button type="button" class="btn secondary" data-extra-del="${i}" style="padding:2px 8px;font-size:11px;color:var(--clay);">×</button>
                </div>
              `).join('')}
            </div>
            <button type="button" class="btn secondary" id="diffAddExtra" style="width:100%;padding:5px;font-size:11px;">+ Aggiungi attività</button>

            <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px;">
              <div style="font-size:11px;font-weight:700;margin-bottom:6px;">Giocatori in questo gruppo:</div>
              <div style="max-height:180px;overflow-y:auto;">
                ${Array.from(recIds).length === 0 ? '<div style="font-size:11px;color:var(--ink-soft);padding:4px;">Nessuno</div>' : Array.from(recIds).map(pid=>{
                  const p = STATE.players.find(x=>String(x.id)===pid);
                  if(!p) return '';
                  return `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 6px;background:white;border-radius:4px;margin-bottom:3px;font-size:11.5px;">
                    <span>${esc(p.name)}</span>
                    <div>
                      <button type="button" class="diff-move-int" data-pid="${pid}" style="background:none;border:none;color:var(--clay);cursor:pointer;font-size:11px;">→ Int.</button>
                      <button type="button" class="diff-move-out" data-pid="${pid}" style="background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:11px;">×</button>
                    </div>
                  </div>`;
                }).join('')}
              </div>
            </div>
          </div>

          <!-- ========== GRUPPO INTENSIVO ========== -->
          <div style="border:1px solid var(--line);border-radius:8px;padding:12px;background:#FDF3E7;">
            <h3 style="margin:0 0 10px 0;color:var(--clay);font-size:14px;">Intensivo / SSG (${intIds.size})</h3>
            <div style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">Chi ha giocato poco o è entrato dalla panchina.</div>

            <label style="font-size:11px;">Esercitazioni dall'archivio</label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;">
              <select id="diffFilterCat" style="padding:6px;font-size:11px;">
                <option value="">Tutte le categorie</option>
                ${catUniche.map(c=>`<option value="${esc(c)}" ${filtroCat===c?'selected':''}>${esc(c)}</option>`).join('')}
              </select>
              <select id="diffFilterTipo" style="padding:6px;font-size:11px;">
                <option value="">Tutti i tipi</option>
                ${tipiUnici.map(t=>`<option value="${esc(t)}" ${filtroTipo===t?'selected':''}>${esc(t)}</option>`).join('')}
              </select>
            </div>

            <div style="max-height:150px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:4px;background:white;margin-bottom:8px;">
              ${eseFiltrate.length === 0 ? '<div style="font-size:11px;color:var(--ink-soft);padding:8px;text-align:center;">Nessuna esercitazione</div>' : eseFiltrate.map(w=>`
                <label style="display:flex;align-items:center;gap:6px;padding:4px;font-size:11.5px;cursor:pointer;">
                  <input type="checkbox" class="diff-ese-chk" value="${w.id}" ${eseSelezionate.has(w.id)?'checked':''}>
                  <span style="flex:1;">${esc(w.name)} <span style="color:var(--ink-soft);font-size:10px;">· ${esc(w.type || '')}</span></span>
                  <span style="font-size:10px;color:var(--ink-soft);">${calcWorkoutDuration(w)}'</span>
                </label>
              `).join('')}
            </div>

            <label style="font-size:11px;">Note</label>
            <textarea id="diffIntNote" rows="2" style="width:100%;padding:6px;font-size:12px;margin-bottom:8px;">${esc(d.intensivo.note || '')}</textarea>

            <div style="margin-top:8px;border-top:1px solid var(--line);padding-top:10px;">
              <div style="font-size:11px;font-weight:700;margin-bottom:6px;">Giocatori in questo gruppo:</div>
              <div style="max-height:180px;overflow-y:auto;">
                ${Array.from(intIds).length === 0 ? '<div style="font-size:11px;color:var(--ink-soft);padding:4px;">Nessuno</div>' : Array.from(intIds).map(pid=>{
                  const p = STATE.players.find(x=>String(x.id)===pid);
                  if(!p) return '';
                  return `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 6px;background:white;border-radius:4px;margin-bottom:3px;font-size:11.5px;">
                    <span>${esc(p.name)}</span>
                    <div>
                      <button type="button" class="diff-move-rec" data-pid="${pid}" style="background:none;border:none;color:var(--ok);cursor:pointer;font-size:11px;">← Rec.</button>
                      <button type="button" class="diff-move-out" data-pid="${pid}" style="background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:11px;">×</button>
                    </div>
                  </div>`;
                }).join('')}
              </div>
            </div>
          </div>
        </div>

        ${nonAssegnati.length > 0 ? `
          <div style="border:1px dashed var(--line);border-radius:8px;padding:10px;margin-top:14px;background:#FAFAFA;">
            <h4 style="margin:0 0 8px 0;color:var(--ink-soft);font-size:12px;">Non assegnati (${nonAssegnati.length})</h4>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">
              ${nonAssegnati.map(p=>`
                <div style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;background:white;border:1px solid var(--line);border-radius:12px;font-size:11px;">
                  ${esc(p.name)}
                  <button type="button" class="diff-add-rec" data-pid="${p.id}" style="background:none;border:1px solid var(--ok);color:var(--ok);border-radius:3px;padding:0 6px;font-size:10px;cursor:pointer;">+Rec</button>
                  <button type="button" class="diff-add-int" data-pid="${p.id}" style="background:none;border:1px solid var(--clay);color:var(--clay);border-radius:3px;padding:0 6px;font-size:10px;cursor:pointer;">+Int</button>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <div style="display:flex;gap:8px;margin-top:16px;">
          <button class="btn" id="diffSave" style="flex:1;">Salva differenziato</button>
          <button class="btn secondary" id="diffRemove" style="color:var(--clay);">Rimuovi differenziato</button>
          <button class="btn secondary" id="diffCloseBottom">Chiudi</button>
        </div>
      </div>
    `;

    /* Binding degli handler */
    const close = ()=>{ modal.remove(); };
    modal.querySelector('#diffCloseTop').addEventListener('click', close);
    modal.querySelector('#diffCloseBottom').addEventListener('click', close);

    modal.querySelector('#diffRecalc').addEventListener('click', ()=>{
      const soglia = parseInt(document.getElementById('diffSoglia').value, 10) || DIFF_SOGLIA_MINUTI_DEFAULT;
      if(!confirm('Ricalcolare lo split dai minuti giocati nell\'ultima partita? Le assegnazioni manuali verranno sovrascritte.')) return;
      const nuovo = creaDifferenziatoDefault(event.date, soglia);
      /* Preservo la configurazione recupero/intensivo (modalità, durate, esercitazioni) */
      nuovo.recupero.modalita = d.recupero.modalita;
      nuovo.recupero.percentualeIntensita = d.recupero.percentualeIntensita;
      nuovo.recupero.durataMinuti = d.recupero.durataMinuti;
      nuovo.recupero.extra = d.recupero.extra;
      nuovo.intensivo.esercitazioniIds = d.intensivo.esercitazioniIds;
      nuovo.intensivo.note = d.intensivo.note;
      event.differenziato = nuovo;
      Object.assign(d, nuovo);
      rerender();
    });

    /* Movimento giocatori */
    modal.querySelectorAll('.diff-move-int').forEach(b=> b.addEventListener('click', ()=>{
      const pid = b.dataset.pid;
      d.recupero.giocatoriIds = d.recupero.giocatoriIds.filter(x=>String(x)!==pid);
      if(!d.intensivo.giocatoriIds.map(String).includes(pid)) d.intensivo.giocatoriIds.push(pid);
      rerender();
    }));
    modal.querySelectorAll('.diff-move-rec').forEach(b=> b.addEventListener('click', ()=>{
      const pid = b.dataset.pid;
      d.intensivo.giocatoriIds = d.intensivo.giocatoriIds.filter(x=>String(x)!==pid);
      if(!d.recupero.giocatoriIds.map(String).includes(pid)) d.recupero.giocatoriIds.push(pid);
      rerender();
    }));
    modal.querySelectorAll('.diff-move-out').forEach(b=> b.addEventListener('click', ()=>{
      const pid = b.dataset.pid;
      d.recupero.giocatoriIds = d.recupero.giocatoriIds.filter(x=>String(x)!==pid);
      d.intensivo.giocatoriIds = d.intensivo.giocatoriIds.filter(x=>String(x)!==pid);
      rerender();
    }));
    modal.querySelectorAll('.diff-add-rec').forEach(b=> b.addEventListener('click', ()=>{
      const pid = b.dataset.pid;
      if(!d.recupero.giocatoriIds.map(String).includes(pid)) d.recupero.giocatoriIds.push(pid);
      rerender();
    }));
    modal.querySelectorAll('.diff-add-int').forEach(b=> b.addEventListener('click', ()=>{
      const pid = b.dataset.pid;
      if(!d.intensivo.giocatoriIds.map(String).includes(pid)) d.intensivo.giocatoriIds.push(pid);
      rerender();
    }));

    /* Filtri esercitazioni: memorizzo nel blocco temporaneo per rerender */
    modal.querySelector('#diffFilterCat').addEventListener('change', (e)=>{
      d._filtroCat = e.target.value; rerender();
    });
    modal.querySelector('#diffFilterTipo').addEventListener('change', (e)=>{
      d._filtroTipo = e.target.value; rerender();
    });

    /* Selezione esercitazioni intensivo */
    modal.querySelectorAll('.diff-ese-chk').forEach(chk=>{
      chk.addEventListener('change', ()=>{
        const set = new Set(d.intensivo.esercitazioniIds || []);
        if(chk.checked) set.add(chk.value); else set.delete(chk.value);
        d.intensivo.esercitazioniIds = Array.from(set);
      });
    });

    /* Configurazione recupero */
    const bindNum = (id, target)=> modal.querySelector(id).addEventListener('change', (e)=>{
      const v = parseInt(e.target.value, 10);
      if(!isNaN(v)) target(v);
    });
    bindNum('#diffRecPct', v=> d.recupero.percentualeIntensita = Math.max(50, Math.min(100, v)));
    bindNum('#diffRecDur', v=> d.recupero.durataMinuti = Math.max(5, Math.min(90, v)));
    modal.querySelector('#diffRecModalita').addEventListener('change', (e)=>{
      d.recupero.modalita = e.target.value;
    });
    modal.querySelector('#diffIntNote').addEventListener('input', (e)=>{
      d.intensivo.note = e.target.value;
    });

    /* Extra recupero */
    modal.querySelectorAll('[data-extra-nome]').forEach(inp=>{
      inp.addEventListener('input', (e)=>{
        const i = parseInt(inp.dataset.extraNome, 10);
        if(d.recupero.extra[i]) d.recupero.extra[i].nome = e.target.value;
      });
    });
    modal.querySelectorAll('[data-extra-dur]').forEach(inp=>{
      inp.addEventListener('input', (e)=>{
        const i = parseInt(inp.dataset.extraDur, 10);
        const v = parseInt(e.target.value, 10);
        if(d.recupero.extra[i] && !isNaN(v)) d.recupero.extra[i].durataMinuti = v;
      });
    });
    modal.querySelectorAll('[data-extra-del]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const i = parseInt(b.dataset.extraDel, 10);
        d.recupero.extra.splice(i, 1);
        rerender();
      });
    });
    modal.querySelector('#diffAddExtra').addEventListener('click', ()=>{
      if(!Array.isArray(d.recupero.extra)) d.recupero.extra = [];
      d.recupero.extra.push({ nome:'', durataMinuti: 10 });
      rerender();
    });

    /* Salva e chiudi */
    modal.querySelector('#diffSave').addEventListener('click', async ()=>{
      /* Pulizia dei campi temporanei prima di salvare */
      delete d._filtroCat;
      delete d._filtroTipo;
      await saveKey('events', STATE.events);
      showToast('Differenziato salvato');
      close();
      if(onSave) onSave();
    });

    modal.querySelector('#diffRemove').addEventListener('click', async ()=>{
      if(!confirm('Rimuovere il differenziato da questa sessione? Il resto della sessione resta intatto.')) return;
      delete event.differenziato;
      await saveKey('events', STATE.events);
      showToast('Differenziato rimosso');
      close();
      if(onSave) onSave();
    });
  };

  document.body.appendChild(modal);
  rerender();
}

          <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.9;">✓ Ultima</div>

              <label>Posizione</label>
              <div style="display:flex;gap:16px;margin-top:8px;">
                <label><input type="radio" name="homeAway" value="home" checked> In casa</label>
                <label><input type="radio" name="homeAway" value="away">Trasferta</label>
              </div>
            </div>
          </div>
          <div class="grid2">
            <div><label>Tipo</label><select id="matchType"><option>Amichevole</option><option>Campionato</option><option>Coppa</option></select></div>
            <div id="resultContainer" style="display:none;">
              <label>Risultato</label>
              <div style="display:flex;gap:8px;align-items:center;margin-top:8px;">
                <input id="matchGoalsFor" type="number" min="0" value="0" style="width:60px;padding:8px;border:1px solid var(--line);border-radius:4px;text-align:center;">
                <span style="font-weight:700;">-</span>
                <input id="matchGoalsAgainst" type="number" min="0" value="0" style="width:60px;padding:8px;border:1px solid var(--line);border-radius:4px;text-align:center;">
              </div>
            </div>
          </div>
        </div>
        
        <!-- ALLENAMENTO FIELDS -->
        <div id="trainingFields" style="display:none;">
          <div style="margin-bottom:16px;">
            <label>Titolo <span style="font-size:10px;color:var(--ink-soft);">(auto-generato)</span></label>
            <input id="evTitle" type="text" placeholder="Auto-generato da MD..." readonly style="background:var(--chalk);cursor:not-allowed;">
          </div>
          <label>Microciclo (MD)</label>
          <input id="evMD" type="text" placeholder="Es. MD+1, MD-2, MD+1/3" style="margin-top:8px;margin-bottom:16px;">
          <label style="font-size:11px;color:var(--ink-soft);margin-top:4px;display:block;">
            Lascia vuoto e sarà calcolato automaticamente se ci sono partite prima/dopo
          </label>
          <label style="margin-top:12px;">Seleziona esercitazioni <span style="font-size:10px;color:var(--ink-soft);">(opzionale)</span></label>
          <div class="checkbox-group" id="workoutCheckboxes">
            ${STATE.workouts.length===0 ? '<div class="empty">Nessuna esercitazione disponibile</div>' :
              STATE.workouts.map(w=>`
                <div class="checkbox-item">
                  <input type="checkbox" id="work_${w.id}" value="${w.id}" data-name="${w.name}" data-duration="${calcWorkoutDuration(w)}">
                  <label for="work_${w.id}">${esc(w.name)} (${calcWorkoutDuration(w)}min)</label>
                </div>
              `).join('')}
          </div>
          <div style="font-size:11px;color:var(--ink-soft);margin-top:8px;padding:8px;background:var(--chalk);border-radius:4px;border-left:3px solid var(--amber);">
            Puoi aggiungere esercitazioni anche dopo, cliccando su "Dettagli" dalla lista
          </div>
        </div>
        
        <div class="btn-row"><button class="btn" id="createEventBtn">Crea evento</button>${window.clipboardEvent && window.clipboardEvent.type === 'allenamento' ? `<button class="btn secondary" id="pasteEventBtn" style="background:var(--ok);">Incolla Sessione</button>` : ''}</div>
      </div>
    `:''}
    
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;">
        <button id="calPrevBtn" class="btn secondary" style="min-width:44px;font-size:16px;padding:6px 12px;">◀</button>
        <h3 style="margin:0;text-align:center;">${monthNames[cm.month]} ${cm.year}</h3>
        <div style="display:flex;gap:6px;">
          <button id="calTodayBtn" class="btn secondary" style="font-size:11px;padding:6px 10px;">Oggi</button>
          <button id="calNextBtn" class="btn secondary" style="min-width:44px;font-size:16px;padding:6px 12px;">▶</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;">
        ${dayNamesShort.map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;padding:4px 0;">${d}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">
        ${(()=>{
          const firstDay = new Date(cm.year, cm.month, 1);
          const lastDay = new Date(cm.year, cm.month + 1, 0);
          /* Lunedi = 0. new Date().getDay() ritorna 0=Dom, 1=Lun...6=Sab, quindi (getDay()+6)%7 */
          const startOffset = (firstDay.getDay() + 6) % 7;
          const totalCells = Math.ceil((startOffset + lastDay.getDate()) / 7) * 7;
          const today = todayStr();
          const cells = [];
          for(let i=0; i<totalCells; i++){
            const dayNum = i - startOffset + 1;
            if(dayNum < 1 || dayNum > lastDay.getDate()){
              /* Casella vuota (padding) */
              cells.push('<div style="min-height:72px;background:#FAFAFA;border-radius:4px;"></div>');
              continue;
            }
            const dateStr = `${cm.year}-${String(cm.month+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
            const isToday = dateStr === today;
            const dayEvents = upcoming.filter(e => e.date === dateStr)
              .sort((a,b)=>(a.time||'00:00').localeCompare(b.time||'00:00'));

            let cell = `<div style="min-height:72px;border:${isToday?'2px solid var(--ok)':'1px solid var(--line)'};border-radius:4px;padding:4px;background:${isToday?'#E3EFE7':'white'};overflow:hidden;">`;
            cell += `<div style="font-size:11px;font-weight:${isToday?'700':'600'};color:${isToday?'var(--ok)':'var(--ink)'};margin-bottom:2px;">${dayNum}</div>`;

            if(dayEvents.length > 0){
              /* Mostro fino a 3 eventi con nome breve. Se sono di piu', aggiungo "+N". */
              const visible = dayEvents.slice(0, 3);
              visible.forEach(e=>{
                const isMatch = e.type === 'Partita';
                const colorLeft = isMatch ? 'var(--amber)' : (e.type === 'Allenamento' ? 'var(--pitch)' : 'var(--ink-soft)');
                const bg = isMatch ? '#FDF3E7' : (e.type === 'Allenamento' ? '#F0F7F1' : '#F7F5EC');
                const label = isMatch ? (e.opponent ? esc(e.opponent) : 'Partita') : (e.title ? esc(e.title) : e.type);
                /* Indicatore RPE: pallino verde piccolo se ci sono dati per questa sessione */
                const rpeCount = (STATE.rpeLog || []).filter(r => r.sessionId === e.id && r.source !== 'plan').length;
                const rpeDot = rpeCount > 0 ? `<span style="display:inline-block;width:5px;height:5px;background:var(--ok);border-radius:50%;margin-right:3px;vertical-align:middle;" title="${rpeCount} RPE registrati"></span>` : '';
                cell += `<div class="cal-event" data-event-id="${e.id}" style="background:${bg};border-left:3px solid ${colorLeft};padding:2px 4px;margin-bottom:2px;font-size:9.5px;font-weight:600;color:var(--ink);border-radius:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${rpeDot}${label.substring(0,14)}</div>`;
              });
              if(dayEvents.length > 3){
                cell += `<div style="font-size:9px;color:var(--ink-soft);text-align:center;">+${dayEvents.length - 3}</div>`;
              }
            }

            cell += '</div>';
            cells.push(cell);
          }
          return cells.join('');
        })()}
      </div>
      <div style="font-size:10px;color:var(--ink-soft);margin-top:12px;display:flex;gap:12px;flex-wrap:wrap;">
        <span><span style="display:inline-block;width:8px;height:8px;background:var(--amber);vertical-align:middle;margin-right:4px;"></span>Partita</span>
        <span><span style="display:inline-block;width:8px;height:8px;background:var(--pitch);vertical-align:middle;margin-right:4px;"></span>Allenamento</span>
        <span><span style="display:inline-block;width:8px;height:8px;background:var(--ok);vertical-align:middle;margin-right:4px;"></span>Oggi</span>
        <span><span style="display:inline-block;width:5px;height:5px;background:var(--ok);border-radius:50%;vertical-align:middle;margin-right:4px;"></span>RPE registrati</span>
      </div>
    </div>
    
    <div class="card">
      <h3>Prossimi impegni (${(()=>{const t=todayStr();return upcoming.filter(e=>e.date>=t).slice(0,3).length;})()} di ${upcoming.filter(e=>e.date>=todayStr()).length})</h3>
      ${(()=>{
        const today = todayStr();
        const prossimi = upcoming.filter(e => e.date >= today).slice(0, 3);
        return prossimi.length === 0 ? '<div class="empty">Nessun impegno futuro</div>' :
          prossimi.map(e=>{
          const isMatch = e.type === 'Partita';
          return `
            <div style="padding:14px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;">
              <div style="display:flex;justify-content:space-between;align-items:start;">
                <div style="flex:1;">
                  <h4 style="margin:0 0 6px 0;color:var(--pitch);">${isMatch ? '' : ''} ${esc(e.title)}</h4>
                  <div style="font-size:12px;color:var(--ink-soft);">
                    ${fmtDate(e.date)} ${e.time ? ''+e.time : ''}
                    ${isMatch ? `<div style="margin-top:4px;">${esc(e.matchType||'Partita')} ${e.result ? `| <strong style="color:var(--pitch);">${e.result.goalsFor}-${e.result.goalsAgainst}</strong>` : ''}</div>` : ''}
                    ${!isMatch ? `<div style="margin-top:4px;font-size:11px;color:var(--amber);font-weight:600;">${e.md ? e.md + ' · ' : ''}Durata: ${getSessionDuration(e)}min</div>` : ''}
                  </div>
                </div>
                ${isStaff ? `<button class="btn secondary" id="evt_edit_${e.id}" style="font-size:11px;padding:6px 10px;margin-right:6px;">Dettagli</button><button class="btn secondary deleteEventBtn" data-event-id="${e.id}" style="font-size:11px;padding:6px 10px;">Elimina</button>` : ''}
              </div>
              ${!isMatch ? (()=>{
                const b = getPresenceBreakdown(e.id);
                const nWork = e.workoutIds ? e.workoutIds.length : 0;
                return `
                <div style="margin-top:8px;font-size:11px;color:var(--pitch);padding:6px;background:var(--chalk);border-radius:4px;">
                  Movimento ${b.movement.present.length}/${b.movement.available.length} &middot;
                  Portieri ${b.keepers.present.length}/${b.keepers.available.length} &middot;
                  Infortunati ${b.movement.injured.length + b.keepers.injured.length} &middot;
                  RTP/valutaz. ${b.movement.returning.length + b.keepers.returning.length} &middot;
                  ${nWork} eserc.
                </div>`;
              })() : ''}
              ${isMatch && e.events && e.events.length > 0 ? `
                <div style="margin-top:8px;font-size:11px;color:var(--amber);padding:6px;background:var(--chalk);border-radius:4px;">
                  ${e.events.filter(ev=>ev.type==='goal').length} gol | ${e.events.filter(ev=>ev.type==='assist').length} assist
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      })()}
    </div>
  `;
  
  if(isStaff){
    // Toggle between Partita and Allenamento
    document.getElementById('typePartita').addEventListener('change', ()=>{
      document.getElementById('matchFields').style.display = 'block';
      document.getElementById('trainingFields').style.display = 'none';
      checkResultVisibility();
    });
    
    document.getElementById('typeAllenamento').addEventListener('change', ()=>{
      document.getElementById('matchFields').style.display = 'none';
      document.getElementById('trainingFields').style.display = 'block';
      updateAllenamentoTitle();
    });
    
    // Update title when date or MD changes
    const updateAllenamentoTitle = ()=>{
      const date = document.getElementById('evDate').value;
      let md = document.getElementById('evMD').value.trim();
      if(!md) md = calculateMD(date) || 'Allenamento';
      document.getElementById('evTitle').value = md;
    };
    
    document.getElementById('evDate').addEventListener('change', updateAllenamentoTitle);
    document.getElementById('evMD').addEventListener('change', updateAllenamentoTitle);
    document.getElementById('evMD').addEventListener('keyup', updateAllenamentoTitle);
    
    // Show result container only if date is in the past
    const checkResultVisibility = ()=>{
      const date = document.getElementById('evDate').value;
      const today = todayStr();
      document.getElementById('resultContainer').style.display = date < today ? 'block' : 'none';
    };
    
    document.getElementById('evDate').addEventListener('change', checkResultVisibility);
    checkResultVisibility();
    
    // Create event
    if(document.getElementById('createEventBtn')){
      document.getElementById('createEventBtn').addEventListener('click', async ()=>{
        const date = document.getElementById('evDate').value;
        const time = document.getElementById('evTime').value;
        const eventType = document.querySelector('input[name="eventType"]:checked').value;
        
        if(eventType === 'partita'){
          const opponent = document.getElementById('matchOpponent').value.trim();
          const position = document.querySelector('input[name="homeAway"]:checked').value;
          const matchType = document.getElementById('matchType').value;
          
          if(!opponent){ showToast('Inserisci avversario'); return; }
          
          const teamName = STATE.teamConfig.name || 'Squadra';
          const title = position === 'home' ? `${teamName} - ${opponent}` : `${opponent} - ${teamName}`;
          
          const matchObj = {
            id:uid(), 
            date, time, title, type: 'Partita',
            matchType: matchType,
            opponent: opponent,
            position: position, // 'home' or 'away'
            result: null,
            events: [], // Timeline events
            lineup: [],
            duration: 90
          };
          
          // Add result if date is in past
          if(date < todayStr()){
            const goalsFor = parseInt(document.getElementById('matchGoalsFor').value || '0');
            const goalsAgainst = parseInt(document.getElementById('matchGoalsAgainst').value || '0');
            matchObj.result = {goalsFor, goalsAgainst};
          }
          
          STATE.events.push(matchObj);
          await saveKey('events', STATE.events);
          showToast('Partita creata');
          render();
        } else {
          let title = document.getElementById('evTitle').value.trim();
          if(!title){
            let md = document.getElementById('evMD').value.trim();
            if(!md) md = calculateMD(date) || 'Allenamento';
            title = md;
          }
          
          const workoutIds = Array.from(document.querySelectorAll('#workoutCheckboxes input:checked')).map(cb=>cb.value);
          // workoutIds può essere vuoto - le esercitazioni sono opzionali
          
          let md = document.getElementById('evMD').value.trim();
          if(!md) md = calculateMD(date) || '';
          
          STATE.events.push({id:uid(), date, time, title, type:'Allenamento', workoutIds, md});
          await saveKey('events', STATE.events);
          showToast('Sessione creata' + (md ? ` (${md})` : '') + (workoutIds.length > 0 ? ` con ${workoutIds.length} esercitazione(i)` : ' (senza esercitazioni)'));
          render();
        }
      });
    }
    
    // Paste event
    if(document.getElementById('pasteEventBtn')){
      document.getElementById('pasteEventBtn').addEventListener('click', async ()=>{
        if(!window.clipboardEvent || window.clipboardEvent.type !== 'allenamento'){
          showToast('Nessuna sessione copiata');
          return;
        }
        
        const date = document.getElementById('evDate').value;
        const time = document.getElementById('evTime').value;
        const clipboard = JSON.parse(JSON.stringify(window.clipboardEvent.data));
        
        // Crea nuova sessione con la data selezionata
        let md = calculateMD(date) || 'Allenamento';
        const workoutIds = clipboard.workoutIds || [];
        
        STATE.events.push({id:uid(), date, time, title: md, type:'Allenamento', workoutIds, md});
        await saveKey('events', STATE.events);
        showToast('Sessione incollata per ' + fmtDate(date) + (workoutIds.length > 0 ? ` con ${workoutIds.length} esercitazione(i)` : ''));
        render();
      });
    }
  }
  
  // Edit and delete match
  if(isStaff){
    el.querySelectorAll('[id^="evt_edit_"]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const eventId = b.id.substring(9);
        const event = STATE.events.find(e=>e.id===eventId);
        if(!event) return;
        if(event.type === 'Partita'){
          renderMatchDetails(event);
        } else if(event.type === 'Allenamento'){
          renderEditAllenamentoModal(event);
        }
      });
    });
    
    // Delete event - using class and data attribute
    el.querySelectorAll('.deleteEventBtn').forEach(b=>{
      b.addEventListener('click', async (e)=>{
        e.preventDefault();
        e.stopPropagation();
        if(!confirm('Sei sicuro di voler eliminare questo evento? L\'azione non può essere annullata.')) return;
        const eventId = b.dataset.eventId;
        STATE.events = STATE.events.filter(evt=>evt.id!==eventId);
        await saveKey('events', STATE.events);
        showToast('Evento eliminato');
        render();
      });
    });
  }
  
  // Click su evento del calendario mensile
  el.querySelectorAll('.cal-event').forEach(card=>{
    card.addEventListener('click', ()=>{
      const eventId = card.dataset.eventId;
      const event = STATE.events.find(e=>e.id===eventId);
      if(!event) return;
      if(event.type === 'Partita' && isStaff){
        renderMatchDetails(event);
      } else if(event.type === 'Allenamento' && isStaff){
        renderAllenamentoDetails(event);
      }
    });
  });

  // Navigazione calendario mensile
  const prevBtn = document.getElementById('calPrevBtn');
  const nextBtn = document.getElementById('calNextBtn');
  const todayBtn = document.getElementById('calTodayBtn');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{
    if(STATE.calendarMonth.month === 0){
      STATE.calendarMonth = {year: STATE.calendarMonth.year - 1, month: 11};
    } else {
      STATE.calendarMonth = {year: STATE.calendarMonth.year, month: STATE.calendarMonth.month - 1};
    }
    renderCalendario(el);
  });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    if(STATE.calendarMonth.month === 11){
      STATE.calendarMonth = {year: STATE.calendarMonth.year + 1, month: 0};
    } else {
      STATE.calendarMonth = {year: STATE.calendarMonth.year, month: STATE.calendarMonth.month + 1};
    }
    renderCalendario(el);
  });
  if(todayBtn) todayBtn.addEventListener('click', ()=>{
    const t = new Date(todayStr() + 'T00:00:00');
    STATE.calendarMonth = {year: t.getFullYear(), month: t.getMonth()};
    renderCalendario(el);
  });
}




/* ---------- MATCH DETAILS ---------- */
function renderAllenamentoDetails(event){
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;box-sizing:border-box;overflow-y:auto;';
  
  modal.innerHTML = `
    <div style="background:white;border-radius:12px;max-width:600px;width:100%;padding:24px;margin:auto;">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:20px;">
        <div>
          <h2 style="margin:0;color:var(--pitch);">${esc(event.title)}</h2>
          <div style="font-size:12px;color:var(--ink-soft);">${fmtDate(event.date)} ${event.time || '-'} ${event.md ? '| ' + esc(event.md) : ''}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button id="printAllenamentoBtn" class="btn secondary" style="padding:6px 12px;font-size:11px;">PDF recap</button>
          <button id="closeAllenamentoModal" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;">×</button>
        </div>
      </div>
      
      <div style="border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:20px;">
        <h4 style="margin:0 0 12px 0;color:var(--pitch);font-size:13px;">Esercitazioni</h4>
        
        ${event.workoutIds && event.workoutIds.length > 0 ? `
          <div style="margin-bottom:12px;">
            ${event.workoutIds.map(wid => {
              const workout = STATE.workouts.find(w => w.id === wid);
              return workout ? `
                <div style="padding:8px;background:var(--chalk);border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">
                  <div style="font-size:12px;">
                    <strong>${esc(workout.name)}</strong> (${calcWorkoutDuration(workout)}min)
                  </div>
                  <button class="del-workout-btn" data-workout-id="${wid}" style="background:none;border:none;color:var(--clay);cursor:pointer;font-size:12px;">×</button>
                </div>
              ` : '';
            }).join('')}
          </div>
        ` : '<div style="font-size:12px;color:#999;margin-bottom:12px;padding:12px;background:var(--chalk);border-radius:6px;">Nessuna esercitazione</div>'}
        
        <div style="border-top:1px solid var(--line);padding-top:12px;">
          <label style="margin-bottom:8px;display:block;font-size:12px;">Aggiungi esercitazione:</label>
          <div style="display:flex;gap:8px;margin-bottom:8px;">
            <select id="addWorkoutSelect" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:4px;font-size:12px;">
              <option value="">-- Seleziona --</option>
              ${STATE.workouts.map(w=>`<option value="${w.id}">${esc(w.name)} (${calcWorkoutDuration(w)}min)</option>`).join('')}
            </select>
            <button id="addWorkoutBtn" class="btn" style="padding:8px 16px;font-size:12px;">+ Aggiungi</button>
          </div>
        </div>
      </div>

      <!-- BLOCCO RPE PER GIOCATORE -->
      <div style="border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <h4 style="margin:0;color:var(--pitch);font-size:13px;">RPE per giocatore</h4>
          ${(()=>{
            const rpes = (STATE.rpeLog || []).filter(r => r.sessionId === event.id && r.source !== 'plan');
            if(rpes.length === 0) return '<span style="font-size:11px;color:var(--ink-soft);">Nessun RPE inserito</span>';
            const avg = rpes.reduce((s,r)=>s + Number(r.rpe||0), 0) / rpes.length;
            const load = rpes.reduce((s,r)=>s + Number(r.rpe||0) * Number(r.minutes||0), 0);
            return `<span style="font-size:11px;color:var(--ink-soft);">Media <strong style="color:var(--pitch);">${(Math.round(avg*10)/10)}</strong> · Carico totale <strong style="color:var(--pitch);">${Math.round(load)}</strong> UA</span>`;
          })()}
        </div>
        ${(()=>{
          const rpes = (STATE.rpeLog || []).filter(r => r.sessionId === event.id && r.source !== 'plan');
          if(rpes.length === 0){
            return '<div style="font-size:12px;color:var(--ink-soft);padding:10px;text-align:center;background:#F7F5EC;border-radius:6px;">I giocatori presenti compileranno il proprio RPE dalla loro area wellness dopo la sessione.</div>';
          }
          const righe = rpes.map(r=>{
            const p = STATE.players.find(x => String(x.id) === String(r.playerId));
            const color = r.rpe >= 8 ? 'var(--clay)' : r.rpe >= 6 ? 'var(--amber-dark)' : r.rpe >= 4 ? 'var(--amber)' : 'var(--ok)';
            return `<div style="display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:6px 10px;background:#F9F9F9;border-radius:4px;margin-bottom:4px;font-size:12px;">
              <span>${p ? esc(p.name) : 'giocatore rimosso'}</span>
              <span style="color:var(--ink-soft);font-size:11px;">${r.minutes || 0} min</span>
              <span style="font-weight:700;color:${color};min-width:34px;text-align:right;">${r.rpe}/10</span>
            </div>`;
          }).join('');
          return '<div style="max-height:280px;overflow-y:auto;">' + righe + '</div>';
        })()}
      </div>

      <!-- BLOCCO DIFFERENZIATO -->
      <div style="border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:20px;background:${event.differenziato && event.differenziato.attivo ? '#FDF3E7' : 'white'};">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <h4 style="margin:0;color:var(--pitch);font-size:13px;">Lavoro differenziato</h4>
          ${event.differenziato && event.differenziato.attivo
            ? '<span style="font-size:11px;color:var(--ok);font-weight:700;">ATTIVO</span>'
            : '<span style="font-size:11px;color:var(--ink-soft);">Non attivato</span>'}
        </div>
        ${event.differenziato && event.differenziato.attivo ? `
          <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;">
            Recupero: <strong>${(event.differenziato.recupero.giocatoriIds||[]).length}</strong> giocatori
            (${esc(event.differenziato.recupero.modalita)} ${event.differenziato.recupero.percentualeIntensita}% · ${event.differenziato.recupero.durataMinuti} min${(event.differenziato.recupero.extra||[]).length ? ' + ' + event.differenziato.recupero.extra.length + ' extra' : ''})<br>
            Intensivo: <strong>${(event.differenziato.intensivo.giocatoriIds||[]).length}</strong> giocatori
            (${(event.differenziato.intensivo.esercitazioniIds||[]).length} esercitazioni dall'archivio)
          </div>
          <button id="editDifferenziatoBtn" class="btn" style="width:100%;font-size:12px;">Modifica differenziato</button>
        ` : `
          <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;">
            Divide la sessione in due gruppi: recupero (aerobico blando) per chi ha giocato molto, intensivo/SSG per gli altri. I portieri sono esclusi.
          </div>
          <button id="attivaDifferenziatoBtn" class="btn secondary" style="width:100%;font-size:12px;">Attiva differenziato</button>
        `}
      </div>

      <div style="text-align:right;display:flex;gap:12px;justify-content:flex-end;">
        <button id="copyAllenamentoBtn" class="btn secondary" style="padding:8px 20px;">Copia</button>
        <button id="saveAllenamentoBtn" class="btn" style="padding:8px 20px;">Salva</button>
      </div>
    </div>
  `;
  
  document.body.appendChild(modal);
  
  // Close button
  document.getElementById('closeAllenamentoModal').addEventListener('click', ()=>{
    modal.remove();
  });

  const printBtnAll = document.getElementById('printAllenamentoBtn');
  if(printBtnAll) printBtnAll.addEventListener('click', ()=> printSessionRecap(event.id));
  
  // Close on backdrop click
  modal.addEventListener('click', (e)=>{
    if(e.target === modal) modal.remove();
  });

  // Attiva differenziato / Modifica differenziato
  const attivaBtn = document.getElementById('attivaDifferenziatoBtn');
  const editBtn = document.getElementById('editDifferenziatoBtn');
  const onDiffChanged = ()=>{
    modal.remove();
    renderAllenamentoDetails(event);
  };
  if(attivaBtn) attivaBtn.addEventListener('click', ()=>{
    event.differenziato = creaDifferenziatoDefault(event.date, DIFF_SOGLIA_MINUTI_DEFAULT);
    apriEditorDifferenziato(event.id, onDiffChanged);
  });
  if(editBtn) editBtn.addEventListener('click', ()=>{
    apriEditorDifferenziato(event.id, onDiffChanged);
  });
  
  // Delete workout
  modal.querySelectorAll('.del-workout-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const wid = btn.dataset.workoutId;
      event.workoutIds = event.workoutIds.filter(id => id !== wid);
      renderAllenamentoDetails(event); // Refresh
    });
  });
  
  // Add workout
  document.getElementById('addWorkoutBtn').addEventListener('click', ()=>{
    const selectEl = document.getElementById('addWorkoutSelect');
    const wid = selectEl.value;
    if(!wid){
      showToast('Seleziona un esercitazione');
      return;
    }
    if(!event.workoutIds) event.workoutIds = [];
    if(!event.workoutIds.includes(wid)){
      event.workoutIds.push(wid);
    }
    selectEl.value = '';
    renderAllenamentoDetails(event); // Refresh
  });
  
  // Copy button
  document.getElementById('copyAllenamentoBtn').addEventListener('click', ()=>{
    // Salva temporaneamente in clipboard interno
    window.clipboardEvent = {type: 'allenamento', data: JSON.parse(JSON.stringify(event))};
    showToast('Sessione copiata! Seleziona una data e premi "Incolla"');
    modal.remove();
  });
  
  // Save
  document.getElementById('saveAllenamentoBtn').addEventListener('click', async ()=>{
    const idx = STATE.events.findIndex(e => e.id === event.id);
    if(idx >= 0){
      STATE.events[idx] = event;
      await saveKey('events', STATE.events);
      showToast('Allenamento aggiornato');
      render();
      modal.remove();
    }
  });
}

function showWorkoutDetailsModal(workout){

  let detailsHTML = '';

    detailsHTML = `
      <div style="margin-bottom:12px;"><strong>Squadre:</strong> ${workout.teamsPlayers?.map(tp=>`Sq${tp.teamNumber}: ${tp.players}`).join(' | ')}</div>
      <div style="margin-bottom:12px;"><strong>Con portieri:</strong> ${workout.withGoalkeepers ? 'Sì' : 'No'}</div>
      <div style="margin-bottom:12px;"><strong>Totale giocatori:</strong> ${workout.totalPlayers}</div>
      <div style="margin-bottom:12px;"><strong>Campo:</strong> ${workout.fieldLength}×${workout.fieldWidth}m</div>
      <div style="margin-bottom:12px;"><strong>m²/giocatore:</strong> ${workout.squareMetersPerPlayer}</div>
      <div style="margin-bottom:12px;"><strong>Durata:</strong> ${workout.series}×${workout.minutesPerSeries}min + ${workout.recovery}min recupero</div>
    `;
  } else if(workout.type === 'Forza massima'){
    detailsHTML = `
      <div style="margin-bottom:12px;"><strong>Esercizio:</strong> ${esc(workout.exercise)}</div>
      <div style="margin-bottom:12px;"><strong>Serie:</strong> ${workout.series}×${workout.reps} ripetizioni</div>
      <div style="margin-bottom:12px;"><strong>Recupero:</strong> ${workout.recovery}min</div>
    `;
  } else if(workout.type.includes('Intermittente') || workout.type.includes('Lavoro intermittente') || workout.type === 'Differenziato' || workout.type.includes('HIIT')){
    detailsHTML = `
      <div style="margin-bottom:12px;"><strong>Serie:</strong> ${workout.series} × ${workout.minutesPerSeries}min</div>
      <div style="margin-bottom:12px;"><strong>Recupero:</strong> ${workout.recovery}min</div>
    `;
  } else if(workout.type === 'Resistenza aerobica a secco'){
    detailsHTML = `
      <div style="margin-bottom:12px;"><strong>Durata:</strong> ${workout.minutes}min</div>
    `;
  } else if(workout.type.includes('Speed') || workout.type.includes('Cambi')){
    detailsHTML = `
      <div style="margin-bottom:12px;"><strong>Serie:</strong> ${workout.series} × ${workout.distance}m</div>
      <div style="margin-bottom:12px;"><strong>Recupero:</strong> ${workout.recovery}min</div>
    `;
  } else if(workout.minutes){
    detailsHTML = `
      <div style="margin-bottom:12px;"><strong>Durata:</strong> ${workout.minutes}min</div>
    `;
  }
  
  modal.innerHTML = `
    <div style="background:white;border-radius:12px;max-width:500px;width:100%;padding:24px;margin:auto;">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:20px;">
        <div>
          <h2 style="margin:0 0 4px 0;color:var(--pitch);">${esc(workout.name)}</h2>
          <div style="font-size:12px;color:var(--ink-soft);">${esc(workout.category)} · ${esc(workout.type)}</div>
        </div>
        <button id="closeDetailsModal" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;">×</button>
      </div>
      
      <div style="background:var(--chalk);padding:16px;border-radius:8px;margin-bottom:16px;border-left:4px solid var(--amber);">
        <div style="font-size:14px;margin-bottom:8px;font-weight:600;color:var(--pitch);">Dettagli</div>
        ${detailsHTML || '<div style="font-size:12px;color:#999;">Nessun dettaglio disponibile</div>'}
      </div>
      
      ${workout.groups && workout.groups.length > 0 ? `
        <div style="background:var(--chalk);padding:16px;border-radius:8px;margin-bottom:16px;">
          <div style="font-size:14px;margin-bottom:8px;font-weight:600;color:var(--pitch);">Gruppi</div>
          ${workout.groups.map(g=>`
            <div style="padding:8px;background:white;border-radius:4px;margin-bottom:6px;font-size:12px;">
              <strong>${esc(g.name)}</strong> (${g.players.length} giocatori)
            </div>
          `).join('')}
        </div>
      ` : ''}
      
      <div style="text-align:right;">
        <button id="closeDetailsBtnOk" class="btn" style="padding:8px 20px;">Chiudi</button>
      </div>
    </div>
  `;
  
  document.body.appendChild(modal);
  
  document.getElementById('closeDetailsModal').addEventListener('click', () => modal.remove());
  document.getElementById('closeDetailsBtnOk').addEventListener('click', () => modal.remove());
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });

function renderEditAllenamentoModal(event){
  const existing = document.getElementById('allenamentoModal');
  if(existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'allenamentoModal';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;box-sizing:border-box;overflow-y:auto;';

  const ids = Array.isArray(event.workoutIds) ? event.workoutIds : [];
  const totalMin = ids.reduce((sum, wid)=>{
    const w = STATE.workouts.find(x=>x.id===wid);
    return sum + (w ? calcWorkoutDuration(w) : 0);
  }, 0);

  modal.innerHTML = `
    <div style="background:white;border-radius:12px;max-width:640px;width:100%;padding:24px;margin:auto;">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:18px;">
        <h2 style="margin:0;color:var(--pitch);">Modifica allenamento</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          <button id="printTrainingBtn" data-event-id="${event.id}" class="btn secondary" style="font-size:11px;padding:6px 12px;">Recap PDF</button>
          <button id="closeAllenamentoModal" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;">&#10005;</button>
        </div>
      </div>

      <div class="grid2" style="gap:12px;">
        <div>
          <label>Titolo</label>
          <input id="editEventTitle" type="text" value="${esc(event.title || '')}">
        </div>
        <div>
          <label>Data</label>
          <input id="editEventDate" type="date" value="${event.date || ''}">
        </div>
      </div>
      <div class="grid2" style="gap:12px;">
        <div>
          <label>Orario</label>
          <input id="editEventTime" type="text" value="${esc(event.time || '')}" placeholder="Es. 19:30">
        </div>
        <div>
          <label>Luogo</label>
          <input id="editEventLocation" type="text" value="${esc(event.location || '')}" placeholder="Campo">
        </div>
      </div>
      <label>Note</label>
      <textarea id="editEventNotes" placeholder="Note per la sessione">${esc(event.notes || '')}</textarea>

      <div style="border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h4 style="margin:0;color:var(--pitch);font-size:13px;">Esercitazioni (${ids.length})</h4>
          <span style="font-size:12px;color:var(--ink-soft);">Totale ${totalMin} min</span>
        </div>

        ${ids.length > 0 ? ids.map((wid, i) => {
          const w = STATE.workouts.find(x=>x.id===wid);
          if(!w) return '';
          return `
            <div style="padding:10px;background:var(--chalk);border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <div class="workout-preview" data-workout-id="${wid}" style="flex:1;cursor:pointer;">
                <div style="font-size:13px;font-weight:600;">${esc(w.name)}</div>
                <div style="font-size:11px;color:var(--ink-soft);">${esc(w.category)} &middot; ${esc(w.type)} &middot; ${calcWorkoutDuration(w)} min &middot; tocca per i dettagli</div>
              </div>
              <div style="display:flex;gap:4px;">
                <button class="move-workout" data-index="${i}" data-dir="-1" ${i===0 ? 'disabled' : ''} style="background:none;border:1px solid var(--line);border-radius:4px;padding:2px 7px;cursor:pointer;font-size:12px;">&#8593;</button>
                <button class="move-workout" data-index="${i}" data-dir="1" ${i===ids.length-1 ? 'disabled' : ''} style="background:none;border:1px solid var(--line);border-radius:4px;padding:2px 7px;cursor:pointer;font-size:12px;">&#8595;</button>
                <button class="del-workout-from-event" data-workout-id="${wid}" style="background:none;border:1px solid var(--line);border-radius:4px;color:var(--clay);padding:2px 7px;cursor:pointer;font-size:12px;">&#10005;</button>
              </div>
            </div>`;
        }).join('') : '<div style="font-size:12px;color:var(--ink-soft);padding:12px;background:var(--chalk);border-radius:6px;margin-bottom:10px;">Nessuna esercitazione. Aggiungine una qui sotto.</div>'}

        <div style="border-top:1px solid var(--line);padding-top:12px;margin-top:12px;">
          <label style="margin-top:0;">Aggiungi esercitazione</label>
          <div style="display:flex;gap:8px;">
            <select id="addWorkoutToEventSelect" style="flex:1;">
              <option value="">-- Seleziona --</option>
              ${STATE.workouts.map(w=>`<option value="${w.id}">${esc(w.name)} (${calcWorkoutDuration(w)} min)</option>`).join('')}
            </select>
            <button id="addWorkoutToEventBtn" class="btn" style="padding:8px 12px;font-size:12px;white-space:nowrap;">Aggiungi</button>
          </div>
        </div>
      </div>

      <div class="btn-row" style="justify-content:flex-end;">
        <button id="closeAllenamentoBtn" class="btn secondary">Annulla</button>
        <button id="saveAllenamentoBtn" class="btn">Salva</button>
      </div>
    </div>
  `;

  document.body.appendChild(modal);

  const close = ()=> modal.remove();
  document.getElementById('closeAllenamentoModal').addEventListener('click', close);
  document.getElementById('closeAllenamentoBtn').addEventListener('click', close);
  modal.addEventListener('click', (e)=>{ if(e.target === modal) close(); });

  // Apri i dettagli di un'esercitazione
  modal.querySelectorAll('.workout-preview').forEach(row=>{
    row.addEventListener('click', ()=>{
      const w = STATE.workouts.find(x=>x.id===row.dataset.workoutId);
      if(w) showWorkoutDetailsModal(w);
    });
  });

  // Rimuovi esercitazione
  modal.querySelectorAll('.del-workout-from-event').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      event.workoutIds = (event.workoutIds || []).filter(id => id !== btn.dataset.workoutId);
      renderEditAllenamentoModal(event);
    });
  });

  // Riordina esercitazioni
  modal.querySelectorAll('.move-workout').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.index, 10);
      const dir = parseInt(btn.dataset.dir, 10);
      const arr = event.workoutIds || [];
      const j = i + dir;
      if(j < 0 || j >= arr.length) return;
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      event.workoutIds = arr;
      renderEditAllenamentoModal(event);
    });
  });

  // Aggiungi esercitazione
  document.getElementById('addWorkoutToEventBtn').addEventListener('click', ()=>{
    const sel = document.getElementById('addWorkoutToEventSelect');
    const wid = sel.value;
    if(!wid){ showToast('Seleziona un\'esercitazione'); return; }
    if(!Array.isArray(event.workoutIds)) event.workoutIds = [];
    event.workoutIds.push(wid);
    renderEditAllenamentoModal(event);
  });

  // Salva
  document.getElementById('saveAllenamentoBtn').addEventListener('click', async ()=>{
    event.title = document.getElementById('editEventTitle').value.trim() || event.title;
    event.date = document.getElementById('editEventDate').value || event.date;
    event.time = document.getElementById('editEventTime').value.trim();
    event.location = document.getElementById('editEventLocation').value.trim();
    event.notes = document.getElementById('editEventNotes').value.trim();

    const idx = STATE.events.findIndex(e => e.id === event.id);
    if(idx >= 0) STATE.events[idx] = event;
    await saveKey('events', STATE.events);
    showToast('Allenamento aggiornato');
    close();
    render();
  });
}
