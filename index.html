function renderGiocatori(el){
  const selectedId = el.dataset.selectedPlayerId || null;
  const selectedPlayer = selectedId ? STATE.players.find(p=>String(p.id)===String(selectedId)) : null;
  const isAddingNew = el.dataset.addingNew === 'true';

  // Se il giocatore ha un ruolo vecchio non presente in lista, lo tengo come opzione
  // per non riassegnarlo in automatico al primo della tendina.
  const roleOptions = (sel)=>{
    let out = ROLES.map(r=>`<option value="${r}" ${sel===r?'selected':''}>${r}</option>`).join('');
    if(sel && ROLES.indexOf(sel) === -1){
      out = `<option value="${esc(sel)}" selected>${esc(sel)} (da aggiornare)</option>` + out;
    }
    if(!sel){
      out = `<option value="" selected disabled>Seleziona ruolo...</option>` + out;
    }
    return out;
  };
  const footOptions = (sel)=>{
    let out = FEET.map(f=>`<option value="${f}" ${sel===f?'selected':''}>${f}</option>`).join('');
    if(!sel) out = `<option value="" selected disabled>Seleziona piede...</option>` + out;
    return out;
  };
  const statusOptions = (sel)=> PLAYER_STATUSES.map(st=>`<option value="${st.value}" ${sel===st.value?'selected':''}>${st.label}</option>`).join('');

  el.innerHTML = `
    <div class="page-head"><h1>Rosa</h1><p>${esc(STATE.teamConfig.name||'Squadra')} — ${STATE.players.length} giocatori</p></div>
    <div class="grid2">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="margin:0;">Elenco</h3>
          <button class="btn" id="addPlayerBtn" style="padding:6px 12px;font-size:12px;">+ Aggiungi</button>
        </div>
        <table>
          <thead><tr><th>Nome</th><th>Eta</th><th>Ruolo</th><th>Min.</th><th>HI</th><th>Stato</th></tr></thead>
          <tbody id="playersTableBody"></tbody>
        </table>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:10px;">HI = Hooper Index piu' recente, da 4 (ottimo) a 28 (critico): basso significa fresco. Min. = minuti giocati in stagione. Il pallino rosso segnala un dolore aperto. Tocca un giocatore per la scheda completa.</div>
      </div>
      <div id="detailsPanel">
        ${isAddingNew ? `
          <div class="card">
            <h3>Nuovo giocatore</h3>
            <label>Nome e cognome</label>
            <input id="newName" type="text" placeholder="Es. Rossi Marco">
            <div class="grid2" style="gap:12px;">
              <div><label>Data di nascita</label><input id="newBirthDate" type="date"></div>
              <div><label>Ruolo</label><select id="newRole">${roleOptions('')}</select></div>
            </div>
            <label>Piede forte</label>
            <select id="newFoot">${footOptions('')}</select>
            <div style="font-size:11px;color:var(--ink-soft);margin-top:10px;">Il codice di accesso viene generato in automatico.</div>
            <div class="btn-row"><button class="btn" id="confirmAddPlayerBtn">Aggiungi</button><button class="btn secondary" id="cancelAddPlayerBtn">Annulla</button></div>
          </div>
        ` : selectedPlayer ? `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:start;">
              <h3 style="margin:0;">${esc(selectedPlayer.name)}</h3>
              <span style="font-size:12px;color:var(--ink-soft);">${calcAge(selectedPlayer.birthDate)} anni</span>
            </div>

            <label>Nome e cognome</label>
            <input id="editName" type="text" value="${esc(selectedPlayer.name)}">

            <div class="grid2" style="gap:12px;">
              <div><label>Data di nascita</label><input id="editBirthDate" type="date" value="${selectedPlayer.birthDate||''}"></div>
              <div><label>Ruolo</label><select id="editRole">${roleOptions(selectedPlayer.role)}</select></div>
            </div>

            <div class="grid2" style="gap:12px;">
              <div><label>Piede forte</label><select id="editFoot">${footOptions(selectedPlayer.foot||'')}</select></div>
              <div><label>Stato</label><select id="editStatus">${statusOptions(selectedPlayer.status||'Disponibile')}</select></div>
            </div>

            ${(()=>{
              const open = getOpenPainIssues(selectedPlayer.id);
              if(open.length === 0) return '';
              return `<div style="margin-top:12px;padding:10px;border-radius:6px;background:var(--clay-soft);border-left:4px solid ${open[0].color};">
                <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#8B3429;margin-bottom:4px;">Dolori aperti (${open.length})</div>
                ${open.map(i=>`<div style="font-size:12px;color:#8B3429;">${esc(i.zone)} — ${i.lastIntensity}/10, ${i.days === 0 ? 'oggi' : i.days + ' giorni fa'} <span style="opacity:0.75;">(${i.label})</span></div>`).join('')}
                <div style="font-size:11px;color:#8B3429;opacity:0.8;margin-top:6px;">Gestiscili dalla scheda completa.</div>
              </div>`;
            })()}

            <div id="returnDateWrap" style="display:${statusMeta(selectedPlayer.status).needsDate ? 'block' : 'none'};">
              <label>Rientro stimato</label>
              <input id="editReturnDate" type="date" value="${selectedPlayer.returnDate||''}">
              <div style="font-size:11px;color:var(--ink-soft);margin-top:4px;">Stima interna dello staff, il giocatore non la vede.</div>
            </div>

            <div class="btn-row">
              <button class="btn" id="savePlayerBtn">Salva</button>
              <button class="btn secondary" id="playerReportBtn">Scheda completa</button>
              <button class="btn secondary" id="closePlayerBtn">Chiudi</button>
            </div>
            <div style="margin-top:10px;">
              <button class="btn secondary" id="deletePlayerBtn" style="color:var(--clay);font-size:12px;padding:6px 10px;">Elimina giocatore</button>
            </div>
          </div>
        ` : `<div class="card"><div class="empty">Seleziona un giocatore dall'elenco</div></div>`}
      </div>
    </div>
  `;

  const tbody = document.getElementById('playersTableBody');
  STATE.players.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name))).forEach(p=>{
    const tr = document.createElement('tr');
    tr.className = 'player-row';
    tr.style.cursor = 'pointer';
    if(String(selectedId)===String(p.id)) tr.style.cssText += 'background:var(--chalk);border-left:4px solid var(--amber);cursor:pointer;';

    const hooper = getLatestHooperIndex(p.id);
    const hiDisplay = hooper
      ? `<span style="font-weight:700;color:${hooper.band.color};" title="${hooper.band.label} — rilevato il ${fmtDate(hooper.date)}">${hooper.score}</span>`
      : '<span style="color:var(--ink-soft);">—</span>';

    const meta = statusMeta(p.status);
    const returnInfo = (meta.needsDate && p.returnDate)
      ? `<div style="font-size:10px;color:var(--ink-soft);">rientro ${fmtDate(p.returnDate)}</div>` : '';

    const season = getSeasonStats(p.id);
    const openPain = getOpenPainIssues(p.id);
    const painDot = openPain.length
      ? `<span title="${openPain.length} problema/i aperto/i: ${openPain.map(i=>i.zone).join(', ')}" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${openPain[0].color};margin-left:6px;vertical-align:middle;"></span>`
      : '';

    tr.innerHTML = `
      <td><strong>${esc(p.name)}</strong>${painDot}</td>
      <td>${calcAge(p.birthDate)}</td>
      <td style="font-size:12px;">${esc(p.role||'—')}</td>
      <td style="font-size:12px;font-weight:600;">${season.minutes || '—'}</td>
      <td>${hiDisplay}</td>
      <td><span style="font-size:11px;font-weight:600;color:${meta.color};">${meta.label}</span>${returnInfo}</td>`;

    tr.addEventListener('click', (e)=>{
      if(e.target.closest('button')) return;
      el.dataset.selectedPlayerId = p.id;
      delete el.dataset.addingNew;
      renderGiocatori(el);
    });
    tbody.appendChild(tr);
  });

  // Mostra il campo rientro solo se lo stato lo richiede
  const statusSel = document.getElementById('editStatus');
  if(statusSel){
    statusSel.addEventListener('change', ()=>{
      const wrap = document.getElementById('returnDateWrap');
      if(wrap) wrap.style.display = statusMeta(statusSel.value).needsDate ? 'block' : 'none';
    });
  }

  const reportBtn = document.getElementById('playerReportBtn');
  if(reportBtn && selectedPlayer){
    reportBtn.addEventListener('click', ()=> showPlayerReport(selectedPlayer.id));
  }

  // Add player button
  const addBtn = document.getElementById('addPlayerBtn');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      el.dataset.addingNew = 'true';
      delete el.dataset.selectedPlayerId;
      renderGiocatori(el);
    });
  }
  
  // Confirm add player
  const confirmAddBtn = document.getElementById('confirmAddPlayerBtn');
  if(confirmAddBtn){
    confirmAddBtn.addEventListener('click', async ()=>{
      const name = document.getElementById('newName').value.trim();
      const birthDate = document.getElementById('newBirthDate').value;
      const role = document.getElementById('newRole').value;
      const foot = document.getElementById('newFoot').value;
      if(!name || !birthDate || !role){
        showToast('Completa tutti i campi');
        return;
      }

      const newPlayer = {
        id: uid(),
        name,
        birthDate,
        role,
        foot,
        status: 'Disponibile',
        returnDate: ''
      };

      STATE.players.push(newPlayer);
      await saveKey('players', STATE.players);

      // Genera subito il codice di accesso
      await setAccessCode(newPlayer.id, generateAccessCode());

      showToast('Giocatore aggiunto, codice generato');
      delete el.dataset.addingNew;
      el.dataset.selectedPlayerId = newPlayer.id;
      renderGiocatori(el);
    });
  }
  
  // Cancel add player
  const cancelAddBtn = document.getElementById('cancelAddPlayerBtn');
  if(cancelAddBtn){
    cancelAddBtn.addEventListener('click', ()=>{
      delete el.dataset.addingNew;
      renderGiocatori(el);
    });
  }
  
  const delBtn = document.getElementById('deletePlayerBtn');
  if(delBtn && selectedPlayer){
    delBtn.addEventListener('click', async ()=>{
      if(!confirm('Eliminare ' + selectedPlayer.name + ' dalla rosa?')) return;
      if(!confirm('Conferma definitiva.\n\nVerranno persi anche il suo codice di accesso e il collegamento ai dati registrati.')) return;

      const pid = selectedPlayer.id;
      STATE.players = STATE.players.filter(p => String(p.id) !== String(pid));
      if(STATE.accessCodes && STATE.accessCodes[pid]){
        delete STATE.accessCodes[pid];
        await saveKey('accessCodes', STATE.accessCodes);
      }
      await saveKey('players', STATE.players);
      showToast('Giocatore eliminato');
      delete el.dataset.selectedPlayerId;
      renderGiocatori(el);
    });
  }
  
  if(selectedPlayer){
    document.getElementById('savePlayerBtn').addEventListener('click', async ()=>{
      const name = document.getElementById('editName').value.trim();
      if(!name){ showToast('Il nome non puo essere vuoto'); return; }

      const roleVal = document.getElementById('editRole').value;
      const footVal = document.getElementById('editFoot').value;
      if(!roleVal){ showToast('Seleziona un ruolo'); return; }
      if(!footVal){ showToast('Seleziona il piede forte'); return; }

      const newStatus = document.getElementById('editStatus').value;
      const needsDate = statusMeta(newStatus).needsDate;
      const returnEl = document.getElementById('editReturnDate');
      const returnDate = (needsDate && returnEl) ? returnEl.value : '';

      const statusChanged = newStatus !== selectedPlayer.status;
      if(statusChanged && !confirm('Cambiare lo stato di ' + selectedPlayer.name + ' da "' + (selectedPlayer.status||'—') + '" a "' + newStatus + '"?')) return;

      selectedPlayer.name = name;
      selectedPlayer.birthDate = document.getElementById('editBirthDate').value;
      selectedPlayer.role = roleVal;
      selectedPlayer.foot = footVal;
      selectedPlayer.status = newStatus;
      selectedPlayer.returnDate = returnDate;

      // Chi non e' disponibile non resta segnato presente
      if(newStatus !== 'Disponibile'){
        let removed = 0;
        STATE.events.forEach(ev=>{
          if(Array.isArray(ev.presentPlayers) && ev.date >= todayStr()){
            const i = ev.presentPlayers.indexOf(selectedPlayer.id);
            if(i !== -1){ ev.presentPlayers.splice(i,1); ev.presentCount = ev.presentPlayers.length; removed++; }
          }
        });
        if(removed > 0) await saveKey('events', STATE.events);
      }

      await saveKey('players', STATE.players);
      showToast('Modifiche salvate');
      renderGiocatori(el);
    });

    document.getElementById('closePlayerBtn').addEventListener('click', ()=>{
      delete el.dataset.selectedPlayerId;
      renderGiocatori(el);
    });
  }
}

/* ---------- TEST ---------- */
function renderTest(el){
  const selectedTestId = el.dataset.selectedTestId || null;
  const selectedTest = selectedTestId ? STATE.tests.find(t=>t.id===selectedTestId) : null;
  
  el.innerHTML = `
    <div class="page-head"><h1>Test</h1><p>Crea test e registra i risultati</p></div>
    
    ${!selectedTestId ? `
    <div class="card">
      <h3>Nuovo test</h3>
      <div class="grid2">
        <div><label>Nome del test</label><input id="testName" type="text" placeholder="Es. Test 30-15 - Settimana 1"></div>
        <div><label>Tipo di test</label><select id="testType">${Object.keys(TEST_SPECS).map(t=>`<option>${t}</option>`).join('')}</select></div>
      </div>
      <div class="grid2">
        <div><label>Data</label><input id="testDate" type="date" value="${todayStr()}"></div>
        <div><label>Unità di misura</label><input id="testUnit" type="text" readonly></div>
      </div>
      <div id="descDisplay" style="font-size:12px;color:var(--ink-soft);margin-top:8px;padding:8px;background:var(--chalk);border-radius:6px;"></div>
      <div class="btn-row"><button class="btn" id="createTestBtn">Crea test</button></div>
    </div>
    ` : ''}
    
    <div class="card">
      <h3>Test disponibili (${STATE.tests.length})</h3>
      ${STATE.tests.length===0 ? '<div class="empty">Nessun test creato</div>' :
        STATE.tests.slice().reverse().map(t=>`
          <div style="border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;background:var(--chalk);">
            <div style="display:flex;justify-content:space-between;align-items:start;">
              <div>
                <h4 style="margin:0 0 6px 0;color:var(--pitch);font-size:13px;">${esc(t.name)}</h4>
                <span style="font-size:11px;color:var(--ink-soft);">${fmtDate(t.date)} | ${t.type}${t.unit ? ' (' + t.unit + ')' : ''} | ${t.results?.length||0} giocatori</span>
              </div>
              <div style="display:flex;gap:6px;">
                <button style="background:none;border:none;color:${selectedTestId===t.id?'var(--amber)':'var(--ink-soft)'};cursor:pointer;font-size:14px;" data-select-test="${t.id}">→</button>
                <button style="background:none;border:none;color:var(--clay);cursor:pointer;font-size:12px;" data-del-test="${t.id}">✕</button>
              </div>
            </div>
            ${selectedTestId===t.id ? `
              <div style="border-top:1px solid var(--line);padding-top:12px;">
                <h4 style="margin:0 0 12px 0;font-size:13px;color:var(--pitch);">Inserisci valori test${t.unit ? ' (' + t.unit + ')' : ''}</h4>
                <table style="width:100%;border-collapse:collapse;">
                  <thead>
                    <tr style="background:var(--chalk);border-bottom:1px solid var(--line);">
                      <th style="text-align:left;padding:8px;font-size:12px;font-weight:600;color:var(--ink-soft);">Giocatore</th>
                      <th style="text-align:center;padding:8px;font-size:12px;font-weight:600;color:var(--ink-soft);">Valore</th>
                      <th style="text-align:center;padding:8px;font-size:12px;font-weight:600;color:var(--ink-soft);">Azioni</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${STATE.players.map(p=>{
                      const result = t.results?.find(r=>r.playerId===p.id);
                      return `
                        <tr data-player-row="${p.id}" style="border-bottom:1px solid #EEEAD9;">
                          <td style="padding:10px;font-size:13px;">${esc(p.name)}</td>
                          <td style="padding:10px;text-align:center;">
                            <input type="number" step="0.01" class="test-value-input" data-player-id="${p.id}" value="${result?.value||''}" placeholder="-" style="width:80px;padding:6px;border:1px solid var(--line);border-radius:4px;text-align:center;">
                          </td>
                          <td style="padding:10px;text-align:center;">
                            ${result ? 
                              `<button class="test-remove-btn" data-player-id="${p.id}" style="background:none;border:none;color:var(--clay);cursor:pointer;font-size:13px;font-weight:600;">✕</button>` 
                              : `<button class="test-add-btn" data-player-id="${p.id}" style="background:none;border:none;color:var(--ok);cursor:pointer;font-size:13px;font-weight:600;">+</button>`
                            }
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
                <button class="btn" id="saveTestResultsBtn" style="margin-top:12px;">💾 Salva Risultati</button>
              </div>
            ` : ''}
          </div>
        `).join('')}
    </div>
  `;
  
  const typeSelect = document.getElementById('testType');
  if(typeSelect){
    const updateUnit = ()=>{
      const spec = TEST_SPECS[typeSelect.value];
      if(!spec) return;   // valore non riconosciuto: non blocco la pagina
      const u = document.getElementById('testUnit');
      const d = document.getElementById('descDisplay');
      if(u) u.value = spec.unit;
      if(d) d.textContent = spec.description;
    };
    updateUnit();
    typeSelect.addEventListener('change', updateUnit);
  }
  
  if(document.getElementById('createTestBtn')){
    document.getElementById('createTestBtn').addEventListener('click', async ()=>{
      const name = document.getElementById('testName').value.trim();
      const type = document.getElementById('testType').value;
      const date = document.getElementById('testDate').value;
      if(!name){ showToast('Inserisci il nome del test'); return; }
      const spec = TEST_SPECS[type];
      STATE.tests.push({id:uid(), name, type, unit:(spec ? spec.unit : ''), date, results:[]});
      await saveKey('tests', STATE.tests);
      showToast('Test creato');
      render();
    });
  }
  
  el.querySelectorAll('[data-select-test]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      el.dataset.selectedTestId = el.dataset.selectedTestId===b.dataset.selectTest ? null : b.dataset.selectTest;
      renderTest(el);
    });
  });
  
  el.querySelectorAll('[data-del-test]').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Sei sicuro di voler eliminare questo test? L\'azione non può essere annullata.')) return;
      STATE.tests = STATE.tests.filter(t=>t.id!==b.dataset.delTest);
      await saveKey('tests', STATE.tests);
      renderTest(el);
    });
  });
  
  // New: handle test results with input fields
  if(selectedTest && document.getElementById('saveTestResultsBtn')){
    document.getElementById('saveTestResultsBtn').addEventListener('click', async ()=>{
      const inputs = el.querySelectorAll('.test-value-input');
      let count = 0;
      selectedTest.results = [];
      
      inputs.forEach(inp=>{
        const playerId = inp.dataset.playerId; // gli id sono testuali: niente parseInt
        const value = inp.value.trim();
        if(value){
          selectedTest.results.push({playerId, value: parseFloat(value)});
          count++;
        }
      });
      
      if(count === 0){
        showToast('Inserisci almeno un valore');
        return;
      }
      
      await saveKey('tests', STATE.tests);
      showToast(`✅ ${count} risultati salvati`);
      renderTest(el);
    });

    // Add giocatore button - focus input
    el.querySelectorAll('.test-add-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const playerId = btn.dataset.playerId;
        const input = el.querySelector(`.test-value-input[data-player-id="${playerId}"]`);
        if(input) {
          input.focus();
          input.select();
        }
      });
    });

    // Remove giocatore button
    el.querySelectorAll('.test-remove-btn').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        if(!confirm('Sei sicuro di voler rimuovere questo giocatore dal test?')) return;
        const playerId = btn.dataset.playerId;
        const input = el.querySelector(`.test-value-input[data-player-id="${playerId}"]`);
        if(input) input.value = '';
        if(selectedTest.results){
          selectedTest.results = selectedTest.results.filter(r=>r.playerId!==playerId);
          await saveKey('tests', STATE.tests);
          showToast('Giocatore rimosso');
          renderTest(el);
        }
      });
    });
  }
}

/* ---------- ALLENAMENTI (Database Esercitazioni) ---------- */
function renderAllenamenti(el){
  el.innerHTML = `
    <div class="page-head"><h1>Allenamenti</h1><p>Catalogo esercitazioni di allenamento</p></div>
    
    <div class="card">
      <h3>Nuova esercitazione</h3>
      <div class="grid2">
        <div><label>Categoria di lavoro</label><select id="workoutCategory"><option>Tecnico-tattico</option><option>Atletico</option></select></div>
        <div><label>Tipo specifico</label><select id="workoutType"></select></div>
      </div>
      <label>Nome esercitazione</label><input id="workoutName" type="text" placeholder="Es. Rondo 4v2">
      <div id="workoutParamsDiv"></div>
      <div class="btn-row"><button class="btn" id="createWorkoutBtn">Crea esercitazione</button></div>
    </div>
    
    <div class="card">
      <h3>Esercitazioni disponibili (${STATE.workouts.length})</h3>
      ${STATE.workouts.length===0 ? '<div class="empty">Nessuna esercitazione catalogata</div>' :
        STATE.workouts.map(w=>`
          <div class="workout-item">
            <h4>${esc(w.name)}</h4>
            <div class="workout-item-row">
              <div><span style="font-size:10px;color:var(--ink-soft);">${w.category}</span> - ${esc(w.type)}</div>
              <div>Durata: <span class="workout-item-val">${calcWorkoutDuration(w)}min</span></div>
              <div style="display:flex;gap:8px;">
                <button style="background:none;border:none;color:var(--amber);cursor:pointer;font-size:12px;" data-edit-workout="${w.id}">Modifica</button>
                <button style="background:none;border:none;color:var(--clay);cursor:pointer;font-size:12px;" data-del-workout="${w.id}">Elimina</button>
              </div>
            </div>
            <div style="font-size:11px;color:var(--ink-soft);margin-top:6px;line-height:1.6;">
              ${w.category==='Tecnico-tattico' ? 
                `${w.teamsPlayers?.map(tp=>`Sq${tp.teamNumber}: ${tp.players}`).join(' | ')}${w.withGoalkeepers?' + portieri':''} (Tot: ${w.totalPlayers}) | Campo: ${w.fieldLength}×${w.fieldWidth}m | ${w.squareMetersPerPlayer}m²/giocatore | ${w.series}×${w.minutesPerSeries}min + ${w.recovery}min recupero` :
                w.type==='Forza massima' ? `${w.exercise}, ${w.series}×${w.reps}, Recupero: ${w.recovery}min` :
                w.type.includes('Intermittente') || w.type.includes('Lavoro intermittente') || w.type==='Differenziato' || w.type.includes('HIIT') ? `Serie: ${w.series} × ${w.minutesPerSeries}min, Recupero: ${w.recovery}min` :
                w.type==='Resistenza aerobica a secco' ? `Durata: ${w.minutes}min` :
                w.type.includes('Speed') || w.type.includes('Cambi') ? `Serie: ${w.series} × ${w.distance}m, Recupero: ${w.recovery}min` :
                w.minutes ? `Durata: ${w.minutes}min` : '-'
              }
            </div>
            ${w.groups && w.groups.length>0 ? `
              <div style="margin-top:8px;padding:8px;background:#F9F5ED;border-radius:4px;border-left:3px solid var(--amber);">
                ${w.groups.map(g=>`
                  <div style="font-size:10px;margin-bottom:4px;color:var(--pitch);">
                    <strong>${esc(g.name)}</strong>: ${g.players.length} giocatori
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `).join('')}
    </div>
  `;
  
  const categorySelect = document.getElementById('workoutCategory');
  const typeSelect = document.getElementById('workoutType');
  const paramsDiv = document.getElementById('workoutParamsDiv');

  // Il form di creazione non e' sempre presente: se manca, non collego nulla
  if(categorySelect && typeSelect && paramsDiv){
  const updateTypeOptions = ()=>{

/* ---------- CALENDARIO (Sessioni) ---------- */
/* Helper functions for matches */
function getTodayEvents(){
  const today = todayStr();
  return STATE.events.filter(e => e.date === today && e.type === 'Partita');
}

function getNextMatch(){
  const today = todayStr();
  return STATE.events.find(e => e.date >= today && e.type === 'Partita' && e.date !== today) || null;
}

function getLastMatch(){
  const today = todayStr();
  return STATE.events.slice().reverse().find(e => e.date < today && e.type === 'Partita') || null;
}

function getMatchStats(match){
  const stats = {
    goals: {},
    assists: {},
    lineup: {}
  };
  if(match.goals){
    match.goals.forEach(g => {
      stats.goals[g.playerId] = (stats.goals[g.playerId] || 0) + 1;
    });
  }
  if(match.assists){
    match.assists.forEach(a => {
      stats.assists[a.playerId] = (stats.assists[a.playerId] || 0) + 1;
    });
  }
  if(match.lineup){
    match.lineup.forEach(l => {
      stats.lineup[l.playerId] = l;
    });
  }
  return stats;
}

function getMatchesAroundDate(date){
  const matches = STATE.events.filter(e=>e.type==='Partita').sort((a,b)=>a.date.localeCompare(b.date));
  const before = matches.reverse().find(m=>m.date<date) || null;
  const after = matches.find(m=>m.date>date) || null;
  return {before, after};
}

function calculateMD(date){
  const {before, after} = getMatchesAroundDate(date);
  
  // Se non c'è nessuna partita
  if(!before && !after) return null;
  
  // Solo partita precedente
  if(before && !after) {
    const daysAfter = Math.floor((new Date(date) - new Date(before.date)) / (1000*60*60*24));
    return `MD+${daysAfter}`;
  }
  
  // Solo partita successiva
  if(!before && after) {
    const daysBefore = Math.floor((new Date(after.date) - new Date(date)) / (1000*60*60*24));
    return `MD-${daysBefore}`;
  }
  
  // Entrambe le partite: formato MD+X/-Y
  const daysAfterBefore = Math.floor((new Date(date) - new Date(before.date)) / (1000*60*60*24));
  const daysBeforeAfter = Math.floor((new Date(after.date) - new Date(date)) / (1000*60*60*24));
  return `MD+${daysAfterBefore}/-${daysBeforeAfter}`;
}

function getTodayWorkout(){
  const today = todayStr();
  return STATE.events.find(e => e.date === today && e.type === 'Allenamento') || null;
}

function isGoalkeeper(p){
  return (p.role || '').toLowerCase().indexOf('portiere') !== -1;
}

function getPlayersOfMovement(){
  return STATE.players.filter(p => !isGoalkeeper(p));
}

function getGoalkeepers(){
  return STATE.players.filter(p => isGoalkeeper(p));
}

/* Un giocatore puo' segnare la presenza solo se e' Disponibile */
function canMarkPresence(player){
  return player && player.status === 'Disponibile';
}

/* Riepilogo completo della presenza per un evento */
function getPresenceBreakdown(eventId){
  const event = STATE.events.find(e => e.id === eventId);
  const present = (event && Array.isArray(event.presentPlayers)) ? event.presentPlayers : [];
  const isIn = p => present.includes(p.id);

  const movement = getPlayersOfMovement();
  const keepers = getGoalkeepers();

  const movAvail = movement.filter(p => p.status === 'Disponibile');
  const keepAvail = keepers.filter(p => p.status === 'Disponibile');

  return {
    presentIds: present,
    movement: {
      available: movAvail,
      present: movAvail.filter(isIn),
      absent: movAvail.filter(p => !isIn(p)),
      injured: movement.filter(p => p.status === 'Infortunato'),
      returning: movement.filter(p => p.status === 'RTP' || p.status === 'In valutazione' || p.status === 'In rientro')
    },
    keepers: {
      available: keepAvail,
      present: keepAvail.filter(isIn),
      absent: keepAvail.filter(p => !isIn(p)),
      injured: keepers.filter(p => p.status === 'Infortunato'),
      returning: keepers.filter(p => p.status === 'RTP' || p.status === 'In valutazione' || p.status === 'In rientro')
    }
  };
}

function getTodayPresenceCount(eventId){
  const b = getPresenceBreakdown(eventId);
  return {
    present: b.movement.present.length + b.keepers.present.length,
    total: b.movement.available.length + b.keepers.available.length
  };
}

function isPlayerPresentToday(playerId){
  const todayEvent = getTodayWorkout();
  if(!todayEvent || !Array.isArray(todayEvent.presentPlayers)) return null;
  return todayEvent.presentPlayers.includes(playerId);
}

async function setPlayerPresence(eventId, playerId, present){
  const event = STATE.events.find(e => e.id === eventId);
  if(!event) return false;
  if(!Array.isArray(event.presentPlayers)) event.presentPlayers = [];
  const idx = event.presentPlayers.indexOf(playerId);
  if(present && idx === -1) event.presentPlayers.push(playerId);
  if(!present && idx !== -1) event.presentPlayers.splice(idx, 1);
  event.presentCount = event.presentPlayers.length;
  await saveKey('events', STATE.events);
  return true;
}

/* ---------- CONVOCAZIONI ---------- */
function isConvocato(event, playerId){
  return !!(event && Array.isArray(event.convocati) && event.convocati.includes(String(playerId)));
}

/* La prossima partita per cui il giocatore risulta convocato o escluso */
function getNextMatchForPlayer(playerId){
  const today = todayStr();
  const future = STATE.events
    .filter(e => e.type === 'Partita' && e.date && e.date >= today && Array.isArray(e.convocati))
    .sort((a,b) => String(a.date).localeCompare(String(b.date)));
  return future[0] || null;
}

async function toggleConvocato(eventId, playerId){
  const event = STATE.events.find(e => e.id === eventId);
  if(!event) return;
  if(!Array.isArray(event.convocati)) event.convocati = [];
  const id = String(playerId);
  const i = event.convocati.indexOf(id);
  if(i === -1) event.convocati.push(id); else event.convocati.splice(i, 1);
  await saveKey('events', STATE.events);
}

        STATE.events.push({id:uid(), date, time, title: md, type:'Allenamento', workoutIds, md});
        await saveKey('events', STATE.events);
        showToast('✅ Sessione incollata per ' + fmtDate(date) + (workoutIds.length > 0 ? ` con ${workoutIds.length} esercitazione(i)` : ''));
        render();
      });
    }
  }
  
  // Edit and delete match
  if(isStaff){
    el.querySelectorAll('[id^="evt_edit_"]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const eventId = b.id.substring(9);

    // Delete event - using class and data attribute
    el.querySelectorAll('.deleteEventBtn').forEach(b=>{
      b.addEventListener('click', async (e)=>{
        e.preventDefault();

        if(!confirm('Sei sicuro di voler eliminare questo evento? L\'azione non può essere annullata.')) return;
        const eventId = b.dataset.eventId;
        STATE.events = STATE.events.filter(evt=>evt.id!==eventId);
        await saveKey('events', STATE.events);
        showToast('✅ Evento eliminato');
        render();
      });

  // Timeline event click
  el.querySelectorAll('.timelineEvent').forEach(card=>{
    card.addEventListener('click', ()=>{
      const eventId = card.dataset.eventId;
      const event = STATE.events.find(e=>e.id===eventId);
      if(!event) return;
      if(event.type === 'Partita' && isStaff){
        renderMatchDetails(event);
      } else if(event.type === 'Allenamento' && isStaff){
        renderAllenamentoDetails(event);
      }
    });
  });
}

            <select id="addWorkoutSelect" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:4px;font-size:12px;">

              ${STATE.workouts.map(w=>`<option value="${w.id}">${esc(w.name)} (${calcWorkoutDuration(w)}min)</option>`).join('')}
            </select>
            <button id="addWorkoutBtn" class="btn" style="padding:8px 16px;font-size:12px;">+ Aggiungi</button>
          </div>
        </div>
      </div>
      
      <div style="text-align:right;display:flex;gap:12px;justify-content:flex-end;">
        <button id="copyAllenamentoBtn" class="btn secondary" style="padding:8px 20px;">📋 Copia</button>
        <button id="saveAllenamentoBtn" class="btn" style="padding:8px 20px;">Salva</button>
      </div>
    </div>
  `;
  
  document.body.appendChild(modal);
  
  // Close button
  document.getElementById('closeAllenamentoModal').addEventListener('click', ()=>{
    modal.remove();
  });
  
  // Close on backdrop click
  modal.addEventListener('click', (e)=>{
    if(e.target === modal) modal.remove();
  });
  
  // Delete workout
  modal.querySelectorAll('.del-workout-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const wid = btn.dataset.workoutId;
      event.workoutIds = event.workoutIds.filter(id => id !== wid);
      renderAllenamentoDetails(event); // Refresh
    });
  });
  
  // Add workout
  document.getElementById('addWorkoutBtn').addEventListener('click', ()=>{
    const selectEl = document.getElementById('addWorkoutSelect');
    const wid = selectEl.value;
    if(!wid){
      showToast('Seleziona un esercitazione');
      return;
    }
    if(!event.workoutIds) event.workoutIds = [];
    if(!event.workoutIds.includes(wid)){
      event.workoutIds.push(wid);
    }
    selectEl.value = '';
    renderAllenamentoDetails(event); // Refresh
  });
  
  // Copy button
  document.getElementById('copyAllenamentoBtn').addEventListener('click', ()=>{
    // Salva temporaneamente in clipboard interno
    window.clipboardEvent = {type: 'allenamento', data: JSON.parse(JSON.stringify(event))};
    showToast('📋 Sessione copiata! Seleziona una data e premi "Incolla"');
    modal.remove();
  });
  
  // Save
  document.getElementById('saveAllenamentoBtn').addEventListener('click', async ()=>{
    const idx = STATE.events.findIndex(e => e.id === event.id);
    if(idx >= 0){
      STATE.events[idx] = event;
      await saveKey('events', STATE.events);
      showToast('✅ Allenamento aggiornato');
      render();
      modal.remove();
    }
  });
}

      <div style="margin-bottom:12px;"><strong>Serie:</strong> ${workout.series} × ${workout.minutesPerSeries}min</div>

      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:20px;">

          <div style="font-size:12px;color:var(--ink-soft);">${esc(workout.category)} · ${esc(workout.type)}</div>
        </div>

        <div style="background:var(--chalk);padding:16px;border-radius:8px;margin-bottom:16px;">

function renderEditAllenamentoModal(event){
  const existing = document.getElementById('allenamentoModal');
  if(existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'allenamentoModal';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;box-sizing:border-box;overflow-y:auto;';

  const ids = Array.isArray(event.workoutIds) ? event.workoutIds : [];
  const totalMin = ids.reduce((sum, wid)=>{
    const w = STATE.workouts.find(x=>x.id===wid);
    return sum + (w ? calcWorkoutDuration(w) : 0);
  }, 0);

  modal.innerHTML = `
    <div style="background:white;border-radius:12px;max-width:640px;width:100%;padding:24px;margin:auto;">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:18px;">
        <h2 style="margin:0;color:var(--pitch);">Modifica allenamento</h2>
        <button id="closeAllenamentoModal" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;">&#10005;</button>
      </div>

      <div class="grid2" style="gap:12px;">
        <div>
          <label>Titolo</label>
          <input id="editEventTitle" type="text" value="${esc(event.title || '')}">
        </div>
        <div>
          <label>Data</label>
          <input id="editEventDate" type="date" value="${event.date || ''}">
        </div>
      </div>
      <div class="grid2" style="gap:12px;">
        <div>
          <label>Orario</label>
          <input id="editEventTime" type="text" value="${esc(event.time || '')}" placeholder="Es. 19:30">
        </div>
        <div>
          <label>Luogo</label>
          <input id="editEventLocation" type="text" value="${esc(event.location || '')}" placeholder="Campo">
        </div>
      </div>
      <label>Note</label>
      <textarea id="editEventNotes" placeholder="Note per la sessione">${esc(event.notes || '')}</textarea>

      <div style="border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h4 style="margin:0;color:var(--pitch);font-size:13px;">Esercitazioni (${ids.length})</h4>
          <span style="font-size:12px;color:var(--ink-soft);">Totale ${totalMin} min</span>
        </div>

        ${ids.length > 0 ? ids.map((wid, i) => {
          const w = STATE.workouts.find(x=>x.id===wid);
          if(!w) return '';
          return `
            <div style="padding:10px;background:var(--chalk);border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <div class="workout-preview" data-workout-id="${wid}" style="flex:1;cursor:pointer;">
                <div style="font-size:13px;font-weight:600;">${esc(w.name)}</div>
                <div style="font-size:11px;color:var(--ink-soft);">${esc(w.category)} &middot; ${esc(w.type)} &middot; ${calcWorkoutDuration(w)} min &middot; tocca per i dettagli</div>
              </div>
              <div style="display:flex;gap:4px;">
                <button class="move-workout" data-index="${i}" data-dir="-1" ${i===0 ? 'disabled' : ''} style="background:none;border:1px solid var(--line);border-radius:4px;padding:2px 7px;cursor:pointer;font-size:12px;">&#8593;</button>
                <button class="move-workout" data-index="${i}" data-dir="1" ${i===ids.length-1 ? 'disabled' : ''} style="background:none;border:1px solid var(--line);border-radius:4px;padding:2px 7px;cursor:pointer;font-size:12px;">&#8595;</button>
                <button class="del-workout-from-event" data-workout-id="${wid}" style="background:none;border:1px solid var(--line);border-radius:4px;color:var(--clay);padding:2px 7px;cursor:pointer;font-size:12px;">&#10005;</button>
              </div>
            </div>`;
        }).join('') : '<div style="font-size:12px;color:var(--ink-soft);padding:12px;background:var(--chalk);border-radius:6px;margin-bottom:10px;">Nessuna esercitazione. Aggiungine una qui sotto.</div>'}

        <div style="border-top:1px solid var(--line);padding-top:12px;margin-top:12px;">
          <label style="margin-top:0;">Aggiungi esercitazione</label>
          <div style="display:flex;gap:8px;">
            <select id="addWorkoutToEventSelect" style="flex:1;">
              <option value="">-- Seleziona --</option>
              ${STATE.workouts.map(w=>`<option value="${w.id}">${esc(w.name)} (${calcWorkoutDuration(w)} min)</option>`).join('')}
            </select>
            <button id="addWorkoutToEventBtn" class="btn" style="padding:8px 12px;font-size:12px;white-space:nowrap;">Aggiungi</button>
          </div>
        </div>
      </div>

      <div class="btn-row" style="justify-content:flex-end;">
        <button id="closeAllenamentoBtn" class="btn secondary">Annulla</button>
        <button id="saveAllenamentoBtn" class="btn">Salva</button>
      </div>
    </div>
  `;

  document.body.appendChild(modal);

  const close = ()=> modal.remove();
  document.getElementById('closeAllenamentoModal').addEventListener('click', close);
  document.getElementById('closeAllenamentoBtn').addEventListener('click', close);
  modal.addEventListener('click', (e)=>{ if(e.target === modal) close(); });

  // Apri i dettagli di un'esercitazione
  modal.querySelectorAll('.workout-preview').forEach(row=>{
    row.addEventListener('click', ()=>{
      const w = STATE.workouts.find(x=>x.id===row.dataset.workoutId);
      if(w) showWorkoutDetailsModal(w);
    });
  });

  // Rimuovi esercitazione
  modal.querySelectorAll('.del-workout-from-event').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      event.workoutIds = (event.workoutIds || []).filter(id => id !== btn.dataset.workoutId);
      renderEditAllenamentoModal(event);
    });
  });

  // Riordina esercitazioni
  modal.querySelectorAll('.move-workout').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.index, 10);
      const dir = parseInt(btn.dataset.dir, 10);
      const arr = event.workoutIds || [];
      const j = i + dir;
      if(j < 0 || j >= arr.length) return;
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      event.workoutIds = arr;
      renderEditAllenamentoModal(event);
    });
  });

  // Aggiungi esercitazione
  document.getElementById('addWorkoutToEventBtn').addEventListener('click', ()=>{
    const sel = document.getElementById('addWorkoutToEventSelect');
    const wid = sel.value;
    if(!wid){ showToast('Seleziona un\'esercitazione'); return; }
    if(!Array.isArray(event.workoutIds)) event.workoutIds = [];
    event.workoutIds.push(wid);
    renderEditAllenamentoModal(event);
  });

  // Salva
  document.getElementById('saveAllenamentoBtn').addEventListener('click', async ()=>{
    event.title = document.getElementById('editEventTitle').value.trim() || event.title;
    event.date = document.getElementById('editEventDate').value || event.date;
    event.time = document.getElementById('editEventTime').value.trim();
    event.location = document.getElementById('editEventLocation').value.trim();
    event.notes = document.getElementById('editEventNotes').value.trim();

    const idx = STATE.events.findIndex(e => e.id === event.id);
    if(idx >= 0) STATE.events[idx] = event;
    await saveKey('events', STATE.events);
    showToast('Allenamento aggiornato');
    close();
    render();
  });
}

        <h4 style="margin:0 0 10px 0;color:var(--pitch);font-size:13px;">Durata partita</h4>
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="matchDuration" type="number" min="1" max="150" value="${matchDuration(match)}" style="width:80px;padding:8px;border:1px solid var(--line);border-radius:6px;text-align:center;">
          <span style="font-size:12px;color:var(--ink-soft);">minuti — usa 120 per i supplementari</span>
        </div>
      </div>

      <!-- TITOLARI -->
      <div style="border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px;background:#F7F5EC;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <h4 style="margin:0;color:var(--pitch);font-size:13px;">In campo dall'inizio</h4>
          <span id="starterCount" style="font-size:12px;font-weight:700;"></span>
        </div>
        <div id="startersBox">
          ${(()=>{
            const st = Array.isArray(match.starters) ? match.starters : [];
            if(st.length === 0) return '<div style="font-size:12px;color:var(--ink-soft);padding:10px;text-align:center;">Nessun titolare. Spuntali dalla lista qui sotto.</div>';
            const calc = computeMatchMinutes(match);
            return st.map(pid=>{
              const pl = STATE.players.find(x=>String(x.id)===String(pid));
              if(!pl) return '';
              const r = calc[String(pid)] || {minutes: matchDuration(match), reason:null};
              return `
                <div style="padding:8px 10px;background:white;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;">
                  <div style="min-width:0;">
                    <div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(pl.name)}</div>
                    <div style="font-size:10px;color:var(--ink-soft);">${esc(pl.role||'—')} &middot; <strong>${r.minutes} min</strong>${r.reason ? ' &middot; ' + r.reason : ''}</div>
                  </div>
                  <button type="button" class="open-sub-btn" data-player-id="${pid}" style="background:none;border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:11px;cursor:pointer;white-space:nowrap;">Sostituisci</button>
                  <button type="button" class="open-red-btn" data-player-id="${pid}" style="background:none;border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:11px;cursor:pointer;color:var(--clay);white-space:nowrap;">Rosso</button>
                </div>`;
            }).join('');
          })()}
        </div>
      </div>

      <!-- EVENTI -->
      <div style="border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px;">
        <h4 style="margin:0 0 10px 0;color:var(--pitch);font-size:13px;">Cambi ed espulsioni</h4>
        <div id="eventsBox">
          ${(()=>{
            const items = [];
            (match.substitutions||[]).forEach(x=> items.push(Object.assign({kind:'sub'}, x)));
            (match.redCards||[]).forEach(x=> items.push(Object.assign({kind:'red'}, x)));
            items.sort((a,b)=>(a.minute||0)-(b.minute||0));
            if(items.length === 0) return '<div style="font-size:12px;color:var(--ink-soft);">Nessun evento registrato</div>';
            const nome = id=>{ const p = STATE.players.find(x=>String(x.id)===String(id)); return p ? esc(p.name) : 'giocatore rimosso'; };
            return items.map(it=>`
              <div style="padding:8px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;">
                <div style="font-size:13px;font-weight:700;color:var(--pitch);width:38px;">${it.minute}'</div>
                <div style="font-size:12px;">
                  ${it.kind === 'sub'
                    ? `<span style="color:var(--clay);">esce</span> ${nome(it.outPlayerId)} &rarr; <span style="color:var(--ok);">entra</span> ${nome(it.inPlayerId)}`
                    : `<span style="color:var(--clay);font-weight:600;">Espulso</span> ${nome(it.playerId)}`}
                </div>
                <button type="button" class="del-match-event" data-kind="${it.kind}" data-id="${it.id}" style="background:none;border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;color:var(--clay);">Elimina</button>
              </div>`).join('');
          })()}
        </div>
      </div>

      <!-- PANCHINA / ROSA -->
      <div style="border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:20px;">
        <h4 style="margin:0 0 4px 0;color:var(--pitch);font-size:13px;">Panchina</h4>
        <div style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">Spunta chi parte titolare. I minuti si calcolano da soli dai cambi.</div>
        <div style="max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;">
          ${(()=>{
            const st = (Array.isArray(match.starters) ? match.starters : []).map(String);
            const calc = computeMatchMinutes(match);
            const bench = STATE.players.slice()
              .filter(p=> st.indexOf(String(p.id)) === -1)
              .sort((a,b)=>String(a.name).localeCompare(String(b.name)));
            if(bench.length === 0) return '<div style="font-size:12px;color:var(--ink-soft);padding:10px;">Nessuno</div>';
            return bench.map(p=>{
              const meta = statusMeta(p.status);
              const unav = p.status !== 'Disponibile';
              const r = calc[String(p.id)];
              return `
                <div class="bench-row" style="padding:8px 10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;">
                  <input type="checkbox" class="starter-check" data-player-id="${p.id}" style="width:18px;height:18px;margin:0;cursor:pointer;">
                  <div style="min-width:0;">
                    <div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(p.name)}</div>
                    <div style="font-size:10px;color:var(--ink-soft);">${esc(p.role||'—')}${unav ? ` &middot; <span style="color:${meta.color};font-weight:600;">${meta.label}</span>` : ''}</div>
                  </div>
                  <div style="font-size:11px;color:${r ? 'var(--ok)' : 'var(--ink-soft)'};font-weight:${r?'700':'400'};white-space:nowrap;">${r ? r.minutes + ' min' : '—'}</div>
                </div>`;
            }).join('');
          })()}
        </div>
      </div>

      <div style="display:flex;gap:8px;">
        <button id="saveMatchBtn" class="btn" style="flex:1;">💾 Salva Partita</button>
        <button id="closeMatchModal2" class="btn secondary" style="flex:0.3;">Chiudi</button>
      </div>
    </div>
  `;
  
  document.body.appendChild(modal);
  
  const closeBtn = document.getElementById('closeMatchModal');
  const closeBtn2 = document.getElementById('closeMatchModal2');
  
  // --- Formazione ed eventi partita ---
  const refreshMatch = ()=>{ modal.remove(); renderMatchDetails(match); };

  // --- Convocazioni ---
  const updateConvocatiCount = ()=>{
    const n = (match.convocati || []).length;
    const out = document.getElementById('convocatiCount');
    if(out) out.textContent = n + (n === 1 ? ' convocato' : ' convocati');
  };
  updateConvocatiCount();

  modal.querySelectorAll('.convoca-check').forEach(chk=>{
    chk.addEventListener('change', async ()=>{
      await toggleConvocato(match.id, chk.dataset.playerId);
      updateConvocatiCount();
    });
  });

  const convocaTuttiBtn = document.getElementById('convocaTuttiBtn');
  if(convocaTuttiBtn){
    convocaTuttiBtn.addEventListener('click', async ()=>{
      match.convocati = STATE.players.filter(p=>p.status === 'Disponibile').map(p=>String(p.id));
      await saveKey('events', STATE.events);
      refreshMatch();
    });
  }

  const svuotaConvocatiBtn = document.getElementById('svuotaConvocatiBtn');
  if(svuotaConvocatiBtn){
    svuotaConvocatiBtn.addEventListener('click', async ()=>{
      match.convocati = [];
      await saveKey('events', STATE.events);
      refreshMatch();
    });
  }

  const updateStarterCount = ()=>{
    const n = (match.starters || []).length;
    const out = document.getElementById('starterCount');
    if(out){
      out.textContent = n + (n === 1 ? ' titolare' : ' titolari');
      out.style.color = (n === 11) ? 'var(--ok)' : (n > 11 ? 'var(--clay)' : 'var(--ink-soft)');
    }
  };
  updateStarterCount();

  // Spuntare un giocatore dalla panchina lo porta tra i titolari
  modal.querySelectorAll('.starter-check').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      if(!Array.isArray(match.starters)) match.starters = [];
      const pid = chk.dataset.playerId;
      if(chk.checked){
        if(match.starters.map(String).indexOf(String(pid)) === -1) match.starters.push(pid);
      }
      refreshMatch();
    });
  });

  // Togliere un titolare: click sul nome nel riquadro titolari non serve,
  // uso il pulsante Sostituisci; per rimuoverlo del tutto c'e' il rosso o il cambio.

  // Sostituzione
  modal.querySelectorAll('.open-sub-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const outId = btn.dataset.playerId;
      const outPl = STATE.players.find(x=>String(x.id)===String(outId));
      const dur = matchDuration(match);

      const minStr = prompt('Al minuto quanti esce ' + (outPl ? outPl.name : '') + '? (1-' + dur + ')', '');
      if(minStr === null) return;
      const minute = parseInt(minStr, 10);
      if(isNaN(minute) || minute < 0 || minute > dur){ showToast('Minuto non valido'); return; }

      // Chi e' gia' sceso in campo non puo' entrare di nuovo
      const calc = computeMatchMinutes(match);
      const disponibili = STATE.players.filter(pl => !calc[String(pl.id)]);
      if(disponibili.length === 0){ showToast('Nessun giocatore disponibile in panchina'); return; }

      const elenco = disponibili.map((pl,i)=> (i+1) + '. ' + pl.name).join('\n');
      const scelta = prompt('Chi entra al posto di ' + (outPl ? outPl.name : '') + '?\n\n' + elenco + '\n\nScrivi il numero:', '');
      if(scelta === null) return;
      const idx = parseInt(scelta, 10) - 1;
      if(isNaN(idx) || idx < 0 || idx >= disponibili.length){ showToast('Scelta non valida'); return; }

      if(!Array.isArray(match.substitutions)) match.substitutions = [];
      match.substitutions.push({
        id: uid(), minute: minute,
        outPlayerId: outId,
        inPlayerId: disponibili[idx].id
      });
      showToast('Cambio al ' + minute + "'");
      refreshMatch();
    });
  });

  // Espulsione
  modal.querySelectorAll('.open-red-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const pid = btn.dataset.playerId;
      const pl = STATE.players.find(x=>String(x.id)===String(pid));
      const dur = matchDuration(match);
      const minStr = prompt('Al minuto quanti e stato espulso ' + (pl ? pl.name : '') + '? (1-' + dur + ')', '');
      if(minStr === null) return;
      const minute = parseInt(minStr, 10);
      if(isNaN(minute) || minute < 0 || minute > dur){ showToast('Minuto non valido'); return; }

      if(!Array.isArray(match.redCards)) match.redCards = [];
      match.redCards.push({id: uid(), playerId: pid, minute: minute});
      showToast('Espulsione registrata');
      refreshMatch();
    });
  });

  // Elimina evento
  modal.querySelectorAll('.del-match-event').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm('Eliminare questo evento? I minutaggi verranno ricalcolati.')) return;
      const id = btn.dataset.id;
      if(btn.dataset.kind === 'sub'){
        match.substitutions = (match.substitutions||[]).filter(x=>x.id !== id);
      } else {
        match.redCards = (match.redCards||[]).filter(x=>x.id !== id);
      }
      refreshMatch();
    });
  });

  const durInput = document.getElementById('matchDuration');
  if(durInput){
    durInput.addEventListener('change', ()=>{
      const d = parseInt(durInput.value, 10);
      if(isNaN(d) || d < 1 || d > 150){ showToast('Durata non valida'); durInput.value = matchDuration(match); return; }
      match.duration = d;
      refreshMatch();
    });
  }

  if(closeBtn) closeBtn.addEventListener('click', ()=>modal.remove());
  if(closeBtn2) closeBtn2.addEventListener('click', ()=>modal.remove());
  
  // Add event (only for past matches)
  if(isPast && document.getElementById('addEventBtn')){
    document.getElementById('addEventBtn').addEventListener('click', ()=>{
      const type = document.getElementById('eventType').value;
      const minute = parseInt(document.getElementById('eventMinute').value);
      const playerId = parseInt(document.getElementById('eventPlayer').value);
      
      if(!playerId || minute < 0 || minute > 120){
        showToast('Completa campi');
        return;
      }
      
      if(!match.events) match.events = [];
      match.events.push({type, minute, playerId});
      renderMatchDetails(match);
      modal.remove();
    });
  }
  
  // Delete event
  modal.querySelectorAll('.del-evt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.evtIdx);
      if(match.events) match.events.splice(idx, 1);
      renderMatchDetails(match);
      modal.remove();
    });
  });
  
  // Save match
  if(document.getElementById('saveMatchBtn')){
    document.getElementById('saveMatchBtn').addEventListener('click', async ()=>{
      if(isPast){
        const homeGoalsVal = parseInt(document.getElementById('homeGoals').value || '0');
        const awayGoalsVal = parseInt(document.getElementById('awayGoals').value || '0');
        
        match.result = {
          goalsFor: isHome ? homeGoalsVal : awayGoalsVal,
          goalsAgainst: isHome ? awayGoalsVal : homeGoalsVal
        };
      }
      
      match.modulo = document.getElementById('modulo').value.trim();
      
      // I minuti sono calcolati dagli eventi: allineo match.lineup per le statistiche
      const nStarters = (match.starters || []).length;
      if(nStarters > 11 && !confirm('Hai indicato ' + nStarters + ' titolari, piu di 11. Salvare lo stesso?')) return;
      syncMatchLineup(match);

      await saveKey('events', STATE.events);
      showToast('✅ Partita salvata');
      modal.remove();
      render();
    });
  }
}

      <h3>Storico Hooper Index (ultimi 10)</h3>
      ${hooperEntries.length===0 ? '<div class="empty">Nessun storico</div>' :
        hooperEntries.map(h=>`<div style="padding:8px;border-bottom:1px solid var(--line);font-size:12px;"><strong>${fmtDate(h.date)}</strong> | S:${h.stress} So:${h.sleep} M:${h.muscles} U:${h.mood} = <span style="color:var(--amber);font-weight:600;">${Math.round((h.stress+h.sleep+h.muscles+h.mood)/20*100)}%</span></div>`).join('')}
    </div>
    
    <div class="card">
      <h3>Storico dolori</h3>
      ${painEntries.length===0 ? '<div class="empty">Nessun dolore registrato</div>' :
        painEntries.map(p=>`
          <div style="padding:10px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:var(--chalk);">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
              <strong>${esc(p.zone)} - ${esc(p.type)}</strong>
              <button style="background:none;border:none;color:var(--clay);cursor:pointer;font-size:12px;" data-del-pain="${p.id}">Elimina</button>
            </div>
            <div style="font-size:11px;color:var(--ink-soft);margin-bottom:4px;">${fmtDate(p.date)} | Intensità: <span style="color:var(--amber);font-weight:600;">${p.intensity}/10</span></div>
            ${p.notes ? `<div style="font-size:11px;margin-top:4px;padding:6px;background:white;border-radius:4px;">${esc(p.notes)}</div>` : ''}
          </div>
        `).join('')}
    </div>
  `;
  
  const vaiCal = document.getElementById('vaiCalendarioBtn');
  if(vaiCal) vaiCal.addEventListener('click', ()=> setPage('calendario'));

  const presentBtn = document.getElementById('markPresentBtn');
  if(presentBtn){
    presentBtn.addEventListener('click', async ()=>{
      await setPlayerPresence(todayEvent.id, STATE.currentPlayerId, true);
      showToast('Presenza registrata');
      render();
    });
  }
  const absentBtn = document.getElementById('markAbsentBtn');
  if(absentBtn){
    absentBtn.addEventListener('click', async ()=>{
      await setPlayerPresence(todayEvent.id, STATE.currentPlayerId, false);
      showToast('Segnato come assente');
      render();
    });
  }

  if(!hooperToday && document.getElementById('saveHooperBtn')){
    HOOPER_ITEMS.forEach(it=>{
      const input = document.getElementById('hi_' + it.key);
      const out = document.getElementById('hi_' + it.key + '_val');
      if(input && out){
        input.addEventListener('input', ()=>{ out.textContent = input.value; });
      }
    });

    document.getElementById('saveHooperBtn').addEventListener('click', async ()=>{
      const entry = {id:uid(), playerId:STATE.currentPlayerId, date:today, scale:7,
                     statusAtEntry: currentStatusOf(STATE.currentPlayerId)};
      HOOPER_ITEMS.forEach(it=>{
        const input = document.getElementById('hi_' + it.key);
        entry[it.key] = input ? (parseInt(input.value) || 4) : 4;
      });

      STATE.hooperLog.push(entry);
      await saveKey('hooper-log', STATE.hooperLog);

      const b = hooperBand(hooperScore(entry));
      showToast('Salvato — punteggio ' + hooperScore(entry) + '/28 (' + b.label + ')');
      render();
    });
  }
  
  if(document.getElementById('rpeInput')){
    document.getElementById('rpeInput').addEventListener('input', ()=>{
      document.getElementById('rpeVal').textContent = document.getElementById('rpeInput').value + '/10';
    });
  }
  
  if(document.getElementById('addRpeBtn')){
    document.getElementById('addRpeBtn').addEventListener('click', async ()=>{
      const sessionId = document.getElementById('rpeSession').value;
      const rpe = parseInt(document.getElementById('rpeInput').value) || 5;
      
      if(!sessionId){
        showToast('Seleziona una sessione');
        return;
      }
      
      STATE.rpeLog.push({id:uid(), playerId:STATE.currentPlayerId, date:today, sessionId, rpe,
                         statusAtEntry: currentStatusOf(STATE.currentPlayerId)});
      await saveKey('rpe-log', STATE.rpeLog);
      showToast('RPE salvato');
      render();
    });
  }
  
  if(document.getElementById('addPainBtn')){
    document.getElementById('addPainBtn').addEventListener('click', async ()=>{
      const zone = document.getElementById('painZone').value;
      const type = document.getElementById('painType').value;
      const intensity = parseInt(document.getElementById('painIntensity').value)||5;
      const notes = document.getElementById('painNotes').value.trim();
      
      STATE.painLog.push({id:uid(), playerId:STATE.currentPlayerId, date:today, zone, type, intensity, notes});
      await saveKey('pain-log', STATE.painLog);
      showToast('Dolore registrato');
      render();
    });
  }
  
  el.querySelectorAll('[data-del-pain]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm('Sei sicuro di voler eliminare questo dolore? L\'azione non può essere annullata.')) return;
      STATE.painLog = STATE.painLog.filter(p=>p.id!==b.dataset.delPain);
      await saveKey('pain-log', STATE.painLog);
      showToast('Dolore eliminato');
      render();
    });
  });
  } catch(err) {
    console.error('Errore in renderWellness:', err);
    el.innerHTML = `<div class="page-head"><h1>Wellness</h1></div><div class="card" style="background:#F0DAD6;border:1px solid #B5473A;color:#8B3429;"><p>❌ Errore interno: ${esc(err.message)}</p></div>`;
  }
}

function renderPlayerCalendario(el){
 try{
  const today = todayStr();
  const playerId = STATE.currentPlayerId;

    .filter(e => e && e.date && e.id !== 'rpe-import-session' && (e.type === 'Allenamento' || e.type === 'Partita'))

  const todayWorkout = getTodayWorkout();
  const isPresent = todayWorkout ? isPlayerPresentToday(playerId) : null;
  
  const pastEvents = allEvents.filter(e => e.date < today);
  const todayEvents = allEvents.filter(e => e.date === today);
  const futureEvents = allEvents.filter(e => e.date > today);
  
  el.innerHTML = `
    <div class="page-head"><h1>Calendario</h1><p>I tuoi impegni</p></div>
    
    ${todayWorkout ? `
      <div class="card" style="background:linear-gradient(135deg, var(--pitch) 0%, var(--pitch-dark) 100%);color:white;border:none;margin-bottom:24px;">
        <h3 style="margin-top:0;color:white;">🏋️ Allenamento Odierno</h3>
        <div style="margin-bottom:16px;">
          <div style="font-size:14px;font-weight:600;margin-bottom:4px;">${esc(todayWorkout.title)}</div>
          <div style="font-size:12px;opacity:0.9;">
            ${todayWorkout.time || 'Orario TBD'} · MD: ${esc(todayWorkout.md || '-')} · Durata: ${getSessionDuration(todayWorkout)}min
          </div>
        </div>
        <div style="background:rgba(255,255,255,0.1);border-radius:8px;padding:14px;text-align:center;">
          ${(()=>{
            const me = STATE.players.find(x=>String(x.id)===String(playerId));
            if(!canMarkPresence(me)){
              return '<div style="font-size:13px;opacity:0.95;">Il tuo stato e <strong>' + esc(me ? me.status : '-') + '</strong>: la presenza la gestisce lo staff.</div>';
            }
            const pres = todayWorkout.presentPlayers && todayWorkout.presentPlayers.includes(playerId);
            return `
              <div style="font-size:17px;font-weight:700;color:${pres ? '#A3E4B4' : '#F7A9A3'};margin-bottom:12px;">
                ${pres ? 'SEI PRESENTE' : 'NON SEI ANCORA SEGNATO'}
              </div>
              <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
                <button id="calMarkPresent" ${pres ? 'disabled' : ''} style="padding:11px 20px;border:none;border-radius:6px;font-weight:700;font-size:14px;cursor:pointer;background:${pres ? 'rgba(255,255,255,0.15)' : 'var(--amber)'};color:${pres ? 'rgba(255,255,255,0.5)' : 'var(--pitch)'};">Ci sono</button>
                <button id="calMarkAbsent" ${!pres ? 'disabled' : ''} style="padding:11px 20px;border:1px solid rgba(255,255,255,0.35);border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;background:transparent;color:${!pres ? 'rgba(255,255,255,0.4)' : 'white'};">Non ci sono</button>
              </div>`;
          })()}
        </div>
      </div>
    ` : ''}
    
    ${todayEvents.length > 0 ? `
      <div class="card">
        <h3>Oggi</h3>
        ${todayEvents.map(e => {
          const isMatch = e.type === 'Partita';
          return `
            <div style="padding:12px;background:var(--chalk);border-radius:6px;margin-bottom:8px;">
              <div style="font-weight:600;color:var(--pitch);margin-bottom:4px;">${isMatch ? '⚽' : '🏋️'} ${esc(e.title)}</div>
              <div style="font-size:12px;color:var(--ink-soft);">
                ${e.time || ''} ${e.md ? '· ' + esc(e.md) : ''} ${!isMatch ? '· Durata: ' + getSessionDuration(e) + 'min' : ''}
              </div>
              ${isMatch && e.result ? `<div style="font-size:12px;color:var(--amber);font-weight:600;margin-top:4px;">${e.result.goalsFor}-${e.result.goalsAgainst}</div>` : ''}
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}
    
    ${futureEvents.length > 0 ? `
      <div class="card">
        <h3>Prossimi impegni</h3>
        ${futureEvents.map(e => {
          const isMatch = e.type === 'Partita';
          return `
            <div style="padding:12px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;">
              <div style="font-weight:600;color:var(--pitch);margin-bottom:4px;">${isMatch ? '⚽' : '🏋️'} ${esc(e.title)}</div>
              <div style="font-size:12px;color:var(--ink-soft);">
                📅 ${fmtDate(e.date)} ${e.time ? '🕐 ' + e.time : ''} ${e.md ? '· ' + esc(e.md) : ''} ${!isMatch ? '· Durata: ' + getSessionDuration(e) + 'min' : ''}

                  ${isConvocato(e, playerId) ? 'CONVOCATO' : 'Non convocato'}

              ${isMatch ? `<div style="font-size:11px;color:var(--amber);margin-top:4px;">${esc(e.matchType || 'Partita')}</div>` : ''}

        }).join('')}
      </div>

    ${pastEvents.length > 0 ? `
      <div class="card">
        <h3>Impegni passati</h3>
        ${pastEvents.slice(-10).reverse().map(e => {
          const isMatch = e.type === 'Partita';
          return `
            <div style="padding:12px;background:#F9F9F9;border-radius:6px;margin-bottom:8px;opacity:0.7;">
              <div style="font-weight:600;color:var(--pitch);margin-bottom:4px;">${isMatch ? '⚽' : '🏋️'} ${esc(e.title)}</div>
              <div style="font-size:12px;color:var(--ink-soft);">
                📅 ${fmtDate(e.date)} ${e.time ? '🕐 ' + e.time : ''}

              ${isMatch && e.result ? `<div style="font-size:12px;color:var(--amber);font-weight:600;margin-top:4px;">${e.result.goalsFor}-${e.result.goalsAgainst}</div>` : ''}
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}
  `;

  const cp = document.getElementById('calMarkPresent');
  if(cp){
    cp.addEventListener('click', async ()=>{
      await setPlayerPresence(todayWorkout.id, playerId, true);
      showToast('Presenza registrata');
      render();
    });
  }
  const ca = document.getElementById('calMarkAbsent');
  if(ca){
    ca.addEventListener('click', async ()=>{
      await setPlayerPresence(todayWorkout.id, playerId, false);
      showToast('Segnato come assente');
      render();
    });
  }
 }catch(err){
  console.error('Errore calendario giocatore:', err);
  el.innerHTML = `<div class="page-head"><h1>Calendario</h1></div><div class="card" style="background:#F0DAD6;border:1px solid #B5473A;color:#8B3429;"><p style="margin:0;">Errore nel caricamento del calendario: ${esc(err.message)}</p></div>`;
 }
}

function renderImpostazioni(el){
  el.innerHTML = `
    <div class="page-head"><h1>Impostazioni</h1></div>
    <div class="card"><h3>Nome squadra</h3><input id="setTeamName" type="text" value="${esc(STATE.teamConfig.name||'')}"><div class="btn-row"><button class="btn" id="saveTeamBtn">Salva</button></div></div>
    <div class="card"><h3>Password staff</h3><input id="setStaffPassword" type="text" value="${esc(STATE.staffPassword||'staff')}"><div class="btn-row"><button class="btn" id="saveStaffPasswordBtn">Aggiorna</button></div></div>
    <div class="card"><h3>Backup dati</h3><div class="btn-row"><button class="btn secondary" id="exportBtn">Scarica backup</button></div></div>
  `;
  
  document.getElementById('saveTeamBtn').addEventListener('click', async ()=>{
    STATE.teamConfig.name = document.getElementById('setTeamName').value.trim() || 'Squadra';
    await saveKey('team-config', STATE.teamConfig);
    showToast('Salvato');
  });
  
  document.getElementById('saveStaffPasswordBtn').addEventListener('click', async ()=>{
    const pwd = document.getElementById('setStaffPassword').value.trim();
    if(!pwd){ showToast('Inserisci una password'); return; }
    STATE.staffPassword = pwd;
    await saveKey('staff-password', STATE.staffPassword);
    showToast('Password aggiornata');
  });
  
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    // Stesso formato del backup admin, senza le credenziali
    const backup = {
      formato:'team-hub-pro-1', esportatoIl:new Date().toISOString(),
      teamConfig: STATE.teamConfig, players: STATE.players,
      accessCodes: STATE.accessCodes || {},
      events: STATE.events, workouts: STATE.workouts, tests: STATE.tests,
      rpeLog: STATE.rpeLog, hooperLog: STATE.hooperLog, painLog: STATE.painLog
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'team-hub-pro-backup-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Backup scaricato');
  });
}
