      <div class="tile ${todayWorkout ? 'tap' : ''}" id="tilePresenze">
        <div class="tile-accent" style="background:${todayWorkout ? 'var(--amber)' : 'var(--line)'};"></div>
        <div class="tile-lbl">Presenti oggi</div>
        ${todayWorkout ? `
          <div class="tile-big">${pres.present}<small>/${pres.total}</small></div>
          <div class="tile-sub">${bd.movement.present.length}/${bd.movement.available.length} movimento &middot; ${bd.keepers.present.length}/${bd.keepers.available.length} portieri</div>
        ` : `
          <div class="tile-big" style="color:var(--ink-soft);">—</div>
          <div class="tile-sub">Nessuna sessione in programma</div>
        `}
      </div>

      <div class="tile tap" id="tileWellness">
        <div class="tile-accent" style="background:${w.bandOggi ? w.bandOggi.color : 'var(--line)'};"></div>
        <div class="tile-lbl">Wellness squadra</div>
        <div class="tile-big" style="color:${w.bandOggi ? w.bandOggi.color : 'var(--ink-soft)'};">${w.avgOggi !== null ? hooperPercent(w.avgOggi) + '<small>%</small>' : '—'}</div>
        <div class="tile-sub">${w.bandOggi ? w.bandOggi.label + ' &middot; ' : ''}${w.compilatiOggi}/${w.attesiOggi} hanno compilato</div>
        <div class="tile-sub" style="opacity:0.6;">Freschezza media &middot; tocca per il dettaglio</div>
      </div>

      <div class="tile tap" id="tileRosa">
        <div class="tile-accent" style="background:${fuori === 0 ? 'var(--ok)' : 'var(--clay)'};"></div>
        <div class="tile-lbl">Rosa</div>
        <div class="tile-big">${disponibili}<small>/${STATE.players.length}</small></div>
        <div class="tile-sub">${fuori === 0 ? 'Tutti disponibili' : fuori + ' non disponibil' + (fuori===1?'e':'i')}</div>
        <div class="tile-sub" style="opacity:0.6;">Tocca per il dettaglio</div>
      </div>

      <div class="tile tap" id="tileAcwr">
        <div class="tile-accent" style="background:${acwrRisk.length ? 'var(--clay)' : acwrAll.length ? 'var(--ok)' : 'var(--line)'};"></div>
        <div class="tile-lbl">Carico ACWR</div>
        ${acwrAll.length === 0 ? `
          <div class="tile-big" style="color:var(--ink-soft);">—</div>
          <div class="tile-sub">Servono 3 settimane di RPE</div>
        ` : `
          <div class="tile-big" style="color:${acwrRisk.length ? 'var(--clay)' : 'var(--ok)'};">${acwrRisk.length}</div>
          <div class="tile-sub">${acwrRisk.length ? 'oltre 1.5: ' + acwrRisk.slice(0,2).map(x=>esc(String(x.player.name).split(' ')[0])).join(', ') : 'nessuno in zona rischio'} &middot; ${acwrAll.length} monitorati</div>
        `}
      </div>
    </div>

    ${mostraPromemoriaBackup ? `
      <div class="card" style="border-left:4px solid var(--amber-dark);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--pitch);">Backup di sicurezza consigliato</div>
          <div style="font-size:12px;color:var(--ink-soft);">${ggBackup === null ? 'Non hai mai scaricato una copia esterna.' : 'Ultima copia esterna ' + ggBackup + ' giorni fa.'} Scaricala e tienila fuori dal browser.</div>
        </div>
        <button class="btn" id="dashBackupBtn" style="font-size:12px;padding:8px 14px;white-space:nowrap;">Scarica backup</button>
      </div>

    ${rpeOrfani > 0 ? `
      <div class="card" style="border-left:4px solid var(--clay);background:var(--clay-soft);">
        <h3 style="margin:0 0 4px 0;color:#8B3429;">Dati non allineati</h3>
        <div style="font-size:12.5px;color:#8B3429;">
          Ci sono <strong>${rpeOrfani} RPE</strong> che non risultano collegati a nessun giocatore della rosa attuale.
          Vai in Impostazioni Admin e premi <strong>Carica rosa e RPE storici</strong> per allineare i dati.
        </div>
      </div>
    ` : ''}

    ${alerts.length > 0 ? `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="margin:0;">Da controllare</h3>
          <span style="font-size:11px;color:${urgenti ? 'var(--clay)' : 'var(--ink-soft)'};font-weight:600;">${urgenti ? urgenti + ' urgent' + (urgenti===1?'e':'i') + ' su ' : ''}${alerts.length}</span>
        </div>
        <div class="alerts">
          ${alerts.slice(0,6).map(a=>`
            <div class="alert" data-player-id="${a.playerId}" style="border-left-color:${a.color};">
              <div style="flex:1;min-width:0;">
                <div class="alert-t">${esc(a.text)}</div>
                <div class="alert-s">${esc(a.sub)}</div>
              </div>
            </div>`).join('')}
        </div>
        ${alerts.length > 6 ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:10px;">Altri ${alerts.length-6} avvisi nella Rosa.</div>` : ''}
      </div>
    ` : ''}

    <div class="grid2">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;">
          <h3 style="margin:0;">Ultime partite</h3>
          ${results.length ? `<span style="font-size:11px;color:var(--ink-soft);">${bilancio.V||0}V &middot; ${bilancio.P||0}P &middot; ${bilancio.S||0}S</span>` : ''}
        </div>
        ${results.length === 0 ? '<div style="font-size:12px;color:var(--ink-soft);">Nessun risultato inserito.</div>' : `
          <div class="form-strip" style="margin-bottom:12px;">
            ${results.map(r=>`<div class="form-chip result-row" data-event-id="${r.match.id}" title="${esc(r.match.title)} ${r.gf}-${r.ga}" style="background:${r.color};">${r.esito}</div>`).join('')}
          </div>
          ${results.slice(0,3).map(r=>`
            <div class="mini-row result-row" data-event-id="${r.match.id}" style="cursor:pointer;border-bottom:1px solid var(--line);padding:6px 0;">
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(r.match.title)}</span>
              <strong style="color:${r.color};white-space:nowrap;margin-left:10px;">${r.gf}-${r.ga}</strong>
            </div>`).join('')}
        `}
      </div>

      <div class="card">
        <h3 style="margin:0 0 12px 0;">Wellness</h3>
        ${w.peggiori.length > 0 ? `
          <div class="tile-lbl">Piu affaticati (media 7gg)</div>
          ${w.peggiori.map(x=>`
            <div class="mini-row">
              <span>${esc(x.player.name)}</span>
              <strong style="color:${hooperBand(Math.round(x.avg)).color};">${Math.round(x.avg*10)/10}</strong>
            </div>`).join('')}
        ` : '<div style="font-size:12px;color:var(--ok);margin-bottom:10px;">Nessun giocatore sopra la soglia di attenzione.</div>'}

        ${w.nonCompilanti.length > 0 ? `
          <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px;">
            <div class="tile-lbl" style="color:var(--amber-dark);">Non compilano da oltre 3 giorni</div>
            <div style="font-size:12px;color:var(--ink-soft);">${w.nonCompilanti.slice(0,6).map(p=>esc(String(p.name).split(' ')[0])).join(', ')}${w.nonCompilanti.length>6?' e altri '+(w.nonCompilanti.length-6):''}</div>
          </div>` : ''}

        ${w.avgSettimana !== null ? `
          <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:12px;color:var(--ink-soft);">
            Media squadra ultimi 7 giorni: <strong style="color:var(--pitch);">${w.avgSettimana}/28</strong>
          </div>` : ''}
      </div>
    </div>
  `;

  const printBtn = document.getElementById('printReportBtn');
  if(printBtn) printBtn.addEventListener('click', printDailyReport);

  const tile = document.getElementById('tilePresenze');
  if(tile && todayWorkout){
    tile.addEventListener('click', ()=> showPresenceModal(todayWorkout.id));
  }

  const tw = document.getElementById('tileWellness');
  if(tw) tw.addEventListener('click', showWellnessDetail);

  const tr = document.getElementById('tileRosa');
  if(tr) tr.addEventListener('click', showRosaDetail);

  const ta = document.getElementById('tileAcwr');
  if(ta) ta.addEventListener('click', showAcwrDetail);

  const dashBackupBtn = document.getElementById('dashBackupBtn');
  if(dashBackupBtn){
    dashBackupBtn.addEventListener('click', ()=>{
      scaricaBackupCompleto();
      registraBackupEsterno();
      render();
    });
  }

  el.querySelectorAll('.alert').forEach(row=>{
    row.addEventListener('click', ()=>{
      if(row.dataset.playerId) showPlayerReport(row.dataset.playerId);
    });
  });

  el.querySelectorAll('.result-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const ev = STATE.events.find(e=>e.id===row.dataset.eventId);
      if(ev) renderMatchDetails(ev);
    });
  });
}

/* Piccola tile riutilizzabile */
function tileHTML({label, value, note, color, accent, id}){
  return `<div class="tile" ${id?`id="${id}"`:''}>

    ${note ? `<div class="tile-sub">${esc(note)}</div>` : ''}

}

/* ---------- GIOCATORI ---------- */
/* ---------- DOLORI ----------
   Una segnalazione non scade da sola col tempo: resta aperta finche' lo staff
   non la chiude. Dopo qualche giorno di silenzio passa a "da verificare",
   che e' un promemoria, non un archiviazione automatica. */
const PAIN_SILENT_AFTER = 5;   // giorni senza nuove segnalazioni
const PAIN_STALE_AFTER  = 14;  // oltre questo, va chiusa o ripresa in mano

function daysSince(dateStr){
  if(!dateStr) return 9999;
  const a = new Date(todayStr() + 'T00:00:00');
  const b = new Date(dateStr + 'T00:00:00');
  return Math.round((a - b) / 86400000);
}

/* Raggruppa le segnalazioni di un giocatore per zona: ogni zona = un problema */
function getPainIssues(playerId){
  const entries = STATE.painLog
    .filter(x => String(x.playerId) === String(playerId))
    .sort((a,b) => String(b.date).localeCompare(String(a.date)));

  const byZone = {};
  entries.forEach(e=>{
    const z = e.zone || 'Non indicata';
    if(!byZone[z]) byZone[z] = [];
    byZone[z].push(e);
  });

  return Object.keys(byZone).map(zone=>{
    const list = byZone[zone];
    const last = list[0];
    const closed = list.every(e => e.closed) || !!last.closed;
    const days = daysSince(last.date);

    let status, label, color;
    if(closed){
      status = 'closed'; label = 'Risolto'; color = 'var(--ink-soft)';
    } else if(days <= PAIN_SILENT_AFTER){
      status = 'active'; label = 'Attivo'; color = 'var(--clay)';
    } else if(days <= PAIN_STALE_AFTER){
      status = 'silent'; label = 'Da verificare'; color = 'var(--amber-dark)';
    } else {
      status = 'stale'; label = 'Aperto da tempo'; color = 'var(--amber-dark)';
    }

    const peak = Math.max.apply(null, list.map(e => e.intensity || 0));
    const first = list[list.length - 1];

    return {
      zone, entries: list, last, first,
      status, label, color,
      days, peak,
      lastIntensity: last.intensity || 0,
      count: list.length,
      // sale, scende o resta uguale rispetto alla segnalazione precedente
      direction: list.length > 1
        ? ((last.intensity || 0) - (list[1].intensity || 0))
        : 0
    };
  }).sort((a,b)=>{
    const rank = {active:0, silent:1, stale:2, closed:3};
    if(rank[a.status] !== rank[b.status]) return rank[a.status] - rank[b.status];
    return a.days - b.days;
  });
}

/* Problemi che richiedono attenzione ora */
function getOpenPainIssues(playerId){
  return getPainIssues(playerId).filter(i => i.status !== 'closed');
}

/* ---------- MINUTI GIOCATI ----------
   I minuti non si scrivono a mano: si ricavano da chi era titolare,
   dalle sostituzioni e dalle espulsioni. Cosi' non possono contraddirsi. */
const DEFAULT_MATCH_DURATION = 90;

function matchDuration(match){
  const d = parseInt(match && match.duration, 10);
  return (!isNaN(d) && d > 0) ? d : DEFAULT_MATCH_DURATION;
}

/* Restituisce { playerId: {minutes, status, on, off, reason} } */
function computeMatchMinutes(match){
  const total = matchDuration(match);
  const out = {};

  const starters = Array.isArray(match.starters) ? match.starters : [];
  const subs = (Array.isArray(match.substitutions) ? match.substitutions : [])
    .slice()
    .sort((a,b)=> (a.minute||0) - (b.minute||0));
  const reds = Array.isArray(match.redCards) ? match.redCards : [];

  const clamp = m => Math.max(0, Math.min(total, parseInt(m,10) || 0));

  // Chi parte in campo
  starters.forEach(pid=>{
    out[String(pid)] = {on: 0, off: null, status: 'starter', reason: null};
  });

  // Sostituzioni, in ordine di minuto
  subs.forEach(sw=>{
    const min = clamp(sw.minute);
    if(sw.outPlayerId){
      const k = String(sw.outPlayerId);
      if(out[k] && out[k].off === null){ out[k].off = min; out[k].reason = 'sostituito'; }
    }
    if(sw.inPlayerId){
      const k = String(sw.inPlayerId);
      // Un giocatore puo' entrare una volta sola
      if(!out[k]) out[k] = {on: min, off: null, status: 'sub', reason: null};
    }
  });

  // Espulsioni: chiudono la partita del giocatore in quel minuto
  reds.forEach(rc=>{
    const k = String(rc.playerId);
    const min = clamp(rc.minute);
    if(out[k] && (out[k].off === null || min < out[k].off)){
      out[k].off = min;
      out[k].reason = 'espulso';
    }
  });

  // Calcolo finale
  Object.keys(out).forEach(k=>{
    const r = out[k];
    const off = (r.off === null) ? total : r.off;
    r.minutes = Math.max(0, off - r.on);
    r.offEffective = off;
  });

  return out;
}

/* Chi e' in campo a un dato minuto: serve per proporre solo sostituzioni sensate */
function playersOnPitchAt(match, minute){
  const calc = computeMatchMinutes(match);
  return Object.keys(calc).filter(k=>{
    const r = calc[k];
    return r.on <= minute && r.offEffective > minute;
  });
}

/* Allinea match.lineup (usato dalle statistiche) al calcolo automatico */
function syncMatchLineup(match){
  const calc = computeMatchMinutes(match);
  match.lineup = Object.keys(calc).map(pid=>({
    playerId: pid,
    minutes: calc[pid].minutes,
    status: calc[pid].status
  }));
  return match.lineup;
}

/* ---------- STATISTICHE STAGIONE ---------- */
function getSeasonStats(playerId){
  const pid = String(playerId);
  let minutes = 0, goals = 0, assists = 0, matches = 0, starts = 0;

  STATE.events.filter(e => e.type === 'Partita').forEach(m=>{
    /* Calcolo i minuti al volo da computeMatchMinutes: cosi' subentrati, sostituzioni
       ed espulsioni fatte dal campo grafico si riflettono subito nelle statistiche,
       senza dover richiamare syncMatchLineup ad ogni modifica. Fallback su m.lineup
       solo per partite senza starters (es. dati importati vecchi). */
    let row = null;
    if(Array.isArray(m.starters) && m.starters.length > 0){
      const calc = computeMatchMinutes(m);
      if(calc[pid]) row = {minutes: calc[pid].minutes, status: calc[pid].status};
    } else if(Array.isArray(m.lineup)){
      row = m.lineup.find(l => String(l.playerId) === pid) || null;
    }
    if(row && (row.minutes || 0) > 0){
      minutes += row.minutes || 0;
      matches++;
      if(row.status === 'starter') starts++;
    }

    /* Gol e assist: leggo dagli eventi timeline (formato nuovo), fallback sui vecchi array. */
    if(Array.isArray(m.events) && m.events.length){
      goals   += m.events.filter(e => e.type === 'goal'   && String(e.playerId) === pid).length;
      assists += m.events.filter(e => e.type === 'assist' && String(e.playerId) === pid).length;
    } else {
      if(Array.isArray(m.goals))   goals   += m.goals.filter(g => String(g.playerId) === pid).length;
      if(Array.isArray(m.assists)) assists += m.assists.filter(a => String(a.playerId) === pid).length;
    }
  });

  return {minutes, goals, assists, matches, starts};
}

/* Presenze agli allenamenti gia' svolti */
function getTrainingAttendance(playerId){
  const past = STATE.events.filter(e => e.type === 'Allenamento' && e.date && e.id !== 'rpe-import-session' && e.date <= todayStr());
  const present = past.filter(e => Array.isArray(e.presentPlayers) && e.presentPlayers.includes(playerId)).length;
  return {
    present,
    total: past.length,
    percent: past.length ? Math.round(present / past.length * 100) : null
  };
}

/* ---------- CARICO E ACWR ----------
   Carico sessione = RPE x durata (metodo di Foster).
   ACWR = carico dell'ultima settimana / media settimanale delle ultime 4.
   Sotto 0.8 scarico, 0.8-1.3 zona ottimale, sopra 1.5 rischio. */
function sessionLoad(rpeEntry){
  // Se il singolo RPE ha i suoi minuti, hanno la precedenza su tutto
  if(typeof rpeEntry.minutes === 'number' && rpeEntry.minutes > 0){
    return (rpeEntry.rpe || 0) * rpeEntry.minutes;
  }
  const ev = STATE.events.find(e => e.id === rpeEntry.sessionId);
  let dur;
  if(ev && ev.importedDuration) dur = ev.importedDuration;      // RPE storici importati
  else if(ev) dur = getSessionDuration(ev);
  if(!dur) dur = 65;                                            // sessione non trovata: stima
  return (rpeEntry.rpe || 0) * dur;
}

function getACWR(playerId){
  const pid = String(playerId);
  const entries = STATE.rpeLog.filter(r => String(r.playerId) === pid);
  if(entries.length === 0) return null;

  let acute = 0, chronic = 0, acuteN = 0, chronicN = 0;
  entries.forEach(r=>{
    const d = daysSince(r.date);
    const load = sessionLoad(r);
    if(d < 7){ acute += load; acuteN++; }
    if(d < 28){ chronic += load; chronicN++; }
  });

  // Servono almeno tre settimane di storico perche' il dato significhi qualcosa.
  // L'array non e' ordinato: cerco la rilevazione piu' vecchia, non l'ultima in lista.
  const oldestDays = entries.reduce((max, r)=> Math.max(max, daysSince(r.date)), 0);
  if(chronicN < 4 || oldestDays < 21){
    return {ratio: null, acute: acute, insufficient: true, sessions: chronicN};
  }

  const weeklyChronic = chronic / 4;
  if(weeklyChronic === 0) return {ratio: null, acute: acute, insufficient: true, sessions: chronicN};

  const ratio = acute / weeklyChronic;
  let zone, label, color;
  // Nessuna sessione nell'ultima settimana: non e' uno scarico programmato, e' assenza di dati
  if(acuteN === 0){ zone='none'; label='Fermo da 7 giorni'; color='var(--ink-soft)'; }
  else if(ratio < 0.8){ zone='low';  label='Scarico';  color='var(--amber-dark)'; }
  else if(ratio <= 1.3){ zone='ok'; label='Ottimale'; color='var(--ok)'; }
  else if(ratio <= 1.5){ zone='warn'; label='In salita'; color='var(--amber-dark)'; }
  else { zone='high'; label='Rischio'; color='var(--clay)'; }

  return {
    ratio: Math.round(ratio*100)/100,
    acute: Math.round(acute),
    chronicWeekly: Math.round(weeklyChronic),
    zone, label, color, insufficient: false, sessions: chronicN
  };
}

/* ---------- RIEPILOGO SQUADRA ---------- */
function getTeamWellness(){
  const today = todayStr();
  /* I portieri sono fuori dalle medie di squadra (sono a parte). */
  const inRosa = STATE.players.filter(countsInTeamAggregate);   // Disponibili, no portieri
  const portieri = STATE.players.filter(p => isPortiere(p) && countsInTeamStats(p));
  const ridotti = STATE.players.filter(p => isTrainingStatus(p) && !countsInTeamStats(p)); // RTP, In valutazione
  const fermi = STATE.players.filter(p => !isTrainingStatus(p));                            // Infortunati

  // Media di oggi: voci registrate mentre il giocatore era Disponibile
  const oggi = [];
  inRosa.forEach(p=>{
    const e = STATE.hooperLog.find(h => String(h.playerId)===String(p.id) && h.date===today && !isLegacyHooper(h));
    if(e && entryCountsInTeamStats(e)) oggi.push({player:p, score: hooperScore(e)});
  });

  // Media settimanale: stessa regola, cosi' i due numeri sono confrontabili
  const settimana = [];
  inRosa.forEach(p=>{
    const recenti = getHooperEntries(p.id).filter(h => daysSince(h.date) < 7 && entryCountsInTeamStats(h));
    if(recenti.length) settimana.push({player:p, avg: recenti.reduce((a,h)=>a+hooperScore(h),0)/recenti.length});
  });

  // Fuori media, ma da tenere sott'occhio
  const aParte = [];
  ridotti.concat(fermi).forEach(p=>{
    const recenti = getHooperEntries(p.id).filter(h => daysSince(h.date) < 7);
    if(recenti.length) aParte.push({player:p, avg: recenti.reduce((a,h)=>a+hooperScore(h),0)/recenti.length});
  });

  /* Portieri: stessa logica di calcolo, ma media a parte. */
  const portieriOggi = [];
  const portieriSettimana = [];
  portieri.forEach(p=>{
    const e = STATE.hooperLog.find(h => String(h.playerId)===String(p.id) && h.date===today && !isLegacyHooper(h));
    if(e && entryCountsInTeamStats(e)) portieriOggi.push({player:p, score: hooperScore(e)});
    const recenti = getHooperEntries(p.id).filter(h => daysSince(h.date) < 7 && entryCountsInTeamStats(h));
    if(recenti.length) portieriSettimana.push({player:p, avg: recenti.reduce((a,h)=>a+hooperScore(h),0)/recenti.length});
  });

  const avgOggi = oggi.length ? oggi.reduce((a,x)=>a+x.score,0)/oggi.length : null;
  const avgSett = settimana.length ? settimana.reduce((a,x)=>a+x.avg,0)/settimana.length : null;
  const avgPortieriOggi = portieriOggi.length ? portieriOggi.reduce((a,x)=>a+x.score,0)/portieriOggi.length : null;
  const avgPortieriSett = portieriSettimana.length ? portieriSettimana.reduce((a,x)=>a+x.avg,0)/portieriSettimana.length : null;

  return {
    compilatiOggi: oggi.length,
    attesiOggi: inRosa.length,
    avgOggi: avgOggi !== null ? Math.round(avgOggi*10)/10 : null,
    bandOggi: avgOggi !== null ? hooperBand(Math.round(avgOggi)) : null,
    avgSettimana: avgSett !== null ? Math.round(avgSett*10)/10 : null,
    peggiori: settimana.slice().sort((a,b)=>b.avg-a.avg).slice(0,3).filter(x=>x.avg >= 13),
    fuoriMedia: aParte.sort((a,b)=>b.avg-a.avg),
    /* La lista "chi non compila" include TUTTI (portieri compresi): serve individualmente. */
    nonCompilanti: STATE.players.filter(countsInTeamStats).filter(p=>{
      const ultimo = getHooperEntries(p.id)[0];
      return !ultimo || daysSince(ultimo.date) > 3;
    }),
    /* Media portieri a parte. */
    portieri: {
      compilatiOggi: portieriOggi.length,
      attesiOggi: portieri.length,
      avgOggi: avgPortieriOggi !== null ? Math.round(avgPortieriOggi*10)/10 : null,
      bandOggi: avgPortieriOggi !== null ? hooperBand(Math.round(avgPortieriOggi)) : null,
      avgSettimana: avgPortieriSett !== null ? Math.round(avgPortieriSett*10)/10 : null
    }
  };
}

/* Ultime partite con esito */
function getRecentResults(limit){
  return STATE.events
    .filter(e => e.type === 'Partita' && e.result && typeof e.result.goalsFor === 'number')
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)))
    .slice(0, limit || 5)
    .map(m=>{
      const gf = m.result.goalsFor, ga = m.result.goalsAgainst;
      const esito = gf > ga ? 'V' : gf === ga ? 'P' : 'S';
      return {
        match: m, gf, ga, esito,
        color: esito === 'V' ? 'var(--ok)' : esito === 'P' ? 'var(--amber-dark)' : 'var(--clay)'
      };
    });
}

/* Avvisi da mostrare in dashboard, dal piu' urgente */
function getTeamAlerts(){
  const alerts = [];

  STATE.players.forEach(p=>{
    getOpenPainIssues(p.id).forEach(issue=>{
      if(issue.status === 'active'){
        alerts.push({
          priority: issue.lastIntensity >= 6 ? 1 : 2,
          icon:'',
          color: issue.lastIntensity >= 6 ? 'var(--clay)' : 'var(--amber-dark)',
          text: p.name + ' — ' + issue.zone + ' ' + issue.lastIntensity + '/10' + (issue.direction > 0 ? ', in aumento' : ''),
          sub: issue.days === 0 ? 'segnalato oggi' : 'segnalato ' + issue.days + ' giorni fa',
          playerId: p.id
        });
      } else if(issue.status === 'silent' || issue.status === 'stale'){
        alerts.push({
          priority: 3, icon:'', color: 'var(--amber-dark)',
          text: p.name + ' — ' + issue.zone + ' da verificare',
          sub: 'nessun aggiornamento da ' + issue.days + ' giorni',
          playerId: p.id
        });
      }
    });
  });

  // Wellness e carico valgono per tutti quelli che si allenano, RTP compresi
  STATE.players.filter(isTrainingStatus).forEach(p=>{
    const hi = getLatestHooperIndex(p.id);
    if(hi && hi.score >= 18 && daysSince(hi.date) <= 2){
      alerts.push({
        priority: hi.score >= 23 ? 1 : 2, icon:'', color: hi.band.color,
        text: p.name + (p.status !== 'Disponibile' ? ' [' + statusMeta(p.status).label + ']' : '') + ' — Hooper ' + hi.score + '/28 (' + hi.band.label + ')',
        sub: hi.band.advice, playerId: p.id
      });
    }
    const trend = getHooperTrend(p.id, 7);
    if(trend && trend.direction === 'worse' && Math.abs(trend.delta) >= 3){
      alerts.push({
        priority: 2, icon:'', color: 'var(--clay)',
        text: p.name + (p.status !== 'Disponibile' ? ' [' + statusMeta(p.status).label + ']' : '') + ' — wellness in peggioramento',
        sub: 'media da ' + trend.previousAvg + ' a ' + trend.recentAvg + ' in una settimana',
        playerId: p.id
      });
    }
    const acwr = getACWR(p.id);
    if(acwr && !acwr.insufficient && (acwr.zone === 'high' || acwr.zone === 'warn')){
      alerts.push({
        priority: acwr.zone === 'high' ? 1 : 3, icon:'', color: acwr.color,
        text: p.name + (p.status !== 'Disponibile' ? ' [' + statusMeta(p.status).label + ']' : '') + ' — ACWR ' + acwr.ratio,
        sub: acwr.zone === 'high' ? 'carico cresciuto troppo in fretta' : 'carico in aumento, tenere d\'occhio',
        playerId: p.id
      });
    }
  });

  STATE.players.filter(p=>p.status === 'RTP' || p.status === 'In valutazione').forEach(p=>{
    if(p.returnDate && daysSince(p.returnDate) >= 0){
      alerts.push({
        priority: 2, icon:'', color: 'var(--amber-dark)',
        text: p.name + ' — rientro previsto ' + (daysSince(p.returnDate) === 0 ? 'oggi' : 'scaduto da ' + daysSince(p.returnDate) + ' giorni'),
        sub: 'aggiorna lo stato se e rientrato', playerId: p.id
      });
    }
  });

  return alerts.sort((a,b)=>a.priority - b.priority);
}

          <h4 style="margin:0 0 4px 0;font-size:13px;color:var(--pitch);">Dolori per zona (${openPain.length} aperti)</h4>
          <button type="button" id="addPainBtn" class="btn secondary" style="font-size:11px;padding:5px 10px;">+ Registra</button>
        </div>
        <div style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">Una zona resta aperta finche' non la chiudi tu. Dopo ${PAIN_SILENT_AFTER} giorni senza nuove segnalazioni passa a "da verificare": non sparisce da sola.</div>

        ${painIssues.length === 0 ? '<div style="font-size:12px;color:var(--ink-soft);">Nessuna segnalazione</div>' : painIssues.map(issue=>`
          <div style="border:1px solid var(--line);border-left:4px solid ${issue.color};border-radius:6px;padding:10px;margin-bottom:8px;${issue.status==='closed' ? 'opacity:0.6;' : ''}">
            <div style="display:flex;justify-content:space-between;align-items:start;gap:10px;">
              <div style="flex:1;">
                <div style="font-size:13px;font-weight:700;color:var(--pitch);">
                  ${esc(issue.zone)}
                  <span style="font-size:11px;font-weight:600;color:${issue.color};margin-left:6px;">${issue.label}</span>
                </div>
                <div style="font-size:11.5px;color:var(--ink-soft);margin-top:3px;">
                  Ultima: <strong style="color:${issue.color};">${issue.lastIntensity}/10</strong>
                  ${issue.days === 0 ? 'oggi' : issue.days === 1 ? 'ieri' : issue.days + ' giorni fa'}
                  ${issue.count > 1 ? ` &middot; ${issue.count} segnalazioni, picco ${issue.peak}/10` : ''}
                  ${issue.count > 1 && issue.direction !== 0
                    ? (issue.direction < 0
                        ? ' &middot; <span style="color:var(--ok);font-weight:600;">in calo</span>'
                        : ' &middot; <span style="color:var(--clay);font-weight:600;">in aumento</span>')
                    : ''}
                </div>
                ${issue.count > 1 ? `<div style="font-size:10.5px;color:var(--ink-soft);margin-top:2px;">Prima segnalazione il ${fmtDate(issue.first.date)}</div>` : ''}
                ${issue.last.notes ? `<div style="font-size:11px;margin-top:5px;padding:6px;background:var(--chalk);border-radius:4px;">${esc(issue.last.notes)}</div>` : ''}
                ${issue.closed || issue.status === 'closed' ? `<div style="font-size:10.5px;color:var(--ink-soft);margin-top:5px;">Chiuso${issue.last.closedNote ? ': ' + esc(issue.last.closedNote) : ''}</div>` : ''}
              </div>
              <div style="display:flex;flex-direction:column;gap:4px;">
                ${issue.status !== 'closed'
                  ? `<button class="pain-close" data-zone="${esc(issue.zone)}" style="background:none;border:1px solid var(--line);border-radius:4px;padding:4px 9px;font-size:11px;cursor:pointer;color:var(--ok);white-space:nowrap;">Segna risolto</button>`
                  : `<button class="pain-reopen" data-zone="${esc(issue.zone)}" style="background:none;border:1px solid var(--line);border-radius:4px;padding:4px 9px;font-size:11px;cursor:pointer;white-space:nowrap;">Riapri</button>`}
                <button class="pain-detail" data-zone="${esc(issue.zone)}" style="background:none;border:1px solid var(--line);border-radius:4px;padding:4px 9px;font-size:11px;cursor:pointer;white-space:nowrap;">Storico</button>
              </div>
            </div>
          </div>`).join('')}
      </div>

      <div style="text-align:right;margin-top:16px;">
        <button id="closeReportBtn" class="btn">Chiudi</button>
      </div>
    </div>`;

  document.body.appendChild(modal);

  const close = ()=> modal.remove();
  document.getElementById('closeReport').addEventListener('click', close);
  document.getElementById('closeReportBtn').addEventListener('click', close);
  modal.addEventListener('click', e=>{ if(e.target === modal) close(); });

  const reopen = ()=>{ close(); showPlayerReport(playerId); };

  // Eliminazione, con doppia conferma
  modal.querySelectorAll('.rep-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const kind = btn.dataset.kind;
      const nomi = {hooper:'questa rilevazione Hooper', rpe:'questo RPE', pain:'questa segnalazione di dolore'};
      if(!confirm('Eliminare ' + nomi[kind] + ' di ' + player.name + '?\n\nIl dato viene rimosso per tutti e non si puo recuperare.')) return;

      if(kind === 'hooper'){
        STATE.hooperLog = STATE.hooperLog.filter(x => x.id !== btn.dataset.id);
        await saveKey('hooper-log', STATE.hooperLog);
      } else if(kind === 'rpe'){
        STATE.rpeLog = STATE.rpeLog.filter(x => x.id !== btn.dataset.id);
        await saveKey('rpe-log', STATE.rpeLog);
      } else {
        STATE.painLog = STATE.painLog.filter(x => x.id !== btn.dataset.id);
        await saveKey('pain-log', STATE.painLog);
      }
      showToast('Voce eliminata');
      reopen();
    });
  });

  // Modifica Hooper
  modal.querySelectorAll('.rep-edit-hooper').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const entry = STATE.hooperLog.find(x => x.id === btn.dataset.id);
      if(entry) editHooperEntry(entry, reopen);
    });
  });

  // Modifica RPE
  modal.querySelectorAll('.rep-edit-rpe').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const entry = STATE.rpeLog.find(x => x.id === btn.dataset.id);
      if(entry) rpeEntryForm(playerId, entry, reopen);
    });
  });

  const addRpeStaffBtn = document.getElementById('addRpeStaffBtn');
  if(addRpeStaffBtn){
    addRpeStaffBtn.addEventListener('click', ()=> rpeEntryForm(playerId, null, reopen));
  }

  // Lo staff puo' registrare un problema anche a posteriori (infortuni passati,
  // o segnalazioni fatte a voce che il giocatore non ha inserito)
  const addPainBtn = document.getElementById('addPainBtn');
  if(addPainBtn){
    addPainBtn.addEventListener('click', ()=> addPainEntryForm(playerId, reopen));
  }

  // --- Dolori: chiusura, riapertura, storico ---
  const zoneEntries = (zone)=> STATE.painLog.filter(x =>
    String(x.playerId) === String(playerId) && (x.zone || 'Non indicata') === zone);

  modal.querySelectorAll('.pain-close').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const zone = btn.dataset.zone;
      if(!confirm('Segnare come risolto il problema "' + zone + '" di ' + player.name + '?\n\nResta nello storico e potrai riaprirlo.')) return;
      const note = prompt('Nota di chiusura (facoltativa): come si e risolto?', '');
      if(note === null) return;
      zoneEntries(zone).forEach(e=>{
        e.closed = true;
        e.closedAt = todayStr();
        if(note.trim()) e.closedNote = note.trim();
      });
      await saveKey('pain-log', STATE.painLog);
      showToast('Problema segnato come risolto');
      reopen();
    });
  });

  modal.querySelectorAll('.pain-reopen').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const zone = btn.dataset.zone;
      if(!confirm('Riaprire il problema "' + zone + '"?')) return;
      zoneEntries(zone).forEach(e=>{
        delete e.closed; delete e.closedAt; delete e.closedNote;
      });
      await saveKey('pain-log', STATE.painLog);
      showToast('Problema riaperto');
      reopen();
    });
  });

  modal.querySelectorAll('.pain-detail').forEach(btn=>{
    btn.addEventListener('click', ()=> showPainHistory(playerId, btn.dataset.zone, reopen));
  });
}

/* Inserimento o modifica di un RPE da parte dello staff.
   entry = null significa nuova registrazione. */
function rpeEntryForm(playerId, entry, onDone){
  const player = STATE.players.find(p => String(p.id) === String(playerId));
  const nuovo = !entry;
  const old = document.getElementById('rpeEntryModal');
  if(old) old.remove();

  const sessioni = STATE.events
    .filter(e => e.type === 'Allenamento' && e.id !== 'rpe-import-session')
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  const modal = document.createElement('div');
  modal.id = 'rpeEntryModal';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10002;padding:20px;box-sizing:border-box;overflow-y:auto;';

  const val = entry ? entry.rpe : 5;

  modal.innerHTML = `
    <div style="background:white;border-radius:12px;max-width:460px;width:100%;padding:22px;margin:auto;">
      <h3 style="margin:0 0 4px 0;color:var(--pitch);">${nuovo ? 'Registra un RPE' : 'Modifica RPE'}</h3>
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;">
        ${player ? esc(player.name) : ''}${nuovo ? ' — puoi inserire anche sessioni passate' : ''}
      </div>

      <label>Data</label>
      <input id="reDate" type="date" value="${entry ? entry.date : todayStr()}" max="${todayStr()}">

      <label>Sessione</label>
      <select id="reSession">
        <option value="rpe-import-session" ${(!entry || entry.sessionId === 'rpe-import-session') ? 'selected' : ''}>Sessione generica (65 min)</option>
        ${sessioni.map(e=>`<option value="${e.id}" ${entry && entry.sessionId === e.id ? 'selected' : ''}>${esc(e.title)} — ${fmtDate(e.date)}</option>`).join('')}
      </select>

      <label>Minuti (facoltativo)</label>
      <input id="reMinutes" type="number" min="0" max="240" value="${entry && entry.minutes ? entry.minutes : ''}" placeholder="Lascia vuoto per usare i minuti della sessione">
      <div style="font-size:11px;color:var(--ink-soft);margin-top:4px;">Se indichi i minuti, il carico di questa seduta usa questo valore invece di quello della sessione.</div>

      <div style="margin-top:14px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
          <label style="margin:0;">Sforzo percepito</label>
          <span id="reVal" style="color:var(--amber);font-weight:700;">${val}/10</span>
        </div>
        <input id="reRpe" type="range" min="0" max="10" step="1" value="${val}">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft);margin-top:4px;">
          <span>0 &middot; riposo</span><span>10 &middot; massimale</span>
        </div>
        <div id="reDesc" style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;text-align:center;"></div>
      </div>

      <div class="btn-row" style="justify-content:flex-end;">
        <button id="reCancel" class="btn secondary">Annulla</button>
        <button id="reSave" class="btn">${nuovo ? 'Registra' : 'Salva'}</button>
      </div>
    </div>`;

  document.body.appendChild(modal);

  const SCALA = ['riposo assoluto','molto leggero','leggero','moderato','piuttosto pesante','pesante',
                 'piu che pesante','molto pesante','molto molto pesante','estremamente pesante','massimale'];
  const slider = document.getElementById('reRpe');
  const refresh = ()=>{
    const v = parseInt(slider.value, 10);
    document.getElementById('reVal').textContent = v + '/10';
    document.getElementById('reDesc').textContent = SCALA[v] || '';
  };
  slider.addEventListener('input', refresh);
  refresh();

  document.getElementById('reCancel').addEventListener('click', ()=> modal.remove());
  modal.addEventListener('click', e=>{ if(e.target === modal) modal.remove(); });

  document.getElementById('reSave').addEventListener('click', async ()=>{
    const date = document.getElementById('reDate').value;
    if(!date){ showToast('Indica la data'); return; }
    if(date > todayStr()){ showToast('La data non puo essere futura'); return; }
    const rpe = parseInt(slider.value, 10);
    const sessionId = document.getElementById('reSession').value;
    const minInput = document.getElementById('reMinutes').value;
    const minutes = minInput === '' ? null : Math.max(0, Math.min(240, parseInt(minInput, 10) || 0));

    if(nuovo){
      const gia = STATE.rpeLog.some(x => String(x.playerId)===String(playerId) && x.date===date);
      if(gia && !confirm('Esiste gia un RPE di ' + (player?player.name:'') + ' per il ' + fmtDate(date) + '.\n\nAggiungerne un altro? Quel giorno contera carico doppio.')) return;
      if(!confirm('Registrare RPE ' + rpe + '/10 per ' + (player?player.name:'') + ' in data ' + fmtDate(date) + '?')) return;
      const nuovaVoce = {
        id: uid(), playerId: playerId, date: date,
        sessionId: sessionId, rpe: rpe, addedBy: 'staff',
        statusAtEntry: currentStatusOf(playerId)
      };
      if(minutes !== null) nuovaVoce.minutes = minutes;
      STATE.rpeLog.push(nuovaVoce);
    } else {
      const cambiato = (entry.rpe !== rpe) || (entry.date !== date) || (entry.sessionId !== sessionId) || ((entry.minutes||null) !== minutes);
      if(!cambiato){ modal.remove(); return; }
      if(!confirm('Salvare le modifiche?\n\nIl dato inserito dal giocatore verra sostituito.')) return;
      entry.rpe = rpe;
      entry.date = date;
      entry.sessionId = sessionId;
      if(minutes !== null) entry.minutes = minutes; else delete entry.minutes;
      entry.editedBy = 'staff';
      entry.editedAt = todayStr();
    }

    await saveKey('rpe-log', STATE.rpeLog);
    showToast(nuovo ? 'RPE registrato' : 'RPE aggiornato');
    modal.remove();
    if(onDone) onDone();
  });
}

/* Registrazione manuale di un problema da parte dello staff, anche retroattiva */
function addPainEntryForm(playerId, onDone){
  const player = STATE.players.find(p => String(p.id) === String(playerId));
  const old = document.getElementById('addPainModal');
  if(old) old.remove();

  const modal = document.createElement('div');
  modal.id = 'addPainModal';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10002;padding:20px;box-sizing:border-box;overflow-y:auto;';

  modal.innerHTML = `
    <div style="background:white;border-radius:12px;max-width:460px;width:100%;padding:22px;margin:auto;">
      <h3 style="margin:0 0 4px 0;color:var(--pitch);">Registra un problema</h3>
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;">${player ? esc(player.name) : ''} — puoi inserire anche episodi passati</div>

      <label>Data</label>
      <input id="apDate" type="date" value="${todayStr()}" max="${todayStr()}">

      <div class="grid2" style="gap:12px;">
        <div><label>Zona</label><select id="apZone">${BODY_ZONES.map(z=>`<option>${z}</option>`).join('')}</select></div>
        <div><label>Tipo</label><select id="apType">${PAIN_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
      </div>

      <div style="margin-top:12px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
          <label style="margin:0;">Intensita</label>
          <span id="apIntVal" style="color:var(--clay);font-weight:700;">5/10</span>
        </div>
        <input id="apIntensity" type="range" min="0" max="10" value="5">
      </div>

      <label>Note</label>
      <textarea id="apNotes" placeholder="Dinamica, diagnosi, indicazioni..."></textarea>

      <label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:400;">
        <input id="apClosed" type="checkbox" style="width:auto;margin:0;">
        <span style="font-size:12.5px;">Gia risolto (episodio chiuso)</span>
      </label>

      <div class="btn-row" style="justify-content:flex-end;">
        <button id="apCancel" class="btn secondary">Annulla</button>
        <button id="apSave" class="btn">Registra</button>
      </div>
    </div>`;

  document.body.appendChild(modal);

  const inten = document.getElementById('apIntensity');
  inten.addEventListener('input', ()=>{
    document.getElementById('apIntVal').textContent = inten.value + '/10';
  });

  document.getElementById('apCancel').addEventListener('click', ()=> modal.remove());
  modal.addEventListener('click', e=>{ if(e.target === modal) modal.remove(); });

  document.getElementById('apSave').addEventListener('click', async ()=>{
    const date = document.getElementById('apDate').value;
    if(!date){ showToast('Indica la data'); return; }
    if(date > todayStr()){ showToast('La data non puo essere futura'); return; }

    const entry = {
      id: uid(),
      playerId: playerId,
      date: date,
      zone: document.getElementById('apZone').value,
      type: document.getElementById('apType').value,
      intensity: parseInt(inten.value, 10) || 0,
      notes: document.getElementById('apNotes').value.trim(),
      addedBy: 'staff'
    };
    if(document.getElementById('apClosed').checked){
      entry.closed = true;
      entry.closedAt = date;
    }

    if(!confirm('Registrare questo problema per ' + (player ? player.name : '') + ' in data ' + fmtDate(date) + '?')) return;

    STATE.painLog.push(entry);
    await saveKey('pain-log', STATE.painLog);
    showToast('Problema registrato');
    modal.remove();
    if(onDone) onDone();
  });
}

/* Storico di una singola zona, con modifica ed eliminazione voce per voce */
function showPainHistory(playerId, zone, onDone){
  const player = STATE.players.find(p => String(p.id) === String(playerId));
  const old = document.getElementById('painHistoryModal');
  if(old) old.remove();

  const list = STATE.painLog
    .filter(x => String(x.playerId) === String(playerId) && (x.zone || 'Non indicata') === zone)
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  const modal = document.createElement('div');
  modal.id = 'painHistoryModal';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10002;padding:20px;box-sizing:border-box;overflow-y:auto;';

  modal.innerHTML = `
    <div style="background:white;border-radius:12px;max-width:520px;width:100%;padding:22px;margin:auto;">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:14px;">
        <div>
          <h3 style="margin:0;color:var(--pitch);">${esc(zone)}</h3>
          <div style="font-size:12px;color:var(--ink-soft);">${player ? esc(player.name) : ''} &middot; ${list.length} segnalazioni</div>
        </div>
        <button id="closePainHist" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;">&#10005;</button>
      </div>

      <div style="max-height:340px;overflow-y:auto;">
        ${list.map(x=>`
          <div style="padding:9px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;">
            <div style="font-size:17px;font-weight:700;color:var(--clay);width:32px;text-align:center;">${x.intensity}</div>
            <div>
              <div style="font-size:12px;font-weight:600;">${fmtDate(x.date)} &middot; ${esc(x.type||'—')}</div>
              ${x.notes ? `<div style="font-size:10.5px;color:var(--ink-soft);">${esc(x.notes)}</div>` : ''}
              ${x.editedBy ? `<div style="font-size:10px;color:var(--amber-dark);">modificato dallo staff il ${fmtDate(x.editedAt)}</div>` : ''}
            </div>
            <div style="display:flex;gap:4px;">
              <button class="ph-edit" data-id="${x.id}" style="background:none;border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;">Modifica</button>
              <button class="ph-del" data-id="${x.id}" style="background:none;border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;color:var(--clay);">Elimina</button>
            </div>
          </div>`).join('')}
      </div>

      <div style="text-align:right;margin-top:14px;">
        <button id="closePainHistBtn" class="btn">Chiudi</button>
      </div>
    </div>`;

  document.body.appendChild(modal);

  const shut = ()=>{ modal.remove(); if(onDone) onDone(); };
  document.getElementById('closePainHist').addEventListener('click', shut);
  document.getElementById('closePainHistBtn').addEventListener('click', shut);
  modal.addEventListener('click', e=>{ if(e.target === modal) shut(); });

  modal.querySelectorAll('.ph-edit').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const entry = STATE.painLog.find(x => x.id === btn.dataset.id);
      if(!entry) return;
      const val = prompt('Intensita del dolore da 0 a 10:', entry.intensity);
      if(val === null) return;
      const n = parseInt(val, 10);
      if(isNaN(n) || n < 0 || n > 10){ showToast('Inserisci un numero tra 0 e 10'); return; }
      const note = prompt('Note (vuoto per rimuoverle):', entry.notes || '');
      if(note === null) return;
      if(!confirm('Salvare le modifiche a questa segnalazione?')) return;
      entry.intensity = n;
      entry.notes = note.trim();
      entry.editedBy = 'staff';
      entry.editedAt = todayStr();
      await saveKey('pain-log', STATE.painLog);
      showToast('Segnalazione aggiornata');
      modal.remove();
      showPainHistory(playerId, zone, onDone);
    });
  });

  modal.querySelectorAll('.ph-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Eliminare questa segnalazione?\n\nIl dato viene rimosso per tutti e non si puo recuperare.')) return;
      STATE.painLog = STATE.painLog.filter(x => x.id !== btn.dataset.id);
      await saveKey('pain-log', STATE.painLog);
      showToast('Segnalazione eliminata');
      modal.remove();
      showPainHistory(playerId, zone, onDone);
    });
  });
}

/* Modifica di una singola rilevazione Hooper, voce per voce */

  const old = document.getElementById('hooperEditModal');
  if(old) old.remove();

  const player = STATE.players.find(p => String(p.id) === String(entry.playerId));

  const modal = document.createElement('div');
  modal.id = 'hooperEditModal';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10002;padding:20px;box-sizing:border-box;overflow-y:auto;';

  modal.innerHTML = `
    <div style="background:white;border-radius:12px;max-width:460px;width:100%;padding:22px;margin:auto;">
      <h3 style="margin:0 0 4px 0;color:var(--pitch);">Modifica rilevazione</h3>
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;">${player ? esc(player.name) : ''} &middot; ${fmtDate(entry.date)}</div>

      ${HOOPER_ITEMS.map(it=>`
        <div style="margin-top:14px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <label style="margin:0;">${it.label}</label>
            <span id="ed_${it.key}_val" style="color:var(--amber);font-weight:700;">${entry[it.key] || 4}</span>
          </div>
          <input id="ed_${it.key}" type="range" min="1" max="7" step="1" value="${entry[it.key] || 4}">
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft);margin-top:3px;">
            <span>1 &middot; ${it.low}</span><span>7 &middot; ${it.high}</span>
          </div>
        </div>`).join('')}

      <div style="margin-top:16px;padding:10px;background:var(--chalk);border-radius:6px;text-align:center;">
        <span style="font-size:11px;color:var(--ink-soft);">Punteggio</span>
        <div id="edTotal" style="font-size:22px;font-weight:700;color:var(--pitch);">—</div>
      </div>

      <div class="btn-row" style="justify-content:flex-end;">
        <button id="edCancel" class="btn secondary">Annulla</button>
        <button id="edSave" class="btn">Salva</button>
      </div>
    </div>`;

  document.body.appendChild(modal);

  const recalc = ()=>{
    let tot = 0;
    HOOPER_ITEMS.forEach(it=>{
      const v = parseInt(document.getElementById('ed_' + it.key).value, 10) || 4;
      document.getElementById('ed_' + it.key + '_val').textContent = v;
      tot += v;
    });
    const bnd = hooperBand(tot);
    const out = document.getElementById('edTotal');
    out.textContent = tot + '/28 — ' + bnd.label;
    out.style.color = bnd.color;
  };
  HOOPER_ITEMS.forEach(it=>{
    document.getElementById('ed_' + it.key).addEventListener('input', recalc);
  });
  recalc();

  document.getElementById('edCancel').addEventListener('click', ()=> modal.remove());
  modal.addEventListener('click', e=>{ if(e.target === modal) modal.remove(); });

  document.getElementById('edSave').addEventListener('click', async ()=>{
    if(!confirm('Salvare le modifiche a questa rilevazione?\n\nIl dato originale inserito dal giocatore verra sostituito.')) return;
    HOOPER_ITEMS.forEach(it=>{
      entry[it.key] = parseInt(document.getElementById('ed_' + it.key).value, 10) || 4;
    });
    entry.scale = 7;
    entry.editedBy = 'staff';
    entry.editedAt = todayStr();
    await saveKey('hooper-log', STATE.hooperLog);
    showToast('Rilevazione aggiornata');
    modal.remove();
    if(onDone) onDone();
  });
}

function renderGiocatori(el){
  const selectedId = el.dataset.selectedPlayerId || null;
  const selectedPlayer = selectedId ? STATE.players.find(p=>String(p.id)===String(selectedId)) : null;
  const isAddingNew = el.dataset.addingNew === 'true';

  // Se il giocatore ha un ruolo vecchio non presente in lista, lo tengo come opzione
  // per non riassegnarlo in automatico al primo della tendina.
  const roleOptions = (sel)=>{
    let out = ROLES.map(r=>`<option value="${r}" ${sel===r?'selected':''}>${r}</option>`).join('');
    if(sel && ROLES.indexOf(sel) === -1){
      out = `<option value="${esc(sel)}" selected>${esc(sel)} (da aggiornare)</option>` + out;
    }
    if(!sel){
      out = `<option value="" selected disabled>Seleziona ruolo...</option>` + out;
    }
    return out;
  };
  const footOptions = (sel)=>{
    let out = FEET.map(f=>`<option value="${f}" ${sel===f?'selected':''}>${f}</option>`).join('');
    if(!sel) out = `<option value="" selected disabled>Seleziona piede...</option>` + out;
    return out;
  };
  const statusOptions = (sel)=> PLAYER_STATUSES.map(st=>`<option value="${st.value}" ${sel===st.value?'selected':''}>${st.label}</option>`).join('');

  el.innerHTML = `
    <div class="page-head"><h1>Rosa</h1><p>${esc(STATE.teamConfig.name||'Squadra')} — ${STATE.players.length} giocatori</p></div>
    <div class="grid2">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="margin:0;">Elenco</h3>
          <button class="btn" id="addPlayerBtn" style="padding:6px 12px;font-size:12px;">+ Aggiungi</button>
        </div>
        <table>
          <thead><tr><th>Nome</th><th>Eta</th><th>Ruolo</th><th>Min.</th><th>Fresch.</th><th>Stato</th></tr></thead>
          <tbody id="playersTableBody"></tbody>
        </table>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:10px;">Fresch. = freschezza (Hooper in %): 100% pronto, 0% scarico. Min. = minuti in stagione. Il pallino rosso segnala un dolore aperto. Tocca un giocatore per la scheda.</div>
      </div>
      <div id="detailsPanel">
        ${isAddingNew ? `
          <div class="card">
            <h3>Nuovo giocatore</h3>
            <label>Nome e cognome</label>
            <input id="newName" type="text" placeholder="Es. Rossi Marco">
            <div class="grid2" style="gap:12px;">
              <div><label>Data di nascita</label><input id="newBirthDate" type="date"></div>
              <div><label>Ruolo</label><select id="newRole">${roleOptions('')}</select></div>
            </div>
            <label>Piede forte</label>
            <select id="newFoot">${footOptions('')}</select>
            <div class="grid2" style="gap:12px;">
              <div><label>Altezza (cm)</label><input id="newHeight" type="number" min="130" max="230" placeholder="Es. 178"></div>
              <div><label>Peso (kg)</label><input id="newWeight" type="number" min="35" max="150" step="0.1" placeholder="Es. 72.5"></div>
            </div>
            <div style="font-size:11px;color:var(--ink-soft);margin-top:10px;">Il codice di accesso viene generato in automatico.</div>
            <div class="btn-row"><button class="btn" id="confirmAddPlayerBtn">Aggiungi</button><button class="btn secondary" id="cancelAddPlayerBtn">Annulla</button></div>
          </div>
        ` : selectedPlayer ? `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:start;">
              <h3 style="margin:0;">${esc(selectedPlayer.name)}</h3>
              <span style="font-size:12px;color:var(--ink-soft);">${calcAge(selectedPlayer.birthDate)} anni</span>
            </div>

            <label>Nome e cognome</label>
            <input id="editName" type="text" value="${esc(selectedPlayer.name)}">

            <div class="grid2" style="gap:12px;">
              <div><label>Data di nascita</label><input id="editBirthDate" type="date" value="${selectedPlayer.birthDate||''}"></div>
              <div><label>Ruolo</label><select id="editRole">${roleOptions(selectedPlayer.role)}</select></div>
            </div>

            <div class="grid2" style="gap:12px;">
              <div><label>Piede forte</label><select id="editFoot">${footOptions(selectedPlayer.foot||'')}</select></div>
              <div><label>Stato</label><select id="editStatus">${statusOptions(selectedPlayer.status||'Disponibile')}</select></div>
            </div>

            <div class="grid2" style="gap:12px;">
              <div><label>Altezza (cm)</label><input id="editHeight" type="number" min="130" max="230" placeholder="Es. 178" value="${selectedPlayer.height||''}"></div>
              <div><label>Peso (kg)</label><input id="editWeight" type="number" min="35" max="150" step="0.1" placeholder="Es. 72.5" value="${selectedPlayer.weight||''}"></div>
            </div>

            ${(()=>{
              const open = getOpenPainIssues(selectedPlayer.id);
              if(open.length === 0) return '';
              return `<div style="margin-top:12px;padding:10px;border-radius:6px;background:var(--clay-soft);border-left:4px solid ${open[0].color};">
                <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#8B3429;margin-bottom:4px;">Dolori aperti (${open.length})</div>
                ${open.map(i=>`<div style="font-size:12px;color:#8B3429;">${esc(i.zone)} — ${i.lastIntensity}/10, ${i.days === 0 ? 'oggi' : i.days + ' giorni fa'} <span style="opacity:0.75;">(${i.label})</span></div>`).join('')}
                <div style="font-size:11px;color:#8B3429;opacity:0.8;margin-top:6px;">Gestiscili dalla scheda completa.</div>
              </div>`;
            })()}

            <div id="returnDateWrap" style="display:${statusMeta(selectedPlayer.status).needsDate ? 'block' : 'none'};">
              <label>Rientro stimato</label>
              <input id="editReturnDate" type="date" value="${selectedPlayer.returnDate||''}">
              <div style="font-size:11px;color:var(--ink-soft);margin-top:4px;">Stima interna dello staff, il giocatore non la vede.</div>
            </div>

            <div class="btn-row">
              <button class="btn" id="savePlayerBtn">Salva</button>
              <button class="btn secondary" id="playerReportBtn">Scheda completa</button>
              <button class="btn secondary" id="closePlayerBtn">Chiudi</button>
            </div>
            <div style="margin-top:10px;">
              <button class="btn secondary" id="deletePlayerBtn" style="color:var(--clay);font-size:12px;padding:6px 10px;">Elimina giocatore</button>
            </div>
          </div>
        ` : `<div class="card"><div class="empty">Seleziona un giocatore dall'elenco</div></div>`}
      </div>
    </div>
  `;

  const tbody = document.getElementById('playersTableBody');

  /* Ordinamento: raggruppamento per reparto (Portiere → Difensore → Centrocampista → Attaccante),
     alfabetico dentro ogni reparto. I ruoli sconosciuti vanno in fondo.
     Uso i reparti macro invece dei singoli ruoli, cosi' i separatori sono piu' leggibili. */
  const reparti = [
    {nome:'Portieri',      ruoli:['Portiere']},
    {nome:'Difensori',     ruoli:['Difensore centrale','Terzino']},
    {nome:'Centrocampisti',ruoli:['Mediano','Mezzala','Trequartista','Esterno']},
    {nome:'Attaccanti',    ruoli:['Punta']}
  ];
  const repartoDiRuolo = (ruolo) => {
    for(const r of reparti){ if(r.ruoli.indexOf(ruolo) !== -1) return r.nome; }
    return 'Altri';
  };
  const ordineReparto = (nome) => {
    const i = reparti.findIndex(r => r.nome === nome);
    return i === -1 ? 99 : i;
  };

  const orderedPlayers = STATE.players.slice().sort((a,b)=>{
    const ra = repartoDiRuolo(a.role);
    const rb = repartoDiRuolo(b.role);
    if(ra !== rb) return ordineReparto(ra) - ordineReparto(rb);
    return String(a.name).localeCompare(String(b.name));
  });

  let repartoPrecedente = null;
  orderedPlayers.forEach(p=>{
    const repartoAttuale = repartoDiRuolo(p.role);
    /* Riga separatore quando cambia reparto (non prima del primo) */
    if(repartoPrecedente !== null && repartoAttuale !== repartoPrecedente){
      const sep = document.createElement('tr');
      sep.innerHTML = `<td colspan="6" style="padding:0;border:none;"><div style="border-top:1px solid var(--line);margin:6px 0;"></div></td>`;
      tbody.appendChild(sep);
    }
    repartoPrecedente = repartoAttuale;

    const tr = document.createElement('tr');
    tr.className = 'player-row';
    tr.style.cursor = 'pointer';
    if(String(selectedId)===String(p.id)) tr.style.cssText += 'background:var(--chalk);border-left:4px solid var(--amber);cursor:pointer;';

    const hooper = getLatestHooperIndex(p.id);
    const hiDisplay = hooper
      ? `<span style="font-weight:700;color:${hooper.band.color};" title="Hooper ${hooper.score}/28 · ${hooper.band.label} — rilevato il ${fmtDate(hooper.date)}">${hooperPercent(hooper.score)}%</span>`
      : '<span style="color:var(--ink-soft);">—</span>';

    const meta = statusMeta(p.status);
    const returnInfo = (meta.needsDate && p.returnDate)
      ? `<div style="font-size:10px;color:var(--ink-soft);">rientro ${fmtDate(p.returnDate)}</div>` : '';

    const season = getSeasonStats(p.id);
    const openPain = getOpenPainIssues(p.id);
    const painDot = openPain.length
      ? `<span title="${openPain.length} problema/i aperto/i: ${openPain.map(i=>i.zone).join(', ')}" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${openPain[0].color};margin-left:6px;vertical-align:middle;"></span>`
      : '';

    tr.innerHTML = `
      <td><strong>${esc(p.name)}</strong>${painDot}</td>
      <td>${calcAge(p.birthDate)}</td>
      <td style="font-size:12px;">${esc(p.role||'—')}</td>
      <td style="font-size:12px;font-weight:600;">${season.minutes || '—'}</td>
      <td>${hiDisplay}</td>
      <td><span style="font-size:11px;font-weight:600;color:${meta.color};">${meta.label}</span>${returnInfo}</td>`;

    tr.addEventListener('click', (e)=>{
      if(e.target.closest('button')) return;
      el.dataset.selectedPlayerId = p.id;
      delete el.dataset.addingNew;
      renderGiocatori(el);
    });
    tbody.appendChild(tr);
  });

  // Mostra il campo rientro solo se lo stato lo richiede
  const statusSel = document.getElementById('editStatus');
  if(statusSel){
    statusSel.addEventListener('change', ()=>{
      const wrap = document.getElementById('returnDateWrap');
      if(wrap) wrap.style.display = statusMeta(statusSel.value).needsDate ? 'block' : 'none';
    });
  }

  const reportBtn = document.getElementById('playerReportBtn');
  if(reportBtn && selectedPlayer){
    reportBtn.addEventListener('click', ()=> showPlayerReport(selectedPlayer.id));
  }

  // Add player button
  const addBtn = document.getElementById('addPlayerBtn');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      el.dataset.addingNew = 'true';
      delete el.dataset.selectedPlayerId;
      renderGiocatori(el);
    });
  }
  
  // Confirm add player
  const confirmAddBtn = document.getElementById('confirmAddPlayerBtn');
  if(confirmAddBtn){
    confirmAddBtn.addEventListener('click', async ()=>{
      const name = document.getElementById('newName').value.trim();
      const birthDate = document.getElementById('newBirthDate').value;
      const role = document.getElementById('newRole').value;
      const foot = document.getElementById('newFoot').value;
      const heightRaw = document.getElementById('newHeight').value;
      const weightRaw = document.getElementById('newWeight').value;
      if(!name || !birthDate || !role){
        showToast('Completa tutti i campi');
        return;
      }

      const newPlayer = {
        id: uid(),
        name,
        birthDate,
        role,
        foot,
        height: heightRaw ? parseInt(heightRaw, 10) : null,
        weight: weightRaw ? parseFloat(weightRaw) : null,
        status: 'Disponibile',
        returnDate: ''
      };

      STATE.players.push(newPlayer);
      await saveKey('players', STATE.players);

      // Genera subito il codice di accesso
      await setAccessCode(newPlayer.id, generateAccessCode());

      showToast('Giocatore aggiunto, codice generato');
      delete el.dataset.addingNew;
      el.dataset.selectedPlayerId = newPlayer.id;
      renderGiocatori(el);
    });
  }
  
  // Cancel add player
  const cancelAddBtn = document.getElementById('cancelAddPlayerBtn');
  if(cancelAddBtn){
    cancelAddBtn.addEventListener('click', ()=>{
      delete el.dataset.addingNew;
      renderGiocatori(el);
    });
  }
  
  const delBtn = document.getElementById('deletePlayerBtn');
  if(delBtn && selectedPlayer){
    delBtn.addEventListener('click', async ()=>{
      if(!confirm('Eliminare ' + selectedPlayer.name + ' dalla rosa?')) return;
      if(!confirm('Conferma definitiva.\n\nVerranno persi anche il suo codice di accesso e il collegamento ai dati registrati.')) return;

      const pid = selectedPlayer.id;
      STATE.players = STATE.players.filter(p => String(p.id) !== String(pid));
      if(STATE.accessCodes && STATE.accessCodes[pid]){
        delete STATE.accessCodes[pid];
        await saveKey('accessCodes', STATE.accessCodes);
      }
      await saveKey('players', STATE.players);
      showToast('Giocatore eliminato');
      delete el.dataset.selectedPlayerId;
      renderGiocatori(el);
    });
  }
  
  if(selectedPlayer){
    document.getElementById('savePlayerBtn').addEventListener('click', async ()=>{
      const name = document.getElementById('editName').value.trim();
      if(!name){ showToast('Il nome non puo essere vuoto'); return; }

      const roleVal = document.getElementById('editRole').value;
      const footVal = document.getElementById('editFoot').value;
      if(!roleVal){ showToast('Seleziona un ruolo'); return; }
      if(!footVal){ showToast('Seleziona il piede forte'); return; }

      const newStatus = document.getElementById('editStatus').value;
      const needsDate = statusMeta(newStatus).needsDate;
      const returnEl = document.getElementById('editReturnDate');
      const returnDate = (needsDate && returnEl) ? returnEl.value : '';

      const statusChanged = newStatus !== selectedPlayer.status;
      if(statusChanged && !confirm('Cambiare lo stato di ' + selectedPlayer.name + ' da "' + (selectedPlayer.status||'—') + '" a "' + newStatus + '"?')) return;

      selectedPlayer.name = name;
      selectedPlayer.birthDate = document.getElementById('editBirthDate').value;
      selectedPlayer.role = roleVal;
      selectedPlayer.foot = footVal;
      selectedPlayer.status = newStatus;
      selectedPlayer.returnDate = returnDate;
      /* Altezza e peso: campi opzionali, li salvo se compilati */
      const heightRaw = document.getElementById('editHeight').value;
      const weightRaw = document.getElementById('editWeight').value;
      selectedPlayer.height = heightRaw ? parseInt(heightRaw, 10) : null;
      selectedPlayer.weight = weightRaw ? parseFloat(weightRaw) : null;

      // Chi non e' disponibile non resta segnato presente
      if(newStatus !== 'Disponibile'){
        let removed = 0;
        STATE.events.forEach(ev=>{
          if(Array.isArray(ev.presentPlayers) && ev.date >= todayStr()){
            const i = ev.presentPlayers.indexOf(selectedPlayer.id);
            if(i !== -1){ ev.presentPlayers.splice(i,1); ev.presentCount = ev.presentPlayers.length; removed++; }
          }
        });
        if(removed > 0) await saveKey('events', STATE.events);
      }

      await saveKey('players', STATE.players);
      showToast('Modifiche salvate');
      renderGiocatori(el);
    });

    document.getElementById('closePlayerBtn').addEventListener('click', ()=>{
      delete el.dataset.selectedPlayerId;
      renderGiocatori(el);
    });
  }
}

function renderMedica(el){

    <div style="display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;">
      ${tabBtn('infermeria','Infermeria')}
      ${tabBtn('registro','Registro infortuni')}
      ${tabBtn('dolori','Dolori')}
      ${tabBtn('piani','Piani individuali')}
      ${tabBtn('analisi','Analisi')}
    </div>
    <div id="medContent"></div>
  `;

  el.querySelectorAll('.med-tab').forEach(b=>{
    b.addEventListener('click', ()=>{ el.dataset.medTab = b.dataset.tab; renderMedica(el); });
  });

  const printMedBtn = document.getElementById('printMedicaBtn');
  if(printMedBtn) printMedBtn.addEventListener('click', printAreaMedica);

  const c = document.getElementById('medContent');
  if(!c) return;
  if(tab === 'infermeria') renderInfermeria(c);
  else if(tab === 'registro') renderRegistroInfortuni(c);
  else if(tab === 'dolori') renderMedDolori(c);
  else if(tab === 'piani') renderPianiIndividuali(c, 'riabilitazione');
  else renderMedAnalisi(c);
}

/* ============================================================
   PIANI INDIVIDUALI
   Ogni piano appartiene a un giocatore, ha un tipo (integrazione o
   riabilitazione), una data, un titolo, testo libero opzionale ed
   esercizi strutturati opzionali. Il giocatore vede il piano nel
   proprio menu, puo' aggiungere commenti (uno per piano + uno per
   esercizio) e inserire un RPE fine allenamento. Se ha anche una
   partita o allenamento lo stesso giorno, il carico usa la media
   dei due RPE.
   ============================================================ */

/* Helper: piani di un giocatore filtrati per tipo, ordinati dal piu' recente */
function pianiDelGiocatore(playerId, tipo){
  const pid = String(playerId);
  return (STATE.individualPlans || [])
    .filter(p => String(p.playerId) === pid && (!tipo || p.type === tipo))
    .sort((a,b)=> String(b.date).localeCompare(String(a.date)));
}

/* Helper: quanti piani non ancora "visti" dal giocatore */
function pianiNonVisti(playerId){
  return pianiDelGiocatore(playerId).filter(p => !p.seen).length;
}

/* Helper: piani attivi/futuri (data >= oggi) */
function isPianoAttivo(piano){
  return piano.date >= todayStr() || !piano.completed;
}

/* Aggregatore RPE per calcolo carico: se un giocatore ha compilato un RPE
   per un piano individuale nello stesso giorno di una sessione, uso la media. */
function planRPEForDate(playerId, dateStr){
  const pid = String(playerId);
  const daily = (STATE.individualPlans || [])
    .filter(p => String(p.playerId) === pid && p.date === dateStr && p.playerRPE != null);
  if(daily.length === 0) return null;
  const avg = daily.reduce((s,p)=>s + Number(p.playerRPE || 0), 0) / daily.length;
  return Math.round(avg * 10) / 10;
}

/* Stima durata di un piano dagli esercizi. Se non ricavabile, default 30 min:
   valore ragionevole per lavoro individuale integrativo/riabilitativo. */
function stimaDurataPiano(piano){
  if(!piano || !Array.isArray(piano.exercises)) return 30;
  let tot = 0;
  piano.exercises.forEach(ex=>{
    const serie = ex.series || 1;
    const rep = ex.reps || 1;
    /* Stima tempo per rep: se c'e' TUT parsabile lo uso, altrimenti 3 secondi */
    let repSec = 3;
    if(ex.tut){
      const parts = String(ex.tut).split(/[-\/]/).map(x=>parseInt(x,10));
      const somma = parts.filter(x=>!isNaN(x)).reduce((s,x)=>s+x,0);
      if(somma > 0) repSec = somma;
    }
    const workSec = serie * rep * repSec;
    const restSec = serie * (ex.recovery || 60);
    tot += (workSec + restSec) / 60;   /* converto in minuti */
  });
  return Math.max(15, Math.round(tot));
}

/* Registra o aggiorna la voce sintetica in rpeLog per un piano individuale.
   Cosi' il carico del piano rientra in ACWR e nelle statistiche senza duplicare
   dati. La chiave e' 'plan:<planId>' — univoca per piano. */
async function syncPlanRPEToLog(piano){
  if(!piano || piano.playerRPE == null) return;
  if(!Array.isArray(STATE.rpeLog)) STATE.rpeLog = [];
  const key = 'plan:' + piano.id;
  const durata = stimaDurataPiano(piano);
  const existing = STATE.rpeLog.find(r => r.sessionId === key);
  if(existing){
    existing.rpe = piano.playerRPE;
    existing.minutes = durata;
    existing.date = piano.date;
  } else {
    STATE.rpeLog.push({
      id: uid(),
      playerId: String(piano.playerId),
      date: piano.date,
      rpe: piano.playerRPE,
      minutes: durata,
      sessionId: key,
      source: 'plan',
      statusAtEntry: 'Disponibile',
      createdAt: new Date().toISOString()
    });
  }
  await saveKey('rpeLog', STATE.rpeLog);
}

/* Rimozione voce sintetica quando piano viene eliminato */
async function removePlanRPEFromLog(planId){
  if(!Array.isArray(STATE.rpeLog)) return;
  const key = 'plan:' + planId;
  const before = STATE.rpeLog.length;
  STATE.rpeLog = STATE.rpeLog.filter(r => r.sessionId !== key);
  if(STATE.rpeLog.length !== before) await saveKey('rpeLog', STATE.rpeLog);
}

  }

  el.querySelectorAll('.pi-plan-row').forEach(row=>{
    row.addEventListener('click', (e)=>{
      if(e.target.closest('.pi-plan-del')) return;   /* click su elimina gestito a parte */
      el.dataset.editPlanId = row.dataset.planId;
      renderPianiIndividuali(el, tipo);
    });
  });

  el.querySelectorAll('.pi-plan-del').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Eliminare questo piano? L\'operazione non e\' reversibile.')) return;
      const pid = btn.dataset.planId;
      STATE.individualPlans = (STATE.individualPlans||[]).filter(p => p.id !== pid);
      await saveKey('individualPlans', STATE.individualPlans);
      await removePlanRPEFromLog(pid);
      renderPianiIndividuali(el, tipo);
    });
  });
}

/* Riga riepilogo di un piano nella lista staff */
function rigaPianoStaff(p){
  const nEx = (p.exercises || []).length;
  const hasComment = p.playerComment && p.playerComment.trim().length > 0;
  const hasExComments = (p.exercises || []).some(ex => ex.playerComment && ex.playerComment.trim());
  const rpeInfo = p.playerRPE != null ? `<span style="color:var(--pitch);font-weight:700;">RPE ${p.playerRPE}</span>` : '<span style="color:var(--ink-soft);">RPE non compilato</span>';
  return `
    <div class="pi-plan-row" data-plan-id="${p.id}" style="padding:10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:pointer;background:${p.seen?'white':'#FFF8E7'};">
      <div style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;">
        <div>
          <div style="font-size:13px;font-weight:600;">${esc(p.title || 'Piano senza titolo')}</div>
          <div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">
            ${fmtDate(p.date)} · ${nEx} esercizi${p.freeText ? ' · nota libera' : ''}
          </div>
          <div style="font-size:11px;margin-top:4px;">${rpeInfo}${hasComment ? ' · <span style="color:var(--amber-dark);">commento piano</span>' : ''}${hasExComments ? ' · <span style="color:var(--amber-dark);">commenti esercizi</span>' : ''}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
          ${!p.seen ? '<span style="background:var(--amber);color:white;padding:2px 6px;border-radius:8px;font-size:9px;font-weight:700;">NUOVO</span>' : ''}
          ${p.completed ? '<span style="color:var(--ok);font-size:10px;font-weight:700;">COMPLETATO</span>' : ''}
          <button class="pi-plan-del" data-plan-id="${p.id}" style="background:none;border:1px solid var(--line);border-radius:3px;padding:2px 6px;font-size:10px;color:var(--clay);cursor:pointer;">Elimina</button>
        </div>
      </div>
    </div>
  `;
}

/* Editor di un singolo piano (staff) */
function renderPianoEditor(el, planId, tipo){
  const piano = (STATE.individualPlans || []).find(p => p.id === planId);
  if(!piano){
    el.dataset.editPlanId = '';
    renderPianiIndividuali(el, tipo);
    return;
  }
  const player = STATE.players.find(p => String(p.id) === String(piano.playerId));
  const tipoLabel = piano.type === 'riabilitazione' ? 'Riabilitazione' : 'Integrazione';
  const tipoColor = piano.type === 'riabilitazione' ? 'var(--clay)' : 'var(--amber)';

  el.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;">
        <div>
          <h3 style="margin:0;">Piano di ${tipoLabel.toLowerCase()}</h3>
          <div style="font-size:12px;color:var(--ink-soft);">${player ? esc(player.name) : 'giocatore rimosso'}</div>
        </div>
        <button class="btn secondary pi-back-btn" style="font-size:12px;padding:6px 12px;">← Indietro</button>
      </div>

      <div class="grid2" style="gap:12px;">
        <div>
          <label>Titolo del piano</label>
          ${(()=>{
            const opzioni = piano.type === 'riabilitazione' ? PIANO_TITOLI_RIABILITAZIONE : PIANO_TITOLI_INTEGRAZIONE;
            const titoloCorrente = piano.title || '';
            const isCustom = titoloCorrente && opzioni.indexOf(titoloCorrente) === -1;
            return `
              <select id="piTitleSelect" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:white;margin-bottom:6px;">
                <option value="">— Seleziona un titolo —</option>
                ${opzioni.map(o=>`<option value="${esc(o)}" ${o===titoloCorrente?'selected':''}>${esc(o)}</option>`).join('')}
