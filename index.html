// ========== FIRESTORE REAL-TIME SYNC ==========
/* Conserva una copia locale prima che un dato venga sostituito da uno molto piu' piccolo.
   E' la rete che ci e' mancata quando i dati sono spariti. */
const CHIAVI_SALVAGUARDIA = ['players','events','workouts','tests','rpe-log','hooper-log','pain-log','injuries'];

function salvaguarda(key, nuovo){
  if(CHIAVI_SALVAGUARDIA.indexOf(key) === -1) return;
  let vecchio = null;
  try{ const raw = localStorage.getItem(key); if(raw) vecchio = JSON.parse(raw); }catch(e){ return; }
  if(!Array.isArray(vecchio) || vecchio.length === 0) return;

  const nuovaLung = Array.isArray(nuovo) ? nuovo.length : 0;
  // Perdita sospetta: sparisce tutto, o piu' della meta'
  if(nuovaLung === 0 || nuovaLung < vecchio.length / 2){
    const etichetta = 'salvagente_' + key;
    try{
      localStorage.setItem(etichetta, JSON.stringify({
        quando: new Date().toISOString(),
        avevo: vecchio.length,
        arrivato: nuovaLung,
        dati: vecchio
      }));
      console.warn('SALVAGENTE: ' + key + ' e passato da ' + vecchio.length + ' a ' + nuovaLung +
                   ' voci. Copia conservata in questo dispositivo.');
      PERDITE_RILEVATE[key] = {avevo: vecchio.length, arrivato: nuovaLung};
    }catch(e){}
  }
}

const PERDITE_RILEVATE = {};

/* ---------- BACKUP AUTOMATICO LOCALE ----------
   Ogni 30 minuti conserva una copia completa sul dispositivo. Restano gli ultimi
   10 punti di ripristino. Sul dispositivo e non sul cloud: un dispositivo con la
   rete guasta corromperebbe anche il backup se stesse in Firestore. */
const AUTO_BACKUP_KEY = 'thp-auto-backup';
const AUTO_BACKUP_MAX = 20;
const AUTO_BACKUP_MINUTI = 15;

function raccogliDati(){
  return {
    quando: new Date().toISOString(),
    teamConfig: STATE.teamConfig,
    players: STATE.players || [],
    events: STATE.events || [],
    workouts: STATE.workouts || [],
    tests: STATE.tests || [],
    rpeLog: STATE.rpeLog || [],
    hooperLog: STATE.hooperLog || [],
    painLog: STATE.painLog || [],
    injuries: STATE.injuries || [],
    accessCodes: STATE.accessCodes || {},
    customPasswords: STATE.customPasswords || {}
  };
}

function contaVoci(b){
  return (b.players||[]).length + (b.events||[]).length + (b.rpeLog||[]).length +
         (b.hooperLog||[]).length + (b.painLog||[]).length + (b.injuries||[]).length +
         (b.tests||[]).length + (b.workouts||[]).length;
}

function leggiAutoBackup(){
  try{ const raw = localStorage.getItem(AUTO_BACKUP_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}

function eseguiAutoBackup(forzato){
  // Non salvo se il caricamento e' fallito: sarebbe un backup di dati incompleti
  if(LOAD_FAILED){ return false; }

  const dati = raccogliDati();
  const voci = contaVoci(dati);

  // Non salvo un backup quasi vuoto sopra a uno pieno: sarebbe come perdere i dati
  const lista = leggiAutoBackup();
  const ultimo = lista[0];
  if(!forzato && ultimo){
    const vociUltimo = contaVoci(ultimo);
    if(voci === 0 && vociUltimo > 0) return false;
    if(voci < vociUltimo / 2 && vociUltimo > 5) return false;
    // Se nulla e' cambiato dall'ultima volta, evito una copia inutile
    if(voci === vociUltimo && Date.now() - new Date(ultimo.quando).getTime() < AUTO_BACKUP_MINUTI*60000*0.9) return false;
  }

  lista.unshift(dati);
  while(lista.length > AUTO_BACKUP_MAX) lista.pop();

  try{
    localStorage.setItem(AUTO_BACKUP_KEY, JSON.stringify(lista));
    console.log('Backup automatico: ' + voci + ' voci conservate (' + lista.length + ' punti disponibili)');
    return true;
  }catch(e){
    // localStorage pieno: tolgo i piu' vecchi e riprovo
    try{
      while(lista.length > 3){ lista.pop(); }
      localStorage.setItem(AUTO_BACKUP_KEY, JSON.stringify(lista));
      return true;
    }catch(e2){ console.error('Backup automatico non riuscito:', e2.message); return false; }
  }
}

async function ripristinaAutoBackup(indice){
  const lista = leggiAutoBackup();
  const b = lista[indice];
  if(!b) return false;
  if(LOAD_FAILED){ showToast('Ricarica la pagina prima di ripristinare'); return false; }

  STATE.teamConfig = b.teamConfig || STATE.teamConfig;
  STATE.players = b.players || [];
  STATE.events = b.events || [];
  STATE.workouts = b.workouts || [];
  STATE.tests = b.tests || [];
  STATE.rpeLog = b.rpeLog || [];
  STATE.hooperLog = b.hooperLog || [];
  STATE.painLog = b.painLog || [];
  STATE.injuries = b.injuries || [];
  STATE.accessCodes = b.accessCodes || {};
  STATE.customPasswords = b.customPasswords || {};

  await saveKey('team-config', STATE.teamConfig);
  await saveKey('players', STATE.players);
  await saveKey('events', STATE.events);
  await saveKey('workouts', STATE.workouts);
  await saveKey('tests', STATE.tests);
  await saveKey('rpe-log', STATE.rpeLog);
  await saveKey('hooper-log', STATE.hooperLog);
  await saveKey('pain-log', STATE.painLog);
  await saveKey('injuries', STATE.injuries);
  await saveKey('accessCodes', STATE.accessCodes);
  await saveKey('customPasswords', STATE.customPasswords);
  return true;
}

/* Scarica il file di backup completo. Riutilizzabile da piu' punti. */
function scaricaBackupCompleto(){
  const backup = {
    formato: 'team-hub-pro-1',
    esportatoIl: new Date().toISOString(),
    teamConfig: STATE.teamConfig,
    players: STATE.players || [],
    accessCodes: STATE.accessCodes || {},
    customPasswords: STATE.customPasswords || {},
    staffPassword: STATE.staffPassword,
    adminPassword: STATE.adminPassword,
    events: STATE.events || [],
    workouts: STATE.workouts || [],
    tests: STATE.tests || [],
    rpeLog: STATE.rpeLog || [],
    hooperLog: STATE.hooperLog || [],
    painLog: STATE.painLog || [],
    injuries: STATE.injuries || [],
    staffMembers: STATE.staffMembers || []
  };
  try{
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'team-hub-pro-backup-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Backup scaricato');
    return true;
  }catch(e){ showToast('Download non riuscito'); return false; }
}

/* Registra quando e' stato fatto l'ultimo backup esterno (file scaricato) */
const BACKUP_ESTERNO_KEY = 'thp-ultimo-backup-esterno';
function registraBackupEsterno(){
  try{ localStorage.setItem(BACKUP_ESTERNO_KEY, new Date().toISOString()); }catch(e){}
}
function giorniDaUltimoBackupEsterno(){
  try{
    const raw = localStorage.getItem(BACKUP_ESTERNO_KEY);
    if(!raw) return null;
    return Math.floor((Date.now() - new Date(raw).getTime()) / 86400000);
  }catch(e){ return null; }
}

/* Backup automatico prima di un'operazione rischiosa (reset, cancellazioni) */
function backupPrimaDiOperazioneRischiosa(){
  eseguiAutoBackup(true);
}

let autoBackupTimer = null;
function avviaAutoBackup(){
  if(autoBackupTimer) return;
  // Primo backup 90 secondi dopo l'apertura, poi a intervalli regolari
  setTimeout(()=>{ eseguiAutoBackup(false); }, 90000);
  autoBackupTimer = setInterval(()=>{ eseguiAutoBackup(false); }, AUTO_BACKUP_MINUTI*60000);

  // Un backup anche quando si chiude o si nasconde la pagina: cattura le ultime modifiche
  window.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'hidden') eseguiAutoBackup(false);
  });
  window.addEventListener('pagehide', ()=>{ eseguiAutoBackup(false); });
}

async function setupFirestoreSync(){
  if(!db || !TEAM_ID) return;

  /* Merge in-place: se un elemento e' gia' presente (stesso id/date), aggiorno
     i suoi campi mantenendo il riferimento dell'oggetto. Cosi' i modali aperti
     che hanno una reference a un match/giocatore non diventano orfani quando
     la sync rimbalza indietro dei dati appena salvati. */
  function mergeInPlace(oldArr, newArr){
    if(!Array.isArray(oldArr) || !Array.isArray(newArr)) return newArr;
    const keyOf = o => o && (o.id || o.date || JSON.stringify(o));
    const oldMap = new Map();
    oldArr.forEach(o => { const k = keyOf(o); if(k) oldMap.set(k, o); });
    return newArr.map(nu => {
      const k = keyOf(nu);
      const existing = k ? oldMap.get(k) : null;
      if(existing && typeof existing === 'object' && typeof nu === 'object'){
        /* Rimuovo campi che non esistono piu' nella nuova versione */
        for(const kk of Object.keys(existing)){
          if(!(kk in nu)) delete existing[kk];
        }
        /* Aggiorno con la nuova versione, ma preservo la stessa reference */
        Object.assign(existing, nu);
        return existing;
      }
      return nu;
    });
  }

  try{
    db.collection('teams').doc(TEAM_ID).collection('data').onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        if(change.type !== 'added' && change.type !== 'modified') return;

        const key = change.doc.id;
        const dati = change.doc.data() || {};
        const data = dati.value;

        // Non accetto valori assenti: sovrascriverebbero con nulla
        if(typeof data === 'undefined' || data === null){
          console.warn('Sincronizzazione ignorata per', key, '- valore assente');
          return;
        }

        salvaguarda(key, data);

        /* Per gli array di oggetti, uso il merge in-place per preservare
           i riferimenti (fix bug modale formazione che salvava un giocatore
           per volta perche' l'oggetto match veniva orfanato ad ogni sync). */
        if(key === 'players')      STATE.players      = mergeInPlace(STATE.players, data);
        if(key === 'workouts')     STATE.workouts     = mergeInPlace(STATE.workouts, data);
        if(key === 'events')       STATE.events       = mergeInPlace(STATE.events, data);
        if(key === 'tests')        STATE.tests        = mergeInPlace(STATE.tests, data);
        if(key === 'rpe-log')      STATE.rpeLog       = mergeInPlace(STATE.rpeLog, data);
        if(key === 'hooper-log')   STATE.hooperLog    = mergeInPlace(STATE.hooperLog, data);
        if(key === 'pain-log')     STATE.painLog      = mergeInPlace(STATE.painLog, data);
        if(key === 'injuries')     STATE.injuries     = mergeInPlace(STATE.injuries || [], data);
        if(key === 'staffMembers') STATE.staffMembers = mergeInPlace(STATE.staffMembers || [], data);
        if(key === 'individualPlans') STATE.individualPlans = mergeInPlace(STATE.individualPlans || [], data);
        /* Chiavi non-array: assegnamento diretto */
        if(key === 'team-config')      STATE.teamConfig      = data;
        if(key === 'accessCodes')      STATE.accessCodes     = data || {};
        if(key === 'customPasswords')  STATE.customPasswords = data || {};

        try{ localStorage.setItem(key, JSON.stringify(data)); }catch(e){}
      });

      if(STATE.loggedIn) render();
    }, err => {
      console.error('Errore sincronizzazione:', err);
    });
  }catch(err){
    console.error('Errore avvio sincronizzazione:', err);
  }
}

/* Elenca i salvagenti disponibili su questo dispositivo */
function elencaSalvagenti(){
  const out = [];
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('salvagente_') === 0){
        try{
          const v = JSON.parse(localStorage.getItem(k));
          out.push({chiave: k.replace('salvagente_',''), etichetta: k, quando: v.quando, avevo: v.avevo, arrivato: v.arrivato});
        }catch(e){}
      }
    }
  }catch(e){}
  return out.sort((a,b)=>String(b.quando).localeCompare(String(a.quando)));
}

async function ripristinaSalvagente(chiave){
  const etichetta = 'salvagente_' + chiave;
  let pacchetto;
  try{ pacchetto = JSON.parse(localStorage.getItem(etichetta)); }catch(e){ return false; }
  if(!pacchetto || !Array.isArray(pacchetto.dati)) return false;

  const mappa = {
    'players':'players','events':'events','workouts':'workouts','tests':'tests',
    'rpe-log':'rpeLog','hooper-log':'hooperLog','pain-log':'painLog','injuries':'injuries'
  };
  const campo = mappa[chiave];
  if(!campo) return false;

  STATE[campo] = pacchetto.dati;
  await saveKey(chiave, pacchetto.dati);
  return pacchetto.dati.length;
}

console.log('⏳ Aspettando caricamento...');
initFirebase();

// Timeout di 5 secondi - se non carica, mostra comunque la login
const loadTimeout = setTimeout(()=>{
  console.warn('Timeout caricamento: mostro comunque la schermata di accesso');
  STATE.loading = false;          // altrimenti render() resta su "Caricamento..."
  if(!STATE.loggedIn) render();
}, 6000);

loadAll().then(()=>{
  clearTimeout(loadTimeout);
  console.log('Dati caricati');

  // Accesso tramite link diretto: .../#c=CODICE
  try{
    const m = (location.hash || '').match(/[#&]c=([A-Za-z0-9\-]+)/);
    if(m && !STATE.loggedIn){
      const pid = findPlayerByCode(m[1]);
      // Ripulisce subito la barra degli indirizzi: il codice non resta in cronologia
      history.replaceState(null, '', location.pathname + location.search);
      if(pid){
        try{ localStorage.setItem(DEVICE_CODE_KEY, normalizeCode(m[1])); }catch(e){}
        login('player', pid);
        setupFirestoreSync();
        avviaAutoBackup();
        return;
      }
      showToast('Il link non e valido: chiedi allo staff di rigenerarlo');
    }
  }catch(e){ console.warn('Link di accesso non valido:', e.message); }

  // Dispositivo gia' riconosciuto: entra senza chiedere niente
  try{
    const savedCode = localStorage.getItem(DEVICE_CODE_KEY);
    if(savedCode && !STATE.loggedIn){
      const pid = findPlayerByCode(savedCode);
      if(pid){
        login('player', pid);
        setupFirestoreSync();
        avviaAutoBackup();
        return;
      }
      const staff = findStaffByCode(savedCode);
      if(staff){
        loginStaffMember(staff);
        setupFirestoreSync();
        avviaAutoBackup();
        return;
      }
      // Codice non piu' valido (rigenerato): dimenticalo
      localStorage.removeItem(DEVICE_CODE_KEY);
    }
  }catch(e){ console.warn('Auto-login non riuscito:', e.message); }

  render();
  setupFirestoreSync();
  avviaAutoBackup();
}).catch(err=>{
  clearTimeout(loadTimeout);
  console.error('Errore caricamento:', err);
  STATE.loading = false;
  if(!STATE.loggedIn) render();
});
