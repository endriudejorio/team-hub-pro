  // --- Import RPE storici ---
  const impDur = document.getElementById('impDuration');
  if(impDur){
    impDur.addEventListener('input', ()=>{
      const lab = document.getElementById('impDurLabel');
      if(lab) lab.textContent = impDur.value || '65';
    });
  }

  const parseRpeImport = ()=>{
    const raw = document.getElementById('rpeImportBox').value;
    const righe = raw.split('\n').map(r=>r.trim()).filter(r=>r.length > 0);
    const ok = [], errori = [];
    const nomiIgnoti = {};

    righe.forEach((riga, i)=>{
      const parts = riga.split(/[;\t|,]/).map(x=>x.trim());
      if(parts.length < 3){ errori.push('Riga ' + (i+1) + ': servono nome, data e RPE'); return; }

      const nome = parts[0];
      const data = parts[1];
      const rpe = parseInt(parts[2], 10);

      const player = STATE.players.find(pl =>
        String(pl.name).toLowerCase().replace(/\s+/g,' ').trim() === nome.toLowerCase().replace(/\s+/g,' ').trim());
      if(!player){ nomiIgnoti[nome] = (nomiIgnoti[nome]||0)+1; return; }

      if(!/^\d{4}-\d{2}-\d{2}$/.test(data)){ errori.push('Riga ' + (i+1) + ': data "' + data + '" non nel formato AAAA-MM-GG'); return; }
      if(data > todayStr()){ errori.push('Riga ' + (i+1) + ': data futura'); return; }
      if(isNaN(rpe) || rpe < 0 || rpe > 10){ errori.push('Riga ' + (i+1) + ': RPE "' + parts[2] + '" fuori dalla scala 0-10'); return; }

      ok.push({playerId: player.id, playerName: player.name, date: data, rpe: rpe});
    });

    return {ok, errori, nomiIgnoti, totale: righe.length};
  };

  const mostraReport = (res, importato)=>{
    const box = document.getElementById('rpeImportReport');
    const ignoti = Object.keys(res.nomiIgnoti);
    box.innerHTML = `
      <div style="font-size:12px;border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--chalk);">
        <div style="font-weight:700;margin-bottom:6px;">${importato ? 'Importate' : 'Pronte per l\'import'}: ${res.ok.length} righe su ${res.totale}</div>
        ${ignoti.length ? `<div style="color:var(--clay);margin-top:6px;"><strong>Nomi non trovati in Rosa (${ignoti.length}):</strong><br>${ignoti.map(n=>esc(n) + ' (' + res.nomiIgnoti[n] + ')').join('<br>')}</div>` : ''}
        ${res.errori.length ? `<div style="color:var(--clay);margin-top:6px;"><strong>Righe scartate (${res.errori.length}):</strong><br>${res.errori.slice(0,10).map(esc).join('<br>')}${res.errori.length>10?'<br>...':''}</div>` : ''}
        ${(!ignoti.length && !res.errori.length) ? '<div style="color:var(--ok);">Nessun problema rilevato.</div>' : ''}
      </div>`;
  };

  const previewBtn = document.getElementById('rpePreviewBtn');
  if(previewBtn){
    previewBtn.addEventListener('click', ()=> mostraReport(parseRpeImport(), false));
  }

  const importBtn = document.getElementById('rpeImportBtn');
  if(importBtn){
    importBtn.addEventListener('click', async ()=>{
      const res = parseRpeImport();
      if(res.ok.length === 0){ mostraReport(res, false); showToast('Nessuna riga valida da importare'); return; }
      const dur = parseInt(document.getElementById('impDuration').value, 10) || 65;
      if(!confirm('Importare ' + res.ok.length + ' rilevazioni RPE?\n\nVerranno attribuite ai giocatori come se le avessero inserite loro.')) return;

      // Sessione fittizia per la durata assunta, cosi' il carico e' calcolabile
      let ghost = STATE.events.find(e => e.id === 'rpe-import-session');
      if(!ghost){
        ghost = {
          id: 'rpe-import-session', type: 'Allenamento', title: 'Sessioni storiche (importate)',
          date: '2000-01-01', importedDuration: dur, workoutIds: [], presentPlayers: []
        };
        STATE.events.push(ghost);
      }
      ghost.importedDuration = dur;

      let aggiunte = 0, duplicati = 0;
      res.ok.forEach(r=>{
        const gia = STATE.rpeLog.some(x => String(x.playerId)===String(r.playerId) && x.date===r.date);
        if(gia){ duplicati++; return; }
        STATE.rpeLog.push({
          id: uid(), playerId: r.playerId, date: r.date,
          sessionId: 'rpe-import-session', rpe: r.rpe, imported: true
        });
        aggiunte++;
      });

      await saveKey('events', STATE.events);
      await saveKey('rpe-log', STATE.rpeLog);
      mostraReport(res, true);
      showToast(aggiunte + ' RPE importati' + (duplicati ? ', ' + duplicati + ' gia presenti saltati' : ''));
    });
  }

  // --- Codici di accesso ---
  const buildCodeMessage = (player)=>{
    const code = getAccessCode(player.id);
    const link = location.origin + location.pathname + '#c=' + code;
    return 'Ciao ' + String(player.name).split(' ')[0] + '!\n\n'
      + 'Accedi a TEAM HUB PRO con un tocco:\n' + link + '\n\n'
      + 'Se il link non funziona, apri ' + location.origin + ' e inserisci il codice:\n'
      + formatCode(code) + '\n\n'
      + 'Quando il telefono chiede di salvare la password, accetta: dopo entrera da solo.\n'
      + 'Non girare questo messaggio a nessuno.';
  };

  el.querySelectorAll('.code-gen').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const player = STATE.players.find(p=>String(p.id)===String(btn.dataset.playerId));
      if(!player) return;
      const c = generateAccessCode();
      if(!c){ showToast('Errore nella generazione'); return; }
      await setAccessCode(player.id, c);
      showToast('Codice generato per ' + player.name);
      renderImpostazioniAdmin(el);
    });
  });

  el.querySelectorAll('.code-regen').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const player = STATE.players.find(p=>String(p.id)===String(btn.dataset.playerId));
      if(!player) return;
      if(!confirm('Rigenerare il codice di ' + player.name + '?\n\nIl codice e il link attuali smetteranno subito di funzionare.')) return;
      const c = generateAccessCode();
      if(!c){ showToast('Errore nella generazione'); return; }
      await setAccessCode(player.id, c);
      showToast('Nuovo codice per ' + player.name);
      renderImpostazioniAdmin(el);
    });
  });

  el.querySelectorAll('.code-copy').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const player = STATE.players.find(p=>String(p.id)===String(btn.dataset.playerId));
      if(!player) return;
      const msg = buildCodeMessage(player);
      try{
        await navigator.clipboard.writeText(msg);
        showToast('Messaggio per ' + String(player.name).split(' ')[0] + ' copiato');
      }catch(err){
        prompt('Copia questo messaggio:', msg);
      }
    });
  });

  const genAllBtn = document.getElementById('genAllCodesBtn');
  if(genAllBtn){
    genAllBtn.addEventListener('click', async ()=>{
      if(!confirm('Rigenerare il codice di TUTTI i ' + STATE.players.length + ' giocatori?\n\nTutti i codici e i link inviati finora smetteranno di funzionare, e i telefoni gia collegati chiederanno il nuovo codice.')) return;
      if(!confirm('Confermi? L\'operazione non si puo annullare.')) return;

      const nuovi = {};
      for(let i=0;i<STATE.players.length;i++){
        const c = generateAccessCode(nuovi); // evita doppioni anche dentro il ciclo
        if(!c){ showToast('Errore nella generazione dei codici'); return; }
        nuovi[STATE.players[i].id] = c;
      }
      STATE.accessCodes = nuovi;
      await saveKey('accessCodes', STATE.accessCodes);
      showToast(Object.keys(nuovi).length + ' codici rigenerati');
      renderImpostazioniAdmin(el);
    });
  }

  document.getElementById('saveAdminPasswordBtn').addEventListener('click', async ()=>{
    const pwd = document.getElementById('setAdminPassword').value.trim();
    if(!pwd){ showToast('Inserisci una password'); return; }
    STATE.adminPassword = pwd;
    await saveKey('admin-password', STATE.adminPassword);
    showToast('✅ Password admin aggiornata');
  });
  
  document.getElementById('saveStaffPasswordBtn').addEventListener('click', async ()=>{
    const pwd = document.getElementById('setStaffPassword').value.trim();
    if(!pwd){ showToast('Inserisci una password'); return; }
    STATE.staffPassword = pwd;
    await saveKey('staff-password', STATE.staffPassword);
    showToast('✅ Password staff aggiornata');
  });
  
  // --- Caricamento dati iniziali ---
  const loadSeedBtn = document.getElementById('loadSeedBtn');
  if(loadSeedBtn){
    loadSeedBtn.addEventListener('click', async ()=>{
      if(typeof ALENSE_PLAYERS === 'undefined' || typeof ALENSE_RPE_SEED === 'undefined'){
        showToast('Dati iniziali non disponibili in questa versione');
        return;
      }
      if(!confirm('Caricare la rosa corretta (' + ALENSE_PLAYERS.length + ' giocatori) e ' + ALENSE_RPE_SEED.length + ' RPE storici?\n\n' +
                  'La rosa attuale (' + STATE.players.length + ' giocatori) e gli RPE attuali (' + STATE.rpeLog.length + ') verranno sostituiti.\n\n' +
                  'I codici di accesso andranno rigenerati.')) return;
      if(!confirm('Hai scaricato un backup?\n\nConferma per procedere.')) return;

      STATE.players = ALENSE_PLAYERS.map(p=>Object.assign({}, p));
      STATE.rpeLog = ALENSE_RPE_SEED.map(r=>Object.assign({}, r));
      STATE.accessCodes = {};   // gli id sono cambiati: i vecchi codici non valgono piu'

      if(!STATE.events.some(e=>e.id === 'rpe-import-session')){
        STATE.events.push({
          id:'rpe-import-session', type:'Allenamento',
          title:'Sessioni storiche (importate)', date:'2000-01-01',
          importedDuration:65, workoutIds:[], presentPlayers:[]
        });
      }

      await saveKey('players', STATE.players);
      await saveKey('rpe-log', STATE.rpeLog);
      await saveKey('accessCodes', STATE.accessCodes);
      await saveKey('events', STATE.events);

      showToast(STATE.players.length + ' giocatori e ' + STATE.rpeLog.length + ' RPE caricati');
      render();
    });
  }

  // --- Backup completo ---
  document.getElementById('fullBackupBtn').addEventListener('click', ()=>{
    const backup = {
      formato: 'team-hub-pro-1',
      esportatoIl: new Date().toISOString(),
      teamConfig: STATE.teamConfig,
      players: STATE.players,
      accessCodes: STATE.accessCodes || {},
      customPasswords: STATE.customPasswords || {},
      staffPassword: STATE.staffPassword,
      adminPassword: STATE.adminPassword,
      events: STATE.events,
      workouts: STATE.workouts,
      tests: STATE.tests,
      rpeLog: STATE.rpeLog,
      hooperLog: STATE.hooperLog,
      painLog: STATE.painLog
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'team-hub-pro-backup-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Backup scaricato');
  });

  // --- Ripristino ---
  document.getElementById('restoreBackupBtn').addEventListener('click', ()=>{
    document.getElementById('restoreFileInput').click();
  });

  document.getElementById('restoreFileInput').addEventListener('change', (ev)=>{
    const file = ev.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (e)=>{
      let data;
      try{ data = JSON.parse(e.target.result); }
      catch(err){ showToast('File non leggibile'); return; }

      if(!data || !Array.isArray(data.players)){
        showToast('Non sembra un backup di Team Hub Pro');
        return;
      }

      const riepilogo = [
        data.players.length + ' giocatori',
        (data.events||[]).length + ' eventi',
        (data.rpeLog||data.rpe||[]).length + ' RPE',
        (data.hooperLog||data.hooper||[]).length + ' wellness',
        (data.painLog||data.pain||[]).length + ' segnalazioni'
      ].join(', ');

      if(!confirm('Ripristinare questo backup?\n\n' + (data.esportatoIl ? 'Del ' + data.esportatoIl.slice(0,10) + '\n' : '') + riepilogo + '\n\nTUTTI i dati attuali verranno sostituiti.')) return;
      if(!confirm('Conferma definitiva: i dati di adesso andranno persi.')) return;

      STATE.teamConfig = data.teamConfig || STATE.teamConfig;
      STATE.players = data.players;
      STATE.accessCodes = data.accessCodes || {};
      STATE.customPasswords = data.customPasswords || {};
      STATE.events = data.events || [];
      STATE.workouts = data.workouts || [];
      STATE.tests = data.tests || [];
      STATE.rpeLog = data.rpeLog || data.rpe || [];
      STATE.hooperLog = data.hooperLog || data.hooper || [];
      STATE.painLog = data.painLog || data.pain || [];
      if(data.staffPassword) STATE.staffPassword = data.staffPassword;

      await saveKey('team-config', STATE.teamConfig);
      await saveKey('players', STATE.players);
      await saveKey('accessCodes', STATE.accessCodes);
      await saveKey('customPasswords', STATE.customPasswords);
      await saveKey('events', STATE.events);
      await saveKey('workouts', STATE.workouts);
      await saveKey('tests', STATE.tests);
      await saveKey('rpe-log', STATE.rpeLog);
      await saveKey('hooper-log', STATE.hooperLog);
      await saveKey('pain-log', STATE.painLog);

      showToast('Backup ripristinato');
      render();
    };
    reader.readAsText(file);
    ev.target.value = '';
  });

  // --- Azzera stagione: tiene rosa, codici ed esercitazioni ---
  document.getElementById('resetSeasonBtn').addEventListener('click', async ()=>{
    const n = STATE.events.length + STATE.rpeLog.length + STATE.hooperLog.length + STATE.painLog.length;
    if(n === 0){ showToast('Non c\'e nulla da azzerare'); return; }
    if(!confirm('Azzerare la stagione?\n\nVerranno cancellati:\n' +
      STATE.events.filter(e=>e.type==='Partita').length + ' partite\n' +
      STATE.events.filter(e=>e.type==='Allenamento').length + ' allenamenti\n' +
      STATE.rpeLog.length + ' RPE\n' +
      STATE.hooperLog.length + ' rilevazioni wellness\n' +
      STATE.painLog.length + ' segnalazioni di dolore\n\n' +
      'Restano rosa, codici di accesso ed esercitazioni.')) return;
    if(!confirm('Hai scaricato un backup?\n\nQuesta operazione non si puo annullare.')) return;

    STATE.events = [];
    STATE.rpeLog = [];
    STATE.hooperLog = [];
    STATE.painLog = [];
    STATE.tests = [];
    STATE.players.forEach(p=>{ p.status = 'Disponibile'; p.returnDate = ''; });

    await saveKey('events', STATE.events);
    await saveKey('rpe-log', STATE.rpeLog);
    await saveKey('hooper-log', STATE.hooperLog);
    await saveKey('pain-log', STATE.painLog);
    await saveKey('tests', STATE.tests);
    await saveKey('players', STATE.players);
    showToast('Stagione azzerata');
    render();
  });

  // --- Elimina solo le partite ---
  document.getElementById('deleteAllMatchesBtn').addEventListener('click', async ()=>{
    const partite = STATE.events.filter(e=>e.type==='Partita');
    if(partite.length === 0){ showToast('Nessuna partita da eliminare'); return; }
    if(!confirm('Eliminare tutte le ' + partite.length + ' partite?\n\nSi perdono risultati, formazioni, gol e minutaggi.')) return;
    STATE.events = STATE.events.filter(e=>e.type!=='Partita');
    await saveKey('events', STATE.events);
    showToast(partite.length + ' partite eliminate');
    render();
  });

  // --- Cancella tutto ---
  document.getElementById('wipeAllBtn').addEventListener('click', async ()=>{
    if(!confirm('Cancellare TUTTI i dati, rosa e codici di accesso compresi?')) return;
    const conferma = prompt('Per confermare scrivi: CANCELLA');
    if(conferma !== 'CANCELLA'){ showToast('Operazione annullata'); return; }

    STATE.players = [];
    STATE.accessCodes = {};
    STATE.customPasswords = {};
    STATE.events = [];
    STATE.workouts = [];
    STATE.tests = [];
    STATE.rpeLog = [];
    STATE.hooperLog = [];
    STATE.painLog = [];

    await saveKey('players', STATE.players);
    await saveKey('accessCodes', STATE.accessCodes);
    await saveKey('customPasswords', STATE.customPasswords);
    await saveKey('events', STATE.events);
    await saveKey('workouts', STATE.workouts);
    await saveKey('tests', STATE.tests);
    await saveKey('rpe-log', STATE.rpeLog);
    await saveKey('hooper-log', STATE.hooperLog);
    await saveKey('pain-log', STATE.painLog);

    try{ localStorage.clear(); }catch(e){}
    showToast('Tutti i dati sono stati cancellati');
    setTimeout(()=>location.reload(), 1200);
  });
  
}

// ========== FIRESTORE REAL-TIME SYNC ==========
async function setupFirestoreSync(){
  if(!db || !TEAM_ID) return;
  
  console.log('🔄 Inizializzando sincronizzazione real-time Firestore...');
  
  try{
    // Ascolta i cambiamenti nella collezione 'data' della squadra
    db.collection('teams').doc(TEAM_ID).collection('data').onSnapshot(snapshot => {
      console.log('📡 Dati aggiornati da Firestore:', snapshot.size, 'documenti');
      snapshot.docChanges().forEach(change => {
        if(change.type === 'added' || change.type === 'modified'){
          const key = change.doc.id;
          const data = change.doc.data().value;
          
          // Aggiorna lo STATE corrispondente
          if(key === 'players') STATE.players = data;
          if(key === 'workouts') STATE.workouts = data;
          if(key === 'events') STATE.events = data;
          if(key === 'tests') STATE.tests = data;
          if(key === 'rpe-log') STATE.rpeLog = data;
          if(key === 'hooper-log') STATE.hooperLog = data;
          if(key === 'pain-log') STATE.painLog = data;
          if(key === 'team-config') STATE.teamConfig = data;
          if(key === 'accessCodes') STATE.accessCodes = data || {};
          if(key === 'customPasswords') STATE.customPasswords = data || {};

          // Tiene aggiornata anche la riserva offline
          try{ localStorage.setItem(key, JSON.stringify(data)); }catch(e){}

          console.log('✅ Sincronizzato:', key);
        }
      });
      
      // Aggiorna la UI se è necessario
      if(STATE.loggedIn) render();
    }, err => {
      console.error('❌ Errore sincronizzazione Firestore:', err);
    });
  }catch(err){
    console.error('❌ Errore setup sync Firestore:', err);
  }
}

// Avvia Firebase e poi i dati
console.log('⏳ Aspettando caricamento...');
initFirebase();

// Timeout di 5 secondi - se non carica, mostra comunque la login
const loadTimeout = setTimeout(()=>{
  console.warn('Timeout caricamento: mostro comunque la schermata di accesso');
  STATE.loading = false;          // altrimenti render() resta su "Caricamento..."
  if(!STATE.loggedIn) render();
}, 6000);

loadAll().then(()=>{
  clearTimeout(loadTimeout);
  console.log('✅ Dati caricati');

  // Accesso tramite link diretto: .../#c=CODICE
  try{
    const m = (location.hash || '').match(/[#&]c=([A-Za-z0-9\-]+)/);
    if(m && !STATE.loggedIn){
      const pid = findPlayerByCode(m[1]);
      // Ripulisce subito la barra degli indirizzi: il codice non resta in cronologia
      history.replaceState(null, '', location.pathname + location.search);
      if(pid){
        try{ localStorage.setItem(DEVICE_CODE_KEY, normalizeCode(m[1])); }catch(e){}
        login('player', pid);
        setupFirestoreSync();
        return;
      }
      showToast('Il link non e valido: chiedi allo staff di rigenerarlo');
    }
  }catch(e){ console.warn('Link di accesso non valido:', e.message); }

  // Dispositivo gia' riconosciuto: entra senza chiedere niente
  try{
    const savedCode = localStorage.getItem(DEVICE_CODE_KEY);
    if(savedCode && !STATE.loggedIn){
      const pid = findPlayerByCode(savedCode);
      if(pid){
        login('player', pid);
        setupFirestoreSync();
        return;
      }
      // Codice non piu' valido (rigenerato dallo staff): dimenticalo
      localStorage.removeItem(DEVICE_CODE_KEY);
    }
  }catch(e){ console.warn('Auto-login non riuscito:', e.message); }

  render();
  setupFirestoreSync();
}).catch(err=>{
  clearTimeout(loadTimeout);
  console.error('Errore caricamento:', err);
  STATE.loading = false;
  if(!STATE.loggedIn) render();
});
</script>
