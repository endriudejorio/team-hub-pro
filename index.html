<style>
  :root{
    --pitch: #1A1A1A;
    --pitch-dark: #0D0D0D;
    --chalk: #F4F1E8;
    --paper: #FFFFFF;
    --amber: #C9922B;
    --amber-dark: #9C6E1C;
    --clay: #B5473A;
    --clay-soft: #F0DAD6;
    --ok: #404040;
    --line: #DCD6C4;
    --ink: #000000;
    --ink-soft: #333333;
    --radius: 10px;
    --radius-sm: 6px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--chalk);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:'Oswald',sans-serif;letter-spacing:0.01em;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}

  .app{display:flex;min-height:100vh;}
  .login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--pitch);color:var(--chalk);padding:20px;}
  .login-card{background:var(--paper);color:var(--ink);border-radius:var(--radius);padding:40px;max-width:380px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.2);}
  .login-card h1{margin-top:0;font-size:24px;text-align:center;color:var(--pitch);}
  .login-logo{width:72px;height:72px;border-radius:50%;background:var(--amber);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--pitch-dark);}
  .login-form label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;margin-top:12px;}
  .login-form input,.login-form select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;}
  .login-form input:focus,.login-form select:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}
  .login-btn{width:100%;padding:12px;background:var(--pitch);color:var(--chalk);border:none;border-radius:var(--radius-sm);font-weight:600;margin-top:18px;cursor:pointer;}
  .login-btn:hover{background:var(--pitch-dark);}

  .sidebar{width:220px;flex-shrink:0;background:var(--pitch);color:var(--chalk);display:flex;flex-direction:column;padding:20px 0;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 18px 20px 18px;border-bottom:1px solid rgba(244,241,232,0.14);margin-bottom:14px;}
  .brand-logo{width:38px;height:38px;border-radius:50%;background:var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;color:var(--pitch-dark);font-size:15px;}
  .brand-name{font-family:'Oswald';font-size:17px;font-weight:600;}
  .brand-sub{font-size:10.5px;color:#B9C6BC;text-transform:uppercase;letter-spacing:0.08em;}

  .nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;flex:1;}
  .nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;background:transparent;color:#CFD8CC;border-radius:var(--radius-sm);text-align:left;font-size:14px;font-weight:500;}
  .nav-btn:hover{background:rgba(244,241,232,0.08);}
  .nav-btn.active{background:var(--amber);color:var(--pitch-dark);font-weight:600;}

  .sidebar-foot{padding:12px 18px 0 18px;font-size:11px;color:#8DA095;border-top:1px solid rgba(244,241,232,0.1);margin-top:10px;padding-top:12px;}
  .logout-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(244,241,232,0.2);color:var(--chalk);padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;margin-top:8px;width:100%;}
  .logout-btn:hover{background:rgba(255,255,255,0.15);}

  .main{flex:1;padding:32px 40px;max-width:1200px;overflow-y:auto;}
  .page-head{margin-bottom:24px;}
  .page-head h1{font-size:26px;margin:0 0 4px 0;color:var(--pitch);}
  .page-head p{margin:0;color:var(--ink-soft);font-size:14px;}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .card h3{margin:0 0 14px 0;font-size:15px;color:var(--pitch);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;margin-top:12px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;color:var(--ink);
  }
  input[type=range]{
    width:100%;height:6px;border-radius:3px;background:var(--line);outline:none;-webkit-appearance:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--amber);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:18px;height:18px;border-radius:50%;background:var(--amber);cursor:pointer;border:none;
  }
  textarea{resize:vertical;min-height:60px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--pitch);background:var(--pitch);color:var(--chalk);font-size:13.5px;font-weight:600;}
  .btn:hover{background:var(--pitch-dark);}
  .btn.secondary{background:var(--paper);color:var(--pitch);border-color:var(--line);}
  .btn.secondary:hover{background:#F2EFE4;}
  .btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:8px 10px;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid #EEEAD9;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#FAF8F0;}

  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge.ok{background:#E3EFE7;color:var(--ok);}
  .badge.warn{background:#F7EAD3;color:var(--amber-dark);}
  .badge.bad{background:var(--clay-soft);color:var(--clay);}

  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .stat{flex:1;min-width:140px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:all 0.2s;}
  .stat:hover{border-color:var(--amber);box-shadow:0 2px 8px rgba(0,0,0,0.08);}
  .stat .num{font-family:'Oswald';font-size:28px;color:var(--pitch);}
  .stat .lbl{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}

  .workout-item{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;background:var(--chalk);}
  .workout-item h4{margin:0 0 6px 0;font-size:13px;color:var(--pitch);font-weight:600;}
  .workout-item-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;font-size:12px;margin-bottom:4px;}
  .workout-item-val{color:var(--amber);font-weight:600;}

  .session-exercise{border:1px solid var(--amber);border-left:4px solid var(--amber);padding:8px;margin-bottom:6px;background:#FFF9F0;font-size:12px;}
  .session-exercise-name{font-weight:600;color:var(--pitch);margin-bottom:2px;}
  .session-exercise-detail{color:var(--ink-soft);font-size:11px;}

  .checkbox-group{border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--chalk);max-height:300px;overflow-y:auto;}
  .checkbox-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #EEEAD9;}
  .checkbox-item:last-child{border-bottom:none;}
  .checkbox-item input{width:auto;margin:0;}
  .checkbox-item label{margin:0;font-weight:400;}

  /* DASHBOARD A RIQUADRI */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
  .tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;position:relative;overflow:hidden;}
  .tile.tap{cursor:pointer;}
  .tile.tap:hover{border-color:var(--amber);}
  .tile-lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);font-weight:700;margin-bottom:6px;}
  .tile-big{font-size:34px;font-weight:700;line-height:1;color:var(--pitch);font-family:'Oswald',sans-serif;}
  .tile-big small{font-size:15px;color:var(--ink-soft);font-weight:600;}
  .tile-sub{font-size:11px;color:var(--ink-soft);margin-top:5px;line-height:1.35;}
  .tile-accent{position:absolute;left:0;top:0;bottom:0;width:4px;}

  .alerts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-left-width:4px;border-radius:var(--radius-sm);cursor:pointer;}
  .alert:hover{background:#FAF8F0;}
  .alert-t{font-size:12.5px;font-weight:600;color:var(--pitch);line-height:1.3;}
  .alert-s{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .form-strip{display:flex;gap:5px;}
  .form-chip{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;font-family:'Oswald',sans-serif;cursor:pointer;}

  .mini-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;}

  @media(max-width:1100px){ .tiles{grid-template-columns:repeat(2,1fr);} .alerts{grid-template-columns:1fr;} }
  @media(max-width:560px){ .tiles{grid-template-columns:repeat(2,1fr);gap:8px;} .tile{padding:11px;} .tile-big{font-size:26px;} }

  /* BOLLETTINO STAMPABILE */
  #printSheet{display:none;}
  @media print{
    @page{ size:A4; margin:14mm; }
    body{background:white!important;}
    body > *{display:none!important;}
    #printSheet{display:block!important;color:#000;font-family:'Inter',sans-serif;}
    #printSheet .ps-head{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;}
    #printSheet h1{font-family:'Oswald',sans-serif;font-size:20pt;margin:0;letter-spacing:0.02em;}
    #printSheet .ps-date{font-size:10pt;text-align:right;}
    #printSheet h2{font-family:'Oswald',sans-serif;font-size:11pt;margin:14px 0 6px 0;text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid #999;padding-bottom:3px;}
    #printSheet .ps-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px;}
    #printSheet .ps-box{border:1px solid #000;padding:7px;}
    #printSheet .ps-box .n{font-family:'Oswald',sans-serif;font-size:19pt;line-height:1;}
    #printSheet .ps-box .l{font-size:7.5pt;text-transform:uppercase;letter-spacing:0.04em;}
    #printSheet .ps-box .s{font-size:8pt;color:#333;margin-top:3px;}
    #printSheet table{width:100%;border-collapse:collapse;font-size:9pt;}
    #printSheet th{text-align:left;border-bottom:1px solid #000;padding:3px 4px;font-size:7.5pt;text-transform:uppercase;}
    #printSheet td{padding:3px 4px;border-bottom:1px solid #ddd;}
    #printSheet .ps-alert{border-left:3px solid #000;padding:4px 8px;margin-bottom:4px;font-size:9pt;page-break-inside:avoid;}
    #printSheet .ps-foot{margin-top:16px;padding-top:6px;border-top:1px solid #999;font-size:7.5pt;color:#555;}
    #printSheet .ps-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    #printSheet .avoid{page-break-inside:avoid;}
  }

  /* MOBILE RESPONSIVE */
  @media(max-width:768px){
    .app{flex-direction:column;}
    .sidebar{width:100%;position:fixed;top:0;left:0;right:0;flex-direction:row;padding:10px;z-index:1000;height:auto;border-bottom:1px solid rgba(244,241,232,0.14);}
    .brand{padding:0 10px;margin-bottom:0;border-bottom:none;}
    .brand-logo{width:32px;height:32px;font-size:12px;}
    .brand-name{font-size:14px;}
    .brand-sub{font-size:9px;}
    .nav{flex-direction:row;flex:1;gap:5px;padding:0 5px;overflow-x:auto;}
    .nav-btn{padding:8px 10px;font-size:12px;gap:5px;}
    .nav-btn span{display:none;}
    .sidebar-foot{padding:0;margin:0;border:none;font-size:0;}
    .sidebar-foot .role-label{display:none;}
    .logout-btn{width:auto;margin:0;padding:6px 10px;font-size:11px;white-space:nowrap;}
    .main{margin-top:60px;padding:20px 12px;}
    .page-head h1{font-size:22px;}
    .page-head p{font-size:12px;}
    .card{padding:14px;}
    .btn{padding:10px 14px;font-size:13px;}
    .grid2,.grid3{grid-template-columns:1fr;}
    input,select,textarea{font-size:16px;padding:10px;}
  }
  
  @media(max-width:480px){
    .sidebar{padding:8px 5px;}
    .brand{padding:0 5px;}
    .brand-logo{width:28px;height:28px;font-size:11px;}
    .brand-name{font-size:13px;}
    .nav-btn{padding:6px 8px;font-size:11px;}
    .main{margin-top:50px;padding:16px 10px;}
    .page-head h1{font-size:18px;}
    .card{padding:12px;margin-bottom:16px;}
    .btn{padding:12px;font-size:14px;width:100%;}
    .card h3{font-size:16px;}
    .card h4{font-size:13px;}
    .grid2,.grid3{grid-template-columns:1fr;gap:12px;}
    .workout-item-row{grid-template-columns:1fr;}
    input,select,textarea,button{font-size:16px;padding:12px;}
    .login-card{padding:20px 16px;}
    .login-card h1{font-size:18px;}
    .login-btn{padding:14px;}
  }
</style>

<div id="root"></div>
<script>
// Rete di sicurezza: invece della schermata bianca, mostra l'errore.
(function(){
  function mostraErrore(testo){
    var r = document.getElementById('root');
    if(!r) return;
    if(r.getAttribute('data-errore')) return;   // solo il primo
    r.setAttribute('data-errore','1');
    r.innerHTML =
      '<div style="font-family:-apple-system,sans-serif;max-width:640px;margin:40px auto;padding:24px;">' +
      '<h2 style="color:#B5473A;margin:0 0 8px 0;">L\'applicazione non e partita</h2>' +
      '<p style="color:#333;font-size:14px;">Mostra questo messaggio a chi ti assiste.</p>' +
      '<pre style="background:#F4F1E8;border:1px solid #DCD6C4;border-radius:6px;padding:12px;' +
      'font-size:12px;white-space:pre-wrap;word-break:break-word;">' + testo + '</pre>' +
      '<button onclick="location.reload()" style="padding:10px 16px;background:#1A1A1A;color:#fff;' +
      'border:none;border-radius:6px;font-weight:600;">Riprova</button></div>';
  }
  window.addEventListener('error', function(e){
    mostraErrore((e.message||'errore') + '\n' + (e.filename||'') + ' riga ' + (e.lineno||'?'));
  });
  window.addEventListener('unhandledrejection', function(e){
    mostraErrore('Promessa non gestita: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  // Se dopo 12 secondi non c'e' ancora nulla a schermo, qualcosa e' bloccato
  setTimeout(function(){
    var r = document.getElementById('root');
    if(r && r.innerHTML.trim().length < 40){
      mostraErrore('Nessuna risposta dopo 12 secondi.\nPossibile blocco nella connessione a Firestore.');
    }
  }, 12000);
})();
</script>

/* Stati: solo "Disponibile" permette al giocatore di segnarsi presente */
const PLAYER_STATUSES = [
  {value:'Disponibile',   label:'Disponibile',   color:'var(--ok)',          needsDate:false},
  {value:'RTP',           label:'RTP',           color:'var(--amber-dark)',  needsDate:true},
  {value:'In valutazione',label:'In valutazione',color:'var(--amber-dark)',  needsDate:true},
  {value:'Infortunato',   label:'Infortunato',   color:'var(--clay)',        needsDate:true}
];

/* Solo chi e' pienamente disponibile fa media di squadra.
   RTP e In valutazione lavorano a carico ridotto: mescolarli falserebbe il dato. */
function countsInTeamStats(player){
  return player && player.status === 'Disponibile';
}

/* Chi si allena in qualche forma: serve per il monitoraggio individuale,
   non per le medie. */
function isTrainingStatus(player){
  return player && player.status !== 'Infortunato';
}

/* Lo stato del giocatore nel momento in cui il dato e' stato registrato.
   Senza questo, cambiare lo stato oggi riscriverebbe tutto lo storico. */
function entryCountsInTeamStats(entry){
  if(!entry) return false;
  // Voci vecchie o importate: nessuna marcatura, le considero valide
  if(!entry.statusAtEntry) return true;
  return entry.statusAtEntry === 'Disponibile';
}

/* Da usare ogni volta che si crea una voce di wellness, RPE o dolore */
function currentStatusOf(playerId){
  const p = STATE.players.find(x => String(x.id) === String(playerId));
  return p ? (p.status || 'Disponibile') : 'Disponibile';
}

function statusMeta(value){
  return PLAYER_STATUSES.find(s => s.value === value) || PLAYER_STATUSES[0];
}

/* ---------- HOOPER INDEX ----------
   Scala 1-7 come in letteratura (Hooper & Mackinnon, 1995).
   Su ogni voce 1 = condizione migliore, 7 = condizione peggiore.
   Somma delle 4 voci: 4 = ottimo, 28 = pessimo. Alto = affaticato. */
const HOOPER_ITEMS = [
  {key:'sleep',   label:'Qualita del sonno',       low:'Ho dormito benissimo', high:'Non ho quasi dormito'},
  {key:'stress',  label:'Livello di stress',        low:'Per niente stressato', high:'Molto stressato'},
  {key:'fatigue', label:'Fatica generale',          low:'Pienamente riposato',  high:'Esausto'},
  {key:'soreness',label:'Indolenzimento muscolare', low:'Nessun dolore',        high:'Molto indolenzito'}
];

const HOOPER_MIN = 4;
const HOOPER_MAX = 28;

/* Fasce di lettura immediata sul punteggio grezzo 4-28 */
function hooperBand(score){
  if(score <= 8)  return {label:'Ottimo',    color:'var(--ok)',         advice:'Condizione ottimale'};
  if(score <= 12) return {label:'Buono',     color:'var(--ok)',         advice:'Nessun segnale critico'};
  if(score <= 17) return {label:'Discreto',  color:'var(--amber-dark)', advice:'Da tenere d\'occhio'};
  if(score <= 22) return {label:'Attenzione',color:'var(--clay)',       advice:'Valutare il carico'};
  return {label:'Critico', color:'var(--clay)', advice:'Confronto diretto con il giocatore'};
}

/* Compatibilita': le voci vecchie usavano muscles/mood su scala 1-5 */
function hooperScore(entry){
  if(!entry) return null;
  if(entry.scale === 7 || (typeof entry.fatigue !== 'undefined' && typeof entry.soreness !== 'undefined')){
    return (entry.sleep||0) + (entry.stress||0) + (entry.fatigue||0) + (entry.soreness||0);
  }
  return null; // voce con la vecchia scala: non confrontabile, non la mescolo
}

function isLegacyHooper(entry){
  return entry && hooperScore(entry) === null;
}

function calcAge(birthDateStr){
  const today = new Date();
  const birth = new Date(birthDateStr);
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if(m<0 || (m===0 && today.getDate()<birth.getDate())) age--;
  return age;
}

async function saveKey(key, value){
  // Salva SEMPRE su localStorage (locale)
  try{
    localStorage.setItem(key, JSON.stringify(value));
    console.log('✅ Salvato localStorage:', key);
  }catch(e){
    console.error('❌ Errore localStorage:', e.message);
  }
  
  // Prova a sincronizzare su Firestore (opzionale)
  if(db && TEAM_ID){
    try{
      await db.collection('teams').doc(TEAM_ID).collection('data').doc(key).set({
        value: value,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        playerId: STATE.currentPlayerId || 'admin'
      });
      console.log('📡 Sincronizzato Firestore:', key);
    }catch(e){
      console.warn('⚠️ Sync Firestore fallito:', e.message);
    }
  }
}

async function loadKey(key, fallback){
  // Firestore e' la fonte di verita': i dati sono condivisi tra dispositivi.
  // localStorage serve solo come riserva quando si e' offline.
  if(db && TEAM_ID){
    try{
      const doc = await db.collection('teams').doc(TEAM_ID).collection('data').doc(key).get();
      if(doc.exists && typeof doc.data().value !== 'undefined'){
        const result = doc.data().value;
        try{ localStorage.setItem(key, JSON.stringify(result)); }catch(e){}
        console.log('📡 Caricato da Firestore:', key);
        return result;
      }
    }catch(e){
      console.warn('⚠️ Firestore non raggiungibile per', key, '-', e.message);
    }
  }

  // Riserva offline
  try{
    const stored = localStorage.getItem(key);
    if(stored){
      console.log('💾 Caricato da riserva locale:', key);
      return JSON.parse(stored);
    }
  }catch(e){
    console.warn('⚠️ Errore lettura riserva locale:', e.message);
  }

  return fallback;
}

function calcWorkoutDuration(workout){
  if(workout.category==='Tecnico-tattico'){
    const series = workout.series || 1;
    const minutesPerSeries = workout.minutesPerSeries || 1;
    const recovery = workout.recovery || 0;
    return (series * minutesPerSeries) + ((series-1) * recovery);
  }
  if(workout.category==='Atletico'){
    const type = workout.type;
    if(type==='Riscaldamento coordinativo' || type==='Core stability e propriocezione' || type==='Forza resistente' || type==='Potenza metabolica ed High-Intensity Interval Training (HIIT)' || type==='Lavoro intermittente'){
      return (workout.series * workout.minutesPerSeries) + ((workout.series-1) * workout.recovery);
    }else if(type==='Speed & Agility (Velocità pura)' || type==='Cambi di direzione (COD)' || type==='Forza massima'){
      return (workout.series * 1) + ((workout.series-1) * workout.recovery);
    }else if(type==='Riscaldamento generale (Warm-up)' || type==='Prevenzione infortuni (Screening e protocolli)' || type==='Resistenza aerobica a secco' || type==='Rigenerazione e scarico (Recovery)'){
      return workout.minutes || 0;
    }else if(type.startsWith('Test')){
      return 0; // Test non hanno durata calcolata
    }
  }
  return 0;
}

function getSessionDuration(session){
  if(!session.workoutIds) return 0;
  return session.workoutIds.reduce((sum, wid)=>{
    const w = STATE.workouts.find(wo=>wo.id===wid);
    return sum + (w ? calcWorkoutDuration(w) : 0);
  }, 0);
}

function playerLoadStats(playerId){
  const entries = STATE.rpeLog.filter(r=>r.playerId===playerId);
  const acuteFrom = daysAgo(7), chronicFrom = daysAgo(28);
  
  let acute = entries.filter(e=>e.date>=acuteFrom).reduce((s,e)=>{
    const evt = STATE.events.find(ev=>ev.id===e.sessionId);
    const duration = evt ? getSessionDuration(evt) : 0;
    return s+(e.rpe*duration);
  },0);
  
  const chronicSum = entries.filter(e=>e.date>=chronicFrom).reduce((s,e)=>{
    const evt = STATE.events.find(ev=>ev.id===e.sessionId);
    const duration = evt ? getSessionDuration(evt) : 0;
    return s+(e.rpe*duration);
  },0);
  
  const chronicWeekly = chronicSum/4;
  const acwr = chronicWeekly>0 ? (acute/chronicWeekly) : (acute>0?2:0);
  return {acute, chronicWeekly, acwr};
}

/* Confronta la media degli ultimi N giorni con quella dei N precedenti.
   Sul punteggio grezzo un calo = miglioramento, quindi inverto il segno per la lettura. */
function getHooperTrend(playerId, windowDays){
  const win = windowDays || 7;
  const entries = getHooperEntries(playerId);
  if(entries.length < 2) return null;

  const today = new Date(todayStr() + 'T00:00:00');
  const dayDiff = d => Math.round((today - new Date(d + 'T00:00:00')) / 86400000);

  const recent = entries.filter(e => dayDiff(e.date) < win);
  const previous = entries.filter(e => { const d = dayDiff(e.date); return d >= win && d < win*2; });
  if(recent.length === 0 || previous.length === 0) return null;

  const avg = arr => arr.reduce((sum,e)=> sum + hooperScore(e), 0) / arr.length;
  const recentAvg = avg(recent);
  const previousAvg = avg(previous);
  const delta = recentAvg - previousAvg; // positivo = punteggio salito = sta peggio

  let direction, label, color;
  if(Math.abs(delta) < 1.5){
    direction = 'stable'; label = 'Stabile'; color = 'var(--ink-soft)';
  } else if(delta < 0){
    direction = 'better'; label = 'In miglioramento'; color = 'var(--ok)';
  } else {
    direction = 'worse'; label = 'In peggioramento'; color = 'var(--clay)';
  }

  return {
    direction, label, color,
    delta: Math.round(delta * 10) / 10,
    recentAvg: Math.round(recentAvg * 10) / 10,
    previousAvg: Math.round(previousAvg * 10) / 10,
    recentCount: recent.length,
    previousCount: previous.length,
    windowDays: win
  };
}

const DEVICE_CODE_KEY = 'thp-device-code';
const LOGIN_FAIL_KEY = 'thp-login-fails';
const MAX_LOGIN_ATTEMPTS = 5;

/* Dopo 5 errori l'attesa cresce: 30s, 60s, 120s... fino a 15 minuti */
function loginLockRemaining(){
  try{
    const raw = localStorage.getItem(LOGIN_FAIL_KEY);
    if(!raw) return 0;
    const st = JSON.parse(raw);
    if(!st || st.count < MAX_LOGIN_ATTEMPTS) return 0;
    const extra = st.count - MAX_LOGIN_ATTEMPTS;
    const waitMs = Math.min(30000 * Math.pow(2, extra), 900000);
    const remaining = st.last + waitMs - Date.now();
    return remaining > 0 ? Math.ceil(remaining / 1000) : 0;
  }catch(e){ return 0; }
}

function registerFailedLogin(){
  try{
    const raw = localStorage.getItem(LOGIN_FAIL_KEY);
    const st = raw ? JSON.parse(raw) : {count:0, last:0};
    st.count = (st.count || 0) + 1;
    st.last = Date.now();
    localStorage.setItem(LOGIN_FAIL_KEY, JSON.stringify(st));
    return st.count;
  }catch(e){ return 0; }
}

function clearFailedLogins(){
  try{ localStorage.removeItem(LOGIN_FAIL_KEY); }catch(e){}
}

const CODE_LENGTH = 6;

/* Sequenze troppo facili da tirare a indovinare: mai assegnarle */
const WEAK_CODES = [
  '000000','111111','222222','333333','444444','555555','666666','777777','888888','999999',
  '123456','654321','012345','543210','121212','123123','112233','101010','010101','696969',
  '111222','123321','456789','987654','200000','999000'
];

/* Estrazione casuale con il generatore crittografico del browser quando disponibile */
function randomDigits(n){
  let out = '';
  if(typeof crypto !== 'undefined' && crypto.getRandomValues){
    const buf = new Uint32Array(n);
    crypto.getRandomValues(buf);
    for(let i=0;i<n;i++) out += String(buf[i] % 10);
  } else {
    for(let i=0;i<n;i++) out += String(Math.floor(Math.random()*10));
  }
  return out;
}

function isWeakCode(code){
  if(WEAK_CODES.indexOf(code) !== -1) return true;
  // tutte cifre uguali
  if(/^(\d)\1{5}$/.test(code)) return true;
  // sei cifre consecutive crescenti o decrescenti
  let asc = true, desc = true;
  for(let i=1;i<code.length;i++){
    const d = Number(code[i]) - Number(code[i-1]);
    if(d !== 1) asc = false;
    if(d !== -1) desc = false;
  }
  return asc || desc;
}

/* Genera un codice a 6 cifre garantito diverso da tutti quelli gia' assegnati */
function generateAccessCode(taken){
  const used = {};
  const source = taken || (STATE.accessCodes || {});
  Object.keys(source).forEach(k => { used[normalizeCode(source[k])] = true; });

  for(let attempt=0; attempt<5000; attempt++){
    const c = randomDigits(CODE_LENGTH);
    if(used[c]) continue;
    if(isWeakCode(c)) continue;
    return c;
  }
  return null; // praticamente impossibile con 23 giocatori
}

/* Tiene solo le cifre: il giocatore puo' scrivere con spazi o trattini */
function normalizeCode(code){
  return String(code || '').replace(/\D/g, '');
}

/* Formato leggibile: 482 917 */
function formatCode(code){
  const c = normalizeCode(code);
  return c.length === 6 ? c.slice(0,3) + ' ' + c.slice(3) : c;
}

function getAccessCode(playerId){
  return (STATE.accessCodes && STATE.accessCodes[playerId]) || null;
}

function findPlayerByCode(code){
  const target = normalizeCode(code);
  if(!target || !STATE.accessCodes) return null;
  const ids = Object.keys(STATE.accessCodes);
  for(let i=0;i<ids.length;i++){
    if(normalizeCode(STATE.accessCodes[ids[i]]) === target) return String(ids[i]);
  }
  return null;
}

async function setAccessCode(playerId, code){
  const c = normalizeCode(code);
  if(c.length !== CODE_LENGTH){
    showToast('Errore nella generazione del codice');
    return false;
  }
  if(!STATE.accessCodes) STATE.accessCodes = {};
  STATE.accessCodes[playerId] = c;
  await saveKey('accessCodes', STATE.accessCodes);
  return true;
}

        showToast('Codice non riconosciuto. Ancora ' + left + ' tentativi.');

        showToast('Codice non riconosciuto');

      return false;

    setTimeout(()=>login('player', playerId), 120);
    return true;
  };

  document.getElementById('playerLoginForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    doPlayerLogin();
  });

    inp.type = hidden ? 'text' : 'password';
    btn.textContent = hidden ? 'Nascondi' : 'Mostra';
  });
  
  document.getElementById('staffLoginBtn').addEventListener('click', ()=>{
    login('staff', document.getElementById('staffCode').value);
  });
  
  document.getElementById('adminLoginBtn').addEventListener('click', ()=>{
    login('admin', document.getElementById('adminPassword').value);
  });
  

  
  document.getElementById('staffCode').addEventListener('keydown', (e)=>{
    if(e.key==='Enter') document.getElementById('staffLoginBtn').click();
  });
  
  document.getElementById('adminPassword').addEventListener('keydown', (e)=>{
    if(e.key==='Enter') document.getElementById('adminLoginBtn').click();
  });
}

   Struttura comune: media di squadra in cima, poi un giocatore per riga.
   Toccando una riga si apre la scheda completa di quel giocatore. */

  const sezioni = opts.sections.filter(sec => sec.rows.length > 0);

  modal.innerHTML = `
    <div style="background:white;border-radius:12px;max-width:680px;width:100%;padding:24px;margin:auto;">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:16px;">
        <div>
          <h2 style="margin:0;color:var(--pitch);">${esc(opts.title)}</h2>
          ${opts.subtitle ? `<div style="font-size:12px;color:var(--ink-soft);">${opts.subtitle}</div>` : ''}
        </div>
        <button id="closeTileDetail" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;">&#10005;</button>
      </div>

      ${opts.summary ? `
        <div style="display:grid;grid-template-columns:repeat(${opts.summary.length},1fr);gap:10px;margin-bottom:18px;">
          ${opts.summary.map(sv=>`
            <div style="background:var(--chalk);border-radius:8px;padding:12px;text-align:center;">
              <div style="font-size:26px;font-weight:700;color:${sv.color || 'var(--pitch)'};font-family:'Oswald',sans-serif;">${sv.value}</div>
              <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:700;margin-top:2px;">${esc(sv.label)}</div>
              ${sv.note ? `<div style="font-size:10.5px;color:var(--ink-soft);margin-top:3px;">${esc(sv.note)}</div>` : ''}
            </div>`).join('')}
        </div>` : ''}

      ${sezioni.map(sec=>`
        <div style="margin-bottom:16px;">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;color:${sec.color || 'var(--ink-soft)'};margin-bottom:6px;">
            ${esc(sec.title)} (${sec.rows.length})

              <div class="td-row" data-player-id="${r.playerId || ''}"
                   style="padding:9px 11px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;${r.playerId ? 'cursor:pointer;' : ''}">
                <div style="min-width:0;">
                  <div style="font-size:12.5px;font-weight:600;color:var(--pitch);">${esc(r.name)}</div>
                  ${r.sub ? `<div style="font-size:10.5px;color:var(--ink-soft);">${esc(r.sub)}</div>` : ''}
                </div>
                <div style="text-align:right;white-space:nowrap;">
                  <div style="font-size:15px;font-weight:700;color:${r.color || 'var(--pitch)'};">${r.value}</div>
                  ${r.valueSub ? `<div style="font-size:10px;color:var(--ink-soft);">${esc(r.valueSub)}</div>` : ''}

function showWellnessDetail(){
  const inMedia = [], fuoriMedia = [], senza = [];
  STATE.players.forEach(p=>{
    const hi = getLatestHooperIndex(p.id);
    if(!hi){ senza.push(p); return; }
    const r = {p, hi, trend: getHooperTrend(p.id, 7)};
    if(countsInTeamStats(p) && entryCountsInTeamStats(hi.data)) inMedia.push(r); else fuoriMedia.push(r);
  });
  inMedia.sort((a,b)=> b.hi.score - a.hi.score);
  fuoriMedia.sort((a,b)=> b.hi.score - a.hi.score);

  const media = inMedia.length ? inMedia.reduce((a,x)=>a+x.hi.score,0)/inMedia.length : null;
  const disponibili = STATE.players.filter(countsInTeamStats).length;
  const oggi = inMedia.filter(x=> daysSince(x.hi.date) === 0).length;

  const riga = (x, dentro)=>({
    playerId: x.p.id,
    name: x.p.name + (x.p.status !== 'Disponibile' ? ' · ' + statusMeta(x.p.status).label : ''),
    sub: (daysSince(x.hi.date) === 0 ? 'oggi' : daysSince(x.hi.date) === 1 ? 'ieri' : daysSince(x.hi.date) + ' giorni fa')
         + (dentro && media !== null ? ' · ' + (x.hi.score > media ? '+' : '') + (Math.round((x.hi.score - media)*10)/10) + ' rispetto alla media' : '')
         + (x.trend ? ' · ' + x.trend.label.toLowerCase() : ''),
    value: x.hi.score + '<span style="font-size:11px;color:var(--ink-soft);">/28</span>',
    color: x.hi.band.color,
    valueSub: x.hi.band.label
  });

  showTileDetail({
    title: 'Wellness — Hooper Index',
    subtitle: 'Dal piu affaticato. Punteggio basso significa giocatore fresco.',
    summary: [
      {label:'Media dei disponibili', value: media !== null ? Math.round(media*10)/10 : '—',
       color: media !== null ? hooperBand(Math.round(media)).color : 'var(--ink-soft)',
       note: media !== null ? hooperBand(Math.round(media)).label : ''},
      {label:'Compilato oggi', value: oggi + '/' + disponibili},
      {label:'Fuori media', value: fuoriMedia.length, color: fuoriMedia.length ? 'var(--amber-dark)' : 'var(--ok)',
       note:'RTP, valutaz., infortunati'}
    ],
    sections: [
      {title:'Disponibili — fanno media', rows: inMedia.map(x=>riga(x,true))},
      {title:'Fuori media — monitorati', color:'var(--amber-dark)', rows: fuoriMedia.map(x=>riga(x,false))},
      {title:'Nessuna rilevazione', color:'var(--ink-soft)', rows: senza.map(p=>({
        playerId: p.id, name: p.name, sub: statusMeta(p.status).label, value:'—', color:'var(--ink-soft)'
      }))}
    ],
    footer: 'La media considera solo i giocatori pienamente disponibili, e solo le rilevazioni fatte mentre lo erano. RTP, In valutazione e infortunati restano visibili ma non entrano nel calcolo.'
  });
}

function showAcwrDetail(){
  const conDati = [], pochiDati = [], fermi = [];
  STATE.players.forEach(p=>{
    const a = getACWR(p.id);
    if(!countsInTeamStats(p)){ fermi.push({p, a}); return; }
    if(a && !a.insufficient) conDati.push({p, a});
    else pochiDati.push({p, a});
  });
  conDati.sort((x,y)=> y.a.ratio - x.a.ratio);

  const media = conDati.length ? conDati.reduce((s,x)=>s+x.a.ratio,0)/conDati.length : null;
  const caricoMedio = conDati.length ? conDati.reduce((s,x)=>s+x.a.acute,0)/conDati.length : null;

  const gruppo = (titolo, zone, colore)=>({
    title: titolo, color: colore,
    rows: conDati.filter(x=> zone.indexOf(x.a.zone) !== -1).map(x=>({
      playerId: x.p.id,
      name: x.p.name,
      sub: 'carico settimana ' + x.a.acute + ' UA · media 4 settimane ' + x.a.chronicWeekly + ' UA',
      value: x.a.ratio,
      color: x.a.color,
      valueSub: x.a.label
    }))
  });

  showTileDetail({
    title: 'Carico — ACWR',
    subtitle: 'Rapporto fra il carico dell ultima settimana e la media delle ultime quattro.',
    summary: [
      {label:'Media squadra', value: media !== null ? Math.round(media*100)/100 : '—',
       color: media !== null ? (media > 1.3 ? 'var(--clay)' : media < 0.8 ? 'var(--amber-dark)' : 'var(--ok)') : 'var(--ink-soft)'},
      {label:'Carico medio', value: caricoMedio !== null ? Math.round(caricoMedio) : '—', note:'UA settimana'},
      {label:'Nella media', value: conDati.length + '/' + STATE.players.filter(countsInTeamStats).length, note:'solo disponibili'}
    ],
    sections: [
      gruppo('Zona rischio, oltre 1.5', ['high'], 'var(--clay)'),
      gruppo('In salita, 1.3 - 1.5', ['warn'], 'var(--amber-dark)'),
      gruppo('Zona ottimale, 0.8 - 1.3', ['ok'], 'var(--ok)'),
      gruppo('Scarico o fermi', ['low','none'], 'var(--amber-dark)'),
      {title:'Dati insufficienti', color:'var(--ink-soft)', rows: pochiDati.map(x=>({
        playerId: x.p.id, name: x.p.name,
        sub: x.a ? x.a.sessions + ' sessioni nelle ultime 4 settimane' : 'nessun RPE registrato',
        value:'—', color:'var(--ink-soft)'
      }))},
      {title:'Fuori media — RTP, valutazione, infortunati', color:'var(--clay)', rows: fermi.map(x=>({
        playerId: x.p.id, name: x.p.name,
        sub: statusMeta(x.p.status).label + (x.p.returnDate ? ' · rientro ' + fmtDate(x.p.returnDate) : ''),
        value: (x.a && !x.a.insufficient) ? x.a.ratio : '—',
        color: (x.a && !x.a.insufficient) ? x.a.color : 'var(--ink-soft)',
        valueSub: (x.a && !x.a.insufficient) ? x.a.label : 'nessun carico'
      }))}
    ],
    footer: 'UA = unita arbitrarie, cioe RPE moltiplicato per i minuti di sessione. Servono almeno tre settimane di storico perche il rapporto sia attendibile. Nella media entrano solo i giocatori pienamente disponibili. Chi e in RTP o in valutazione lavora a carico ridotto, quindi resta monitorato ma fuori dal calcolo: il suo ACWR individuale continua a essere valido.'
  });
}

function showRosaDetail(){
  const perStato = {};
  PLAYER_STATUSES.forEach(st=> perStato[st.value] = []);
  STATE.players.forEach(p=>{
    const k = perStato[p.status] ? p.status : 'Disponibile';
    perStato[k].push(p);
  });

  const eta = STATE.players.map(p=>calcAge(p.birthDate)).filter(a=> typeof a === 'number' && a > 0);
  const etaMedia = eta.length ? Math.round(eta.reduce((a,b)=>a+b,0)/eta.length*10)/10 : null;
  const disponibili = perStato['Disponibile'].length;

  showTileDetail({
    title: 'Rosa',
    subtitle: STATE.players.length + ' giocatori in organico',
    summary: [
      {label:'Disponibili', value: disponibili, color:'var(--ok)'},
      {label:'Non disponibili', value: STATE.players.length - disponibili, color: (STATE.players.length - disponibili) ? 'var(--clay)' : 'var(--ok)'},
      {label:'Eta media', value: etaMedia !== null ? etaMedia : '—'}
    ],
    sections: PLAYER_STATUSES.map(st=>({
      title: st.label, color: st.color,
      rows: perStato[st.value].sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(p=>{
        const hi = getLatestHooperIndex(p.id);
        const pain = getOpenPainIssues(p.id);
        const season = getSeasonStats(p.id);
        return {
          playerId: p.id,
          name: p.name,
          sub: (p.role || 'ruolo da assegnare')
               + (season.minutes ? ' · ' + season.minutes + ' min in stagione' : '')
               + (pain.length ? ' · ' + pain.length + ' dolore/i aperto/i' : '')
               + (st.needsDate && p.returnDate ? ' · rientro ' + fmtDate(p.returnDate) : ''),
          value: hi ? hi.score : '—',
          color: hi ? hi.band.color : 'var(--ink-soft)',
          valueSub: hi ? 'HI' : 'nessun HI'
        };
      })
    })),
    footer: 'Tocca un giocatore per aprire la sua scheda completa.'
  });
}

/* ---------- BOLLETTINO GIORNALIERO ----------
   Genera un foglio A4 e apre la stampa: da li' si salva come PDF. */
function buildDailyReport(){
  const dayNames = ['Domenica','Lunedi','Martedi','Mercoledi','Giovedi','Venerdi','Sabato'];
  const oggi = new Date(todayStr()+'T00:00:00');
  const workout = getTodayWorkout();
  const bd = workout ? getPresenceBreakdown(workout.id) : null;
  const pres = workout ? getTodayPresenceCount(workout.id) : null;
  const w = getTeamWellness();
  const alerts = getTeamAlerts();

  const results = getRecentResults(5);

  const acwrAll = STATE.players
    .filter(countsInTeamStats)
    .map(p => ({player:p, acwr:getACWR(p.id)}))
    .filter(x => x.acwr && !x.acwr.insufficient);
  const acwrRisk = acwrAll.filter(x => x.acwr.zone === 'high' || x.acwr.zone === 'warn')
    .sort((a,b)=>b.acwr.ratio - a.acwr.ratio);

  const nonDisponibili = STATE.players.filter(p => p.status !== 'Disponibile');
  const disponibili = STATE.players.length - nonDisponibili.length;

  // Elenco giocatori con i dati del giorno
  const righe = STATE.players.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(p=>{
    const hi = getLatestHooperIndex(p.id);
    const ac = getACWR(p.id);
    const pain = getOpenPainIssues(p.id);
    const presente = workout && Array.isArray(workout.presentPlayers) && workout.presentPlayers.includes(p.id);
    return {
      nome: p.name,
      ruolo: p.role || '-',
      stato: statusMeta(p.status).label,
      hi: hi ? hi.score : null,
      hiFresco: hi ? daysSince(hi.date) <= 1 : false,
      acwr: (ac && !ac.insufficient) ? ac.ratio : null,
      dolori: pain.length ? pain.map(i=>i.zone + ' ' + i.lastIntensity).join(', ') : '',
      presente: workout ? (presente ? 'SI' : (p.status === 'Disponibile' ? 'no' : '-')) : '-'
    };
  });

  return `
    <div class="ps-head">
      <div>
        <h1>${esc(STATE.teamConfig.name || 'Squadra')}</h1>
        <div style="font-size:9pt;letter-spacing:0.08em;text-transform:uppercase;">Bollettino giornaliero</div>
      </div>
      <div class="ps-date">
        <strong>${dayNames[oggi.getDay()]} ${fmtDate(todayStr())}</strong><br>
        ${workout ? esc(workout.title) + (workout.time ? ' &middot; ' + esc(workout.time) : '') : 'Nessuna sessione'}
      </div>
    </div>

    <div class="ps-kpi avoid">
      <div class="ps-box">

function printDailyReport(){
  const old = document.getElementById('printSheet');
  if(old) old.remove();

  const sheet = document.createElement('div');
  sheet.id = 'printSheet';
  sheet.innerHTML = buildDailyReport();
  document.body.appendChild(sheet);

  const cleanup = ()=>{
    const el = document.getElementById('printSheet');
    if(el) el.remove();
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);

  // Lascia al browser il tempo di applicare gli stili di stampa
  setTimeout(()=>{
    window.print();
    setTimeout(cleanup, 1500);
  }, 120);

/* ---------- GIOCATORI ---------- */
/* ---------- DOLORI ----------
   Una segnalazione non scade da sola col tempo: resta aperta finche' lo staff
   non la chiude. Dopo qualche giorno di silenzio passa a "da verificare",
   che e' un promemoria, non un archiviazione automatica. */
const PAIN_SILENT_AFTER = 5;   // giorni senza nuove segnalazioni
const PAIN_STALE_AFTER  = 14;  // oltre questo, va chiusa o ripresa in mano

function daysSince(dateStr){
  if(!dateStr) return 9999;
  const a = new Date(todayStr() + 'T00:00:00');
  const b = new Date(dateStr + 'T00:00:00');
  return Math.round((a - b) / 86400000);
}

/* Raggruppa le segnalazioni di un giocatore per zona: ogni zona = un problema */
function getPainIssues(playerId){
  const entries = STATE.painLog
    .filter(x => String(x.playerId) === String(playerId))
    .sort((a,b) => String(b.date).localeCompare(String(a.date)));

  const byZone = {};
  entries.forEach(e=>{
    const z = e.zone || 'Non indicata';
    if(!byZone[z]) byZone[z] = [];
    byZone[z].push(e);
  });

  return Object.keys(byZone).map(zone=>{
    const list = byZone[zone];
    const last = list[0];
    const closed = list.every(e => e.closed) || !!last.closed;
    const days = daysSince(last.date);

    let status, label, color;
    if(closed){
      status = 'closed'; label = 'Risolto'; color = 'var(--ink-soft)';
    } else if(days <= PAIN_SILENT_AFTER){
      status = 'active'; label = 'Attivo'; color = 'var(--clay)';
    } else if(days <= PAIN_STALE_AFTER){
      status = 'silent'; label = 'Da verificare'; color = 'var(--amber-dark)';
    } else {
      status = 'stale'; label = 'Aperto da tempo'; color = 'var(--amber-dark)';
    }

    const peak = Math.max.apply(null, list.map(e => e.intensity || 0));
    const first = list[list.length - 1];

    return {
      zone, entries: list, last, first,
      status, label, color,
      days, peak,
      lastIntensity: last.intensity || 0,
      count: list.length,
      // sale, scende o resta uguale rispetto alla segnalazione precedente
      direction: list.length > 1
        ? ((last.intensity || 0) - (list[1].intensity || 0))
        : 0
    };
  }).sort((a,b)=>{
    const rank = {active:0, silent:1, stale:2, closed:3};
    if(rank[a.status] !== rank[b.status]) return rank[a.status] - rank[b.status];
    return a.days - b.days;
  });
}

/* Problemi che richiedono attenzione ora */
function getOpenPainIssues(playerId){
  return getPainIssues(playerId).filter(i => i.status !== 'closed');
}

/* ---------- MINUTI GIOCATI ----------
   I minuti non si scrivono a mano: si ricavano da chi era titolare,
   dalle sostituzioni e dalle espulsioni. Cosi' non possono contraddirsi. */
const DEFAULT_MATCH_DURATION = 90;

function matchDuration(match){
  const d = parseInt(match && match.duration, 10);
  return (!isNaN(d) && d > 0) ? d : DEFAULT_MATCH_DURATION;
}

/* Restituisce { playerId: {minutes, status, on, off, reason} } */
function computeMatchMinutes(match){
  const total = matchDuration(match);
  const out = {};

  const starters = Array.isArray(match.starters) ? match.starters : [];
  const subs = (Array.isArray(match.substitutions) ? match.substitutions : [])
    .slice()
    .sort((a,b)=> (a.minute||0) - (b.minute||0));
  const reds = Array.isArray(match.redCards) ? match.redCards : [];

  const clamp = m => Math.max(0, Math.min(total, parseInt(m,10) || 0));

  // Chi parte in campo
  starters.forEach(pid=>{
    out[String(pid)] = {on: 0, off: null, status: 'starter', reason: null};
  });

  // Sostituzioni, in ordine di minuto
  subs.forEach(sw=>{
    const min = clamp(sw.minute);
    if(sw.outPlayerId){
      const k = String(sw.outPlayerId);
      if(out[k] && out[k].off === null){ out[k].off = min; out[k].reason = 'sostituito'; }
    }
    if(sw.inPlayerId){
      const k = String(sw.inPlayerId);
      // Un giocatore puo' entrare una volta sola
      if(!out[k]) out[k] = {on: min, off: null, status: 'sub', reason: null};
    }
  });

  // Espulsioni: chiudono la partita del giocatore in quel minuto
  reds.forEach(rc=>{
    const k = String(rc.playerId);
    const min = clamp(rc.minute);
    if(out[k] && (out[k].off === null || min < out[k].off)){
      out[k].off = min;
      out[k].reason = 'espulso';
    }
  });

  // Calcolo finale
  Object.keys(out).forEach(k=>{
    const r = out[k];
    const off = (r.off === null) ? total : r.off;
    r.minutes = Math.max(0, off - r.on);
    r.offEffective = off;
  });

  return out;
}

/* Chi e' in campo a un dato minuto: serve per proporre solo sostituzioni sensate */
function playersOnPitchAt(match, minute){
  const calc = computeMatchMinutes(match);
  return Object.keys(calc).filter(k=>{
    const r = calc[k];
    return r.on <= minute && r.offEffective > minute;
  });
}

/* Allinea match.lineup (usato dalle statistiche) al calcolo automatico */
function syncMatchLineup(match){
  const calc = computeMatchMinutes(match);
  match.lineup = Object.keys(calc).map(pid=>({
    playerId: pid,
    minutes: calc[pid].minutes,
    status: calc[pid].status
  }));
  return match.lineup;
}

/* ---------- STATISTICHE STAGIONE ---------- */
function getSeasonStats(playerId){
  const pid = String(playerId);
  let minutes = 0, goals = 0, assists = 0, matches = 0, starts = 0;

  STATE.events.filter(e => e.type === 'Partita').forEach(m=>{
    if(Array.isArray(m.lineup)){
      const row = m.lineup.find(l => String(l.playerId) === pid);
      if(row && (row.minutes || 0) > 0){
        minutes += row.minutes || 0;
        matches++;
        if(row.status === 'starter') starts++;
      }
    }
    if(Array.isArray(m.goals))   goals   += m.goals.filter(g => String(g.playerId) === pid).length;
    if(Array.isArray(m.assists)) assists += m.assists.filter(a => String(a.playerId) === pid).length;
  });

  return {minutes, goals, assists, matches, starts};
}

/* Presenze agli allenamenti gia' svolti */
function getTrainingAttendance(playerId){
  const past = STATE.events.filter(e => e.type === 'Allenamento' && e.date && e.id !== 'rpe-import-session' && e.date <= todayStr());
  const present = past.filter(e => Array.isArray(e.presentPlayers) && e.presentPlayers.includes(playerId)).length;
  return {
    present,
    total: past.length,
    percent: past.length ? Math.round(present / past.length * 100) : null
  };
}

/* ---------- CARICO E ACWR ----------
   Carico sessione = RPE x durata (metodo di Foster).
   ACWR = carico dell'ultima settimana / media settimanale delle ultime 4.
   Sotto 0.8 scarico, 0.8-1.3 zona ottimale, sopra 1.5 rischio. */
function sessionLoad(rpeEntry){
  const ev = STATE.events.find(e => e.id === rpeEntry.sessionId);
  let dur;
  if(ev && ev.importedDuration) dur = ev.importedDuration;      // RPE storici importati
  else if(ev) dur = getSessionDuration(ev);
  if(!dur) dur = 65;                                            // sessione non trovata: stima
  return (rpeEntry.rpe || 0) * dur;
}

function getACWR(playerId){
  const pid = String(playerId);
  const entries = STATE.rpeLog.filter(r => String(r.playerId) === pid);
  if(entries.length === 0) return null;

  let acute = 0, chronic = 0, acuteN = 0, chronicN = 0;
  entries.forEach(r=>{
    const d = daysSince(r.date);
    const load = sessionLoad(r);
    if(d < 7){ acute += load; acuteN++; }
    if(d < 28){ chronic += load; chronicN++; }
  });

  // Servono almeno tre settimane di storico perche' il dato significhi qualcosa.
  // L'array non e' ordinato: cerco la rilevazione piu' vecchia, non l'ultima in lista.
  const oldestDays = entries.reduce((max, r)=> Math.max(max, daysSince(r.date)), 0);
  if(chronicN < 4 || oldestDays < 21){
    return {ratio: null, acute: acute, insufficient: true, sessions: chronicN};
  }

  const weeklyChronic = chronic / 4;
  if(weeklyChronic === 0) return {ratio: null, acute: acute, insufficient: true, sessions: chronicN};

  const ratio = acute / weeklyChronic;
  let zone, label, color;
  // Nessuna sessione nell'ultima settimana: non e' uno scarico programmato, e' assenza di dati
  if(acuteN === 0){ zone='none'; label='Fermo da 7 giorni'; color='var(--ink-soft)'; }
  else if(ratio < 0.8){ zone='low';  label='Scarico';  color='var(--amber-dark)'; }
  else if(ratio <= 1.3){ zone='ok'; label='Ottimale'; color='var(--ok)'; }
  else if(ratio <= 1.5){ zone='warn'; label='In salita'; color='var(--amber-dark)'; }
  else { zone='high'; label='Rischio'; color='var(--clay)'; }

  return {
    ratio: Math.round(ratio*100)/100,
    acute: Math.round(acute),
    chronicWeekly: Math.round(weeklyChronic),
    zone, label, color, insufficient: false, sessions: chronicN
  };
}

/* ---------- RIEPILOGO SQUADRA ---------- */
function getTeamWellness(){
  const today = todayStr();
  const inRosa = STATE.players.filter(countsInTeamStats);   // solo Disponibili
  const ridotti = STATE.players.filter(p => isTrainingStatus(p) && !countsInTeamStats(p)); // RTP, In valutazione
  const fermi = STATE.players.filter(p => !isTrainingStatus(p));                            // Infortunati

  // Media di oggi: voci registrate mentre il giocatore era Disponibile
  const oggi = [];
  inRosa.forEach(p=>{
    const e = STATE.hooperLog.find(h => String(h.playerId)===String(p.id) && h.date===today && !isLegacyHooper(h));
    if(e && entryCountsInTeamStats(e)) oggi.push({player:p, score: hooperScore(e)});
  });

  // Media settimanale: stessa regola, cosi' i due numeri sono confrontabili
  const settimana = [];
  inRosa.forEach(p=>{
    const recenti = getHooperEntries(p.id).filter(h => daysSince(h.date) < 7 && entryCountsInTeamStats(h));
    if(recenti.length) settimana.push({player:p, avg: recenti.reduce((a,h)=>a+hooperScore(h),0)/recenti.length});
  });

  // Fuori media, ma da tenere sott'occhio
  const aParte = [];
  ridotti.concat(fermi).forEach(p=>{
    const recenti = getHooperEntries(p.id).filter(h => daysSince(h.date) < 7);
    if(recenti.length) aParte.push({player:p, avg: recenti.reduce((a,h)=>a+hooperScore(h),0)/recenti.length});
  });

  const avgOggi = oggi.length ? oggi.reduce((a,x)=>a+x.score,0)/oggi.length : null;
  const avgSett = settimana.length ? settimana.reduce((a,x)=>a+x.avg,0)/settimana.length : null;

  return {
    compilatiOggi: oggi.length,
    attesiOggi: inRosa.length,
    avgOggi: avgOggi !== null ? Math.round(avgOggi*10)/10 : null,
    bandOggi: avgOggi !== null ? hooperBand(Math.round(avgOggi)) : null,
    avgSettimana: avgSett !== null ? Math.round(avgSett*10)/10 : null,
    peggiori: settimana.slice().sort((a,b)=>b.avg-a.avg).slice(0,3).filter(x=>x.avg >= 13),
    fuoriMedia: aParte.sort((a,b)=>b.avg-a.avg),
    nonCompilanti: inRosa.filter(p=>{
      const ultimo = getHooperEntries(p.id)[0];
      return !ultimo || daysSince(ultimo.date) > 3;
    })
  };
}

/* Ultime partite con esito */
function getRecentResults(limit){
  return STATE.events
    .filter(e => e.type === 'Partita' && e.result && typeof e.result.goalsFor === 'number')
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)))
    .slice(0, limit || 5)
    .map(m=>{
      const gf = m.result.goalsFor, ga = m.result.goalsAgainst;
      const esito = gf > ga ? 'V' : gf === ga ? 'P' : 'S';
      return {
        match: m, gf, ga, esito,
        color: esito === 'V' ? 'var(--ok)' : esito === 'P' ? 'var(--amber-dark)' : 'var(--clay)'
      };
    });
}

/* Avvisi da mostrare in dashboard, dal piu' urgente */
function getTeamAlerts(){
  const alerts = [];

  STATE.players.forEach(p=>{
    getOpenPainIssues(p.id).forEach(issue=>{
      if(issue.status === 'active'){
        alerts.push({
          priority: issue.lastIntensity >= 6 ? 1 : 2,
          icon: 'dolore',
          color: issue.lastIntensity >= 6 ? 'var(--clay)' : 'var(--amber-dark)',
          text: p.name + ' — ' + issue.zone + ' ' + issue.lastIntensity + '/10' + (issue.direction > 0 ? ', in aumento' : ''),
          sub: issue.days === 0 ? 'segnalato oggi' : 'segnalato ' + issue.days + ' giorni fa',
          playerId: p.id
        });
      } else if(issue.status === 'silent' || issue.status === 'stale'){
        alerts.push({
          priority: 3, icon: 'dolore', color: 'var(--amber-dark)',
          text: p.name + ' — ' + issue.zone + ' da verificare',
          sub: 'nessun aggiornamento da ' + issue.days + ' giorni',
          playerId: p.id
        });
      }
    });
  });

  // Wellness e carico valgono per tutti quelli che si allenano, RTP compresi
  STATE.players.filter(isTrainingStatus).forEach(p=>{
    const hi = getLatestHooperIndex(p.id);
    if(hi && hi.score >= 18 && daysSince(hi.date) <= 2){
      alerts.push({
        priority: hi.score >= 23 ? 1 : 2, icon: 'wellness', color: hi.band.color,
        text: p.name + (p.status !== 'Disponibile' ? ' [' + statusMeta(p.status).label + ']' : '') + ' — Hooper ' + hi.score + '/28 (' + hi.band.label + ')',
        sub: hi.band.advice, playerId: p.id
      });
    }
    const trend = getHooperTrend(p.id, 7);
    if(trend && trend.direction === 'worse' && Math.abs(trend.delta) >= 3){
      alerts.push({
        priority: 2, icon: 'trend', color: 'var(--clay)',
        text: p.name + (p.status !== 'Disponibile' ? ' [' + statusMeta(p.status).label + ']' : '') + ' — wellness in peggioramento',
        sub: 'media da ' + trend.previousAvg + ' a ' + trend.recentAvg + ' in una settimana',
        playerId: p.id
      });
    }
    const acwr = getACWR(p.id);
    if(acwr && !acwr.insufficient && (acwr.zone === 'high' || acwr.zone === 'warn')){
      alerts.push({
        priority: acwr.zone === 'high' ? 1 : 3, icon: 'carico', color: acwr.color,
        text: p.name + (p.status !== 'Disponibile' ? ' [' + statusMeta(p.status).label + ']' : '') + ' — ACWR ' + acwr.ratio,
        sub: acwr.zone === 'high' ? 'carico cresciuto troppo in fretta' : 'carico in aumento, tenere d\'occhio',
        playerId: p.id
      });
    }
  });

  STATE.players.filter(p=>p.status === 'RTP' || p.status === 'In valutazione').forEach(p=>{
    if(p.returnDate && daysSince(p.returnDate) >= 0){
      alerts.push({
        priority: 2, icon: 'rientro', color: 'var(--amber-dark)',
        text: p.name + ' — rientro previsto ' + (daysSince(p.returnDate) === 0 ? 'oggi' : 'scaduto da ' + daysSince(p.returnDate) + ' giorni'),
        sub: 'aggiorna lo stato se e rientrato', playerId: p.id
      });
    }
  });

  return alerts.sort((a,b)=>a.priority - b.priority);
}

                ${issue.closed || issue.status === 'closed' ? `<div style="font-size:10.5px;color:var(--ink-soft);margin-top:5px;">Chiuso${issue.last.closedNote ? ': ' + esc(issue.last.closedNote) : ''}</div>` : ''}
              </div>
              <div style="display:flex;flex-direction:column;gap:4px;">
                ${issue.status !== 'closed'
                  ? `<button class="pain-close" data-zone="${esc(issue.zone)}" style="background:none;border:1px solid var(--line);border-radius:4px;padding:4px 9px;font-size:11px;cursor:pointer;color:var(--ok);white-space:nowrap;">Segna risolto</button>`
                  : `<button class="pain-reopen" data-zone="${esc(issue.zone)}" style="background:none;border:1px solid var(--line);border-radius:4px;padding:4px 9px;font-size:11px;cursor:pointer;white-space:nowrap;">Riapri</button>`}
                <button class="pain-detail" data-zone="${esc(issue.zone)}" style="background:none;border:1px solid var(--line);border-radius:4px;padding:4px 9px;font-size:11px;cursor:pointer;white-space:nowrap;">Storico</button>
              </div>
            </div>
          </div>`).join('')}
      </div>

      <div style="text-align:right;margin-top:16px;">
        <button id="closeReportBtn" class="btn">Chiudi</button>
      </div>
    </div>`;

  document.body.appendChild(modal);

  const close = ()=> modal.remove();
  document.getElementById('closeReport').addEventListener('click', close);
  document.getElementById('closeReportBtn').addEventListener('click', close);
  modal.addEventListener('click', e=>{ if(e.target === modal) close(); });

  const reopen = ()=>{ close(); showPlayerReport(playerId); };

  // Eliminazione, con doppia conferma
  modal.querySelectorAll('.rep-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const kind = btn.dataset.kind;
      const nomi = {hooper:'questa rilevazione Hooper', rpe:'questo RPE', pain:'questa segnalazione di dolore'};
      if(!confirm('Eliminare ' + nomi[kind] + ' di ' + player.name + '?\n\nIl dato viene rimosso per tutti e non si puo recuperare.')) return;

      if(kind === 'hooper'){
        STATE.hooperLog = STATE.hooperLog.filter(x => x.id !== btn.dataset.id);
        await saveKey('hooper-log', STATE.hooperLog);
      } else if(kind === 'rpe'){
        STATE.rpeLog = STATE.rpeLog.filter(x => x.id !== btn.dataset.id);
        await saveKey('rpe-log', STATE.rpeLog);
      } else {
        STATE.painLog = STATE.painLog.filter(x => x.id !== btn.dataset.id);
        await saveKey('pain-log', STATE.painLog);
      }
      showToast('Voce eliminata');
      reopen();
    });
  });

  // Modifica Hooper
  modal.querySelectorAll('.rep-edit-hooper').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const entry = STATE.hooperLog.find(x => x.id === btn.dataset.id);
      if(entry) editHooperEntry(entry, reopen);
    });
  });

  // Modifica RPE
  modal.querySelectorAll('.rep-edit-rpe').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const entry = STATE.rpeLog.find(x => x.id === btn.dataset.id);
      if(entry) rpeEntryForm(playerId, entry, reopen);
    });
  });

  const addRpeStaffBtn = document.getElementById('addRpeStaffBtn');
  if(addRpeStaffBtn){
    addRpeStaffBtn.addEventListener('click', ()=> rpeEntryForm(playerId, null, reopen));
  }

  // Lo staff puo' registrare un problema anche a posteriori (infortuni passati,
  // o segnalazioni fatte a voce che il giocatore non ha inserito)
  const addPainBtn = document.getElementById('addPainBtn');
  if(addPainBtn){
    addPainBtn.addEventListener('click', ()=> addPainEntryForm(playerId, reopen));
  }

  // --- Dolori: chiusura, riapertura, storico ---
  const zoneEntries = (zone)=> STATE.painLog.filter(x =>
    String(x.playerId) === String(playerId) && (x.zone || 'Non indicata') === zone);

  modal.querySelectorAll('.pain-close').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const zone = btn.dataset.zone;
      if(!confirm('Segnare come risolto il problema "' + zone + '" di ' + player.name + '?\n\nResta nello storico e potrai riaprirlo.')) return;
      const note = prompt('Nota di chiusura (facoltativa): come si e risolto?', '');
      if(note === null) return;
      zoneEntries(zone).forEach(e=>{
        e.closed = true;
        e.closedAt = todayStr();
        if(note.trim()) e.closedNote = note.trim();
      });
      await saveKey('pain-log', STATE.painLog);
      showToast('Problema segnato come risolto');
      reopen();
    });
  });

  modal.querySelectorAll('.pain-reopen').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const zone = btn.dataset.zone;
      if(!confirm('Riaprire il problema "' + zone + '"?')) return;
      zoneEntries(zone).forEach(e=>{
        delete e.closed; delete e.closedAt; delete e.closedNote;
      });
      await saveKey('pain-log', STATE.painLog);
      showToast('Problema riaperto');
      reopen();
    });
  });

  modal.querySelectorAll('.pain-detail').forEach(btn=>{
    btn.addEventListener('click', ()=> showPainHistory(playerId, btn.dataset.zone, reopen));
  });
}

/* Inserimento o modifica di un RPE da parte dello staff.
   entry = null significa nuova registrazione. */
function rpeEntryForm(playerId, entry, onDone){
  const player = STATE.players.find(p => String(p.id) === String(playerId));
  const nuovo = !entry;
  const old = document.getElementById('rpeEntryModal');
  if(old) old.remove();

  const sessioni = STATE.events
    .filter(e => e.type === 'Allenamento' && e.id !== 'rpe-import-session')
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  const modal = document.createElement('div');
  modal.id = 'rpeEntryModal';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10002;padding:20px;box-sizing:border-box;overflow-y:auto;';

  const val = entry ? entry.rpe : 5;

  modal.innerHTML = `
    <div style="background:white;border-radius:12px;max-width:460px;width:100%;padding:22px;margin:auto;">
      <h3 style="margin:0 0 4px 0;color:var(--pitch);">${nuovo ? 'Registra un RPE' : 'Modifica RPE'}</h3>
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;">
        ${player ? esc(player.name) : ''}${nuovo ? ' — puoi inserire anche sessioni passate' : ''}
      </div>

      <label>Data</label>
      <input id="reDate" type="date" value="${entry ? entry.date : todayStr()}" max="${todayStr()}">

      <label>Sessione</label>
      <select id="reSession">
        <option value="rpe-import-session" ${(!entry || entry.sessionId === 'rpe-import-session') ? 'selected' : ''}>Sessione generica (65 min)</option>
        ${sessioni.map(e=>`<option value="${e.id}" ${entry && entry.sessionId === e.id ? 'selected' : ''}>${esc(e.title)} — ${fmtDate(e.date)}</option>`).join('')}
      </select>

      <div style="margin-top:14px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
          <label style="margin:0;">Sforzo percepito</label>
          <span id="reVal" style="color:var(--amber);font-weight:700;">${val}/10</span>
        </div>
        <input id="reRpe" type="range" min="0" max="10" step="1" value="${val}">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft);margin-top:4px;">
          <span>0 &middot; riposo</span><span>10 &middot; massimale</span>
        </div>
        <div id="reDesc" style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;text-align:center;"></div>
      </div>

      <div class="btn-row" style="justify-content:flex-end;">
        <button id="reCancel" class="btn secondary">Annulla</button>
        <button id="reSave" class="btn">${nuovo ? 'Registra' : 'Salva'}</button>
      </div>
    </div>`;

  document.body.appendChild(modal);

  const SCALA = ['riposo assoluto','molto leggero','leggero','moderato','piuttosto pesante','pesante',
                 'piu che pesante','molto pesante','molto molto pesante','estremamente pesante','massimale'];
  const slider = document.getElementById('reRpe');
  const refresh = ()=>{
    const v = parseInt(slider.value, 10);
    document.getElementById('reVal').textContent = v + '/10';
    document.getElementById('reDesc').textContent = SCALA[v] || '';
  };
  slider.addEventListener('input', refresh);
  refresh();

  document.getElementById('reCancel').addEventListener('click', ()=> modal.remove());
  modal.addEventListener('click', e=>{ if(e.target === modal) modal.remove(); });

  document.getElementById('reSave').addEventListener('click', async ()=>{
    const date = document.getElementById('reDate').value;
    if(!date){ showToast('Indica la data'); return; }
    if(date > todayStr()){ showToast('La data non puo essere futura'); return; }
    const rpe = parseInt(slider.value, 10);
    const sessionId = document.getElementById('reSession').value;

    if(nuovo){
      const gia = STATE.rpeLog.some(x => String(x.playerId)===String(playerId) && x.date===date);
      if(gia && !confirm('Esiste gia un RPE di ' + (player?player.name:'') + ' per il ' + fmtDate(date) + '.\n\nAggiungerne un altro? Quel giorno contera carico doppio.')) return;
      if(!confirm('Registrare RPE ' + rpe + '/10 per ' + (player?player.name:'') + ' in data ' + fmtDate(date) + '?')) return;
      STATE.rpeLog.push({
        id: uid(), playerId: playerId, date: date,
        sessionId: sessionId, rpe: rpe, addedBy: 'staff',
        statusAtEntry: currentStatusOf(playerId)
      });
    } else {
      const cambiato = (entry.rpe !== rpe) || (entry.date !== date) || (entry.sessionId !== sessionId);
      if(!cambiato){ modal.remove(); return; }
      if(!confirm('Salvare le modifiche?\n\nIl dato inserito dal giocatore verra sostituito.')) return;
      entry.rpe = rpe;
      entry.date = date;
      entry.sessionId = sessionId;
      entry.editedBy = 'staff';
      entry.editedAt = todayStr();
    }

    await saveKey('rpe-log', STATE.rpeLog);
    showToast(nuovo ? 'RPE registrato' : 'RPE aggiornato');
    modal.remove();
    if(onDone) onDone();
  });
}

            <div>

        <button id="closePainHistBtn" class="btn">Chiudi</button>
      </div>

  document.body.appendChild(modal);

  const shut = ()=>{ modal.remove(); if(onDone) onDone(); };
  document.getElementById('closePainHist').addEventListener('click', shut);
  document.getElementById('closePainHistBtn').addEventListener('click', shut);
  modal.addEventListener('click', e=>{ if(e.target === modal) shut(); });

  modal.querySelectorAll('.ph-edit').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const entry = STATE.painLog.find(x => x.id === btn.dataset.id);
      if(!entry) return;
      const val = prompt('Intensita del dolore da 0 a 10:', entry.intensity);
      if(val === null) return;
      const n = parseInt(val, 10);
      if(isNaN(n) || n < 0 || n > 10){ showToast('Inserisci un numero tra 0 e 10'); return; }

      showToast('Segnalazione eliminata');
      modal.remove();
      showPainHistory(playerId, zone, onDone);
    });
  });
}
